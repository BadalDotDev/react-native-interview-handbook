```

```bash
xcrun simctl push booted com.example.app payload.apns
```

Because simulated pushes bypass APNs and FCM, they don't prove that your tokens, credentials or backend work, and they may not flow through the Firebase SDK exactly like a real FCM message. For an end-to-end test on a simulator, use one running iOS 16+ on macOS 13+ with Apple silicon or a T2 chip, which registers with the APNs sandbox and receives real pushes. Apple's **Push Notifications Console** in the developer account can also send test pushes and look up delivery logs for a push by its ID.

**Android**:

```bash
# FCM, notification and JS logs
adb logcat | grep -iE "FirebaseMessaging|FCM|ReactNativeJS|Notifee"

# What the system thinks is posted, including channel and importance
adb shell dumpsys notification --noredact | grep -A 20 com.example.app

# Simulate Doze (screen off), then send a normal- vs high-priority data message
adb shell dumpsys deviceidle force-idle
adb shell dumpsys deviceidle unforce

# Push the app into a restrictive App Standby bucket
adb shell am set-standby-bucket com.example.app rare

# Reproduce "force stopped" (no messages delivered until next launch)
adb shell am force-stop com.example.app

# Reset the Android 13+ notification permission to test the prompt again
adb shell pm revoke com.example.app android.permission.POST_NOTIFICATIONS
```

**iOS device logs**: in macOS Console.app, select the device and filter by your process plus `apsd` (push daemon) and `dasd` (background scheduling) to see whether a silent push arrived and whether it was deferred.

Add a hidden **debug screen** in internal builds that shows the current token, permission status, channel states and the last received payload, with a copy button. It pays for itself the first time QA reports "no notifications".

## Troubleshooting

| Symptom | Likely cause | Fix |
|---|---|---|
| iOS: `getToken()` fails or never resolves | No APNs token: missing Push Notifications capability, swizzling disabled without manual forwarding, no network, or an old simulator | Add the capability, keep `FirebaseAppDelegateProxyEnabled` default or forward tokens manually, test on device or a supported simulator |
| iOS: "no valid aps-environment entitlement string found" | Entitlement missing or provisioning profile generated before push was enabled | Add the capability, regenerate profiles (or let automatic signing / EAS sync capabilities), clean build |
| FCM send returns `THIRD_PARTY_AUTH_ERROR` for iOS tokens | APNs key not uploaded to Firebase, wrong Key ID/Team ID, or key restricted to another environment/topic | Re-upload the `.p8` with the correct IDs in Firebase Cloud Messaging settings |
| Notification not shown while app is open | Expected: foreground messages aren't displayed by default | Display locally in `onMessage`, or configure iOS foreground presentation options |
| Android 13+: nothing ever appears | `POST_NOTIFICATIONS` not declared or not granted | Declare it, request it after a primer, check `areNotificationsEnabled` |
| Android: white square icon | Coloured small icon | Use a white-on-transparent notification icon and set `default_notification_icon` |
| Android: notifications land in "Miscellaneous" | Referenced channel not created, or no default channel configured | Create channels at startup; set the default channel in `firebase.json` / manifest |
| Data-only messages arrive late or never on some Android phones | Doze, App Standby buckets, OEM battery optimisation (aggressive on some Xiaomi, Huawei, OPPO, vivo, Samsung builds), app force-stopped, normal priority | Use notification messages for user-visible content; `priority: high` only for user-visible data messages; guide users to exempt the app from battery optimisation if critical; sync on app open |
| iOS silent pushes arrive sporadically | System throttling (budget, Low Power Mode, low usage), wrong headers | `apns-push-type: background`, `apns-priority: 5`, no alert keys; send sparingly; don't rely on them for correctness |
| iOS silent pushes never arrive after user swipes app away | Force-quit apps aren't launched for background pushes | Expected behaviour; the next app open must sync |
| Works in debug, fails in TestFlight (direct APNs) | Sandbox vs production mismatch: production tokens sent to sandbox or vice versa (`BadDeviceToken`) | Store environment per token and route to the matching APNs host |
| Image not shown in iOS notification | No NSE, missing `mutable-content: 1`, NSE deployment target too high, non-HTTPS or slow image URL, file without a recognisable extension | Add/fix the extension, set the flag, lower the target, serve small HTTPS images quickly |
| Tap opens the app but not the right screen on cold start | Navigating before the navigator is ready, or `getInitialNotification` not consulted | Resolve the tap in `linking.getInitialURL` and `subscribe` |
| `SENDER_ID_MISMATCH` errors | Tokens from a different Firebase project (e.g. staging app, prod backend) | Separate token tables or tag tokens with their project |
| Manifest merger failed on `default_notification_color` | Declared in both manifest and RNFB's `firebase.json` | Use one place, or `tools:replace` |

## Production checklist

- [ ] APNs `.p8` key created, uploaded to Firebase (or configured in your APNs sender), stored in a secrets manager with an owner
- [ ] Push Notifications and Background Modes → Remote notifications enabled; `aps-environment` verified in the signed archive
- [ ] Separate Firebase projects / credentials for dev, staging and production
- [ ] Android small icon (monochrome, transparent) and accent colour configured
- [ ] Android channels created at startup with user-meaningful names and correct importance
- [ ] Android 13+ `POST_NOTIFICATIONS` declared and requested after an in-app primer; iOS prompt shown in context (or provisional used deliberately)
- [ ] Permission re-checked on every foreground; settings deep link offered when blocked
- [ ] Token registered on every launch, on refresh, and on login; deleted on logout (server first, then `deleteToken`)
- [ ] Backend upserts by installation ID, reassigns tokens between users, prunes on `UNREGISTERED` / 410, expires stale tokens
- [ ] Sending goes through an outbox + queue with retries, backoff, rate limiting and idempotency keys
- [ ] Notification messages used for anything user-critical; data-only used only as an optimisation
- [ ] Foreground handling decided per message type; no duplicate banners
- [ ] Background handlers registered in `index.js`, idempotent, within time budgets; headless launches don't run app bootstrap
- [ ] Taps route through the deep-link system for background and cold start, with URL validation
- [ ] Collapse IDs / tags used for updating notifications; TTL / expiration set on time-bound messages
- [ ] Rich notification extension tested on the oldest supported iOS version
- [ ] Quiet hours, frequency caps and per-category preferences enforced server-side
- [ ] Sensitive content kept off the lock screen where appropriate
- [ ] Analytics: `notificationId` in every payload, open tracking, opt-out monitoring, delivery metrics
- [ ] Tested on physical iOS and Android devices (including at least one aggressive-OEM Android phone) in foreground, background, killed and Doze states

## Interview questions

### Walk me through how a push notification gets from your backend to an iPhone when you use FCM.

The app requests permission and calls `registerForRemoteNotifications`; APNs issues a device token to the OS, the Firebase SDK captures it (via swizzling) and exchanges it with FCM for an FCM registration token, which the app sends to our backend along with user, installation ID, platform and app version. To send, the backend mints a short-lived OAuth2 token from a service account and calls FCM HTTP v1 `messages:send` with the token and a payload containing `apns` overrides. FCM authenticates to APNs using the `.p8` key we uploaded to Firebase and forwards the message; APNs delivers it over the device's persistent `apsd` connection, and iOS displays it (notification message) or wakes the app (`content-available`). On Android the same FCM call is delivered by Google Play services directly. A senior answer also mentions the failure modes: sandbox vs production tokens, token rotation, and APNs keeping only the latest message for offline devices.

### What is the difference between notification messages and data messages, and when do you use each?

A notification message contains a `notification`/`aps.alert` block and is displayed by the OS when the app is backgrounded or killed, without running your code; in the foreground it goes to `onMessage` and isn't shown by default. A data-only message carries only key/value data, is never displayed automatically, and relies on your JS running (headless task on Android, background launch on iOS with `content-available: 1`), which is subject to Doze, OEM battery policies, iOS throttling and force-quit rules. Use notification messages for anything the user must see; use data messages for background sync, silent state updates, or content you must transform before display (E2E decryption) — and even then prefer `mutable-content` + NSE on iOS for user-visible content. Knowing the full behaviour matrix per state and platform is what interviewers are probing for.

### Why might data-only pushes not arrive on some Android devices, and what do you do about it?

Causes: the app was **force-stopped** (no delivery until next launch); **Doze** and **App Standby buckets** defer normal-priority messages; some OEM ROMs kill background processes or block headless starts for apps swiped away; `priority: normal` was used for something time-critical, or FCM deprioritised `high` messages that never produced a visible notification; the device lacks Google Play services. Mitigations: send notification messages for user-visible content so the system displays them; reserve `high` priority for data messages that immediately produce a notification; make the app sync on foreground so correctness never depends on a push; for critical use cases, detect aggressive battery optimisation and guide users to exempt the app; test with `adb shell dumpsys deviceidle force-idle` and on real OEM devices.

### How do you make a notification tap open the right screen, including from a cold start?

Put a `url` in the payload and route it through the same linking configuration used for universal links, rather than calling `navigate` imperatively. For the killed state, `linking.getInitialURL` checks `Linking.getInitialURL()`, then `getInitialNotification()` (FCM-displayed) and the display library's initial notification (locally displayed). For the background state, `linking.subscribe` listens to `onNotificationOpenedApp` and the display library's press events and forwards the URL to React Navigation's listener. Taps that happen before navigation mounts are buffered. Validate the URL against an allowlist, and ensure auth-gated destinations resume after login. Track `notification_opened` with the `notificationId`.

### How do you manage device tokens on the backend?

Tokens are volatile: one user has many devices, and a device's token changes on reinstall, restore, data clear or rotation. Store one row per app installation (upsert by an app-generated installation ID) with token, provider, platform, app version, locale, timezone and `last_registered_at`, updated on every launch and `onTokenRefresh`. On login, reassign the token to the new user; on logout, delete the device server-side and call `deleteToken` on the client. Prune on `UNREGISTERED` (404) from FCM and `410 Unregistered` from APNs, be careful with `BadDeviceToken` (could be an environment mismatch), and stop sending to tokens that haven't been refreshed in about two months. Never key tokens only by user, or you'll overwrite other devices.

### How reliable are silent pushes on iOS, and what would you use for data that must be up to date?

They are explicitly best-effort. They require `content-available: 1`, no alert, `apns-push-type: background` and priority 5; iOS budgets them based on battery, Low Power Mode and app usage, may coalesce or delay them, gives the app about 30 seconds, and does not deliver them at all to apps the user force-quit. So they're an optimisation to pre-warm caches. Correctness comes from syncing on app foreground, pull-to-refresh, background app refresh / `BGTaskScheduler` as another best-effort path, and, for user-visible content, sending a normal alert with `mutable-content` so the NSE can enrich or decrypt it with a much stronger delivery guarantee.

### Design a system that sends a campaign notification to ten million users.

Separate audience resolution from sending: a planner queries eligible users (opt-in, category preferences, quiet hours by timezone, frequency caps) and writes send jobs to an outbox keyed by `(campaign_id, device_id)` for idempotency. Workers pull jobs from a queue in batches of 500 tokens and call `sendEach` with bounded concurrency and a global rate limiter sized to the FCM project quota; results are processed per token — prune dead tokens, retry 429/5xx with backoff and jitter, record successes. Stagger delivery by timezone and throttle to protect your own API from the thundering herd of opens. For truly identical broadcasts, FCM topics offload fan-out at the cost of per-token feedback and personalisation. Instrument sent/failed/opened per campaign and monitor opt-out spikes; have a kill switch to stop a bad campaign mid-flight.

### How do rich notifications with images work on each platform?

On iOS you add a Notification Service Extension target; the push includes an `alert` and `mutable-content: 1`, iOS runs the extension with about 30 seconds to download the image and attach it as a `UNNotificationAttachment`, and `serviceExtensionTimeWillExpire` must deliver a fallback. With FCM you set `apns.fcm_options.image` and can use the Firebase helper in the extension. Gotchas: the extension's deployment target, App Group sharing, image size and HTTPS. On Android, FCM notification messages with `android.notification.image` are downloaded and shown as big-picture style by the SDK; for data messages, you display them yourself with a big-picture style. Action buttons are iOS categories referenced by `aps.category`, and per-notification actions on Android (requiring data messages plus local display).

### How do you maximise notification opt-in without annoying users?

Don't prompt at launch. Show an in-app primer tied to a clear benefit at the moment it matters (after placing an order, when following someone), and trigger the system prompt only on acceptance, because iOS allows one prompt and Android 13+ stops asking after repeated denials. Consider iOS provisional authorization to deliver quietly first. Offer granular categories (Android channels plus server-side preferences) so users can reduce noise instead of disabling everything, respect quiet hours, and measure opt-out rates after campaigns. When permission is blocked, explain and deep link to Settings rather than nagging. Details are in the [Permissions guide](permissions.html).
