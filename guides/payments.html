## Part B — Implementation

### End-to-end purchase flow

```mermaid
sequenceDiagram
    participant App as RN App
    participant Store as StoreKit or Play Billing
    participant BE as Backend
    participant SAPI as Apple or Google server API
    App->>Store: fetchProducts(skus)
    Store-->>App: Localized prices and eligible offers
    App->>Store: requestPurchase(sku, account token)
    Store->>Store: Payment sheet, Face ID, Ask to Buy
    Store-->>App: purchaseUpdated(purchase)
    App->>BE: POST /iap/verify (platform, JWS or purchase token)
    alt iOS
        BE->>BE: SignedDataVerifier checks the JWS chain and bundle id
        BE->>SAPI: Optional subscription status lookup
    else Android
        BE->>SAPI: subscriptionsv2.get or products.get
        SAPI-->>BE: State, expiry, obfuscated account id
    end
    BE->>BE: Upsert purchase, recompute entitlements (idempotent)
    BE-->>App: Active entitlements
    App->>Store: finishTransaction (acknowledge or consume)
    Note over App,Store: Android refunds purchases not acknowledged within 3 days
    SAPI-->>BE: Later, server notifications for renewals and refunds
```
*Figure: IAP purchase flow. Grant on the server first, then finish the transaction.*

The order at the end matters. **Verify and grant, then finish.** If you finish first and your backend call fails, the store considers the purchase delivered and won't redeliver it. The user has paid and has nothing to show for it. If you grant and then fail to finish, the store redelivers the transaction on the next launch, and your idempotent backend simply returns the existing entitlement.

### Client: purchases service with react-native-iap / expo-iap

Mount the purchase listener **once, at the app root**, not only on the paywall screen. Renewals, Ask to Buy approvals, pending Android purchases and interrupted purchases can all complete while the user is somewhere else in the app, or on the next launch.

```tsx title="src/iap/PurchasesProvider.tsx"
import { createContext, useCallback, useEffect, useState } from 'react';
import { Platform } from 'react-native';
import {
  ErrorCode,
  getAvailablePurchases as fetchAvailablePurchases,
  useIAP,
  type Purchase,
} from 'react-native-iap'; // or 'expo-iap' (same API shape)
import { api } from '../api/client';
import { useAuth } from '../auth/useAuth';

export const SUBSCRIPTION_SKUS = ['com.example.pro.monthly', 'com.example.pro.yearly'];
const CONSUMABLE_SKUS = ['com.example.coins.500'];

type VerifyResponse = { entitlements: string[]; status: 'granted' | 'pending' | 'rejected' };
type Ctx = ReturnType<typeof usePurchasesInternal>;
const PurchasesContext = createContext<Ctx | null>(null);

function usePurchasesInternal() {
  const { user } = useAuth(); // user.iapAccountToken is a UUID issued by our backend
  const [entitlements, setEntitlements] = useState<string[]>([]);
  const [message, setMessage] = useState<string | null>(null);

  const verifyAndFinish = useCallback(
    async (purchase: Purchase, finish: (args: { purchase: Purchase; isConsumable: boolean }) => Promise<unknown>) => {
      if (purchase.purchaseState === 'pending') {
        setMessage('Your purchase is pending approval. We will unlock it as soon as it completes.');
        return; // never grant or finish a pending purchase
      }
      try {
        const res = await api.post<VerifyResponse>('/iap/verify', {
          platform: Platform.OS,
          productId: purchase.productId,
          purchaseToken: purchase.purchaseToken, // iOS: StoreKit 2 JWS, Android: Play purchase token
        });
        if (res.status === 'granted') {
          setEntitlements(res.entitlements);
          await finish({ purchase, isConsumable: CONSUMABLE_SKUS.includes(purchase.productId) });
        }
      } catch {
        // Don't finish: the store redelivers the transaction and we retry on the next launch.
        setMessage('We could not confirm your purchase yet. It will be retried automatically.');
      }
    },
    [],
  );

  const iap = useIAP({
    onPurchaseSuccess: (purchase) => void verifyAndFinish(purchase, iap.finishTransaction),
    onPurchaseError: (error) => {
      if (error.code === ErrorCode.UserCancelled) return; // older versions: E_USER_CANCELLED
      setMessage(error.message);
    },
  });

  useEffect(() => {
    if (!iap.connected) return;
    void iap.fetchProducts({ skus: SUBSCRIPTION_SKUS, type: 'subs' });
    void iap.fetchProducts({ skus: CONSUMABLE_SKUS, type: 'in-app' });
  }, [iap.connected]);

  const buySubscription = useCallback(
    async (sku: string, offerToken?: string) => {
      if (!user) throw new Error('Sign in before purchasing'); // so the purchase is linked to an account
      const sub = iap.subscriptions.find((s) => s.id === sku);
      // Android: choose ONE eligible offer (trial or base plan) for this SKU.
      const token = offerToken ?? sub?.subscriptionOfferDetailsAndroid?.[0]?.offerToken;
      await iap.requestPurchase({
        request: {
          apple: { sku, appAccountToken: user.iapAccountToken },
          google: {
            skus: [sku],
            subscriptionOffers: token ? [{ sku, offerToken: token }] : [],
            obfuscatedAccountIdAndroid: user.iapAccountToken,
          },
        },
        type: 'subs',
      });
      // Don't use the return value: the result arrives via onPurchaseSuccess / onPurchaseError.
    },
    [iap, user],
  );

  const restore = useCallback(async () => {
    const purchases = await fetchAvailablePurchases(); // StoreKit 2 current entitlements / Play owned purchases
    const res = await api.post<VerifyResponse>('/iap/restore', {
      platform: Platform.OS,
      purchases: purchases.map((p) => ({ productId: p.productId, purchaseToken: p.purchaseToken })),
    });
    setEntitlements(res.entitlements);
    return res.entitlements.length > 0;
  }, []);

  return { ...iap, entitlements, message, buySubscription, restore };
}

// PurchasesProvider renders <PurchasesContext.Provider value={usePurchasesInternal()}> at the app root,
// and usePurchases() reads that context.
```

The paywall renders **store-provided, localised prices** (`product.displayPrice`). Never hardcode "$9.99". Prices vary by storefront, currency and tax, and a mismatch between your text and the payment sheet is an App Review rejection.

```tsx title="src/iap/Paywall.tsx"
import { Button, Linking, Text, View } from 'react-native';
import { usePurchases } from './PurchasesProvider';

export function Paywall() {
  const { subscriptions, buySubscription, restore, message } = usePurchases();
  return (
    <View style={{ padding: 16, gap: 12 }}>
      {subscriptions.map((s) => (
        <Button key={s.id} title={`${s.title}: ${s.displayPrice}`} onPress={() => void buySubscription(s.id)} />
      ))}
      <Text>Renews automatically at the price shown unless canceled at least 24 hours before the period ends.</Text>
      <Text onPress={() => Linking.openURL('https://example.com/terms')}>Terms of Use</Text>
      <Text onPress={() => Linking.openURL('https://example.com/privacy')}>Privacy Policy</Text>
      <Button title="Restore purchases" onPress={() => void restore()} />
      {message && <Text accessibilityRole="alert">{message}</Text>}
    </View>
  );
}
```

### Linking purchases to your user

Store accounts are not your accounts. One Apple ID can be used by several app users, and one app user can have several devices and stores. Link them explicitly:

- **iOS: `appAccountToken`**, which **must be a UUID**. Generate one per user on your backend and store it. Apple embeds it in every signed transaction and in renewal notifications.
- **Android: `obfuscatedAccountId`** (and optionally `obfuscatedProfileId`). It must not contain PII (no email addresses) and has a length limit, so use the same UUID. It comes back as `externalAccountIdentifiers.obfuscatedExternalAccountId`.
- On verification, if the token belongs to **another** user, apply an explicit policy: *transfer* to the current account (usual for "restore on a new account") or *deny* (to stop one subscription being shared). Log it either way.
- Transactions created outside your purchase call (offer code redemption in the App Store, promoted IAP, purchases before you added the token) carry no token. Fall back to mapping by `originalTransactionId` / purchase token, and attach them to the authenticated user who submits them.

### Backend: verifying Apple transactions

```ts title="server/src/iap/apple.ts"
import fs from 'node:fs';
import {
  AppStoreServerAPIClient,
  Environment,
  SignedDataVerifier,
  type JWSTransactionDecodedPayload,
} from '@apple/app-store-server-library';

const bundleId = 'com.example.app';
const appAppleId = Number(process.env.APPLE_APP_ID); // numeric App Store ID, required for Production
// Apple root certificates downloaded from apple.com/certificateauthority (e.g. AppleRootCA-G3.cer)
const rootCAs = ['AppleRootCA-G3.cer', 'AppleRootCA-G2.cer', 'AppleIncRootCertificate.cer'].map((f) =>
  fs.readFileSync(`certs/${f}`),
);
const enableOnlineChecks = true; // OCSP revocation checks on the certificate chain

const verifiers = {
  production: new SignedDataVerifier(rootCAs, enableOnlineChecks, Environment.PRODUCTION, bundleId, appAppleId),
  sandbox: new SignedDataVerifier(rootCAs, enableOnlineChecks, Environment.SANDBOX, bundleId),
};

export const appStoreApi = new AppStoreServerAPIClient(
  process.env.APPLE_IAP_KEY_P8!, // In-App Purchase key contents
  process.env.APPLE_IAP_KEY_ID!,
  process.env.APPLE_ISSUER_ID!,
  bundleId,
  Environment.PRODUCTION,
);

/**
 * App Review and TestFlight purchase in SANDBOX against your PRODUCTION backend,
 * so production servers must accept sandbox transactions (and flag them as such).
 */
export async function verifyAppleTransaction(jws: string): Promise<JWSTransactionDecodedPayload> {
  try {
    return await verifiers.production.verifyAndDecodeTransaction(jws);
  } catch (prodErr) {
    return await verifiers.sandbox.verifyAndDecodeTransaction(jws); // throws if also invalid
  }
}
```

```ts title="server/src/iap/verifyRoute.ts"
iapRouter.post('/iap/verify', requireAuth, async (req: AuthedRequest, res) => {
  const { platform, productId, purchaseToken } = req.body as VerifyBody;
  const user = await db.users.get(req.user.id);

  if (platform === 'ios') {
    const tx = await verifyAppleTransaction(purchaseToken).catch(() => null);
    if (!tx) return res.status(400).json({ status: 'rejected' });
    if (tx.appAccountToken && tx.appAccountToken !== user.iapAccountToken) {
      return res.status(409).json({ status: 'rejected', reason: 'owned_by_other_account' });
    }
    await db.storePurchases.upsert({
      store: 'app_store',
      userId: user.id,
      productId: tx.productId!,
      originalId: tx.originalTransactionId!, // stable across renewals: the subscription's identity
      latestTransactionId: tx.transactionId!,
      environment: tx.environment!,
      expiresAt: tx.expiresDate ? new Date(tx.expiresDate) : null,
      status: tx.revocationDate ? 'revoked' : 'active',
    }); // unique (store, originalId): replays are no-ops
  } else {
    await verifyGooglePurchase(user, productId, purchaseToken); // below
  }

  const entitlements = await recomputeEntitlements(user.id);
  res.json({ status: 'granted', entitlements });
});
```

For subscriptions, you can also call `appStoreApi.getAllSubscriptionStatuses(originalTransactionId)` to get the authoritative current state (including renewal info) instead of trusting a possibly stale transaction. Transactions from a local **StoreKit Configuration file** are signed by Xcode, not Apple, so they fail this verification. Handle them in a dev-only path, or test server flows with sandbox instead.

### Backend: verifying Google purchases

```ts title="server/src/iap/google.ts"
import { google } from 'googleapis';

const packageName = 'com.example.app';
const auth = new google.auth.GoogleAuth({
  scopes: ['https://www.googleapis.com/auth/androidpublisher'], // service account via GOOGLE_APPLICATION_CREDENTIALS
});
const publisher = google.androidpublisher({ version: 'v3', auth });

const ENTITLED_STATES = new Set([
  'SUBSCRIPTION_STATE_ACTIVE',
  'SUBSCRIPTION_STATE_IN_GRACE_PERIOD',
  'SUBSCRIPTION_STATE_CANCELED', // auto-renew off, but still paid until expiryTime
]);

export async function verifyGooglePurchase(user: User, productId: string, token: string) {
  if (SUBSCRIPTION_PRODUCT_IDS.has(productId)) {
    const { data } = await publisher.purchases.subscriptionsv2.get({ packageName, token });
    const owner = data.externalAccountIdentifiers?.obfuscatedExternalAccountId;
    if (owner && owner !== user.iapAccountToken) throw new OwnershipError();

    const line = data.lineItems?.[0];
    const expiresAt = line?.expiryTime ? new Date(line.expiryTime) : null;
    const entitled = ENTITLED_STATES.has(data.subscriptionState ?? '') && !!expiresAt && expiresAt > new Date();

    // Upgrades, downgrades and resubscribes create a NEW token that points at the old one.
    if (data.linkedPurchaseToken) await db.storePurchases.markReplaced('play_store', data.linkedPurchaseToken);

    await db.storePurchases.upsert({
      store: 'play_store',
      userId: user.id,
      productId: line?.productId ?? productId,
      originalId: token,
      latestTransactionId: data.latestOrderId ?? token,
      environment: data.testPurchase ? 'sandbox' : 'production',
      expiresAt,
      status: entitled ? 'active' : mapGoogleState(data.subscriptionState),
    });
    return;
  }

  // One-time products
  const { data } = await publisher.purchases.products.get({ packageName, productId, token });
  if (data.purchaseState === 2) return; // pending: grant later via RTDN or the next client delivery
  if (data.purchaseState !== 0) throw new Error('Purchase canceled');
  if (data.obfuscatedExternalAccountId && data.obfuscatedExternalAccountId !== user.iapAccountToken) {
    throw new OwnershipError();
  }
  // Consumables: credit the balance exactly once per token (unique constraint on the token).
  await db.consumableGrants.insertOnce({ token, userId: user.id, productId, orderId: data.orderId });
}
```

As a safety net, a scheduled job should find verified Play purchases still in `ACKNOWLEDGEMENT_STATE_PENDING` after a few hours and acknowledge them server-side (`purchases.subscriptions.acknowledge` / `purchases.products.acknowledge`). The 3-day auto-refund then can't happen even if the app never came back. For one-time products with several purchase options, newer API versions add a v2 product purchase endpoint, so check the current Android Publisher reference.

### Alternative: RevenueCat

With RevenueCat, the SDK sends transactions to RevenueCat's servers, which validate them, finish them and keep entitlement state. You work in terms of **offerings → packages** and **entitlements**:

```tsx title="src/iap/revenuecat.ts"
import { Platform } from 'react-native';
import Purchases, {
  LOG_LEVEL,
  PURCHASES_ERROR_CODE,
  type CustomerInfo,
  type PurchasesPackage,
} from 'react-native-purchases';

export function configurePurchases(appUserID: string) {
  Purchases.setLogLevel(__DEV__ ? LOG_LEVEL.DEBUG : LOG_LEVEL.WARN);
  Purchases.configure({
    apiKey: Platform.OS === 'ios' ? 'appl_public_sdk_key' : 'goog_public_sdk_key', // public SDK keys
    appUserID, // your user id, so entitlements follow the account across devices and stores
  });
}

export const isPro = (info: CustomerInfo) => info.entitlements.active['pro'] !== undefined;

export async function getPaywallPackages(): Promise<PurchasesPackage[]> {
  const offerings = await Purchases.getOfferings();
  return offerings.current?.availablePackages ?? []; // pkg.product.priceString is localized
}

export async function purchase(pkg: PurchasesPackage): Promise<'pro' | 'cancelled' | 'pending'> {
  try {
    const { customerInfo } = await Purchases.purchasePackage(pkg);
    return isPro(customerInfo) ? 'pro' : 'pending';
  } catch (e: any) {
    if (e.userCancelled) return 'cancelled';
    if (e.code === PURCHASES_ERROR_CODE.PAYMENT_PENDING_ERROR) return 'pending';
    throw e;
  }
}

export const restore = async () => isPro(await Purchases.restorePurchases());
```

Call `Purchases.logIn(userId)` / `logOut()` when auth changes, subscribe with `addCustomerInfoUpdateListener`, and use `RevenueCatUI.presentPaywallIfNeeded({ requiredEntitlementIdentifier: 'pro' })` from `react-native-purchases-ui` for remotely configured paywalls. Your **backend** should trust RevenueCat's webhooks (`INITIAL_PURCHASE`, `RENEWAL`, `CANCELLATION`, `BILLING_ISSUE`, `EXPIRATION`, `PRODUCT_CHANGE`) or its REST API, never an "I'm pro" flag sent by the app.

### Restore, pending, interrupted and plan changes

- **Restore purchases is required.** Apple requires a restore mechanism for restorable purchases (non-consumables and subscriptions), so a visible **Restore Purchases** button on the paywall and in settings is expected in review. Only force a StoreKit sync (the library's `syncIOS` / `AppStore.sync()`) on an explicit user tap, because it can prompt for the Apple ID password. On Android, owned purchases come back from the Play query automatically after a reinstall, but keep the button for parity.
- **Pending purchases (Android):** cash payments, some carrier billing and slow payment methods produce `PENDING`. Don't grant and don't acknowledge. Show "pending" and grant when it becomes `PURCHASED` (via the listener or RTDN). The 3-day acknowledgement window starts at that point.
- **Ask to Buy (iOS):** a child's purchase returns *pending*. Approval can arrive hours later as a transaction update, which is why the listener lives at the app root.
- **Interrupted purchases (iOS):** the user may have to accept new terms or fix a payment method mid-purchase. The purchase first fails or pends, then succeeds later through transaction updates. Test this with a StoreKit Configuration file ("Enable Interrupted Purchases").
- **Upgrades, downgrades and crossgrades:**

| | iOS | Android |
|---|---|---|
| How | Buy another product in the **same subscription group**, and StoreKit handles the switch | New purchase that passes the **old purchase token** plus a **replacement mode** |
| Upgrade | Immediate, with the remaining time refunded pro rata | Depends on replacement mode: `WITH_TIME_PRORATION`, `CHARGE_PRORATED_PRICE`, `CHARGE_FULL_PRICE`, `WITHOUT_PRORATION` |
| Downgrade | Takes effect at next renewal (`DID_CHANGE_RENEWAL_PREF`) | Usually `DEFERRED` |
| Crossgrade | Same duration: immediate. Different duration: at next renewal | Per replacement mode |
| Backend impact | Same `originalTransactionId`, new `transactionId` / `productId` | **New purchase token**, with `linkedPurchaseToken` pointing at the old one, which you must retire |

## Server notifications & entitlements

The client only sees the moment of purchase. Renewals, billing failures, refunds, family-sharing revocations and cancellations all happen **server to server**, so without notifications your entitlement data goes stale.

### App Store Server Notifications V2

Apple POSTs `{ "signedPayload": "<JWS>" }`. Verify it with `verifier.verifyAndDecodeNotification(signedPayload)`, then verify the nested `signedTransactionInfo` and `signedRenewalInfo` the same way. Dedupe on `notificationUUID`. Apple retries failed deliveries several times over a few days, and the **Get Notification History** endpoint lets you backfill anything you missed.

| `notificationType` (subtype) | Meaning | Action |
|---|---|---|
| `SUBSCRIBED` (`INITIAL_BUY`, `RESUBSCRIBE`) | New or returning subscriber | Grant |
| `DID_RENEW` (`BILLING_RECOVERY`) | Renewed, or recovered from billing retry | Extend `expires_at` |
| `DID_FAIL_TO_RENEW` (`GRACE_PERIOD` or none) | Renewal failed | Grace: keep access, prompt to fix payment. None: billing retry, remove access |
| `GRACE_PERIOD_EXPIRED` | Grace ended without recovery | Remove access (billing retry continues) |
| `DID_CHANGE_RENEWAL_STATUS` (`AUTO_RENEW_DISABLED` / `ENABLED`) | User canceled or re-enabled | Keep access until expiry, drive win-back |
| `DID_CHANGE_RENEWAL_PREF` (`UPGRADE` / `DOWNGRADE`) | Plan change | Upgrade: immediate. Downgrade: at renewal |
| `EXPIRED` (`VOLUNTARY`, `BILLING_RETRY`, `PRICE_INCREASE`, …) | Ended | Remove access |
| `REFUND` / `REVOKE` | Refunded, or family-sharing access removed | Remove access, claw back consumables |
| `REFUND_DECLINED`, `REFUND_REVERSED`, `CONSUMPTION_REQUEST`, `OFFER_REDEEMED`, `PRICE_INCREASE`, `RENEWAL_EXTENDED`, `TEST` | Other lifecycle events | Log and handle as relevant (answer `CONSUMPTION_REQUEST` with consumption data) |

```ts title="server/src/iap/appStoreNotifications.ts"
iapRouter.post('/webhooks/app-store', express.json(), async (req, res) => {
  const payload = req.body.signedPayload as string;
  const n = await verifiers.production
    .verifyAndDecodeNotification(payload)
    .catch(() => verifiers.sandbox.verifyAndDecodeNotification(payload))
    .catch(() => null);
  if (!n) return res.sendStatus(400);
  if (!(await db.processedEvents.insertIfAbsent('app_store', n.notificationUUID!))) return res.sendStatus(200);

  // Ack fast; the job verifies n.data.signedTransactionInfo / signedRenewalInfo and applies the transition.
  await jobs.enqueue('apply-apple-notification', { type: n.notificationType, subtype: n.subtype, data: n.data });
  res.sendStatus(200);
});
```

### Google Real-time Developer Notifications (RTDN)

Play publishes to your **Cloud Pub/Sub** topic. With a push subscription (authenticated with an OIDC token that you verify), your endpoint receives a base64 `message.data` containing `subscriptionNotification`, `oneTimeProductNotification`, `voidedPurchaseNotification` or `testNotification`. RTDN **carries no state**, only a type and a `purchaseToken`. Always call `purchases.subscriptionsv2.get` for the truth, and ack the Pub/Sub message only after you've processed it.

| Notification | Action after re-fetching state |
|---|---|
| `SUBSCRIPTION_PURCHASED` | Grant, acknowledge if still pending |
| `SUBSCRIPTION_RENEWED`, `SUBSCRIPTION_RECOVERED`, `SUBSCRIPTION_RESTARTED` | Extend or restore access |
| `SUBSCRIPTION_IN_GRACE_PERIOD` | Keep access, prompt to fix payment |
| `SUBSCRIPTION_ON_HOLD` | Remove access (account hold) |
| `SUBSCRIPTION_PAUSED`, `SUBSCRIPTION_PAUSE_SCHEDULE_CHANGED` | Remove access while paused |
| `SUBSCRIPTION_CANCELED` | Keep access until expiry, auto-renew is off |
| `SUBSCRIPTION_EXPIRED` | Remove access |
| `SUBSCRIPTION_REVOKED` | Remove access immediately (refund or revoke) |
| `SUBSCRIPTION_PENDING_PURCHASE_CANCELED` | Clear the pending UI |
| `ONE_TIME_PRODUCT_PURCHASED` / `ONE_TIME_PRODUCT_CANCELED` | Grant a completed pending purchase, or clear it |
| Voided purchase | Revoke, claw back consumables, flag abuse |

### Subscription state machine

```mermaid
stateDiagram-v2
    state "Active" as Active
    state "Active, auto-renew off" as Canceling
    state "Grace period (access)" as Grace
    state "Billing retry or on hold (no access)" as Retry
    state "Paused (Android)" as Paused
    state "Expired" as Expired
    state "Revoked or refunded" as Revoked
    [*] --> Active : SUBSCRIBED or PURCHASED
    Active --> Active : DID_RENEW or RENEWED
    Active --> Canceling : auto-renew disabled or CANCELED
    Canceling --> Active : re-enabled or RESTARTED
    Canceling --> Expired : EXPIRED
    Active --> Grace : renewal failed, grace enabled
    Active --> Retry : renewal failed, no grace
    Grace --> Active : payment recovered
    Grace --> Retry : GRACE_PERIOD_EXPIRED or ON_HOLD
    Retry --> Active : RECOVERED or BILLING_RECOVERY
    Retry --> Expired : retry window ends
    Active --> Paused : PAUSED
    Paused --> Active : resumes
    Active --> Revoked : REFUND or REVOKED
    Expired --> Active : resubscribe
    Revoked --> [*]
```
*Figure: A unified subscription state machine. Apple and Google events map onto the same states.*

Entitlement rule: **access = state in (Active, Canceling, Grace) and `expires_at` > now**, always evaluated with server time.

### Entitlement data model

Store purchases per store, and **derive** entitlements from them. Never let the client write an entitlement directly.

```plaintext
users              (id uuid PK, iap_account_token uuid UNIQUE, stripe_customer_id text, ...)

store_purchases    (id uuid PK,
                    user_id uuid NULL REFERENCES users,      -- null until linked
                    store text,              -- app_store | play_store | stripe
                    environment text,        -- production | sandbox
                    product_id text,
                    original_id text,        -- Apple originalTransactionId | Play purchase token | Stripe subscription id
                    latest_transaction_id text,
                    status text,             -- active | canceling | grace | retry | paused | expired | revoked | pending
                    auto_renew boolean,
                    expires_at timestamptz NULL,
                    replaced_by uuid NULL,   -- Play linkedPurchaseToken chain, plan changes
                    updated_at timestamptz,
                    UNIQUE (store, original_id))

product_entitlements (product_id text, entitlement text)   -- 'com.example.pro.yearly' -> 'pro'

entitlements       (user_id uuid, entitlement text, source_purchase_id uuid,
                    expires_at timestamptz NULL, PRIMARY KEY (user_id, entitlement))

processed_events   (provider text, event_id text, received_at timestamptz,
                    PRIMARY KEY (provider, event_id))       -- webhook / notification dedupe
```

`recomputeEntitlements(userId)` runs in a transaction after any purchase change. It takes the best active purchase for each entitlement (latest `expires_at`, ignoring sandbox rows for revenue reporting) and upserts the `entitlements` table. Clients fetch `GET /me/entitlements` and cache it locally (in MMKV, with its expiry) so paying users aren't locked out while offline.

### Cross-platform entitlements

```mermaid
flowchart TD
    Web["Web checkout<br/>Stripe Billing"] -->|"signed webhooks"| Ingest
    IOS["iOS app<br/>StoreKit 2"] -->|"JWS and ASSN V2"| Ingest
    Droid["Android app<br/>Play Billing"] -->|"token and RTDN"| Ingest
    Ingest["Purchase ingestion<br/>verify, dedupe, normalize"] --> Purchases[("store_purchases")]
    Purchases --> Resolver["Entitlement resolver"]
    Resolver --> Ent[("entitlements")]
    Ent --> MeAPI["GET /me/entitlements"]
    MeAPI --> Clients["iOS, Android, web<br/>gate features"]
```
*Figure: Every store feeds one normalised pipeline, and every client reads the same entitlements.*

Practical rules:

- **The account is the unit, not the device.** A user who subscribed on the web (Stripe Billing: `customer.subscription.updated`, `invoice.paid`, `invoice.payment_failed`) gets Pro on iOS after signing in. This is allowed under the multiplatform-services rule, as long as the app also offers IAP.
- **Prevent double subscriptions.** If the user already has an active entitlement from another store, hide the paywall and say where they're subscribed.
- **Manage in the right place.** You can't cancel an Apple subscription from Android. Route "Manage subscription" by `store`: `https://apps.apple.com/account/subscriptions` for iOS, `https://play.google.com/store/account/subscriptions?sku=<id>&package=<pkg>` for Play, and the Stripe customer portal for web.

## Security

- **Server-side prices.** The client sends IDs and quantities only.
- **Idempotency everywhere money moves:** idempotency keys, unique constraints on `(store, original_id)`, consumable tokens and event IDs.
- **Authenticate every inbound event:** Stripe `constructEvent`, Razorpay HMAC compared in constant time, Apple JWS via `SignedDataVerifier`, Pub/Sub push OIDC tokens.
- **Replay protection:** dedupe event IDs, rely on Stripe's timestamp tolerance, and treat a transaction already linked to another user as a conflict, not a new grant.
- **Never trust client receipts or "isPro" flags.** Jailbreak tweaks fake StoreKit responses locally, so gate server features on server-verified entitlements.
- **Refund abuse:** process `REFUND` and voided purchases, claw back consumables (allow negative balances), flag repeat refunders, and answer `CONSUMPTION_REQUEST` truthfully.
- **Secrets** (Stripe secret key, `.p8`, service-account JSON) live in a secret manager. The app ships only publishable or public SDK keys.
- **Log IDs, not data.** No card data, client secrets, raw JWS, emails or addresses in logs. Scrub Sentry breadcrumbs on payment routes.
- **Authenticate and rate-limit payment endpoints** to stop card testing.

See [Security](security.html) for device hardening and [Authentication & Sessions](authentication.html) for account linking.

## Edge cases & gotchas

- **App killed mid-payment.** Stripe: the webhook still fulfils. IAP: the unfinished transaction is redelivered on the next launch, as long as your listener is mounted at startup.
- **Double taps and retries** create duplicate PaymentIntents or orders unless you use idempotency keys and disable the button.
- **Sandbox transactions in production.** App Review purchases with sandbox accounts against your production backend. Rejecting sandbox JWS or tokens there is a classic rejection cause ("the purchase didn't unlock anything").
- **Account switching.** Apple ID A buys while app user X is signed in, then user Y signs in on the same device. Your ownership policy decides what happens, and it must be explicit.
- **Price increases.** Apple may require user consent for some increases (`PRICE_INCREASE`), and Play has its own price-change flow. Users who don't consent churn at renewal.
- **Clock and timezones.** Evaluate expiry with server UTC time, never the device clock.

## Testing & debugging

### Stripe

```bash
stripe login
stripe listen --forward-to localhost:4242/webhooks/stripe   # prints a whsec_ for local use
stripe trigger payment_intent.succeeded
stripe trigger charge.dispute.created
```

| Test card | Behaviour |
|---|---|
| `4242 4242 4242 4242` | Succeeds |
| `4000 0027 6000 3184` | Always requires 3DS authentication |
| `4000 0000 0000 0002` | Generic decline |
| `4000 0000 0000 9995` | Insufficient funds |

Use any future expiry date and any CVC. Test the 3DS card on a **real device in a release-like build** to confirm the redirect returns to the app. For subscriptions billed on the web, use Stripe **test clocks** to simulate renewals and failures.

### Apple

- **StoreKit Configuration file:** instant, offline purchases in the simulator. The **Transaction Manager** (Debug → StoreKit → Manage Transactions) lets you refund, expire, trigger Ask to Buy and interrupted purchases, and speed up renewals.
- **Sandbox testers:** sign in on the device under the sandbox account section of Settings (under App Store, or Developer on recent iOS versions). Subscriptions renew on an accelerated schedule: a 1-month subscription renews roughly every 5 minutes and a 1-year one roughly every hour. You can adjust the renewal rate, clear purchase history and simulate billing issues per tester in App Store Connect.
- **TestFlight** also uses the sandbox environment.
- **Notifications:** call `appStoreApi.requestTestNotification()` to check that your endpoint receives and verifies a `TEST` notification.

### Google

- **License testers** see test instruments ("Test card, always approves", "…always declines", and slow cards that produce **pending** purchases). Test subscriptions renew fast (a monthly plan renews in about 5 minutes), and test orders are refunded automatically.
- **Play Billing Lab** lets you change the Play country and test offer eligibility and accelerated subscription scenarios.
- **RTDN:** use *Send test notification* on the Monetization setup page, and watch the Pub/Sub subscription metrics for undelivered messages.
- Debug on device with `adb logcat | grep -i billing`.

## App Review pitfalls

- **External payment for digital goods** outside the storefronts and entitlements that allow it (guideline 3.1.1). This includes "subscribe on our website" buttons in regions where steering is still prohibited.
- **No Restore Purchases** button for non-consumables or subscriptions.
- **Missing subscription disclosures (3.1.2):** the paywall must show the title, length, **price per period** and what's included. The binary must link to your **Terms of Use (EULA)** and **Privacy Policy**, and the App Store metadata must include them too.
- **Misleading paywalls:** the trial price shown bigger than the real price, hidden close buttons, fake countdowns, or "free" without clearly stating what's charged afterwards.
- **IAP products not submitted** with the build, or the reviewer's sandbox purchase failing because the backend rejects sandbox transactions.
- **Using IAP for physical goods or real-world services**, which is also a rejection.

## Troubleshooting

| Symptom | Likely cause | Fix |
|---|---|---|
| iOS product list is empty | Paid Applications Agreement, banking or tax incomplete; product in *Missing Metadata*; bundle ID mismatch; product IDs typo'd; new products still propagating | Complete the agreements in App Store Connect → Business, fill in all product metadata (including the review screenshot) until it reads *Ready to Submit*, check the bundle ID, wait a few hours after creating products |
| Android product list is empty | App not uploaded to a testing track; tester not a license tester or hasn't accepted the opt-in; installed build's `applicationId` differs; products inactive; device account isn't the tester | Upload an AAB with the `BILLING` permission to internal testing, add the tester to both lists, install from the Play link, activate products and base plans |
| Android purchases refunded after 3 days | Purchase never acknowledged or consumed | Call `finishTransaction` after granting, and add a server-side acknowledgement sweeper |
| "Item already owned" on Android | Consumable never consumed, or a previous purchase pending | Consume after granting (`isConsumable: true`), and process unfinished purchases at launch |
| Purchase succeeded but nothing unlocked | Backend rejected a sandbox transaction, or verification failed and the client still finished | Accept sandbox on production (flagged), and only finish after a successful grant |
| PaymentSheet 3DS never returns to the app | Missing `urlScheme` / `returnURL`, URL scheme not registered, or links not forwarded to `handleURLCallback` | Register the scheme in `Info.plist` and the manifest, pass `urlScheme` to `StripeProvider` and `returnURL` to `initPaymentSheet`, wire up the `Linking` handler |
| Apple Pay missing from PaymentSheet | No Merchant ID or Apple Pay capability/entitlement, processing certificate not uploaded to Stripe, `applePay` not passed, no card in Wallet | Complete the Apple Pay setup steps and test on a device with a card |
| Google Pay missing | Manifest `meta-data` missing, Google Pay disabled in Stripe, `testEnv` doesn't match your keys, no Play services or card | Add the `meta-data` (or the plugin flag), enable Google Pay, align `testEnv` with test/live mode |
| Every webhook returns 400 | JSON parser ran before `constructEvent`, or the wrong `whsec_` (CLI vs Dashboard endpoint, test vs live) | Mount the raw-body route first, and use the secret for that endpoint |
| Duplicate orders or charges | No idempotency key, a new PaymentIntent per tap | Idempotency keys, one pending order per cart, reuse open PaymentIntents |
| Apple JWS verification fails | Wrong environment verifier, missing `appAppleId` for production, missing root certs, StoreKit-config (Xcode-signed) transaction | Try production then sandbox, configure the app ID and root CAs, don't verify local StoreKit transactions against Apple roots |
| No RTDN arriving | Pub/Sub publisher grant missing, wrong topic name in Play Console, push endpoint rejecting auth | Grant the Play service account Publisher, re-send the test notification, check the subscription's delivery metrics |

## Production checklist

- [ ] Payment mechanism chosen per product type and storefront, with current §3.1 / Play Payments policy reviewed for every region shipped
- [ ] Live Stripe account activated; live keys in the secret manager; publishable key per environment
- [ ] Amounts computed server-side; idempotency keys on PaymentIntent, refund and customer creation
- [ ] Webhook endpoint uses a raw body, verifies signatures, dedupes event IDs, acknowledges fast and queues work
- [ ] Reconciliation job for stuck orders and daily payout matching, with alerts
- [ ] 3DS tested on a real device in a release build; `urlScheme` / `returnURL` configured
- [ ] Apple Pay processing certificate uploaded, with a renewal reminder; Google Pay production access approved and `testEnv: false` in release
- [ ] Radar rules, rate limits and auth on payment endpoints; dispute evidence process defined
- [ ] Paid Applications Agreement, banking and tax complete; IAP products *Ready to Submit* and attached to the version
- [ ] Play payments profile set up; products and base plans active; Play Billing Library version compliant
- [ ] Purchase listener mounted at app root; transactions finished or acknowledged only after the server grants
- [ ] Server verification for Apple (JWS, `SignedDataVerifier`, sandbox fallback) and Google (`subscriptionsv2.get` / `products.get`)
- [ ] `appAccountToken` / `obfuscatedAccountId` sent on every purchase; ownership conflict policy defined
- [ ] App Store Server Notifications V2 (production and sandbox URLs) and RTDN configured and tested
- [ ] Subscription state machine covers grace, retry or hold, pause, cancel, expire, refund and revoke
- [ ] Restore Purchases button on the paywall and in settings
- [ ] Paywall shows localised prices, period, auto-renew terms, and links to Terms and Privacy
- [ ] Unified entitlements API used by every client; offline cache with expiry
- [ ] Refund and voided-purchase handling claws back consumables
- [ ] Logs and crash reports scrubbed of card data, secrets and PII
- [ ] Monitoring on webhook failure rates, verification errors, payment success rate and entitlement mismatches (see [Monitoring](monitoring.html))

## Interview questions

### How do you decide between a payment gateway like Stripe and Apple/Google in-app purchases?

It depends on **what is sold and where it's consumed**. Physical goods and real-world services (food, rides, bookings, e-commerce) must use a gateway such as Stripe, Braintree, Adyen or Razorpay, usually with Apple Pay and Google Pay. Digital content, features and subscriptions used in the app must use IAP / Play Billing under Apple 3.1.1 and Google's Payments policy. Exceptions include reader apps (link-out entitlement), real-time one-to-one services, enterprise apps sold to organisations, and multiplatform access to purchases made elsewhere (provided IAP is also offered). Regional rules now differ: US link-outs after the 2025 *Epic v. Apple* ruling, the EU DMA, Japan and South Korea. So I'd check the current guidelines per storefront and make payment options configurable from the server.

### Walk me through a Stripe PaymentSheet payment. Where does fulfillment happen, and why?

The app sends a cart ID and an idempotency key. The server recomputes the total, creates a Customer, an Ephemeral Key (or CustomerSession) and a PaymentIntent, and returns the `client_secret`. The app calls `initPaymentSheet` and `presentPaymentSheet`. The SDK collects the card (keeping us in minimal PCI scope), runs 3DS if required, and returns via the URL scheme. **Fulfillment happens in the `payment_intent.succeeded` webhook**, after signature verification and event-ID dedupe. The client can die mid-flow, a 3DS redirect can strand the user, and asynchronous methods can settle later, so only the signed provider event is authoritative. The client just polls or listens for the order status.

### How do you prevent double charges?

Use layers. The UI disables the button while presenting. The client sends a stable **idempotency key** per checkout attempt. The server keeps **one pending order per cart**, reuses an open PaymentIntent whose amount matches, and passes a Stripe `idempotencyKey` derived from the order, amount and client key, so a retried request returns the same PaymentIntent. Webhooks are deduped by event ID, and `markPaid` is a conditional update (`WHERE status <> 'paid'`), so duplicate or out-of-order events are harmless. For IAP, the equivalent is unique constraints on the original transaction ID or purchase token, and granting each consumable token exactly once.

### What is SCA / 3D Secure, and what commonly breaks it in React Native apps?

Strong Customer Authentication (mandatory in the EEA and UK, and common elsewhere) requires the issuer to challenge the cardholder, for example with a bank-app approval or an OTP. The Stripe SDK handles it: the PaymentIntent moves to `requires_action`, the SDK presents the challenge in-app or in a browser, then completes confirmation. What breaks it is a missing **`urlScheme` on `StripeProvider` / `returnURL` in `initPaymentSheet`**, an unregistered URL scheme, a deep-link handler that doesn't forward URLs to `handleURLCallback`, or a navigation linking config that swallows the redirect. The user then gets stuck in the browser, and the order stays in `requires_action` until the reconciliation job cancels it.

### How do you verify an in-app purchase on the server for iOS and Android?

**iOS:** StoreKit 2 gives a JWS-signed transaction. The backend verifies it with Apple's `@apple/app-store-server-library` `SignedDataVerifier` (certificate chain to Apple's root CA, bundle ID, environment, and the app's Apple ID in production). It optionally calls the App Store Server API (`getAllSubscriptionStatuses`) for the current status. **Android:** the backend calls the Google Play Developer API (`purchases.subscriptionsv2.get` or `purchases.products.get`) with the purchase token, using a service account, and reads the state, expiry, acknowledgement state and `obfuscatedExternalAccountId`. On both platforms: check that the account token matches the user, upsert idempotently, recompute entitlements, and accept sandbox transactions on production (flagged) because App Review uses sandbox. The legacy `verifyReceipt` is deprecated.

### What happens if you don't finish or acknowledge a transaction, and in what order should you do it?

On **Android**, a purchase not **acknowledged within 3 days** (or consumed, for consumables) is automatically refunded and the entitlement revoked. On **iOS**, an unfinished transaction stays in the queue and is redelivered on every launch. The right order is **verify, then grant on the server, then finish**. Finishing first risks a paid user with nothing unlocked if the backend call fails. Granting first and failing to finish just causes a harmless redelivery that your idempotent backend absorbs. Add a server-side acknowledgement sweeper for Play as a safety net.

### How would you model subscription state, including grace periods, billing retry and refunds?

Normalise both stores into one state machine: active, active with auto-renew off, grace period (keeps access), billing retry / account hold (no access), paused (Android), expired, and revoked or refunded. Transitions are driven by **App Store Server Notifications V2** (`DID_RENEW`, `DID_FAIL_TO_RENEW`, `GRACE_PERIOD_EXPIRED`, `EXPIRED`, `REFUND`, `REVOKE`, and so on) and **Google RTDN** via Pub/Sub. For Google I always re-fetch state with `subscriptionsv2.get`, because RTDN carries no state. Access is derived: state in (active, canceling, grace) and `expires_at` > server now. Purchases are stored per store, and entitlements are recomputed from them, never written by the client.

### A user subscribes on the web, then installs the iOS and Android apps. How do you support that?

Entitlements belong to the **account**, not the device or store. Web purchases arrive through Stripe Billing webhooks, iOS through JWS verification plus ASSN V2, and Android through token verification plus RTDN. All of them flow into one `store_purchases` table, and an entitlement resolver computes `entitlements`. Every client calls `GET /me/entitlements` after sign-in. Apple allows accessing purchases made elsewhere as long as IAP is also offered in the app. The UX details: hide the paywall when an entitlement from another store is active (to prevent double billing), and route "Manage subscription" to the right place (App Store settings, Play subscriptions, or the Stripe customer portal).

### RevenueCat or react-native-iap: which would you choose?

The client call is trivial with either. The real cost is the backend: validation, notification processing, renewal, grace and refund state, upgrade token chains and cross-platform entitlements. For a typical subscription app without a billing team, I'd choose **RevenueCat**: hosted validation, entitlements, webhooks and remote paywalls, for a revenue share that's usually cheaper than the engineering time. I'd choose **react-native-iap / expo-iap plus our own backend** when we already run billing (for example, Stripe on the web as the source of truth), need data control or residency, or the revenue share is significant at our scale. Either way, I'd wrap it behind a `PurchasesService` interface so the choice stays reversible.
