## Interview questions

### What problems did the legacy bridge have, and how does the New Architecture solve them?

**Short answer:** The bridge was an asynchronous, batched, JSON-serialized message queue. That meant no synchronous calls, serialization overhead, congestion for high-frequency traffic, eager native module initialization, and layout that could only be read after a round trip. The New Architecture replaces it with JSI (direct C++ calls), TurboModules (lazy, typed modules), Fabric (a C++ renderer with synchronous layout access) and Codegen (typed glue at build time).

Go one level deeper with concrete consequences: gestures and JS-driven animations dropped frames when the queue was busy; startup cost grew with every SDK because modules were created up front; "measure then position" UIs flickered; signature mismatches were runtime crashes. Then map each to its fix.

> [!INTERVIEW]
> What a senior answer includes: specific failure modes, not "the bridge was slow". Red flags: claiming the New Architecture makes everything synchronous or automatically faster. Likely follow-ups: "When would you still prefer async?", "What changed at startup?"

### What is JSI, and what are host objects and host functions?

**Short answer:** JSI is a C++ interface to the JavaScript engine that lets native code create and read JS values and call functions directly, without serialization. A host function is a C++ function exposed as a JS function; a host object is a C++ object whose property access is routed to C++ `get`/`set`. TurboModules are implemented as host objects.

JSI is engine-agnostic: Hermes, JavaScriptCore and V8 integrations implement the same `jsi::Runtime` interface, so modules work regardless of engine. Because JS can hold references to C++ objects, large data (camera frames, buffers) can be shared instead of copied. The critical constraint: the runtime is single-threaded — JS values may only be touched on the JS thread, and background work must hop back through a `CallInvoker`.

### How do TurboModules differ from legacy native modules, and when should a method be synchronous?

**Short answer:** TurboModules are lazy (created on first access), strongly typed via a Codegen spec, called directly through JSI, and can expose synchronous methods. Legacy modules were mostly created at startup, untyped, and async-only over the bridge.

A spec method returning a plain value is synchronous and runs on the JS thread; returning `Promise<T>` or `void` makes it async on a native queue. Make a method sync only if it is cheap and bounded — reading a cached value, a flag, a constant. Disk or network I/O, crypto on large inputs, or anything with unpredictable latency stays async, otherwise you trade bridge latency for JS thread jank.

> [!INTERVIEW]
> Likely follow-ups: "How would you emit events from a TurboModule?" (typed `EventEmitter` properties in recent versions, or `NativeEventEmitter`), "How do you mock it in Jest?" (mock the spec module).

### Walk me through Fabric's render, commit and mount phases. Which threads are involved?

**Short answer:** In the render phase React runs components on the JS thread and creates an immutable C++ shadow tree via JSI. In the commit phase Yoga computes layout on cloned nodes and the tree is promoted as the next tree to mount — on the JS thread or a background thread. In the mount phase, on the UI thread, the renderer diffs old and new trees and applies minimal mutations to platform views.

Worth adding: immutability with structural sharing makes the tree thread-safe without locks and lets React prepare trees it may discard (concurrent rendering). View flattening removes layout-only views during mount. Synchronous JSI access to the shadow tree is why `measure` inside `useLayoutEffect` returns correct values before paint.

### What does Codegen generate, and why is it important?

**Short answer:** Codegen reads typed TypeScript/Flow specs (`Native*.ts` for modules, `*NativeComponent.ts` for components) at build time and generates the C++ JSI bindings, Java abstract classes/ViewManager interfaces and Objective-C protocols that native code implements. It makes the JS–native boundary type-safe: a mismatch is a compile error instead of a runtime crash.

It runs in the Gradle build (`generateCodegenArtifactsFromSchema`) and during `pod install`. For components it also generates props structs, event emitters, shadow nodes and component descriptors. Practical gotchas: only supported types parse, generated output must be regenerated after spec changes, and library authors can ship pre-generated code.

### What is Bridgeless mode, and what is the interop layer for?

**Short answer:** Bridgeless mode initializes React Native without the bridge at all, using `ReactHost` on Android and `RCTHost` on iOS; it has been the default with the New Architecture since 0.74. The interop layers let legacy native modules and view managers keep working on top of the new systems so apps could migrate before every library did.

The interop covers common public APIs (`NativeModules`, `requireNativeComponent`, event emitters) but not bridge internals like `RCTBridge`, `ReactInstanceManager` or `UIManagerModule`. It is transitional: unmigrated libraries are debt, and some behaviors (e.g. untyped access) lose the benefits of Codegen.

### How would you migrate a large production app to the New Architecture?

**Short answer:** Treat it as a dependency project first: audit every native library (React Native Directory, `expo-doctor`), upgrade or replace blockers, then upgrade React Native in steps with the Upgrade Helper, fix code-level breakages, test release builds on low-end devices, and ship with a staged rollout and predefined halt criteria.

Details that show experience: stabilize on the last opt-out version (0.81 / SDK 54) before moving to 0.82+; grep for `findNodeHandle`, `UIManager`, `setNativeProps`, `NativeModules`; screenshot-diff key screens for Fabric/Yoga layout shifts; test with R8 enabled; remember OTA cannot ship an architecture change and runtime versions must be pinned; capture before/after metrics including build time.

> [!INTERVIEW]
> Red flags: "flip the flag and ship". Strong signals: a dependency matrix, a rollback plan (you can only roll forward on stores, so halt the staged rollout and hotfix), and ownership of interop debt.

### Does the New Architecture make React Native apps faster?

**Short answer:** Not automatically. It removes specific bottlenecks — startup cost from eager modules and bridge setup, serialization overhead, async-only access, layout jumps, and the lack of concurrent rendering. Apps limited by those see real gains; apps whose problems are re-renders, heavy JS or unoptimized lists will not.

The gains to name: faster startup with many native SDKs, synchronous storage reads, smoother gesture/animation/camera integrations, correct first-frame layout, better responsiveness under load via transitions. Costs to mention: C++ build times and a modest native size increase. Always measure before and after on real devices in release mode.

### Turbo Native Module, Expo Modules API or Nitro Modules — how do you choose?

**Short answer:** In an Expo app, Expo Modules for app-specific native code (Swift/Kotlin DSL, config plugins, low boilerplate). Nitro for hot paths and rich object models where per-call overhead matters. A Turbo Native Module for public libraries that should not add dependencies, or when you want the official toolchain and C++ cross-platform modules.

All three are built on JSI and support the New Architecture. Trade-offs: Turbo Modules are verbose and need an ObjC++ layer for Swift; Expo Modules add `expo-modules-core` and hand-written TS types; Nitro is a community project with its own codegen (Nitrogen) and runtime dependency but excellent performance and Swift-native interop.

### Why does measuring a view in useLayoutEffect work correctly on the New Architecture but flicker on the old one?

**Short answer:** On Fabric the committed shadow tree, including Yoga layout, lives in C++ and JS can read it synchronously through JSI, while the well-defined event loop guarantees layout effects run before the update is painted. So you can measure and set state before the user sees the frame. On the legacy architecture `measure` was an async bridge round trip, so the first frame always painted with the old layout.

This is also why popovers, tooltips and auto-sizing components can drop `setTimeout` hacks and why state updates made inside `useLayoutEffect` are applied in the same visual frame. Caveat: synchronous work in layout effects blocks paint, so keep it small.
