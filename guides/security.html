## Interview questions

### Where would you store an API key for a third-party service in a React Native app?

**Short answer:** If it is a secret, not in the app at all. Anything in the bundle or binary — `.env` via react-native-config, `EXPO_PUBLIC_*`, native constants, even obfuscated strings — can be extracted from the APK/IPA, and Hermes bytecode can be disassembled.

Secret keys stay on the backend; the app calls your own authenticated, rate-limited endpoint that proxies the third party. Keys that are public by design (Maps SDK, Firebase config, Stripe publishable, Sentry DSN) ship in the app but are restricted — Android package + SHA-1 of every signing cert including the Play App Signing key, iOS bundle ID, API scopes, quotas — and backed by server-side rules (Firebase Security Rules, App Check). Mention that platform restrictions rely on spoofable headers, so they reduce abuse rather than prevent it.

### How do you store authentication tokens securely, and why not AsyncStorage?

**Short answer:** In the iOS Keychain and Android Keystore-backed storage via react-native-keychain or expo-secure-store, using a `ThisDeviceOnly` accessibility class. AsyncStorage is unencrypted files in the sandbox — readable on rooted devices, in backups, and by forensic tools.

Choose `AfterFirstUnlockThisDeviceOnly` if background tasks need the token, `WhenUnlockedThisDeviceOnly` otherwise; optionally add biometric access control. Keep access tokens short-lived and mostly in memory. Handle platform quirks: iOS Keychain survives reinstall (clear on first launch), Android Keystore keys are not backed up (exclude ciphertext from backup, catch decryption errors). Larger sensitive data goes into encrypted MMKV or SQLCipher with the key in the Keychain.

### What is certificate pinning, what are its risks, and how do you rotate pins?

**Short answer:** Pinning makes the app accept a TLS connection only if the server's chain contains an expected public key (SPKI hash), defending against rogue or user-installed CAs. The main risk is self-inflicted: a wrong pin bricks every installed app until users update.

Pin SPKI hashes (not certificates) for your own hosts only, always with a backup pin (offline key or second CA). Implement with react-native-ssl-public-key-pinning or natively (OkHttp `CertificatePinner` / `network_security_config` pin-set, TrustKit / `NSPinnedDomains`). Rotation: add the new pin in a release, wait for adoption with minimum-version enforcement, rotate the server key, remove the old pin later. Monitor pin failures, keep the update-check endpoint reachable, and consider Android pin expiration. Acknowledge that Frida/objection bypass pinning on rooted devices — it protects users from MITM, not your API from the device owner.

### Is root or jailbreak detection effective? How would you use it?

**Short answer:** It is a useful risk signal but not a security boundary — every client check can be hooked or hidden (Frida, Magisk DenyList), and false positives hit legitimate users.

Use jail-monkey or freeRASP to collect signals (root, hooks, debugger, tampering, unofficial store), send them to the backend, and combine them with attestation verdicts and behavioural data. Respond proportionally: extra rate limits, step-up authentication, or disabling high-risk features such as payouts — rather than crashing the app. Real protection for the business comes from server-side authorization and attestation.

### How do Play Integrity and App Attest work, and how do you integrate them?

**Short answer:** They let your backend verify that a request comes from your genuine, unmodified app on a genuine device. The app obtains a platform-signed token bound to a server nonce or request hash; the backend verifies it (Google decodes Play Integrity tokens; App Attest attestations are verified against Apple's root CA) and allows, limits or challenges the request.

Integration: backend issues a single-use nonce → app requests the token (Play Integrity standard/classic request; App Attest `attestKey` once, then `generateAssertion` per request) → backend verifies signature, nonce, package/bundle, and verdict fields. Firebase App Check wraps both into short-lived tokens verifiable with the Admin SDK (limited-use tokens for replay protection). Roll out in monitor mode first, decide a policy for unavailable verdicts (non-Play devices, simulators), and mind quotas.

### How do you implement biometric login securely?

**Short answer:** Never trust a boolean from `authenticate()`. Either store the refresh token behind biometric access control so the OS only releases it after a match, or — stronger — create a key pair in the Secure Enclave/Keystore that requires biometrics to sign a server challenge, so the server verifies the proof.

The local-gate approach is fine for "app lock" UX but trivially bypassed with Frida. Keychain access control (`BIOMETRY_CURRENT_SET`) is enforced by secure hardware. Signature-based flows give the server proof of possession plus user presence, ideal for passwordless login and step-up for payments. Invalidate keys on biometric enrolment changes, provide a password/OTP fallback, and handle lockout and cancellation.

### How do you prevent sensitive data from leaking outside the app?

**Short answer:** Cover each leak channel explicitly: app-switcher snapshots, screenshots, logs, crash reports, backups, clipboard, caches and WebView storage.

`FLAG_SECURE` on Android and a blur overlay on resign-active on iOS; strip `console.*` in production with `transform-remove-console`; scrub `Authorization` headers, query strings and PII in Sentry `beforeSend`/`beforeBreadcrumb`; exclude secure storage from Android backups via data extraction rules and choose iOS file protection classes deliberately; avoid copying secrets to the clipboard; delete temp files after upload and clear image/WebView caches on logout. Maintaining a data inventory makes all of this — and privacy labels — manageable.

### How would you secure a WebView that talks to native code?

**Short answer:** Restrict it to origins you control, validate every message, and expose a minimal typed bridge.

Use `onShouldStartLoadWithRequest` to allow only your origin (open other `https` links externally, block `file:`, `javascript:` and custom schemes), `originWhitelist={['https://*']}`, disable file access and universal access from file URLs, `mixedContentMode="never"`, no multiple windows, and debugging only in dev. In `onMessage`, check `nativeEvent.url` against your origin, parse JSON defensively and validate against a schema of allowed actions. Never inject long-lived tokens into web content; exchange a short-lived, scoped session server-side instead.

### How do you manage supply-chain risk in a React Native project?

**Short answer:** Treat dependencies as code you ship: lock them, scan them, review new ones — especially their native code and install scripts — and avoid auto-adopting brand-new versions.

Commit lockfiles (npm/Yarn/pnpm, `Podfile.lock`) and use frozen installs in CI; run `npm audit` plus Socket/Snyk on PRs; use Renovate/Dependabot with a minimum release age and grouped updates; restrict lifecycle scripts (pnpm 10's allow-list model); skim podspecs and Gradle plugins of new native libraries; scan for committed secrets; lock down CI tokens and signing keys. Reference the 2025 npm account-takeover incidents as the reason these controls matter.

### Walk me through a threat model for a fintech React Native app.

**Short answer:** Identify assets (credentials, tokens, money movement, PII), actors (thief, device owner with root, network attacker, malicious apps, bots, compromised dependencies) and trust boundaries, then map controls to MASVS categories — with enforcement on the server.

Concretely: short-lived access tokens and rotating device-bound refresh tokens in the Keychain; server-verified biometric signatures for transfers; attestation on login, OTP and transfer endpoints; pinning with backup pins; FLAG_SECURE and app-switcher overlay; no PII in logs or crash reports; backups excluded; Universal/App Links for sensitive links; RASP signals feeding a fraud engine; rate limiting and anomaly detection; dependency scanning; MASTG-based pentests each major release. Close by stating what the client cannot guarantee and how the backend compensates.
