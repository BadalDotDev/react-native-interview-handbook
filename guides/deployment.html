| ITMS-90189 Redundant Binary Upload | Build number already used for this version | Increment `CURRENT_PROJECT_VERSION`; make CI own build numbers |
| ITMS-90062 version must be higher | `CFBundleShortVersionString` not greater than the last approved version | Bump `MARKETING_VERSION` |
| ITMS-90683 Missing purpose string | A linked SDK references a privacy-sensitive API without a usage description | Add the `NS...UsageDescription` key with a real explanation, even if the feature is rarely used |
| ITMS-91053 Missing API declaration | Required-reason API used without declaration in a privacy manifest | Update `PrivacyInfo.xcprivacy`; update SDKs that ship their own manifests |
| Upload rejected for SDK version | Built with an Xcode/SDK older than Apple's current minimum | Upgrade Xcode on CI (and RN if needed) |
| ITMS-90717 Invalid App Store icon | 1024 icon has an alpha channel | Export the icon without transparency |
| TestFlight shows "Missing Compliance" | Export compliance not declared | Add `ITSAppUsesNonExemptEncryption` to `Info.plist` (`usesNonExemptEncryption` in Expo) |
| Xcode "PhaseScriptExecution failed" in *Bundle React Native code and images* | Node not found (nvm/volta), or a JS bundling error | Set `NODE_BINARY` in `ios/.xcode.env.local`; run `npx react-native bundle` locally to see the real error |
| Play: "Version code X has already been used" | `versionCode` reused (any track, ever) | Increment; derive from CI; check `google_play_track_version_codes` |
| Play: "You uploaded an APK or Android App Bundle that was signed in debug mode" | Release build using the debug signing config | Configure `signingConfigs.release` and verify with `keytool -printcert -jarfile` |
| Play: "signed with the wrong key" | AAB signed with a key other than the registered upload key | Use the correct keystore; if lost, request an upload key reset |
| Play: target API level error on upload | `targetSdkVersion` below the current Play requirement | Raise `targetSdkVersion`/`compileSdkVersion`, test behaviour changes |
| Play: "does not support 16 KB memory page sizes" | Native `.so` files not 16 KB aligned (often a third-party SDK) | Upgrade RN (0.77+), AGP 8.5.1+, NDK r28+; update or replace libraries with prebuilt `.so`; verify with `zipalign -c -P 16` |
| Release APK crashes on launch, debug works | R8 removed reflected classes, or JS bundle not embedded | Check logcat for `ClassNotFoundException` and add keep rules; check `debuggableVariants` with flavors |
| "Unable to load script" in a release build | Variant treated as debuggable so no bundle was embedded | Fix `debuggableVariants`; confirm `index.android.bundle` exists in the APK assets |
| Pod install errors for new configurations | CocoaPods doesn't know `Debug-Staging` etc. | Map configurations in the `Podfile` `project` line; include the Pods xcconfig in custom xcconfigs |
| Google Sign-In / App Links fail only in the Play build | SHA-256 of the Play app signing key not registered | Add the app signing key fingerprint from Play Console to Firebase/Google Cloud and `assetlinks.json` |
| Gradle daemon killed / OOM on CI | Default JVM heap too small | Set `org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g` in `android/gradle.properties` |

## Production checklist

- [ ] Developer accounts active; organisation D-U-N-S and Play identity verification complete; account access shared with at least two admins
- [ ] Bundle ID / applicationId final; variants use suffixes and separate backend/Firebase/Sentry projects
- [ ] Upload keystore and passwords stored in a secret manager with backup; nothing signing-related in git
- [ ] Play App Signing enabled; app signing key SHA-256 registered with Firebase, Google Sign-In, Maps and `assetlinks.json`
- [ ] iOS certificates/profiles managed centrally (match or EAS credentials); capabilities match entitlements for app and extensions
- [ ] Marketing version and build numbers come from CI; one build number shared by both platforms
- [ ] `targetSdkVersion` meets the current Play requirement; 16 KB alignment verified
- [ ] Built with the Xcode/SDK version Apple currently requires
- [ ] R8 enabled with tested keep rules; release build smoke-tested on real devices
- [ ] `ITSAppUsesNonExemptEncryption`, privacy manifest, purpose strings, App Privacy labels and Play Data safety form are accurate, including SDKs
- [ ] In-app account deletion implemented; privacy policy and support URLs live
- [ ] Reviewer demo account and review notes prepared; content rating / age rating questionnaires answered
- [ ] Store listings, screenshots (6.9" iPhone, iPad if supported, Play phone) and icons (1024 no-alpha, 512 Play) uploaded
- [ ] CI builds signed artifacts from tags only, with secrets in protected environments
- [ ] Source maps, dSYMs, R8 mapping and native symbols uploaded per build
- [ ] Staged rollout plan and gates agreed; alerting on crash-free rate and ANR rate per version
- [ ] Hotfix runbook written: who halts, how to OTA, how to request expedited review
- [ ] Feature flags / kill switches for risky features in this release

## Interview questions

### What is Play App Signing, and what happens if you lose your upload key?

**Short answer:** Play App Signing splits Android signing into an **app signing key** held by Google, which signs what users install, and an **upload key** you hold, which only authenticates your uploads. Losing the upload key is recoverable: an account owner requests an upload key reset in Play Console and registers a new certificate.

Before Play App Signing, the key you signed with *was* the app's identity — lose it and you could never update the app. Now Google re-signs the device-specific APKs it generates from your AAB. Consequences worth mentioning: production SHA-256 fingerprints for Firebase, Google Sign-In and `assetlinks.json` must come from the **app signing key** in Play Console, not your upload keystore; and the upload key should still be treated as a secret (stored in a secret manager, injected into CI via `ORG_GRADLE_PROJECT_*` variables, never committed).

> [!INTERVIEW]
> Strong answers mention the fingerprint gotcha and how the keystore gets into CI. Red flag: "we keep the keystore in the repo so CI can use it."

### Walk me through iOS code signing. Why does a build that signs fine on your Mac fail in CI?

**Short answer:** A signed iOS app needs a **certificate** (private key proving team identity), an **App ID** with capabilities, and a **provisioning profile** tying them together (plus devices for dev/ad hoc). CI fails because it doesn't have the private key or profile, or because automatic signing needs an interactive Apple ID.

Locally, Xcode's automatic signing quietly created a development certificate in your keychain and fetched profiles. In CI there's no keychain entry and no logged-in account. The fix is a shared, reproducible identity: Fastlane `match` (encrypted certs/profiles in a repo, `readonly` in CI, `setup_ci` for a temp keychain) or EAS credentials, and an **App Store Connect API key** instead of Apple ID auth. Also check entitlements vs profile capabilities — adding push or associated domains without regenerating profiles is the other classic failure — and remember each app extension needs its own profile.

### How do you manage version numbers and build numbers across platforms and CI?

**Short answer:** Keep the marketing version (`versionName` / `MARKETING_VERSION`) human-controlled per release, and make the build number (`versionCode` / `CURRENT_PROJECT_VERSION`) a CI-generated, strictly increasing integer shared by both platforms.

Details: `versionCode` must be unique forever across all Play tracks; iOS build numbers must be unique per marketing version and the marketing version must exceed the last approved one. Inject values at build time (`-PAPP_VERSION_CODE=...`, `xcodebuild ... CURRENT_PROJECT_VERSION=...`) rather than committing bumps, which cause merge conflicts on release branches. Options for the number itself: CI run number plus an offset, querying the store for the latest and adding one, or EAS remote versioning with `autoIncrement`. Sharing one number means a crash report's "1.4.2 (10423)" maps to one commit and one pipeline run.

### How would you set up dev, staging and production variants of an RN app?

**Short answer:** Separate bundle IDs/application IDs per environment so they install side by side, with distinct names, icons, backends and Firebase/Sentry projects — Android product flavors, iOS build configurations + schemes + xcconfig, and `app.config.ts` driven by `APP_VARIANT` in Expo.

On Android, flavors with `applicationIdSuffix`, source-set overrides for `strings.xml`, icons and `google-services.json`, and `debuggableVariants` updated in the `react {}` block. On iOS, duplicated configurations (`Release-Staging`), xcconfig files setting `PRODUCT_BUNDLE_IDENTIFIER`, display name and icon set, shared schemes, and the Podfile `project` mapping so Pods know which configurations are debug. JS reads config through react-native-config or Expo `extra`/`EXPO_PUBLIC_*`. Stress that these values ship in the binary and are not secrets.

### Design a CI/CD pipeline for a React Native app.

**Short answer:** PR checks on Linux (lint, typecheck, unit tests); on merge, build internal builds for both platforms; on a release tag, build signed AAB/IPA with CI-owned version numbers, upload to Play internal and TestFlight, promote the *same* artifacts to production with staged rollouts, and upload symbols for every build.

Talking points: secrets in protected CI environments restricted to tags; Fastlane lanes or EAS profiles as the single way to build; caching (Gradle, CocoaPods keyed on `Podfile.lock`, node_modules keyed on the lockfile); macOS minutes are expensive, so only build there; artifact retention; OTA channel wiring for JS-only fixes; release trains with feature flags; automated rollout gates based on crash-free rate. Mention the one-time manual steps: first Play upload, closed testing for new personal accounts, App Store record creation.

> [!INTERVIEW]
> Senior signal: talking about *promotion* of a single tested artifact rather than rebuilding per environment, and about how the pipeline supports a fast hotfix. Likely follow-up: "How long from merge to a fix in users' hands?"

### Your new version reaches 10 percent of Android users and the crash rate triples. What do you do?

**Short answer:** Halt the staged rollout immediately, confirm the crashes are specific to the new version, then use the fastest safe lever — kill the feature flag, fix server-side, ship an OTA if the cause is JS-only, or ship a hotfix binary with a higher `versionCode` (and expedited review on iOS if affected).

Halting stops new users getting the build but doesn't revert the 10 percent who have it — there's no rollback on either store — so the fix must reach them too. Check whether the crash is device- or OS-specific (Play lets you exclude device models), look at symbolicated stack traces (source maps, mapping files), and pause the iOS phased release in parallel if the same code shipped there. Afterwards: post-mortem, a test or alert that would have caught it, and possibly tighter rollout gates.

### What's the difference between Android staged rollouts and iOS phased releases?

**Short answer:** Android staged rollouts use any percentage you choose, can be halted, resumed and changed at will, and apply to all users receiving the update. iOS phased release follows a fixed 7-day schedule (1, 2, 5, 10, 20, 50, 100 percent) that only affects **automatic updates** — users can still update manually and new installs get the new version — and you can only pause (up to 30 days) or release to everyone.

So iOS gives you less control over blast radius; compensate with feature flags, longer TestFlight external testing and OTA readiness. Neither platform supports rolling back a binary.

### What are the most common App Store rejections and how do you prevent them?

**Short answer:** Crashes and incomplete flows during review (2.1), missing demo credentials, thin WebView apps (4.2), privacy problems such as vague purpose strings or missing account deletion (5.1.1), selling digital goods outside IAP (3.1.1), and third-party login without Sign in with Apple or an equivalent (4.8).

Prevention is procedural: test the exact release build on current and oldest supported iOS, give reviewers a working account and clear notes, write specific purpose strings, keep App Privacy labels and privacy manifests accurate for all SDKs, and follow the current regional IAP/link-out rules. When rejected, read the cited guideline, reply in the Resolution Center with clarification or screenshots when the reviewer missed something (often no new build is needed), and appeal only when the guideline is genuinely misapplied.

### How do you keep secrets safe in the build pipeline and in the app?

**Short answer:** Signing material and API credentials live only in a secret manager and CI secrets scoped to protected environments; they're injected at build time and never committed. Anything bundled into the app — `.env`, `BuildConfig`, `Info.plist`, JS — is public, so real secrets stay on the server.

Specifics: base64 keystore decoded at build time and deleted afterwards, `ORG_GRADLE_PROJECT_*` for Gradle passwords, match repo encrypted with `MATCH_PASSWORD`, App Store Connect API keys with least-privilege roles, Play service account limited to release permissions, EAS environment variables with secret visibility, required reviewers on production deployments, and no signed builds from fork PRs. In the app, use short-lived tokens from your backend instead of embedded keys, and restrict public keys (Maps, etc.) by package name/bundle ID and signing fingerprint. See [Security](security.html).
