<section class="home-section" id="what-interviewers-look-for">
  <h2>What senior interviewers are listening for</h2>
  <p class="sub">Correct answers get you to the bar. These get you over it.</p>
  <div class="tips">
    <div class="tip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><div><b>Trade-offs, not trivia</b>Name the options, pick one, and explain what you're giving up and when you'd choose differently.</div></div>
    <div class="tip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg><div><b>Platform depth</b>Know what happens on iOS and Android underneath: threads, permissions, signing, lifecycle and store rules.</div></div>
    <div class="tip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><div><b>Production scars</b>Crash rates, rollbacks, rejections, flaky releases. Concrete incidents and numbers beat hypotheticals.</div></div>
    <div class="tip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><div><b>Ownership &amp; influence</b>How you set standards, unblock others, and make decisions stick across teams.</div></div>
  </div>
</section>
