<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · React Native Interview Handbook</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg: #ffffff; --text: #0f1b2a; --muted: #64748b; --accent: #0b7fa3; --border: #e2e8f0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1017; --text: #e6edf5; --muted: #8a99ab; --accent: #5ccbea; --border: #1f2a37; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
         font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
  .box { max-width: 460px; }
  h1 { font-size: 4rem; margin: 0; letter-spacing: -0.04em; }
  p { color: var(--muted); line-height: 1.6; }
  a { display: inline-block; margin-top: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); color: var(--accent); text-decoration: none; font-weight: 600; }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>This page doesn't exist. It may have moved, or the link has a typo.</p>
    <a id="home" href="./">Back to the handbook</a>
  </div>
  <script>
    // GitHub Pages serves this file for any missing path, so work out the site root.
    // Project sites live under /<repo>/; user sites (username.github.io) live at /.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var base = '/';
      if (/\.github\.io$/i.test(location.hostname) && parts.length && !/\.github\.io$/i.test(parts[0])) {
        base = '/' + parts[0] + '/';
      }
      document.getElementById('home').href = base;
    })();
  </script>
</body>
</html>
