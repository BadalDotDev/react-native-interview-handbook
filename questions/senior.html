> What a senior answer includes: clear triggers for native work, awareness of Expo Modules/Turbo/Nitro trade-offs, the ongoing cost of native code, and a structured way to assess and contain dependency risk. Red flags: "we'll just find a library for everything", or writing native code for things JS does fine. Likely follow-up: "A critical library is abandoned and blocks your RN upgrade, what do you do?" (fork and patch for New Architecture, contribute upstream, or replace behind the adapter, and put it in the upgrade plan).

## Release engineering & quality

### How do you run release trains, branching and hotfixes for a mobile app?

**Short answer:** Trunk-based development with short-lived branches and feature flags keeps `main` always releasable. On a fixed cadence (weekly or every two weeks) we cut a release branch, stabilise it with fixes only, submit, and roll out in stages behind health gates. The train leaves on time, and unfinished features stay dark behind flags. Hotfixes land on `main` first and are cherry-picked to the release branch, so the next release can't regress.

```mermaid
flowchart TD
    Main["main (trunk)<br/>always releasable, flags off"] -->|"cut every 2 weeks"| RB["release/5.12<br/>stabilise, fixes only"]
    RB --> QA["Regression<br/>E2E suite and manual smoke"]
    QA --> Submit["Submit to App Store and Play"]
    Submit --> Stage["Staged rollout<br/>1 to 100 percent"]
    Stage --> Gate{"Health gates pass?"}
    Gate -->|"yes"| Full["Full rollout<br/>tag v5.12.0"]
    Gate -->|"no"| Halt["Pause or halt rollout"]
    Halt --> Fix["Fix on main first"]
    Fix -->|"cherry-pick"| RB
    Full -.->|"critical bug found later"| Hot["Hotfix 5.12.1<br/>from release branch"]
    Main -.->|"cherry-pick fix"| Hot
```
*Figure: A release train with trunk-based development, release branches and the hotfix path.*

#### Mechanics

- **Why trains:** mobile releases are expensive (store review, user update lag), so predictability beats "ship when ready". Product plans around the calendar, and a feature that misses the train waits two weeks, not forever.
- **Release captain:** a rotating engineer owns the cut, the regression pass, submission, rollout monitoring and stakeholder comms, with a runbook.
- **Versioning:** a marketing version (`5.12.0`) plus an auto-incremented build number from CI (EAS `autoIncrement`, fastlane). Tag every shipped build. Changelogs come from PR labels or conventional commits.
- **Branch hygiene:** only bug fixes enter the release branch, each one reviewed by the captain. The branch is deleted or frozen once the next train ships.
- **Internal distribution:** TestFlight and Play internal testing for every release candidate, dogfooded by the company for a few days.

#### Hotfix process

1. **Triage severity:** crash spike, data loss, payment or security issue qualifies. Cosmetic issues wait for the train.
2. **Fastest safe channel:** if the fix is JS-only and within OTA policy, ship an OTA update to the affected runtime (see the next questions). Otherwise make a hotfix binary from the release branch.
3. **Fix on `main` first, then cherry-pick.** If `main` has diverged too far, fix on the release branch and forward-port immediately, with a ticket to verify.
4. **Expedited review:** Apple allows requesting an expedited review for critical fixes. Use it sparingly.
5. **Post-incident:** blameless review, and add the missing test or gate.

> [!INTERVIEW]
> What a senior answer includes: trunk-based development plus flags, a fixed cadence, clear ownership, and a hotfix path that prevents regressions. Red flags: long-lived feature branches merged at release time, "we release when QA is done", fixing only on the release branch and forgetting `main`. Likely follow-up: "A feature is 90% done at branch cut and the PM wants it in?" (it ships dark behind a flag, or waits for the next train. The train doesn't wait).

### How do you de-risk releases with feature flags, kill switches, staged rollouts and release health gates?

**Short answer:** Flags separate deploying code from releasing features. Kill switches let us turn off a broken feature remotely without a new binary. Staged rollouts (App Store phased release, Play staged rollout, percentage-based OTA) limit how many users see a bad build. Health gates, meaning crash-free SLOs, ANR rates and key business metrics per release, decide whether a rollout advances, pauses or halts. You can't roll back a binary, only halt it and roll forward, so these layers are the safety net.

#### Flag types

| Type | Purpose | Lifetime |
|---|---|---|
| Release toggle | Ship dark, turn on gradually | Days to weeks, then delete |
| Experiment toggle | A/B test variants | Duration of the experiment |
| Ops toggle / kill switch | Disable a feature or dependency under incident | Long-lived, tested regularly |
| Permission toggle | Enable for staff, beta users, regions or brands | Long-lived |

**Design rules:** compiled-in safe defaults, a cached snapshot so evaluation is synchronous at startup, a background refresh, changes applied at safe points (next screen or next launch), consistent values within a session, and a **fail-safe default** if the flag service is down. Every flag has an owner and an expiry date, and stale flags are flagged by lint or a scheduled report, because flag debt is real debt.

**Minimum-version gate:** a remote config value (or API error) that triggers a soft "update available" prompt or a hard block for versions with critical security or data bugs. Build it before you need it: you can't add it to versions already in the field.

#### Staged rollouts per platform

| | App Store phased release | Google Play staged rollout | OTA (for example EAS Update) |
|---|---|---|---|
| Schedule | Fixed 7 days: 1%, 2%, 5%, 10%, 20%, 50%, 100% of automatic updaters | Any percentage you choose, raise manually | Percentage rollouts per update |
| Pause/halt | Pause (limited total pause time) or release to all | Halt. Users who already have it keep it | Roll back to a previous update or republish |
| Caveat | Users can still update manually from the store | Can target countries | Only JS/assets, same runtime version |

#### Health gates

| Signal | Example gate to advance |
|---|---|
| Crash-free users (Sentry/Crashlytics release health) | At least 99.8% and not worse than the previous release |
| Crash-free sessions | At least 99.95% |
| Android vitals | User-perceived crash and ANR rates well under Play's bad-behaviour thresholds (about 1.09% and 0.47% overall at the time of writing, so verify current values) |
| Startup time | p90 cold start within 10% of baseline |
| Business guardrails | Login success, checkout conversion, API error rate within noise |
| New feature errors | Handled error rate for flagged features below the threshold |

Gates are automated where possible (a bot posts rollout health to the release channel and recommends advance or halt). A human decides, and the criteria are written down *before* the release.

#### Crash-free SLOs

Set an SLO such as "99.8% crash-free users per release by day 3", with an error budget. Burning the budget freezes feature rollouts and redirects effort to stability. Break the numbers down by OS version, device model and app version. A healthy global number can hide a 5% crash rate on one popular Android model.

> [!INTERVIEW]
> What a senior answer includes: flag taxonomy and flag hygiene, fail-safe defaults, the minimum-version gate, platform differences in staged rollouts, and quantitative, pre-agreed gates. Red flags: "we'll roll back the release" (you can't for binaries), flags that default to *on* when the service fails, no owner or expiry for flags. Likely follow-up: "The 10% rollout shows a crash on Android 12 Samsung devices only. What now?" (halt, check if a kill switch covers it, reproduce on device farm, decide between OTA fix, hotfix binary or targeted flag).

### What is your OTA update policy: what may ship over the air, and how do you do it safely?

**Short answer:** OTA can only change JavaScript and assets for binaries with a compatible runtime version, never native code. My policy ships bug fixes, copy changes and small low-risk tweaks OTA. It never uses OTA for native changes, new permissions, or anything that changes the app's purpose or skips review for a significant new feature, which both stores' policies restrict. Every OTA goes through the same PR review and QA as a store build, is signed, rolls out in stages with crash monitoring, and has a rollback plan. See the [OTA Updates guide](../guides/ota-updates.html).

```mermaid
flowchart TD
    Change["Change ready to ship"] --> Native{"Touches native code, native deps,<br/>permissions or entitlements?"}
    Native -->|"yes"| Store["Store release<br/>new runtime version"]
    Native -->|"no"| Purpose{"Major new feature or<br/>change of app purpose?"}
    Purpose -->|"yes"| Store
    Purpose -->|"no"| Compat{"Compatible with every binary<br/>on this runtime version?"}
    Compat -->|"no"| Store
    Compat -->|"yes"| Sev{"Bug fix or pre-approved<br/>low-risk change?"}
    Sev -->|"no"| Train["Wait for next store train"]
    Sev -->|"yes"| OTA["OTA staged rollout<br/>5 then 25 then 100 percent"]
    OTA --> Watch{"Crash or error rate regressed?"}
    Watch -->|"yes"| Rollback["Roll back to previous update"]
    Watch -->|"no"| Promote["Promote to 100 percent"]
```
*Figure: OTA decision flow. When in doubt, it goes in a store release.*

#### What may ship OTA

| Allowed OTA | Store release required |
|---|---|
| JS bug fixes, crash fixes in JS | Any native code, new native dependency or native version bump |
| Copy, translations, images, config defaults | New permissions, entitlements, `Info.plist`/manifest changes |
| Small UX tweaks, flag-gated feature polish | Significant new features or changes to the app's purpose |
| Hotfixes for a live incident (JS-only) | Anything that needs a newer runtime version |

**Store policy context:** Apple permits downloaded interpreted code only when it doesn't change the app's primary purpose or bypass review for new functionality (App Review Guideline 2.5.2 and the Developer Program License Agreement). Google Play's Device and Network Abuse policy restricts self-updating executable code, with allowances for code running in a VM or interpreter. Read the current wording, and never use OTA to smuggle features past review.

#### Safety mechanics

- **Runtime versions:** with EAS Update use the `fingerprint` runtime version policy, so any native change automatically produces a new runtime and old binaries never receive incompatible JS. Manual version strings are the #1 source of OTA-induced crashes.
- **Channels:** production, staging and preview channels map to build profiles. Test the exact update on the preview channel against the production binary before promoting.
- **Staged rollout and rollback:** percentage rollouts, watch crash-free sessions *for that update ID*, and roll back or republish the previous update if it regresses.
- **Code signing:** sign updates (EAS Update supports end-to-end code signing, and self-hosted solutions should too) so a compromised CDN can't push code.
- **Apply strategy:** download in the background and apply on the next cold start by default. For critical fixes, prompt the user to restart (`Updates.reloadAsync()`) at a safe moment, never mid-checkout.
- **Tooling after App Center:** App Center (and hosted CodePush) retired on March 31, 2025. Options are EAS Update, a self-hosted CodePush server (open-sourced by Microsoft), or community tools such as hot-updater, Revopush and Stallion.

> [!INTERVIEW]
> What a senior answer includes: the JS-only boundary, runtime version compatibility, store policy awareness, staged OTA rollouts with monitoring, and code signing. Red flags: "we ship features OTA to skip review", manual runtime versions with no process, force-reloading the app mid-session. Likely follow-up: "An OTA crashed users on an older binary. How?" (a JS change depended on a native module absent in that runtime, which fingerprint-based runtime versions prevent).

### How do you handle App Store and Play rejections, and prevent them?

**Short answer:** Read the exact guideline cited, reproduce what the reviewer saw, and decide whether it's a misunderstanding (reply in App Store Connect with explanation, demo credentials or a screen recording), a metadata fix (no new binary needed) or a real issue (fix and resubmit). Appeal to the App Review Board only when you're confident you comply. Prevention is a pre-submission checklist built from past rejections, good review notes, and policy owners who track guideline changes.

#### Common rejection causes

| Guideline area | Typical trigger | Fix |
|---|---|---|
| 2.1 App Completeness | Crash on reviewer's device, broken login, missing demo account | Test on the current iOS release, provide working demo credentials in review notes |
| 2.3 Metadata | Screenshots not matching the app, placeholder text | Update metadata (no new build needed) |
| 3.1.1 In-App Purchase | Digital goods sold via external payment where not permitted | Use IAP or a region-permitted link-out per current rules |
| 4.8 Sign in with Apple | Third-party social login without a compliant alternative | Add Sign in with Apple or a login option meeting Apple's privacy criteria |
| 5.1.1 Data collection | Vague permission purpose strings, no account deletion, privacy policy missing | Specific `NS*UsageDescription` strings, in-app account deletion |
| 4.2 / 4.3 | Thin web wrapper, template or duplicate apps | Add native value, consolidate apps |
| Privacy manifest | Required-reason APIs undeclared in the app or SDKs | Update `PrivacyInfo.xcprivacy` and SDK versions |

**Google Play** rejections usually come from policy declarations: background location, photo and video permissions (use the system photo picker unless media access is core), Data safety form mismatches, missing account deletion link, target API level. Appeals go through Play Console's policy status page.

#### Process

1. The release captain triages within hours and posts the exact message to the team channel.
2. Classify: misunderstanding, metadata, or code.
3. Reply in the Resolution Center politely and specifically. Attach a video showing the flow if hardware or location is involved.
4. Update stakeholders on date impact, and slip the marketing date rather than ship a risky workaround.
5. Add the cause to the pre-submission checklist.

**Prevention checklist items:** demo account valid and not 2FA-locked, review notes explaining non-obvious features, purpose strings reviewed, privacy manifest and Data safety updated for new SDKs, account deletion reachable, IAP rules checked for any new monetisation, and a smoke test on the latest OS release.

> [!INTERVIEW]
> What a senior answer includes: calm triage, knowing that metadata rejections don't need a new binary, specific reviewer communication, and systemic prevention. Red flags: resubmitting unchanged hoping for a different reviewer, or arguing tone in replies. Likely follow-up: "Your launch is tomorrow and you got rejected for 4.8?" (fastest compliant path: add Sign in with Apple, request expedited review, align marketing on a new date).

### What testing strategy would you set up for a React Native team?

**Short answer:** A layered strategy weighted toward fast, reliable tests. Static analysis (strict TypeScript, ESLint) catches whole bug classes. Unit tests cover pure logic. Component and integration tests with React Native Testing Library and MSW cover most behaviour. A small set of E2E tests (Maestro or Detox) guards critical journeys on real builds. Device-farm runs, performance regression checks and short manual exploratory passes round it out. Every layer has an owner, a CI stage and a time budget, and flaky tests are quarantined quickly. Details in the [Testing Strategy guide](../guides/testing.html).

| Layer | What it covers | Tools | When it runs |
|---|---|---|---|
| Static | Types, lint, dead code, boundaries | TypeScript strict, ESLint, knip | Every commit (pre-commit + PR) |
| Unit | Reducers, formatters, domain rules, hooks | Jest | PR, seconds |
| Component/integration | Screens with real navigation and mocked network | RNTL (user-event API), MSW | PR, a few minutes |
| Contract | API shape compatibility | OpenAPI schema checks, Pact, zod fixtures | PR on both client and backend |
| E2E | 10–30 critical journeys: login, purchase, onboarding | Maestro, Detox | On merge to main (smoke), nightly (full) |
| Device matrix | OS versions, low-end devices, tablets | Firebase Test Lab, BrowserStack, AWS Device Farm | Nightly, release candidates |
| Performance | Render regressions, startup, FPS | Reassure, Flashlight, Sentry performance | PR (Reassure), release candidate |
| Manual | Exploratory, a11y with VoiceOver/TalkBack, new features | Checklists, bug bash | Each release candidate |

#### Principles

- **Test behaviour, not implementation:** query by role and text, interact via user-event, assert what the user sees. Snapshot tests of whole screens are low value.
- **Mock at the network edge (MSW), not every module.** Tests then survive refactors of the data layer.
- **Keep E2E small and stable:** stable test IDs, seeded backends or dedicated test accounts, and no sleeps (Maestro waits automatically, Detox synchronises with the app).
- **Flake policy:** a flaky test is quarantined within a day with a ticket and an owner, and flakiness rates are reviewed weekly.
- **Coverage is a signal, not a target.** Track it for domain code, but don't gate on a global percentage.
- **Shift quality left:** PR template with iOS and Android screenshots or videos, and a definition of done that includes tests, a11y and analytics events.

> [!INTERVIEW]
> What a senior answer includes: a pyramid or trophy tailored to mobile, a clear role for each layer, CI placement with time budgets, flake management, and mobile-specific layers (device matrix, performance). Red flags: "100% coverage", E2E for everything, or no tests for the data layer. Likely follow-up: "Detox or Maestro?" (Maestro: fast to write, YAML, black-box, great for smoke and screenshots. Detox: gray-box synchronisation and JS-level control, more setup. Many teams use Maestro for breadth).

### How do you upgrade React Native across a large codebase?

**Short answer:** Treat upgrades as a continuous, owned process rather than a heroic project. Stay at most one or two minors behind, upgrade dependencies ahead of time, and use the Upgrade Helper (bare) or Expo SDK upgrade tooling. Work on a branch with CI and a full E2E pass, measure performance against a baseline, dogfood internally, then ship through a staged rollout. The big one right now is the New Architecture: RN 0.82+ has no legacy mode, so every native dependency must be New Architecture compatible before you cross that line.

#### Process

1. **Prepare continuously:** track RN and Expo release notes, keep a dependency inventory with New Architecture status, and upgrade libraries that support both old and new RN versions ahead of the RN bump.
2. **Plan:** read the changelog and blog post for each version you cross. For Expo, one SDK at a time (`npx expo install expo@^<next>` then `npx expo install --fix` and `npx expo-doctor`). For bare, apply the Upgrade Helper diff for native template files.
3. **Spike first:** a time-boxed spike to find blockers (abandoned libraries, custom native modules, build configuration), then estimate.
4. **Execute:** one branch with frequent rebases, codemods for API changes, and native build fixes. Keep feature work flowing on `main` so the upgrade branch lives only days.
5. **Verify:** full E2E, device matrix, manual smoke on the oldest supported OS versions, performance comparison (startup, memory, FPS) against the previous release.
6. **Roll out:** internal builds, then a staged store rollout with tighter health gates. Remember the runtime version changes, so previously published OTA updates won't apply to the new binary and vice versa.

#### Typical breakages

| Area | Example |
|---|---|
| Native build | Gradle/AGP/Kotlin versions, CocoaPods changes, minimum iOS/Android versions, 16 KB page size alignment |
| Libraries | No New Architecture support, deprecated APIs removed |
| JS | Removed or deprecated core APIs (for example core `SafeAreaView` in favour of `react-native-safe-area-context`), React version changes |
| Tooling | Metro config, Babel presets, Jest presets, debugger changes |
| Behaviour | Layout differences, edge-to-edge enforcement on newer Android targets |

**Ownership:** a rotating "platform" duty or a dedicated platform team, with upgrades on the roadmap every quarter. Skipping upgrades compounds: store SDK requirements (Xcode versions each spring, Play target API each August) eventually force a rushed multi-version jump.

> [!INTERVIEW]
> What a senior answer includes: continuous cadence, dependency preparation, the New Architecture cutoff, verification with performance baselines, staged rollout, and OTA runtime implications. Red flags: "we upgrade every two years", or upgrading RN and ten major libraries in one untested jump. Likely follow-up: "A key library doesn't support the New Architecture yet?" (check interop layer behaviour, patch or fork, replace behind an adapter, or contribute upstream, and block the upgrade until it's resolved).

## Cross-cutting concerns

### How would you set up an accessibility programme for a React Native app?

**Short answer:** Make accessibility a property of the system, not a clean-up project. Set a target (WCAG 2.2 AA mapped to mobile), bake roles, labels, focus handling, touch targets, contrast and font scaling into the design-system components, add automated checks in CI, and include screen-reader testing in the definition of done and release regression. Train the team, name a11y champions, and audit periodically, including with disabled users. Regulation such as the European Accessibility Act (applying since June 2025) makes this a legal requirement for many products, not just good practice.

#### Programme building blocks

| Area | What we do |
|---|---|
| Standards | WCAG 2.2 AA as the target, platform guidance (Apple HIG, Material) for conventions |
| Components | `Button`, `TextField`, list rows ship with `role`, labels, states, hit slop, and focus styles by default |
| Text | Support Dynamic Type/font scaling (cap with `maxFontSizeMultiplier` only where layout truly breaks), test at the largest sizes |
| Motion | Respect reduce motion (`AccessibilityInfo.isReduceMotionEnabled`, Reanimated's `useReducedMotion`) |
| Focus | Move screen-reader focus to the new screen title or error message after navigation and validation failures |
| Automation | `eslint-plugin-react-native-a11y`, RNTL queries by role (a test that can't find the button by role is a bug), accessibility scanners in E2E |
| Manual | VoiceOver and TalkBack passes on key flows every release, Xcode Accessibility Inspector, Android Accessibility Scanner |
| Process | a11y acceptance criteria in tickets, design reviews check contrast and target sizes, bugs triaged with severity like any other |

```tsx title="shared/design-system/IconButton.tsx"
import { Pressable, type PressableProps } from 'react-native';
import { Icon, type IconName } from './Icon';

type Props = Omit<PressableProps, 'children'> & {
  icon: IconName;
  label: string; // required: icon-only buttons are invisible to screen readers without it
  selected?: boolean;
};

export function IconButton({ icon, label, selected, disabled, ...rest }: Props) {
  return (
    <Pressable
      role="button"
      accessibilityLabel={label}
      accessibilityState={{ selected, disabled: !!disabled }}
      hitSlop={8}
      disabled={disabled}
      style={{ minWidth: 44, minHeight: 44, alignItems: 'center', justifyContent: 'center' }}
      {...rest}
    >
      <Icon name={icon} />
    </Pressable>
  );
}
```

Making `label` a required prop is the kind of leverage a senior engineer adds: the type system enforces accessibility for every future use.

> [!INTERVIEW]
> What a senior answer includes: accessibility built into components, automated plus manual testing, process integration, and awareness of legal drivers. Red flags: "we add labels before launch", testing only with automated tools, disabling font scaling globally. Likely follow-up: "How do you prioritise a backlog of 200 a11y issues?" (by user impact on critical flows first: login, checkout, core task, then by frequency).

### How do you handle internationalisation and RTL at scale?

**Short answer:** Externalise every string with keys and ICU-style plurals (i18next or FormatJS), format numbers, dates and currencies with `Intl`, and run a translation pipeline through a TMS with CI checks for missing keys. Pseudo-localise to catch truncation and hard-coded strings. For RTL, use logical style properties (`start`/`end`), mirror directional icons, and remember that switching layout direction requires an app restart. Test real RTL locales, not just a flipped layout.

#### Pipeline

1. **Authoring:** developers add keys in the source locale only (`checkout.total`), with context comments for translators.
2. **Sync:** CI pushes new keys to a TMS (Lokalise, Crowdin, Phrase), and translations come back as PRs or are pulled at build time.
3. **Checks:** fail CI on missing keys in shipped locales, unused keys, or invalid ICU syntax. A pseudo-locale (accented, 30–40% longer strings) surfaces hard-coded text and truncation.
4. **Delivery:** bundle translations with the app. Optionally OTA-update copy (it's JS/assets), but keep a bundled fallback.

```ts title="src/shared/i18n/locales/en.ts"
export const en = {
  cart: {
    items_one: '{{count}} item',
    items_other: '{{count}} items', // i18next picks the form via Intl.PluralRules
  },
  checkout: {
    total: 'Total: {{amount}}', // amount pre-formatted with Intl.NumberFormat for the user's currency
  },
};
```

#### Pitfalls

| Pitfall | Fix |
|---|---|
| String concatenation (`'Hello ' + name`) | Interpolated messages, since word order differs by language |
| Hard-coded plural logic (`count === 1`) | Plural categories (Arabic has six forms, Japanese has one) |
| `marginLeft`/`paddingRight` | `marginStart`/`paddingEnd`, and `flexDirection: 'row'` flips automatically in RTL |
| Directional icons not mirrored | Mirror back arrows and progress chevrons, but not media controls or logos |
| Assuming `I18nManager.forceRTL` applies instantly | It requires a reload/restart. Prompt the user or apply at next launch |
| Fonts lacking glyphs | Test Arabic, Hebrew, Thai, CJK scripts, and allow taller line heights |
| Dates formatted manually | `Intl.DateTimeFormat` with the user's locale and time zone |

**Platform notes:** Hermes ships the core `Intl` APIs, but verify coverage for less common ones and polyfill if needed. Android 13+ and recent iOS support per-app language settings. Declare supported locales (Android `localeConfig`, iOS localisations) so the system settings list your languages. `expo-localization` or `react-native-localize` read device locale preferences.

> [!INTERVIEW]
> What a senior answer includes: an automated pipeline, ICU plurals, `Intl` formatting, pseudo-localisation, and RTL specifics including the restart requirement. Red flags: translating by string concatenation, "we'll add RTL later" with `left`/`right` styles everywhere. Likely follow-up: "How do you handle server-provided content?" (the backend localises using `Accept-Language`, and the client sends the app's chosen locale, not just the device's).

### How do you design an analytics taxonomy that stays privacy-compliant (GDPR, Apple privacy manifests, Play Data safety)?

**Short answer:** Define a tracking plan as code: a small set of consistently named events (`object_action`, such as `product_viewed`, `checkout_started`) with typed, documented properties and owners, exposed through a generated, type-safe `track()` API. Validate events in CI and at runtime in dev builds. On the privacy side, keep a data inventory mapping every SDK and event to data types and purposes. Gate non-essential tracking behind consent (and ATT on iOS for cross-app tracking), and keep App Store privacy labels, `PrivacyInfo.xcprivacy` and the Play Data safety form in sync with that inventory on every SDK change.

#### Taxonomy rules

- **Naming:** one convention (`snake_case` `object_action`, past tense), a fixed verb list (`viewed`, `tapped`, `started`, `completed`, `failed`), no screen-specific one-offs like `blue_button_clicked_v2`.
- **Properties:** typed and bounded (enums, not free text). Global context attached automatically: app version, platform, brand, locale, experiment variants, network type.
- **Identity:** anonymous ID before login, aliased to the user ID after login, reset on logout.
- **Governance:** the plan lives in the repo, and changes are reviewed by analytics and engineering. Each event has an owner and a purpose, and unused events get removed.
- **Delivery:** batch and persist events offline, flush on background and on a timer, sample high-volume diagnostic events.

```ts title="src/shared/analytics/events.ts"
import { consent } from '../privacy/consent';
import { analyticsQueue } from './queue';
import { getGlobalContext } from './context';

type Events = {
  product_viewed: { product_id: string; source: 'search' | 'category' | 'deeplink' | 'home' };
  add_to_cart_tapped: { product_id: string; quantity: number };
  checkout_completed: { order_id: string; value_minor: number; currency: string };
};

export function track<E extends keyof Events>(name: E, props: Events[E]): void {
  if (!consent.allows('analytics')) return; // consent gate at a single choke point
  analyticsQueue.enqueue({ name, props, ts: Date.now(), context: getGlobalContext() });
}
```

#### Privacy compliance checklist

| Requirement | What it means for the app |
|---|---|
| GDPR/UK GDPR (and similar laws such as CCPA/CPRA) | Lawful basis per purpose, consent for non-essential tracking in the EEA/UK, data minimisation, access/erasure requests, DPAs with vendors |
| Apple App Tracking Transparency | Prompt before tracking across other companies' apps/sites (IDFA). No tracking if denied |
| Apple privacy manifest | `PrivacyInfo.xcprivacy` declaring collected data and required-reason APIs (for example UserDefaults, file timestamps, disk space). Expo supports `ios.privacyManifests` in app config. Third-party SDKs must ship their own manifests |
| App Store privacy labels | Nutrition labels in App Store Connect that must match actual collection, including SDKs |
| Google Play Data safety | Form declaring collection, sharing, encryption and deletion. Must match app and SDK behaviour |
| Account deletion | Both stores require in-app account deletion for apps with account creation (Google also requires a web link) |
| Consent mode | For Google tools in the EEA, pass consent state (Consent Mode) so tags behave accordingly |

**Process:** every PR adding an SDK or new data type triggers a privacy review. The data inventory is updated, then the store declarations and privacy policy. Analytics payloads never contain raw PII (emails, precise location, free-text), and user IDs are pseudonymous.

> [!INTERVIEW]
> What a senior answer includes: a tracking plan as code with type safety, governance and ownership, consent at a single choke point, and treating store privacy declarations as outputs of a maintained data inventory. Red flags: free-form event names chosen per developer, sending emails as analytics properties, filling Data safety once and never revisiting it. Likely follow-up: "Marketing wants a new attribution SDK next week?" (privacy and security review, check ATT implications, update manifests and declarations, and put it behind consent).

### What does a security review process look like for a mobile team?

**Short answer:** Security is built into the lifecycle. Threat modelling happens at the RFC stage for features touching auth, payments, personal data or new SDKs. OWASP MASVS is the baseline checklist. Automated checks in CI cover dependency and secret scanning, SAST and lint rules for insecure patterns. Security-focused code review applies to sensitive areas (CODEOWNERS). Periodic penetration tests run before major launches, and there's a clear incident response path. We're honest about the fact that the client is untrusted: anything in the app can be extracted and modified.

#### The process

| Stage | Activity |
|---|---|
| Design (RFC) | Threat model (assets, entry points, attackers, STRIDE-style prompts), data classification, abuse cases |
| Implementation | Secure storage (Keychain/Keystore via `react-native-keychain`/`expo-secure-store`), no secrets in the bundle, TLS only, input validation, safe deep link handling |
| CI | Dependency audit (npm audit, Snyk/Socket), secret scanning (gitleaks), SAST (Semgrep rules for `eval`, insecure WebView settings, logging tokens) |
| Review | Security champion or AppSec review for auth, payments, crypto, WebViews, deep links, new native modules |
| Pre-release | MASVS-based checklist, penetration test for major releases, verify release builds strip debug menus and logs |
| Runtime | App Attest/Play Integrity for sensitive APIs, anomaly detection server-side, certificate pinning only with backup pins and rotation plan |
| Incident | Kill switches, forced-upgrade gate, key rotation runbooks, disclosure policy or bug bounty |

#### Mobile-specific realities

- **The JS bundle is readable.** API keys in it are public, so use server-side proxies and scoped, restricted keys.
- **Root/jailbreak detection** raises the bar slightly but is bypassable. Use it as a signal, not as a security boundary.
- **Deep links are untrusted input:** validate parameters, and never perform sensitive actions straight from a link without confirmation.
- **WebViews:** restrict origins, disable file access where possible, and treat `postMessage` data as untrusted.
- **Logs and crash reports** must scrub tokens and PII before they leave the device.

See the [Security guide](../guides/security.html) for implementation detail.

> [!INTERVIEW]
> What a senior answer includes: security across the lifecycle, MASVS as a shared vocabulary, automation plus human review, and a realistic threat model for client code. Red flags: "we obfuscate so it's secure", secrets in `.env` files bundled into the app, pinning without a rotation plan. Likely follow-up: "How do you protect an API from being called by a scripted client?" (attestation tokens, rate limiting, behavioural detection, since you can't fully prevent it).

### How do you define and enforce performance budgets?

**Short answer:** Pick a few user-centric metrics (cold start time to interactive, screen time to content, frame quality, memory, app size, crash and ANR rates) and set budgets per device tier. Measure them in CI where possible (bundle size, Reassure render benchmarks, Flashlight scores on a reference Android device) and in production (Sentry/Firebase performance, Android vitals, Xcode Organizer/MetricKit). Treat a budget breach like a failing test: it blocks the merge or triggers a regression ticket with an owner.

| Metric | Example budget | Where measured |
|---|---|---|
| Cold start to interactive | p50 under 2 s, p90 under 3.5 s on a mid-tier Android device | Production tracing, startup spans |
| Screen time to content (key screens) | Under 1 s from cache, under 2.5 s from network | Custom spans |
| Slow/frozen frames | Frozen frames under 0.1% of frames on feed screens | Sentry/Firebase, Flashlight |
| JS bundle size | No more than +50 KB per PR without approval | CI size diff comment |
| Download size | Under 60 MB (iOS) / under 40 MB (Android AAB split) | Store tooling, size analysis in CI |
| Memory | No growth over a 10-minute scripted scroll session | E2E + profiler |
| ANR rate | Well below Play's bad-behaviour threshold | Android vitals |

#### Making budgets stick

- **Device tiers:** define "low-end reference device" explicitly (for example a 3–4 GB RAM Android phone a few years old) and test there. Flagship phones hide everything.
- **Automate the boring parts:** a PR bot posts bundle and binary size deltas and Reassure results. Nightly Flashlight or E2E perf runs chart trends.
- **Ownership:** each budget has an owner, and regressions get tickets tied to the PR that caused them.
- **Trade-offs are explicit:** a new SDK that adds 300 ms to startup needs a product decision, not a silent merge.
- **Common wins:** lazy-load screens and heavy modules, defer SDK initialisation until after first render, FlashList for long lists, image variants, avoid synchronous storage of large blobs at startup, and the React Compiler for memoisation.

See the [Performance guide](../guides/performance.html) and [Monitoring guide](../guides/monitoring.html).

> [!INTERVIEW]
> What a senior answer includes: user-centric metrics, budgets per device tier, lab plus field measurement, automation in CI, and ownership. Red flags: "we optimise when users complain", measuring only on simulators or flagships, or averages instead of percentiles. Likely follow-up: "Startup regressed 20% in the last release, how do you find it?" (compare startup traces between versions, bisect by build, check new SDK inits and module evaluation at import time).

## Leadership & collaboration

### What code review standards do you set for a React Native team?

**Short answer:** Reviews exist to catch defects, spread knowledge and keep the codebase coherent, not to enforce personal taste. Automation handles formatting, lint, types and tests, so humans focus on correctness, design, tests, accessibility, performance, security and platform parity. PRs are small, described well (with iOS and Android screenshots or videos for UI), reviewed within an agreed SLA, and comments are labelled by severity so authors know what blocks the merge.

#### The standard

| Area | Reviewer asks |
|---|---|
| Correctness | Edge cases, error and loading states, offline, race conditions, cleanup of subscriptions |
| Design | Right layer and feature? Public API sensible? Duplicates something that exists? |
| Tests | Behaviour covered at the right level? Would this test catch the bug it claims to? |
| Mobile specifics | Works on both platforms, small screens, large font sizes, dark mode, RTL, low-end devices |
| Performance | Re-render hotspots, list rendering, work on the JS thread during animations, startup impact |
| Security and privacy | Tokens, PII in logs, deep link input, new SDK data collection |
| Operability | Analytics events, error reporting, feature flag, rollback plan |

#### Mechanics

- **PR size:** aim for under ~400 changed lines. Stack PRs for larger work.
- **Template:** what and why, screenshots and videos per platform, test plan, flags involved, risk and rollback.
- **Comment labels** (Conventional Comments style): `blocking:`, `suggestion:`, `nit:`, `question:`. Nits never block.
- **SLA:** first review within one working day. Reviewer load is balanced, and CODEOWNERS routes sensitive areas.
- **Automation:** lint, typecheck, tests, bundle size and Danger-style checks (missing changelog label, missing screenshots) run before a human looks.
- **Tone:** critique the code, ask questions, praise good solutions, and move long debates to a call or an RFC.

> [!INTERVIEW]
> What a senior answer includes: purpose-driven reviews, automation of the mechanical parts, mobile-specific checks, severity labels, and turnaround expectations. Red flags: gatekeeping on style, 2,000-line PRs as normal, or reviews that take a week. Likely follow-up: "How do you review a junior's PR that needs a total rewrite?" (talk synchronously first, explain the design issue, pair on the direction, and don't leave 60 comments).

### How do you use RFCs and ADRs to make and record technical decisions?

**Short answer:** An RFC is for proposing and debating a significant or hard-to-reverse decision before building: state management, navigation library, offline sync, a New Architecture migration, monorepo adoption. An ADR is the short, permanent record of what was decided and why, stored in the repo next to the code. RFCs get a named decider, a comment deadline and explicit alternatives. ADRs are immutable: when a decision changes, you write a new ADR that supersedes the old one.

#### RFC template (what I expect in one)

1. Context and problem, with data (crash rates, build times, incidents).
2. Goals and non-goals.
3. Options considered, including "do nothing", with honest pros and cons.
4. Proposal: design, API sketches, diagrams.
5. Rollout and migration plan, flags, and how to roll back.
6. Risks, open questions, cost (people and weeks).
7. Decider and comment deadline.

#### ADR example

```plaintext
docs/adr/0012-use-tanstack-query-for-server-state.md

Title: Use TanStack Query for server state
Status: Accepted (2026-03-04). Supersedes ADR-0005.
Context: Server data lives in Redux slices with hand-written loading/error flags.
  Stale data and duplicated fetch logic cause bugs. 14 screens refetch on every focus.
Decision: New server data uses TanStack Query. Existing slices migrate opportunistically.
  Client-only state stays in Redux Toolkit.
Consequences: Two patterns coexist for about 2 quarters. Lint rule blocks new
  createAsyncThunk usage. Query keys follow the conventions in docs/query-keys.md.
```

**Why it matters for seniors:** decisions outlive the people who made them. Six months later, "why do we use X?" has an answer, new joiners understand context, and you avoid re-litigating settled questions unless the context has actually changed.

> [!INTERVIEW]
> What a senior answer includes: when an RFC is warranted (and when it's overkill), a decider and deadline, real alternatives, and ADRs as lightweight, immutable history. Red flags: design-by-committee with no decider, RFCs written after the code ships, or a wiki nobody can find. Likely follow-up: "An RFC has been open for three weeks with no consensus?" (the decider decides, records dissent in the ADR, and sets a review point).

### How do you onboard engineers onto a large React Native codebase, and how do you mentor them?

**Short answer:** Make the first week productive and the first month confident. That means a one-command setup, downloadable dev builds, an architecture tour, ADRs to read, a buddy, a starter task that ships to production in week one, and a 30/60/90-day plan. Mentoring then shifts from answering questions to growing judgement: pairing, stretch ownership, deliberate feedback, and gradually handing over decisions. I measure onboarding with time to first PR and time to first independent feature.

#### Onboarding kit

- **Setup:** a `bootstrap` script plus doctor checks (Node version, Xcode, Android SDK, JDK, CocoaPods), prebuilt development builds from CI so JS-only work needs no native toolchain on day one, and seeded test accounts.
- **Knowledge:** architecture overview with diagrams, feature ownership map, ADR index, glossary of domain terms, a "how we release" doc, and recorded walkthroughs of the sync engine or other tricky subsystems.
- **Work:** curated starter issues across layers (UI fix, data-layer change, test), a first on-call shadow shift, and one release-captain shadow.
- **People:** a buddy for daily questions, and introductions to the design, backend and native counterparts.

#### Mentoring approach

| Stage | What I do |
|---|---|
| New to RN (for example from web) | Pair on platform concepts: threading, native builds, lifecycle, store releases. Review with explanations |
| Productive | Give ownership of a feature end to end, including analytics, rollout and monitoring |
| Growing to senior | Hand over design decisions (they write the RFC, I review), include them in incident leadership, and let them mentor someone else |

I use regular 1:1s with explicit growth goals, specific feedback tied to situations (what happened, impact, what to try), and I resist taking the keyboard.

> [!INTERVIEW]
> What a senior answer includes: concrete artefacts (setup automation, docs, starter tasks), metrics for onboarding, and mentoring that builds autonomy rather than dependence. Red flags: "they read the code", or mentoring that means solving their problems for them. Likely follow-up: "How did you help someone who was struggling?" (use the STAR mentoring template below).

### How do you estimate large pieces of work and prioritise tech debt against feature work?

**Short answer:** Estimate in ranges with stated confidence: break work down, spike the unknowns, include the mobile-specific overhead (both platforms, store review, QA, accessibility, analytics, localisation, rollout), and re-estimate as uncertainty shrinks. For tech debt, make it visible and quantified in business terms (incidents, crash rate, build minutes, lead time, blocked features), then fund it through a standing capacity allocation plus targeted investments tied to roadmap goals. "Refactor because it's ugly" doesn't compete with features. "This cuts checkout crashes by half and unblocks the redesign" does.

#### Estimation practice

- **Decompose** to tasks of one to three days. Anything bigger hides unknowns.
- **Spike unknowns** with a time box (for example "2 days to prove background upload on Android 14+").
- **Give ranges:** "4–6 weeks, 70% confident, assuming the payments API is ready by week 2". Communicate the assumptions as loudly as the number.
- **Checklist of forgotten work:** iOS and Android parity, tablets, dark mode, a11y, i18n, analytics events, feature flag and kill switch, error states, E2E tests, store assets and review time, staged rollout and monitoring.
- **Track actuals** against estimates and calibrate. Throughput-based forecasting works well for teams with steady-sized tickets.

#### Tech debt prioritisation

| Step | Practice |
|---|---|
| Visibility | A debt register: item, impact, affected area, cost of delay, owner |
| Quantify | Crash rate, incident count, CI minutes, flaky test rate, PR cycle time, onboarding time |
| Frame as interest | "Every feature touching the cart costs about 30% more because of X" |
| Fund | 15–20% standing capacity for platform health, plus larger items pitched with the roadmap |
| Tie to goals | Bundle debt paydown with features in the same area (strangler pattern) |
| Guard | Boy-scout rule, lint rules so new code doesn't add the same debt |

> [!INTERVIEW]
> What a senior answer includes: ranges and assumptions, mobile-specific hidden work, and tech debt framed in measurable business impact with a sustainable funding model. Red flags: single-point estimates given on the spot, "we need a quarter to rewrite everything", debt with no data. Likely follow-up: "Your estimate is 8 weeks, product needs 4?" (negotiate scope, not quality: an MVP cut, feature-flagged phases, or more people only if the work parallelises).

### How do you handle disagreements with product or design, and how do you work with native iOS/Android and backend teams?

**Short answer:** Disagree early, with data and options, not with a flat "no". Explain the cost, risk or user impact, offer alternatives (a cheaper version, a phased rollout, an experiment), and once a decision is made, commit to it. With native and backend teams, success comes from clear contracts and shared ownership: API schemas agreed before building, mobile needs (pagination, payload size, backward compatibility) represented in API design, native module ownership defined, and regular syncs instead of surprises.

#### With product and design

- **Understand the goal behind the ask.** Often the goal can be met more cheaply.
- **Make trade-offs concrete:** "the custom animation costs about 1.5 weeks and risks jank on low-end Android. The platform transition ships this sprint".
- **Use platform conventions as a shared reference:** iOS and Android users expect different navigation patterns, date pickers and share sheets.
- **Prototype when words fail:** a one-day prototype on a real device resolves more debates than a meeting.
- **Disagree and commit,** and document the decision and the risk. Escalate only for user harm, legal or security issues.

#### With native iOS/Android teams

- Agree who owns shared native modules, bridging contracts and native crash triage.
- In brownfield apps, define the integration boundary (entry points, navigation hand-off, shared auth state) and a release coordination process.
- Respect their expertise: involve them in RFCs that touch native code, and learn enough Swift/Kotlin to read and review.

#### With backend teams

- **Contract first:** OpenAPI or GraphQL schema reviewed by mobile before implementation, and mock servers so both sides work in parallel.
- **Mobile constraints in API design:** cursor pagination, compact payloads, idempotency keys, field-level nullability, and error codes the client can act on.
- **Backward compatibility:** old app versions live for years, so changes are additive, deprecations are announced with version telemetry, and a minimum-version gate exists.
- **Shared observability:** request IDs that link client errors to backend traces, and joint incident reviews.

> [!INTERVIEW]
> What a senior answer includes: disagreement framed as options and trade-offs, commitment after decisions, explicit contracts with other teams, and backward compatibility as a mobile-specific concern. Red flags: "engineering should decide", blaming other teams, or silently building something you disagree with. Likely follow-up: "The backend team wants to ship a breaking API change next week?" (versioned endpoint or additive fields, telemetry on which app versions call the old shape, minimum-version gate as last resort).

## Behavioral (STAR)

### What is the hardest production bug you've dealt with?

**Short answer:** *(Template: adapt with your own real story and numbers.)* After a release, a few percent of users were being randomly logged out. I traced it to a race between parallel token refreshes and the backend's refresh-token rotation, fixed it with a single-flight refresh and a cross-context lock, and logout-related support tickets dropped by about 90%.

> [!NOTE] How to use these templates
> These are model answers showing structure, depth and tone. Never recite them. Replace every detail with your own experience, keep real numbers (approximate is fine, invented is not), and aim for 2–3 minutes spoken. Spend about 10% on Situation, 10% on Task, 60% on Action and 20% on Result and lessons.

- **Situation:** a fintech app with ~400k MAU. Two weeks after a release, support tickets about "being logged out randomly" tripled. Crash-free rates were fine, so nothing showed up in Crashlytics.
- **Task:** as the senior engineer on the platform team, I owned finding the root cause and a fix without forcing everyone to log in again.
- **Action:**
  - Added structured breadcrumbs around auth events (refresh start and end, 401s, which JS context triggered them) and shipped them via an OTA update to the affected runtime.
  - Correlated client logs with backend auth logs by request ID. The backend had enabled refresh-token *reuse detection* in the same window. When two refreshes raced with the same token, the second was treated as theft and the whole token family was revoked.
  - Found two sources of parallel refreshes: concurrent 401s in the API client, and a background fetch task running its own refresh in a separate JS context.
  - Implemented a single-flight refresh promise in the client, plus a native-backed mutex shared with the background task. Added an MSW-based integration test that fires ten parallel requests with an expired token and asserts exactly one refresh.
  - Agreed with the backend team on a short reuse grace window as defence in depth.
- **Result:** logout tickets fell about 90% within a week of rollout. The test now guards the behaviour, and auth events became a standard dashboard.
- **Lesson:** client and server changes that are each correct can combine into a bug. Since then I insist on cross-team release notes for auth changes.

> [!INTERVIEW]
> What evaluators look for: a systematic method (instrument, correlate, hypothesise, verify), ownership, collaboration with other teams, a durable fix (a test, a dashboard), and a lesson that changed how you work. Red flags: a hero story with no process, blaming others, or no measurable outcome. Likely follow-ups: "How did you prioritise this against the roadmap?", "What would you do differently?"

### Describe a performance improvement you led. What were the numbers?

**Short answer:** *(Template: adapt with your own real story and numbers.)* I led a cold-start effort on low-end Android that took p50 time-to-interactive from about 4.8 s to 2.1 s through deferred SDK initialisation, lazy-loaded screens, removal of a synchronous startup storage read and a lighter home screen. Day-1 retention on those devices rose by roughly 3 points.

- **Situation:** an e-commerce app where 45% of users were on mid- and low-end Android devices. Android vitals flagged slow cold starts, and product analytics showed a sharp drop-off during launch on those devices.
- **Task:** I proposed and led a six-week performance initiative with two engineers, with a target of p50 cold start under 2.5 s on our reference low-end device.
- **Action:**
  - **Measured first:** added startup spans (native init, JS bundle load, first render, home content) with Sentry performance, plus reproducible lab runs with Flashlight on a reference device.
  - **Found the costs:** eleven SDKs initialised eagerly at startup, a 1.2 MB JSON blob read synchronously from storage before first render, every screen imported eagerly through barrel files, and a home screen rendering 40 carousel items at once.
  - **Fixes:** deferred non-critical SDKs until after first interaction, moved the blob to lazy SQLite queries, enabled `inlineRequires` and lazy-loaded screens, switched carousels to FlashList with image variants, and cached the first home response for instant render.
  - **Guarded it:** added a CI budget (bundle size diff and a nightly Flashlight startup run) and a release-health gate on p90 cold start.
- **Result:** p50 time-to-interactive fell from ~4.8 s to ~2.1 s and p90 from ~7.5 s to ~3.6 s on the reference device. Android vitals no longer flagged slow starts, and day-1 retention on low-end devices rose about 3 points in the following cohort.
- **Lesson:** measurement and guardrails mattered more than any single optimisation. Without the budget, startup would have regressed within two releases.

> [!INTERVIEW]
> What evaluators look for: baseline measurements, a method for finding bottlenecks, prioritised fixes, a business metric, and regression prevention. Red flags: "the app felt faster", or optimisations picked from a blog post without measurement. Likely follow-up: "Which change had the biggest impact, and how do you know?" (have per-change measurements ready).

### Can you walk me through a large migration you led, such as adopting the New Architecture or moving to Expo?

**Short answer:** *(Template: adapt with your own real story and numbers.)* I led our move to the New Architecture ahead of the React Native version that dropped the legacy architecture. We audited about 80 native dependencies, replaced six, rewrote two in-house modules as Turbo/Expo modules, and shipped behind a staged rollout with no crash-rate regression, which also unblocked Reanimated 4 and FlashList v2.

- **Situation:** a large app still on the legacy architecture, with 80+ native dependencies and three in-house native modules. Upcoming RN versions would run only on the New Architecture, and newer versions of key libraries (Reanimated 4, FlashList v2) required it.
- **Task:** plan and lead the migration without freezing feature work, as the tech lead with support from two engineers and our iOS and Android specialists.
- **Action:**
  - Wrote an RFC with a dependency audit: status per library (compatible, needs upgrade, works via interop, blocked), owners and replacements. Got sign-off on a two-quarter plan.
  - Upgraded compatible libraries on `main` ahead of time, replaced six unmaintained ones behind existing adapters, and rewrote our in-house modules with the Expo Modules API and a Turbo Module with Codegen.
  - Ran a long-lived *build variant* (New Architecture enabled) in CI from week two, so every PR was tested on both until the switch.
  - Established performance and crash baselines, then dogfooded internally for three weeks, fixing layout differences and two native crashes.
  - Shipped via App Store phased release and a Play staged rollout with tighter health gates and a prepared hotfix branch.
- **Result:** rolled out to 100% over ten days with crash-free users unchanged (99.85%) and a measurable reduction in JS-thread frame drops on our heaviest screens. It unblocked Reanimated 4 and FlashList v2, and subsequent RN upgrades took days instead of weeks.
- **Lesson:** the audit and the dual-build CI were the real work. The flip itself was uneventful because the risk had been burned down beforehand.

> [!INTERVIEW]
> What evaluators look for: planning (audit, RFC, phases), risk management (dual builds, baselines, staged rollout), keeping the business moving, and quantified outcomes. Red flags: a big-bang switch without a rollback plan, or not knowing what actually changed architecturally. Likely follow-up: "What was the hardest dependency, and how did you handle it?"

### Can you describe a conflict with a colleague and how you resolved it?

**Short answer:** *(Template: adapt with your own real story and numbers.)* Our iOS lead wanted to rewrite a slow React Native screen natively. I thought the problem was fixable in RN. We agreed on a time-boxed profiling spike with success criteria up front. The data showed an RN fix was enough for that screen, and we agreed native made sense for the widget work, which improved our working relationship.

- **Situation:** the product detail screen had visible jank on older iPhones. Our iOS lead, a respected engineer, proposed rewriting it in Swift and embedding it. The debate turned tense in a planning meeting, with people taking sides.
- **Task:** I owned RN performance and wanted a decision based on evidence without damaging the relationship or the team's trust in RN.
- **Action:**
  - Met one-on-one first to understand the concerns: user complaints, and a past RN project that had gone badly. His goals (smooth UX, maintainability) were the same as mine.
  - Proposed a three-day spike with success criteria agreed in writing: 60 fps scroll on an iPhone 11-class device and no dropped frames on image carousel swipes. If RN couldn't hit them, we'd go native.
  - Profiled with React Native DevTools and Instruments together. The causes were an unvirtualised list of reviews, full-resolution images and a context provider re-rendering the whole screen on every price tick.
  - Fixed them jointly (FlashList, image variants, a selector-based store), pairing across the RN/native boundary.
- **Result:** the screen met the criteria in the spike. The iOS lead later championed native work where it genuinely fit (home screen widgets, Live Activities), and we wrote a short ADR on "when we go native". The two of us became the go-to reviewers for cross-platform performance.
- **Lesson:** turn opinions into shared, measurable criteria early, and separate the person from the proposal.

> [!INTERVIEW]
> What evaluators look for: empathy and curiosity about the other side, objective criteria, collaboration rather than "winning", and a relationship that ended stronger. Red flags: the other person painted as a villain, escalating to a manager first, or "I was right" as the lesson. Likely follow-up: "What if the spike had shown you were wrong?" (the answer must be: we'd go native, and that's fine).

### What is a failure you've had, and what did you learn from it?

**Short answer:** *(Template: adapt with your own real story and numbers.)* I shipped an OTA update that crashed on launch for users on an older binary because it depended on a native module that binary didn't have. About 8% of users were affected for 40 minutes. We rolled back, then fixed the process: fingerprint-based runtime versions, staged OTA rollouts and crash-rate alerts per update.

- **Situation:** we used manually set runtime version strings for OTA updates. I was release captain and published a JS fix to production.
- **Task:** the fix was urgent (a checkout bug), and I owned the release end to end.
- **Action (the failure):** the fix imported a helper that, two weeks earlier, had started using a new native module shipped in the latest binary. The runtime version hadn't been bumped when that native module was added, so the update also reached users on the previous binary. They crashed on launch.
- **Action (the response):**
  - Crash alerts fired within minutes. I rolled back to the previous update, communicated in the incident channel and with support, and confirmed recovery (the rolled-back update applied on next launch for most users).
  - Ran a blameless post-mortem: the root cause was a process that relied on humans remembering to bump a version.
  - Switched to the `fingerprint` runtime version policy so native changes automatically create a new runtime. Made every OTA roll out at 5% first with a 30-minute watch on crash-free sessions for that update. Added a CI check that runs the update bundle against the oldest binary still on each runtime.
- **Result:** about 8% of users had a broken launch for ~40 minutes, and we lost some orders during that window. Since the changes, we've shipped dozens of OTA updates without a compatibility incident.
- **Lesson:** "urgent" is exactly when process matters most. I now design safety into tooling rather than checklists.

> [!INTERVIEW]
> What evaluators look for: a real failure with real impact (not a humble-brag), ownership without self-flagellation, a calm incident response, and systemic changes. Red flags: "my biggest failure is working too hard", blaming the tool or a colleague, or no lasting change. Likely follow-up: "How did you communicate it to leadership?"

### Can you tell me about a time you mentored someone?

**Short answer:** *(Template: adapt with your own real story and numbers.)* I mentored a mid-level web engineer new to React Native. Over six months, with a plan covering platform fundamentals, paired work, then full ownership of our payments module, they went from needing help on native build issues to leading the Apple Pay/Google Pay rollout and were promoted to senior a cycle later.

- **Situation:** a strong React web engineer joined the mobile team. They were productive on UI but stuck on native builds, app lifecycle, store releases and debugging on devices, and were losing confidence.
- **Task:** as their mentor, help them become independent on mobile within about two quarters, which my manager and I agreed as a goal.
- **Action:**
  - Agreed on explicit goals in our first 1:1: debug native build failures alone, own a feature end to end including release, and lead a design discussion.
  - **Month 1–2:** weekly pairing on platform topics (threading and the JS/UI thread split, permissions, background behaviour, Xcode and Gradle basics), plus reviews with explanations rather than just requests.
  - **Month 3–4:** gave them ownership of adding Apple Pay/Google Pay to checkout: native config, the Stripe integration, testing, and the rollout plan. I reviewed their RFC instead of writing it.
  - **Month 5–6:** made them release captain for two trains, and had them run the post-release review.
  - Gave specific, timely feedback, and deliberately stopped answering questions I knew they could solve ("what have you tried, what does the log say?").
- **Result:** they shipped wallet payments on schedule (checkout conversion up ~4% for wallet-eligible users), became the team's go-to person for payments, started mentoring a new joiner, and were promoted a cycle later.
- **Lesson:** mentoring worked best when I gave ownership early with a safety net, and measured progress against goals we'd agreed together.

> [!INTERVIEW]
> What evaluators look for: a plan with goals, progressively more autonomy, feedback skills, and outcomes for the mentee (not just for you). Red flags: mentoring that means "I answered their questions", taking credit for their work, or no evidence of growth. Likely follow-up: "What would you do if someone wasn't improving despite mentoring?" (revisit goals and fit, check blockers outside the work, involve their manager with specific examples).
