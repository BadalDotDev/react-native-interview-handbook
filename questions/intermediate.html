**Short answer:** `Animated` describes animations as a graph of `Animated.Value`s, interpolations and timing/spring drivers bound to style props of `Animated.View`/`Text`/`Image`. With `useNativeDriver: false`, JS computes every frame and sends updates to native, so a busy JS thread drops frames. With `useNativeDriver: true`, the graph is serialized to native **once** and the UI thread runs it, surviving JS jank. The limit: only **non-layout** properties — `transform` and `opacity` (plus a few others) — are supported; layout props like `width`, `height`, `top`, `margin` or `flex` throw.

```mermaid
flowchart TD
    subgraph jsDriven["useNativeDriver: false"]
        J1["JS thread computes value<br/>every frame"] --> J2["Send style update to native"]
        J2 --> J3["UI thread applies and draws"]
    end
    subgraph nativeDriven["useNativeDriver: true"]
        N1["JS thread serializes<br/>animation graph once"] --> N2["UI thread computes value<br/>every frame"]
        N2 --> N3["UI thread applies transform / opacity"]
    end
    Busy["JS thread busy<br/>(heavy render, JSON parse)"] -.->|"frames dropped"| J1
    Busy -.->|"no impact"| N2
```
*Figure: JS-driven vs native-driven Animated — where each frame is computed.*

```tsx title="src/ui/FadeInCard.tsx"
import { useEffect, useRef } from 'react';
import { Animated } from 'react-native';

export function FadeInCard({ children }: { children: React.ReactNode }) {
  const progress = useRef(new Animated.Value(0)).current;

  useEffect(() => {
    const anim = Animated.timing(progress, { toValue: 1, duration: 250, useNativeDriver: true });
    anim.start();
    return () => anim.stop();
  }, [progress]);

  return (
    <Animated.View
      style={{
        opacity: progress,
        transform: [{ translateY: progress.interpolate({ inputRange: [0, 1], outputRange: [16, 0] }) }],
      }}
    >
      {children}
    </Animated.View>
  );
}
```

Scroll-linked effects can also run natively:

```tsx
const scrollY = useRef(new Animated.Value(0)).current;
<Animated.FlatList
  onScroll={Animated.event([{ nativeEvent: { contentOffset: { y: scrollY } } }], { useNativeDriver: true })}
  scrollEventThrottle={16}
  {...listProps}
/>;
```

| Want to animate | Native driver? | Alternative |
|---|---|---|
| Fade, slide, scale, rotate | Yes (`opacity`, `transform`) | — |
| Height of an expanding panel | No | Animate `scaleY` or use Reanimated / LayoutAnimation |
| Width of a progress bar | No | `transform: [{ scaleX }]` with a left origin trick, or Reanimated |
| Background color | Limited | Reanimated `interpolateColor` |
| Follow a finger precisely | Awkward | Reanimated + Gesture Handler |

Gotchas: you can't mix native and JS drivers on the same `Animated.Value`; reading a value requires a listener (`addListener`), which reintroduces bridge traffic; and `Animated.Value` must be kept in a ref (`useRef(...).current`), not created each render.

> [!INTERVIEW]
> Strong answers explain *why* layout props can't be native-driven (the native driver updates view properties directly, without re-running layout), and know when to graduate to Reanimated: gestures, layout animations, and logic that must react on the UI thread.

### When do you use LayoutAnimation versus Reanimated, and how do shared values and worklets work?

**Short answer:** `LayoutAnimation` is a fire-and-forget instruction: "animate whatever layout changes happen in the next render". It's great for cheap expand/collapse and list insertions, but you can't interrupt it, drive it by a gesture, or animate a single element independently. **Reanimated** runs animation logic on the UI thread: **shared values** hold state readable from both threads, **worklets** are small JS functions that execute on the UI runtime, and `useAnimatedStyle` maps shared values to styles every frame — including layout props — without touching the JS thread.

```tsx
import { LayoutAnimation } from 'react-native';

const toggle = () => {
  LayoutAnimation.configureNext(LayoutAnimation.Presets.easeInEaseOut);
  setExpanded((e) => !e); // the resulting layout change animates
};
```

```tsx title="src/ui/SwipeToDismiss.tsx"
import Animated, { runOnJS, useAnimatedStyle, useSharedValue, withSpring } from 'react-native-reanimated';
import { Gesture, GestureDetector } from 'react-native-gesture-handler';

export function SwipeToDismiss({ children, onDismiss }: { children: React.ReactNode; onDismiss: () => void }) {
  const translateX = useSharedValue(0);

  const pan = Gesture.Pan()
    .activeOffsetX([-10, 10]) // let vertical scrolling win for small movements
    .onUpdate((e) => {
      translateX.value = e.translationX; // runs on the UI thread as a worklet
    })
    .onEnd((e) => {
      if (Math.abs(e.translationX) > 120) {
        translateX.value = withSpring(Math.sign(e.translationX) * 600);
        runOnJS(onDismiss)(); // hop back to the JS thread for React state / navigation
      } else {
        translateX.value = withSpring(0);
      }
    });

  const style = useAnimatedStyle(() => ({
    transform: [{ translateX: translateX.value }],
    opacity: 1 - Math.min(Math.abs(translateX.value) / 600, 1),
  }));

  return (
    <GestureDetector gesture={pan}>
      <Animated.View style={style}>{children}</Animated.View>
    </GestureDetector>
  );
}
```

| | LayoutAnimation | Animated (native driver) | Reanimated |
|---|---|---|---|
| Runs on | Native | UI thread (declarative graph) | UI thread (worklets) |
| Layout props | Yes (whole next layout) | No | Yes |
| Interruptible / gesture-driven | No | Partly | Yes |
| Entering/exiting/layout transitions | Global only | No | `entering`, `exiting`, `layout` props |
| Complexity | Minimal | Low | Medium |

Reanimated 4 specifics: New Architecture only; worklets live in the separate `react-native-worklets` package (its Babel plugin must be **last** in `babel.config.js`; Expo configures it); CSS-style `transition*` and `animation*` style props now cover many simple cases declaratively. Newer worklets releases offer `scheduleOnRN` as the successor to `runOnJS`. For React Compiler compatibility, prefer `sv.get()` / `sv.set()` over `.value` in component bodies.

Pitfalls: never read `sharedValue.value` during React render to drive UI (it doesn't re-render); don't capture large objects in worklets (they're copied to the UI runtime); on old-architecture Android, `LayoutAnimation` needed `UIManager.setLayoutAnimationEnabledExperimental(true)` — on the New Architecture that call is a no-op.

### Why use react-native-gesture-handler instead of PanResponder?

**Short answer:** `PanResponder` runs on the **JS thread** through RN's responder system: every touch move is an event to JS, so a busy JS thread makes gestures lag, and it negotiates poorly with native scroll views. **Gesture Handler** recognizes gestures natively on the UI thread using the platform's recognizers, supports declarative composition (simultaneous, exclusive, race), integrates with native scroll and buttons, and — paired with Reanimated — keeps the gesture-to-animation loop entirely off the JS thread.

```tsx
import { Gesture, GestureDetector } from 'react-native-gesture-handler';
import Animated, { useAnimatedStyle, useSharedValue } from 'react-native-reanimated';

function ZoomableImage({ uri }: { uri: string }) {
  const scale = useSharedValue(1);
  const savedScale = useSharedValue(1);
  const rotation = useSharedValue(0);

  const pinch = Gesture.Pinch()
    .onUpdate((e) => {
      scale.value = savedScale.value * e.scale;
    })
    .onEnd(() => {
      savedScale.value = scale.value;
    });
  const rotate = Gesture.Rotation().onUpdate((e) => {
    rotation.value = e.rotation;
  });
  const doubleTap = Gesture.Tap()
    .numberOfTaps(2)
    .onEnd(() => {
      scale.value = 1;
      savedScale.value = 1;
    });

  const gesture = Gesture.Exclusive(doubleTap, Gesture.Simultaneous(pinch, rotate));
  const style = useAnimatedStyle(() => ({
    transform: [{ scale: scale.value }, { rotate: `${rotation.value}rad` }],
  }));

  return (
    <GestureDetector gesture={gesture}>
      <Animated.Image source={{ uri }} style={[{ width: 300, height: 300 }, style]} />
    </GestureDetector>
  );
}
```

| | PanResponder | Gesture Handler 2 |
|---|---|---|
| Recognition | JS thread | Native (UI thread) |
| Under JS load | Lags / drops | Unaffected |
| Composition | Manual state machines | `Simultaneous`, `Exclusive`, `Race`, `requireExternalGestureToFail` |
| Scroll interop | Fragile (`onMoveShouldSetPanResponderCapture` games) | Native-aware (`simultaneousWithExternalGesture`, `activeOffsetX`) |
| Buttons | `Touchable*` / `Pressable` | Also native buttons (`RectButton`) |
| Setup | None | `GestureHandlerRootView` at the app root |

Setup gotcha: wrap the app (and any native modal content) in `GestureHandlerRootView` with `flex: 1`, or gestures silently won't fire. Gesture callbacks are workletized automatically when Reanimated is installed; add `.runOnJS(true)` to run them on the JS thread when you need to call React state setters directly.

## Forms and keyboard

### How do you build a validated form with react-hook-form and zod?

**Short answer:** Define the rules once as a **zod schema**, infer the TypeScript type from it, and plug it into react-hook-form via `zodResolver`. RHF keeps field values outside React state (subscriptions instead of re-rendering the whole form per keystroke), and in React Native you bind `TextInput` through `Controller` because there's no DOM `register`. Map server-side errors back with `setError`.

```tsx title="src/auth/SignUpScreen.tsx"
import { Controller, useForm } from 'react-hook-form';
import { zodResolver } from '@hookform/resolvers/zod';
import { z } from 'zod';
import { Button, Text, TextInput, View } from 'react-native';

const signUpSchema = z
  .object({
    email: z.string().trim().email('Enter a valid email'), // Zod 4 also offers z.email()
    password: z.string().min(8, 'At least 8 characters'),
    confirmPassword: z.string(),
  })
  .refine((v) => v.password === v.confirmPassword, {
    message: 'Passwords do not match',
    path: ['confirmPassword'],
  });

type SignUpForm = z.infer<typeof signUpSchema>;

export function SignUpScreen() {
  const {
    control,
    handleSubmit,
    setFocus,
    setError,
    formState: { errors, isSubmitting },
  } = useForm<SignUpForm>({
    resolver: zodResolver(signUpSchema),
    defaultValues: { email: '', password: '', confirmPassword: '' },
    mode: 'onTouched', // validate after first blur, then on change
  });

  const onSubmit = handleSubmit(async (values) => {
    try {
      await authApi.signUp(values);
    } catch (e) {
      if (isApiError(e) && e.code === 'EMAIL_TAKEN') {
        setError('email', { message: 'This email is already registered' });
      } else {
        setError('root', { message: 'Something went wrong. Try again.' });
      }
    }
  });

  return (
    <View>
      <Controller
        control={control}
        name="email"
        render={({ field: { ref, value, onChange, onBlur } }) => (
          <TextInput
            ref={ref}
            value={value}
            onChangeText={onChange}
            onBlur={onBlur}
            autoCapitalize="none"
            autoComplete="email"
            keyboardType="email-address"
            textContentType="emailAddress"
            returnKeyType="next"
            submitBehavior="submit"
            onSubmitEditing={() => setFocus('password')}
            accessibilityLabel="Email"
          />
        )}
      />
      {errors.email ? <Text accessibilityLiveRegion="polite">{errors.email.message}</Text> : null}
      {/* password and confirmPassword follow the same pattern */}
      {errors.root ? <Text>{errors.root.message}</Text> : null}
      <Button title="Create account" onPress={onSubmit} disabled={isSubmitting} />
    </View>
  );
}
```

Why this combination: one schema gives runtime validation **and** static types (and can be shared with a Node backend); RHF gives dirty/touched tracking, async submit state and minimal re-renders; `setFocus` works because `field.ref` receives the `TextInput` instance.

Pitfalls: forgetting `defaultValues` (inputs switch from uncontrolled to controlled and `isDirty` misbehaves); validating on every keystroke from the first character (`mode: 'onChange'` is noisy — `onTouched` feels better on mobile); client validation is UX, not security — the server validates again.

### How do you manage TextInput focus chains and keyboard handling across iOS and Android?

**Short answer:** Chain inputs with refs: `returnKeyType="next"` plus `onSubmitEditing={() => nextRef.current?.focus()}` and `submitBehavior="submit"` so the keyboard stays open between fields; the last field uses `returnKeyType="done"` or `"go"` and submits. For keeping inputs visible, `KeyboardAvoidingView` works for simple screens but behaves differently per platform and is fragile with headers, tabs and Android edge-to-edge; **react-native-keyboard-controller** gives consistent, animated, frame-synchronized behavior on both platforms and is the modern default.

```tsx
const passwordRef = useRef<TextInput>(null);

<TextInput
  placeholder="Email"
  returnKeyType="next"
  submitBehavior="submit" // replaces the deprecated blurOnSubmit={false}
  onSubmitEditing={() => passwordRef.current?.focus()}
/>
<TextInput
  ref={passwordRef}
  placeholder="Password"
  secureTextEntry
  textContentType="password"
  returnKeyType="go"
  onSubmitEditing={submit}
/>
```

**Why KeyboardAvoidingView is fragile**

| Issue | Detail |
|---|---|
| Platform behavior | iOS usually needs `behavior="padding"`; on Android the OS historically resized the window (`adjustResize`), so `behavior` was often left undefined |
| Offsets | Needs `keyboardVerticalOffset` equal to header height, which differs by screen and device |
| Edge-to-edge Android | Apps targeting Android 15+ are edge-to-edge; the window is no longer resized for the keyboard automatically, so insets must be handled by the app |
| Animation | Jumps rather than tracking the keyboard frame by frame |
| Scroll views | Doesn't scroll the focused input into view |

```tsx title="App.tsx"
import { KeyboardProvider } from 'react-native-keyboard-controller';

export default function App() {
  return (
    <KeyboardProvider>
      <RootNavigator />
    </KeyboardProvider>
  );
}
```

```tsx title="src/checkout/AddressForm.tsx"
import { KeyboardAwareScrollView, KeyboardToolbar } from 'react-native-keyboard-controller';

export function AddressForm() {
  return (
    <>
      <KeyboardAwareScrollView bottomOffset={24} keyboardShouldPersistTaps="handled">
        {/* inputs: the focused one is scrolled into view automatically */}
      </KeyboardAwareScrollView>
      <KeyboardToolbar /> {/* previous / next / done above the keyboard */}
    </>
  );
}
```

Other details that come up: `keyboardShouldPersistTaps="handled"` on scroll views so a tap on "Submit" doesn't just dismiss the keyboard; `Keyboard.dismiss()` on background press; `textContentType` (iOS) and `autoComplete` (Android and iOS) for password managers and one-time codes (`oneTimeCode` / `sms-otp`); and `keyboardWillShow` events exist only on iOS.

> [!INTERVIEW]
> Strong answers mention Android edge-to-edge changing keyboard behavior, the `submitBehavior` prop, and autofill attributes. Red flag: hard-coding a keyboard height or wrapping every screen in `KeyboardAvoidingView` with magic offsets.

## Networking

### How do you use axios interceptors to attach tokens and refresh them on 401?

**Short answer:** A **request interceptor** attaches the current access token. A **response interceptor** catches `401`, refreshes the token **once** — concurrent failures share a single in-flight refresh promise — then retries the original request with the new token. A `_retry` flag prevents infinite loops, the refresh call bypasses the interceptors, and if refresh fails you emit a "session expired" event that signs the user out.

```mermaid
sequenceDiagram
    participant UI as Screen
    participant AX as Axios instance
    participant API as API server
    participant AUTH as Refresh endpoint
    UI->>AX: GET /orders
    AX->>API: request with access token
    API-->>AX: 401 Unauthorized
    alt no refresh in flight
        AX->>AUTH: POST /auth/refresh with refresh token
        AUTH-->>AX: new access and refresh tokens
        AX->>AX: save tokens, resolve shared promise
    else refresh already running
        AX->>AX: await the shared refresh promise
    end
    AX->>API: retry original request with new token
    API-->>AX: 200 OK
    AX-->>UI: data
    opt refresh fails
        AX-->>UI: reject and emit sessionExpired
    end
```
*Figure: Single-flight token refresh in a response interceptor.*

```ts title="src/api/client.ts"
import axios, { type AxiosError, type InternalAxiosRequestConfig } from 'axios';
import { tokenStore } from '../auth/tokenStore';
import { authEvents } from '../auth/authEvents';

type RetriableConfig = InternalAxiosRequestConfig & { _retry?: boolean };
type TokenPair = { accessToken: string; refreshToken: string };

export const api = axios.create({ baseURL: API_URL, timeout: 15_000 });

api.interceptors.request.use((config) => {
  const token = tokenStore.getAccessToken(); // kept in memory, not read from disk per request
  if (token) config.headers.Authorization = `Bearer ${token}`;
  return config;
});

let refreshPromise: Promise<string> | null = null;

function refreshAccessToken(): Promise<string> {
  if (!refreshPromise) {
    refreshPromise = (async () => {
      try {
        const refreshToken = await tokenStore.getRefreshToken(); // from Keychain / Keystore
        if (!refreshToken) throw new Error('No refresh token');
        // Plain axios, not `api`: the refresh call must not go through these interceptors
        const { data } = await axios.post<TokenPair>(`${API_URL}/auth/refresh`, { refreshToken });
        await tokenStore.setTokens(data); // refresh tokens usually rotate
        return data.accessToken;
      } finally {
        refreshPromise = null;
      }
    })();
  }
  return refreshPromise;
}

api.interceptors.response.use(
  (response) => response,
  async (error: AxiosError) => {
    const original = error.config as RetriableConfig | undefined;
    if (error.response?.status !== 401 || !original || original._retry) {
      return Promise.reject(error);
    }
    original._retry = true;
    try {
      const accessToken = await refreshAccessToken();
      original.headers.Authorization = `Bearer ${accessToken}`;
      return api(original);
    } catch (refreshError) {
      authEvents.emit('sessionExpired'); // clear tokens + caches, auth navigator shows SignIn
      return Promise.reject(refreshError);
    }
  },
);
```

Details that separate good from great:

- **Single flight** matters because a screen often fires 5 requests at once; without it you send 5 refreshes, and with rotating refresh tokens 4 of them fail and log the user out.
- **Proactive refresh**: decode the JWT `exp` and refresh shortly before expiry (and on app foreground) to avoid the 401 round trip.
- **Don't retry non-auth 401s forever** — `_retry` guarantees one attempt per request.
- **Where tokens live**: access token in memory, refresh token in Keychain/Keystore via `react-native-keychain` or `expo-secure-store`.

The full session design (PKCE, rotation, biometric unlock, logout everywhere) is in [Authentication & Sessions](../guides/authentication.html).

> [!INTERVIEW]
> Red flags: refreshing inside every screen, refresh token in AsyncStorage, no protection against parallel refreshes. Likely follow-up: "How would you do the same with `fetch` or RTK Query?" — a wrapper function or a custom `baseQuery` with a mutex implementing the same single-flight logic.

### How do you implement retries with exponential backoff and request cancellation?

**Short answer:** Retry only **transient** failures — network errors, timeouts, `429`, `5xx` — and only **idempotent** requests (GET, PUT, DELETE, or POSTs carrying an idempotency key). Wait `base × 2^attempt` capped at a maximum, with **jitter** so thousands of phones don't retry in lockstep, and honor `Retry-After`. Cancel with `AbortController`: pass its `signal` to fetch or axios and abort on unmount, on a newer search, or when the user leaves the screen.

```ts title="src/api/withRetry.ts"
import axios from 'axios';

type RetryOptions = { retries?: number; baseMs?: number; maxMs?: number; signal?: AbortSignal };

const sleep = (ms: number, signal?: AbortSignal) =>
  new Promise<void>((resolve, reject) => {
    const id = setTimeout(resolve, ms);
    signal?.addEventListener(
      'abort',
      () => {
        clearTimeout(id);
        reject(new Error('Aborted'));
      },
      { once: true },
    );
  });

function isRetryable(error: unknown): boolean {
  if (!axios.isAxiosError(error)) return false;
  if (error.code === 'ERR_CANCELED') return false; // user cancelled: never retry
  if (!error.response) return true;                 // network error or timeout
  const status = error.response.status;
  const method = (error.config?.method ?? 'get').toUpperCase();
  const hasIdempotencyKey = Boolean(error.config?.headers?.['Idempotency-Key']);
  const idempotent = ['GET', 'HEAD', 'OPTIONS', 'PUT', 'DELETE'].includes(method) || hasIdempotencyKey;
  return idempotent && (status === 429 || status >= 500);
}

function retryAfterMs(error: unknown): number | undefined {
  if (!axios.isAxiosError(error)) return undefined;
  const header = error.response?.headers?.['retry-after'];
  const seconds = Number(header);
  return Number.isFinite(seconds) ? seconds * 1000 : undefined;
}

export async function withRetry<T>(
  fn: () => Promise<T>,
  { retries = 3, baseMs = 500, maxMs = 10_000, signal }: RetryOptions = {},
): Promise<T> {
  for (let attempt = 0; ; attempt++) {
    try {
      return await fn();
    } catch (error) {
      if (attempt >= retries || signal?.aborted || !isRetryable(error)) throw error;
      const cap = Math.min(maxMs, baseMs * 2 ** attempt);
      const delay = retryAfterMs(error) ?? Math.random() * cap; // "full jitter"
      await sleep(delay, signal);
    }
  }
}
```

```tsx
// Cancellation: abort when inputs change or the component unmounts
useEffect(() => {
  const controller = new AbortController();
  withRetry(() => api.get<Product[]>('/search', { params: { q: query }, signal: controller.signal }), {
    signal: controller.signal,
  })
    .then((res) => setResults(res.data))
    .catch((e) => {
      if (!axios.isCancel(e) && !controller.signal.aborted) setError(e);
    });
  return () => controller.abort();
}, [query]);
```

| Decision | Recommendation |
|---|---|
| Max attempts | 2–4 for user-facing calls; more for background sync |
| Retry POST? | Only with an idempotency key the server deduplicates |
| 4xx (except 408/429) | Never retry — the request itself is wrong |
| Timeouts | axios `timeout`, or a `setTimeout` that aborts the controller |
| Offline | Don't burn retries; pause until NetInfo reports connectivity (TanStack Query does this) |
| Cancellation in axios | `signal`; `CancelToken` is deprecated |

In practice TanStack Query already provides retries with exponential backoff (`retry`, `retryDelay`), passes an `AbortSignal` to your `queryFn`, and pauses while offline — hand-rolled retry logic is for non-query code paths such as uploads and background sync.

> [!INTERVIEW]
> What a senior answer includes: idempotency, jitter (the thundering-herd problem after an outage), `Retry-After`, and never retrying user-cancelled requests. Follow-up: "How do you retry a large upload?" — resumable/chunked uploads (e.g. tus or S3 multipart); see the [Camera, Media & Uploads guide](../guides/camera.html).

### What is the difference between isConnected and isInternetReachable in NetInfo, and how should you use them?

**Short answer:** `isConnected` means the device has an active network interface (Wi-Fi, cellular) — **not** that the internet works. `isInternetReachable` means NetInfo actually reached the internet via a reachability check; it is `null` while unknown. A phone on hotel Wi-Fi behind a captive portal is connected but not reachable. Treat both as **hints** for UX (offline banners, pausing sync), never as a gate that blocks requests — the request itself is the only reliable test.

```ts title="src/network/netinfo.ts"
import NetInfo from '@react-native-community/netinfo';

// Point reachability at your own backend instead of the default public endpoint
NetInfo.configure({
  reachabilityUrl: 'https://api.example.com/health',
  reachabilityTest: async (response) => response.status === 204,
  reachabilityShortTimeout: 5_000,  // re-check interval while unreachable
  reachabilityLongTimeout: 60_000,  // re-check interval while reachable
});
```

```tsx title="src/network/OfflineBanner.tsx"
import { useNetInfo } from '@react-native-community/netinfo';

export function OfflineBanner() {
  const { isConnected, isInternetReachable } = useNetInfo();
  // null means "not known yet": don't flash the banner on cold start
  const offline = isConnected === false || isInternetReachable === false;
  if (!offline) return null;
  return <Banner text="You're offline. Changes will sync when you reconnect." />;
}
```

| Field | Meaning | Values | Use for |
|---|---|---|---|
| `type` | Interface type | `wifi`, `cellular`, `none`, `unknown`, ... | Avoid big downloads on cellular |
| `isConnected` | Interface is up | `boolean \| null` | Quick "definitely offline" signal |
| `isInternetReachable` | Reachability check succeeded | `boolean \| null` | Offline banner, pausing sync |
| `details.isConnectionExpensive` | Metered connection | `boolean` | Defer media prefetching |

Pitfalls: `null` treated as `false` (offline banner flashes on every launch); blocking a request because NetInfo says offline even though it would have succeeded; emulators reporting odd states; and reachability checks costing battery if configured too aggressively. Wire NetInfo into TanStack Query's `onlineManager` so queries pause and resume automatically.

### How would you design a reliable WebSocket connection with reconnects in a mobile app?

**Short answer:** Assume the socket **will** die — backgrounding, network switches, elevators, server deploys. Reconnect with exponential backoff plus jitter, detect half-open connections with an app-level heartbeat, authenticate on connect with a fresh token, and **resync** missed events (last event ID or a REST refetch) after every reconnect. Tie the lifecycle to `AppState` (close in background, reconnect on foreground) and NetInfo (reconnect immediately when the network returns).

```ts title="src/realtime/RealtimeClient.ts"
type ServerEvent = { type: string; id?: string; payload?: unknown };

export class RealtimeClient {
  private ws: WebSocket | null = null;
  private connecting = false;
  private shouldRun = false;
  private attempt = 0;
  private lastEventId: string | null = null;
  private lastPongAt = 0;
  private retryTimer: ReturnType<typeof setTimeout> | null = null;
  private heartbeatTimer: ReturnType<typeof setInterval> | null = null;

  constructor(
    private readonly url: string,
    private readonly getToken: () => Promise<string>,
    private readonly onEvent: (event: ServerEvent) => void,
  ) {}

  start() {
    this.shouldRun = true;
    void this.connect();
  }

  stop() {
    this.shouldRun = false;
    this.clearTimers();
    this.ws?.close(1000, 'client stop');
    this.ws = null;
  }

  reconnectNow() {
    if (!this.shouldRun || this.ws || this.connecting) return;
    this.clearTimers();
    this.attempt = 0;
    void this.connect();
  }

  private async connect() {
    if (!this.shouldRun || this.ws || this.connecting) return;
    this.connecting = true;
    try {
      const token = await this.getToken(); // fresh token every attempt
      const ws = new WebSocket(this.url);
      this.ws = ws;
      ws.onopen = () => {
        this.attempt = 0;
        // Authenticate in the first message rather than the URL (URLs end up in logs)
        ws.send(JSON.stringify({ type: 'auth', token, since: this.lastEventId }));
        this.startHeartbeat();
      };
      ws.onmessage = (msg) => {
        const event = JSON.parse(String(msg.data)) as ServerEvent;
        if (event.type === 'pong') {
          this.lastPongAt = Date.now();
          return;
        }
        if (event.id) this.lastEventId = event.id;
        this.onEvent(event);
      };
      ws.onclose = (e) => {
        this.clearTimers();
        this.ws = null;
        const authRejected = e.code === 4001; // app-defined close code
        if (this.shouldRun && !authRejected) this.scheduleReconnect();
      };
    } catch {
      this.scheduleReconnect();
    } finally {
      this.connecting = false;
    }
  }

  private scheduleReconnect() {
    const cap = Math.min(30_000, 1_000 * 2 ** this.attempt++);
    this.retryTimer = setTimeout(() => void this.connect(), Math.random() * cap);
  }

  private startHeartbeat() {
    this.lastPongAt = Date.now();
    this.heartbeatTimer = setInterval(() => {
      if (Date.now() - this.lastPongAt > 45_000) return this.dropAndReconnect(); // half-open socket
      this.ws?.send(JSON.stringify({ type: 'ping' }));
    }, 15_000);
  }

  private dropAndReconnect() {
    const dead = this.ws;
    this.clearTimers();
    this.ws = null;
    if (dead) {
      dead.onclose = null; // a dead TCP connection may never deliver onclose
      dead.close();
    }
    this.scheduleReconnect();
  }

  private clearTimers() {
    if (this.retryTimer) clearTimeout(this.retryTimer);
    if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
    this.retryTimer = null;
    this.heartbeatTimer = null;
  }
}
```

```ts

  if (s === 'active') realtime.start();
  else if (s === 'background') realtime.stop(); // iOS suspends the app anyway; free the socket
});

});
```

Design points: after each reconnect, invalidate or refetch the affected queries so the UI converges even if events were lost; make server events idempotent and ordered (sequence numbers) so replays are harmless; backgrounded apps get push notifications for real-time alerts, not sockets; and the server must tolerate a reconnect storm after a deploy (jitter helps both sides).

> [!INTERVIEW]
> Red flags: `setTimeout(connect, 1000)` forever with no backoff, token in the query string, no resync after reconnect. Follow-up: "Socket.IO or raw WebSocket?" — Socket.IO adds reconnection, rooms and fallbacks but needs its own server protocol; raw WebSocket plus a thin client like the one above is often enough.

## Storage

### When do you use AsyncStorage, MMKV, SQLite or Keychain/SecureStore, and what must never go in AsyncStorage?

**Short answer:** **AsyncStorage** is a simple, asynchronous, **unencrypted** key-value store — fine for small non-sensitive data. **MMKV** is a synchronous, memory-mapped key-value store accessed over JSI, much faster, with optional encryption — the modern default for preferences, flags and persisted client state. **SQLite** (expo-sqlite, op-sqlite, or WatermelonDB on top) is for relational or large data you query. **Keychain (iOS) / Keystore-backed storage (Android)** via `react-native-keychain` or `expo-secure-store` is for **secrets**. Tokens, passwords, keys and sensitive PII never go in AsyncStorage or unencrypted MMKV.

| | AsyncStorage | MMKV | SQLite | Keychain / SecureStore |
|---|---|---|---|---|
| API | Async key-value (strings) | Sync key-value (string, number, bool, buffer) | SQL, transactions | Async, small values |
| Speed | Slow-ish (serialization + async round trip) | Very fast | Fast with indexes | Slow (crypto, IPC) |
| Encryption | No | Optional (key must live in Keychain) | Optional (SQLCipher variants) | Yes, hardware-backed where available |
| Size | Small data; Android backend has a default size cap | Tens of MB comfortably | Large datasets | A few KB per item |
| Survives uninstall | No | No | No | iOS Keychain: **yes, by default** |
| Use for | Legacy/simple prefs | Settings, feature flags, Zustand/Redux persist, query cache | Offline data, message history, search | Refresh tokens, credentials, encryption keys |

```ts title="src/storage/kv.ts"
import { createMMKV } from 'react-native-mmkv'; // v4 (Nitro); v3 uses `new MMKV()` and `.delete()`

export const kv = createMMKV({ id: 'app' });

kv.set('onboarding.completed', true);
const completed = kv.getBoolean('onboarding.completed') ?? false;
kv.remove('onboarding.completed');
```

```ts title="src/auth/tokenStore.ts"
import * as SecureStore from 'expo-secure-store';

const REFRESH_KEY = 'auth.refreshToken';
let accessToken: string | null = null; // memory only

export const tokenStore = {
  getAccessToken: () => accessToken,
  getRefreshToken: () => SecureStore.getItemAsync(REFRESH_KEY),
  async setTokens(t: { accessToken: string; refreshToken: string }) {
    accessToken = t.accessToken;
    await SecureStore.setItemAsync(REFRESH_KEY, t.refreshToken, {
      // readable by background tasks after first unlock, never migrated to another device
      keychainAccessible: SecureStore.AFTER_FIRST_UNLOCK_THIS_DEVICE_ONLY,
    });
  },
  async clear() {
    accessToken = null;
    await SecureStore.deleteItemAsync(REFRESH_KEY);
  },
};
```

> [!CAUTION]
> Never store in AsyncStorage or plain MMKV: access/refresh tokens, passwords, API secrets, private keys, payment data, health data or government IDs. On a rooted/jailbroken device or from an unencrypted backup these files are readable. Also remember that **anything bundled in the JS or the binary is public** — storage choice can't protect a secret you ship.

Gotchas: the iOS Keychain survives uninstall, so a reinstalled app can find an old refresh token — clear secure items on first launch using a flag in MMKV; MMKV's synchronous API is great for startup reads but don't store multi-MB blobs in it; and AsyncStorage values must be strings, so every read is a `JSON.parse`. Sync strategies, conflict resolution and database choices are in the [Offline Storage & Sync guide](../guides/offline-storage.html) and the [Security guide](../guides/security.html).

> [!INTERVIEW]
> What a senior answer includes: sync vs async trade-off, encryption-key management (MMKV encryption is only as good as where the key lives), Keychain persistence after uninstall, and matching storage to data shape. Red flag: "we encrypt tokens with a key hard-coded in JS".

## TypeScript in React Native

### How do you type props, children, styles, generic list components and refs to native components?

**Short answer:** Type props as an object type (extend the underlying component's props with `ComponentProps<typeof X>` or `PressableProps` and `Omit` what you replace), children as `ReactNode` (or `PropsWithChildren`), style props as `StyleProp<ViewStyle | TextStyle | ImageStyle>` so callers can pass arrays and falsy values, make reusable lists **generic** over the item type `T`, and type refs with the component class: `useRef<TextInput>(null)`, `useRef<FlatList<Order>>(null)`. In React 19, `ref` is a normal prop, so custom components accept `ref?: Ref<Handle>` without `forwardRef`.

```tsx title="src/ui/Button.tsx"
import type { ReactNode } from 'react';
import {
  Pressable,
  StyleSheet,
  Text,
  type PressableProps,
  type StyleProp,
  type TextStyle,
  type ViewStyle,
} from 'react-native';

type ButtonProps = Omit<PressableProps, 'style' | 'children'> & {
  title: string;
  variant?: 'primary' | 'secondary';
  leftIcon?: ReactNode;
  style?: StyleProp<ViewStyle>;     // accepts objects, arrays, registered styles, false/null
  textStyle?: StyleProp<TextStyle>;
};

export function Button({ title, variant = 'primary', leftIcon, style, textStyle, ...rest }: ButtonProps) {
  return (
    <Pressable
      accessibilityRole="button"
      style={({ pressed }) => [styles.base, styles[variant], pressed && styles.pressed, style]}
      {...rest}
    >
      {leftIcon}
      <Text style={[styles.label, textStyle]}>{title}</Text>
    </Pressable>
  );
}

const styles = StyleSheet.create({
  base: { minHeight: 44, flexDirection: 'row', alignItems: 'center', paddingHorizontal: 16, borderRadius: 8 },
  primary: { backgroundColor: '#1f6feb' },
  secondary: { backgroundColor: '#e7ecf3' },
  pressed: { opacity: 0.7 },
  label: { fontWeight: '600' },
});
```

**Generic list component** — `T` is inferred from `data`, so `renderRow` receives a correctly typed item:

```tsx title="src/ui/DataList.tsx"
import type { ReactElement } from 'react';
import { FlatList, Text, type FlatListProps, type ListRenderItem } from 'react-native';

type DataListProps<T> = Omit<FlatListProps<T>, 'renderItem' | 'keyExtractor'> & {
  getKey: (item: T) => string;
  renderRow: (item: T, index: number) => ReactElement;
  emptyText?: string;
};

export function DataList<T>({ getKey, renderRow, emptyText = 'Nothing here yet', ...rest }: DataListProps<T>) {
  const renderItem: ListRenderItem<T> = ({ item, index }) => renderRow(item, index);
  return (
    <FlatList {...rest} keyExtractor={getKey} renderItem={renderItem} ListEmptyComponent={<Text>{emptyText}</Text>} />
  );
}

// <DataList data={orders} getKey={(o) => o.id} renderRow={(o) => <OrderRow order={o} />} />
//                                  ^ o: Order, inferred
```

**Refs and imperative handles**

```tsx title="src/ui/OtpInput.tsx"
import { useImperativeHandle, useRef, type Ref } from 'react';
import { TextInput } from 'react-native';

export type OtpInputHandle = { focus: () => void; clear: () => void };

export function OtpInput({ ref, length = 6 }: { ref?: Ref<OtpInputHandle>; length?: number }) {
  const inputRef = useRef<TextInput>(null);
  useImperativeHandle(ref, () => ({
    focus: () => inputRef.current?.focus(),
    clear: () => inputRef.current?.clear(),
  }), []);
  return (
    <TextInput
      ref={inputRef}
      maxLength={length}
      keyboardType="number-pad"
      textContentType="oneTimeCode"
      autoComplete="sms-otp"
    />
  );
}

// Parent: const otpRef = useRef<OtpInputHandle>(null); otpRef.current?.focus();
```

| Need | Type |
|---|---|
| Children | `ReactNode`, or `PropsWithChildren<Props>` |
| Style props | `StyleProp<ViewStyle>`, `StyleProp<TextStyle>`, `StyleProp<ImageStyle>` |
| Extend a component's props | `ComponentProps<typeof Pressable>`, `ViewProps`, `TextInputProps` |
| Ref to a host/class component | `useRef<TextInput>(null)`, `useRef<ScrollView>(null)`, `useRef<FlatList<T>>(null)` |
| Ref type of any component | `ComponentRef<typeof X>` (replaces the deprecated `ElementRef`) |
| Events | `GestureResponderEvent`, `LayoutChangeEvent`, `NativeSyntheticEvent<TextInputSubmitEditingEventData>` |
| List render function | `ListRenderItem<T>` |
| Variant-dependent props | Discriminated unions (`{ kind: 'link'; href: string } \| { kind: 'action'; onPress: () => void }`) |

Tips: prefer letting TypeScript infer component return types over annotating `React.FC` (which historically added implicit `children`); with React 19 types, `useRef` requires an initial argument and the global `JSX` namespace moved to `React.JSX`; use `satisfies` for theme objects to keep literal types while checking shape.

> [!INTERVIEW]
> Follow-ups: "Why `StyleProp<ViewStyle>` instead of `ViewStyle`?" (callers pass arrays and conditional falsy entries), "How do you write a generic component as an arrow function in a `.tsx` file?" (`const List = <T,>(props: ListProps<T>) => ...` — the trailing comma disambiguates from JSX).

## Error handling

### What do React Error Boundaries catch, what don't they catch, and where do you place them?

**Short answer:** An Error Boundary is a class component implementing `getDerivedStateFromError` (render a fallback) and `componentDidCatch` (report). It catches errors thrown **while rendering**, in lifecycle methods and in constructors of its **descendants**. It does **not** catch errors in event handlers, asynchronous code (`setTimeout`, promises, `await` in effects), errors in the boundary itself, native crashes, or anything outside the React tree. Place one at the app root plus smaller ones around screens and risky widgets so one broken component doesn't blank the whole app.

```tsx title="src/errors/ErrorBoundary.tsx"
import { Component, type ErrorInfo, type ReactNode } from 'react';

type FallbackArgs = { error: Error; reset: () => void };
type Props = {
  children: ReactNode;
  fallback: (args: FallbackArgs) => ReactNode;
  onError?: (error: Error, info: ErrorInfo) => void;
};
type State = { error: Error | null };

export class ErrorBoundary extends Component<Props, State> {
  state: State = { error: null };

  static getDerivedStateFromError(error: Error): State {
    return { error }; // render phase: must be pure
  }

  componentDidCatch(error: Error, info: ErrorInfo) {
    this.props.onError?.(error, info); // commit phase: report to Sentry / Crashlytics
  }

  reset = () => this.setState({ error: null });

  render() {
    const { error } = this.state;
    return error ? this.props.fallback({ error, reset: this.reset }) : this.props.children;
  }
}
```

```tsx
<ErrorBoundary
  onError={(error, info) => crashReporter.captureException(error, { extra: { componentStack: info.componentStack } })}
  fallback={({ reset }) => <ScreenError message="This screen failed to load." onRetry={reset} />}
>
  <OrdersScreen />
</ErrorBoundary>
```

| Error source | Caught by boundary? | How to handle |
|---|---|---|
| Throw during render / lifecycle | Yes | Boundary fallback |
| Event handler (`onPress`) | No | `try/catch`, show a toast, report |
| `async` code, promises, timers | No | `try/catch`; to show a fallback, rethrow into render (`showBoundary` from react-error-boundary) |
| TanStack Query error | Only with `throwOnError: true` | Pair with `QueryErrorResetBoundary` |
| Error in the boundary's own render | No | The next boundary up handles it |
| Native crash (Java/Kotlin/ObjC/Swift) | No | Native crash reporter |

Practical choices: use the `react-error-boundary` package (hooks-friendly `useErrorBoundary`, `resetKeys`) or Sentry's `ErrorBoundary`; reset boundaries when the route or query key changes; and make fallbacks actionable (retry, go home, contact support) rather than a blank "Something went wrong".

> [!INTERVIEW]
> Red flag: claiming boundaries catch promise rejections. Strong answers list the gaps and explain how each is covered: local `try/catch`, global handlers, native crash reporting.

### How do you handle global JS errors, unhandled promise rejections and crash reporting in React Native?

**Short answer:** Uncaught JS exceptions go to RN's global handler; you can wrap it with `ErrorUtils.setGlobalHandler((error, isFatal) => …)` to report before delegating to the default. Unhandled promise rejections only produce a **dev** warning — in release they disappear silently unless a crash reporter hooks Hermes' rejection tracker. Native crashes and ANRs need a native SDK. In practice, use Sentry (`@sentry/react-native`) or Firebase Crashlytics, which install all these hooks, and upload source maps and dSYMs so stack traces are readable.

```ts title="src/errors/installGlobalHandlers.ts"
export function installGlobalHandlers(report: (error: unknown, context: Record<string, unknown>) => void) {
  const defaultHandler = ErrorUtils.getGlobalHandler();

  ErrorUtils.setGlobalHandler((error, isFatal) => {
    report(error, { isFatal, source: 'global' });
    // Delegate: dev shows the red box; release crashes on fatal errors so the process
    // doesn't keep running with corrupted JS state.
    defaultHandler(error, isFatal);
  });
}
```

| Failure type | Where it surfaces | Captured by |
|---|---|---|
| Render error | Error Boundary | `componentDidCatch` → reporter |
| Uncaught JS exception (handler, timer) | `ErrorUtils` global handler | Reporter's global handler integration |
| Unhandled promise rejection | Hermes rejection tracker; dev LogBox warning | Reporter's rejection integration |
| Native crash (NPE, `EXC_BAD_ACCESS`) | Native signal/exception handlers | Native SDK (Sentry, Crashlytics) |
| ANR / app hang | OS watchdog | Sentry ANR/app hang detection, Play Console vitals |
| OOM kill | Process disappears | Inferred from missing session end; Xcode Organizer, Play vitals |

Essentials for readable reports:

- Upload **source maps** for every release (and every OTA update) and **dSYMs** for iOS native symbols, and tag events with `release` and `dist` so the right map is used.
- Record **breadcrumbs** (navigation, network, user actions) and set a user ID (not an email) for triage.
- Don't try to "keep the app alive" after a fatal JS error — show a restart screen at most; the JS heap may be inconsistent.
- Track crash-free sessions/users as a release gate.

> [!NOTE]
> Hermes exposes a promise-rejection tracker (`HermesInternal.enablePromiseRejectionTracker`) that React Native itself uses in development. Crash reporters hook it for you; wiring it yourself can replace RN's own dev warnings, so prefer the SDK integration.

Details on SDK setup, source-map upload in CI and alerting are in the [Monitoring, Crash Reporting & Analytics guide](../guides/monitoring.html).

> [!INTERVIEW]
> Likely follow-ups: "Why is my Sentry stack trace minified?" (source maps missing or wrong `release`/`dist`, especially after an OTA update), "How do you catch errors in native modules?" (native SDK plus proper promise rejection from the module).

## Testing basics

### How do you test components with Jest and React Native Testing Library, and how do you mock native modules?

**Short answer:** RNTL renders components in Jest (no device) and encourages testing **what the user sees and does**: query by role and accessible name first, interact with `userEvent`, assert on visible output. Native modules don't exist in Jest, so you mock them — ideally with the mocks libraries ship, or by mocking your own thin wrapper module rather than the native library directly. Network calls are best mocked at the HTTP layer with MSW.

```tsx title="src/auth/__tests__/SignUpScreen.test.tsx"
import { render, screen, userEvent } from '@testing-library/react-native';
import { SignUpScreen } from '../SignUpScreen';

jest.mock('../authApi'); // automock our own API module

test('shows a validation error for an invalid email', async () => {
  const user = userEvent.setup();
  render(<SignUpScreen />);

  await user.type(screen.getByLabelText('Email'), 'not-an-email');
  await user.press(screen.getByRole('button', { name: 'Create account' }));

  expect(await screen.findByText('Enter a valid email')).toBeOnTheScreen();
});
```

**Query priority** (most to least preferred):

| Query | Matches | Why |
|---|---|---|
| `getByRole('button', { name })` | Accessibility role + label | Mirrors assistive tech; enforces accessible UI |
| `getByLabelText` | `accessibilityLabel` / `aria-label` | Inputs and icon buttons |
| `getByPlaceholderText` | `placeholder` | Inputs without labels |
| `getByText` | Visible text | Non-interactive content |
| `getByDisplayValue` | Current `TextInput` value | Filled forms |
| `getByTestId` | `testID` | Last resort when nothing user-visible identifies it |

`getBy*` throws if missing, `queryBy*` returns `null` (for asserting absence), `findBy*` waits (for async UI).

```ts title="jest.setup.ts"
import mockAsyncStorage from '@react-native-async-storage/async-storage/jest/async-storage-mock';
import mockRNCNetInfo from '@react-native-community/netinfo/jest/netinfo-mock';
import 'react-native-gesture-handler/jestSetup';

jest.mock('@react-native-async-storage/async-storage', () => mockAsyncStorage);
jest.mock('@react-native-community/netinfo', () => mockRNCNetInfo);
// Reanimated ships its own Jest setup helper; follow its testing docs.

// Mock our wrapper around MMKV instead of the native library itself
jest.mock('./src/storage/kv', () => {
  const store = new Map<string, unknown>();
  return {
    kv: {
      set: jest.fn((key: string, value: unknown) => store.set(key, value)),
      getBoolean: jest.fn((key: string) => store.get(key) as boolean | undefined),
      getString: jest.fn((key: string) => store.get(key) as string | undefined),
      remove: jest.fn((key: string) => store.delete(key)),
    },
  };
});
```

Setup notes: use the `react-native` Jest preset (or `jest-expo` for Expo projects); add untranspiled packages to `transformIgnorePatterns`; wrap components that need providers (QueryClient with `retry: false`, NavigationContainer, SafeAreaProvider) in a custom `renderWithProviders`; use fake timers for debounce logic. Jest tests exercise JS only — native integration belongs to E2E (Maestro, Detox). The full pyramid is in the [Testing Strategy guide](../guides/testing.html).

> [!INTERVIEW]
> Red flags: tests that query by `testID` everywhere, assert on internal state, or call component methods directly. Strong answers mention user-event, role queries doubling as accessibility checks, MSW, and a thin wrapper around native modules to keep mocks small.

### What are the trade-offs of snapshot testing in React Native?

**Short answer:** Snapshots serialize the rendered tree and fail when it changes. They are cheap to write and catch unintended changes in small, stable, presentational components, but large snapshots become noise: every intentional change updates them, reviewers rubber-stamp `-u`, and they assert on implementation details (style objects, wrapper views) rather than behavior. Use them sparingly and small; prefer explicit assertions.

| Snapshots are good for | Snapshots are bad for |
|---|---|
| Small design-system primitives (a `Badge` in each variant) | Whole screens |
| Serializable outputs (a formatter, a reducer's result, generated config) | Components with dates, random IDs or animated values |
| Detecting accidental prop or style regressions in stable code | Asserting behavior ("tapping submit shows an error") |
| Inline snapshots of short values (`toMatchInlineSnapshot`) | Anything reviewers won't actually read |

```tsx
// Focused, reviewable snapshot of a small component variant
test('Badge renders the warning variant', () => {
  render(<Badge variant="warning" label="Low stock" />);
  expect(screen.getByText('Low stock')).toHaveStyle({ color: '#9a6700' });
  expect(screen.toJSON()).toMatchSnapshot();
});

// Better for behavior: explicit expectations
test('Badge is announced with its label', () => {
  render(<Badge variant="warning" label="Low stock" />);
  expect(screen.getByLabelText('Warning: Low stock')).toBeOnTheScreen();
});
```

Rules of thumb: keep snapshots under a screenful, review snapshot diffs like code, stabilize non-determinism (mock dates, fixed IDs), and for visual regressions use real screenshot testing on devices or simulators (for example with Maestro or a dedicated visual-diff service) instead of JSON trees — a JSON snapshot can't tell you that a view is clipped or off-screen.

> [!INTERVIEW]
> A senior answer isn't "never" or "always": it names the maintenance cost, the rubber-stamp problem, and where snapshots genuinely pay off.

## Configuration and platform

### How do you manage environment configs and build variants, and are those env values secret?

**Short answer:** Use build-time configuration per environment (dev, staging, prod): `react-native-config` reads `.env` files and exposes values to JS and native code in bare apps; Expo inlines `EXPO_PUBLIC_*` variables into the JS bundle and uses a dynamic `app.config.ts` for per-variant bundle IDs and names. Pair them with real **build variants** — Android `productFlavors`, iOS schemes and build configurations, or EAS build profiles — so dev, staging and prod install side by side. None of these values are secret: anything in the bundle or binary can be extracted.

```ts title="app.config.ts"
import type { ExpoConfig } from 'expo/config';

const variant = (process.env.APP_VARIANT ?? 'production') as 'development' | 'staging' | 'production';
const suffix = variant === 'production' ? '' : `.${variant}`;

const config: ExpoConfig = {
  name: variant === 'production' ? 'Acme' : `Acme (${variant})`,
  slug: 'acme',
  scheme: `acme${variant === 'production' ? '' : `-${variant}`}`,
  ios: { bundleIdentifier: `com.acme.app${suffix}` },
  android: { package: `com.acme.app${suffix}` },
  extra: { variant },
};

export default config;
```

```json title="eas.json"
{
  "build": {
    "development": { "developmentClient": true, "distribution": "internal", "env": { "APP_VARIANT": "development" } },
    "staging": { "distribution": "internal", "channel": "staging", "env": { "APP_VARIANT": "staging" } },
    "production": { "channel": "production", "env": { "APP_VARIANT": "production" } }
  }
}
```

```ts
// Expo: inlined at build time. Must be accessed exactly like this (no destructuring, no dynamic keys).
const apiUrl = process.env.EXPO_PUBLIC_API_URL;

// Bare with react-native-config (ENVFILE=.env.staging picks the file at build time):
// import Config from 'react-native-config';
// const apiUrl = Config.API_URL;
```

```gradle title="android/app/build.gradle"
android {
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        prod {
            dimension "env"
        }
    }
}
```

On iOS, create build configurations (e.g. `Debug-Staging`, `Release-Staging`) with their own `.xcconfig`, bundle ID and `GoogleService-Info.plist`, and a scheme per environment.

| Mechanism | Scope | Visible in shipped app? |
|---|---|---|
| `EXPO_PUBLIC_*` | Inlined into the JS bundle | **Yes** |
| `react-native-config` | JS plus native build files | **Yes** (strings in the binary) |
| `app.config.ts` `extra` | Embedded in the app manifest, read via `expo-constants` | **Yes** |
| EAS env vars with secret visibility, CI secrets | Build machine only (signing keys, Sentry auth token) | No, unless you inline them |

> [!CAUTION]
> Never ship private API keys, database credentials or third-party secret keys in env files. Public identifiers (a Stripe **publishable** key, a Maps key restricted by bundle ID/SHA-1, a Sentry DSN) are fine. Anything truly secret stays on your server, which the app calls with the user's session.

> [!INTERVIEW]
> Red flag: "we keep the secret in `.env`, so it's not in Git and therefore safe". Follow-ups: separate Firebase projects per environment, OTA channels per variant (see [OTA Updates](../guides/ota-updates.html)), and signing per flavor (see [Deployment, Signing & CI/CD](../guides/deployment.html)).

### What does Hermes give you over JavaScriptCore?

**Short answer:** Hermes is a JS engine built for React Native: the build step compiles JavaScript to **bytecode ahead of time**, so the app doesn't parse and compile JS at startup — faster time-to-interactive, lower memory use, and a smaller Android app than bundling JSC. It has a concurrent garbage collector designed for mobile, first-class debugging via React Native DevTools, and a sampling profiler. It's been the default since RN 0.70; JSC now lives in a community package.

| | Hermes | JavaScriptCore (community package) |
|---|---|---|
| Startup | Precompiled bytecode — no parse/compile at launch | Parses and compiles JS at runtime |
| Memory | Lower; GC tuned for mobile | Higher |
| JIT | No (bytecode interpreter; predictable startup) | Yes on some platforms |
| Debugging | React Native DevTools (CDP) | Limited in modern RN |
| Status | Default; the path forward (Hermes V1 work continues) | Community-maintained |

Practical notes:

- Check the engine at runtime with `typeof HermesInternal !== 'undefined'`.
- Language and API support is broad but not identical to V8: verify newer APIs, and `Intl` coverage for your locales, before relying on them.
- Profile with the Hermes sampling profiler through React Native DevTools, in a release-like build.
- Because there's no JIT, CPU-heavy JS (crypto, image processing, big JSON transforms) is better moved to native code (Nitro/TurboModules) or a worklet runtime.
- Next-generation "Hermes V1" work (from the Static Hermes effort) has been shipping experimentally in recent RN releases — treat it as opt-in until the RN release notes say otherwise.

> [!INTERVIEW]
> Follow-ups: "Why is bytecode faster at startup?" (no parse/compile on the critical path; bytecode can be memory-mapped), "Why might a library behave differently on Hermes?" (engine differences in less common APIs).

### How does AppState work across iOS and Android, and what do you use it for?

**Short answer:** `AppState` reports `active` (foreground, interactive), `background` (not visible) and — on **iOS only** — `inactive`, a transitional state during the app switcher, Control Center, an incoming call or permission dialogs. Subscribe with `AppState.addEventListener('change', …)` and remove the subscription on cleanup. Use it to refresh data on foreground, pause timers and sockets in background, lock sensitive screens after a timeout, and blur content in the app switcher.

```mermaid
stateDiagram-v2
    [*] --> active : launched in foreground
    active --> inactive : iOS - app switcher, Control Center, call
    inactive --> active : user returns
    inactive --> background : user leaves the app
    active --> background : Android - home or switch app
    background --> active : user reopens app
    background --> [*] : OS kills the process (no event)
```
*Figure: AppState transitions — inactive exists only on iOS, and process death sends no event.*

```tsx title="src/security/usePrivacyLock.ts"
import { useEffect, useRef, useState } from 'react';
import { AppState } from 'react-native';

const LOCK_AFTER_MS = 5 * 60_000;

export function usePrivacyLock() {
  const [obscured, setObscured] = useState(false);   // cover UI in the app switcher
  const [locked, setLocked] = useState(false);       // require biometrics again
  const backgroundedAt = useRef<number | null>(null);

  useEffect(() => {
    const sub = AppState.addEventListener('change', (next) => {
      if (next === 'inactive' || next === 'background') {
        setObscured(true);
        if (next === 'background') backgroundedAt.current = Date.now();
      } else if (next === 'active') {
        setObscured(false);
        if (backgroundedAt.current && Date.now() - backgroundedAt.current > LOCK_AFTER_MS) setLocked(true);
        backgroundedAt.current = null;
      }
    });
    return () => sub.remove();
  }, []);

  return { obscured, locked, unlock: () => setLocked(false) };
}
```

| | iOS | Android |
|---|---|---|
| `inactive` | Yes (transitions, overlays) | Never |
| App switcher snapshot | Taken while inactive — cover sensitive UI | Use `FLAG_SECURE` natively to block screenshots/recents preview |
| Background execution | Suspended within seconds | Can run a bit longer; restricted by Doze/background limits |
| Extra events | `memoryWarning` | `focus` / `blur` (Android-only AppState events) |

Pitfalls: `AppState.currentState` can be `unknown` very early at launch; there's no event when the OS kills a backgrounded process, so persist anything important *when going to background*, not on "exit"; and `active` fires after returning from system dialogs such as the permission prompt on iOS — don't treat every `active` as "the user reopened the app". Real background work belongs to the [Background Tasks guide](../guides/background-tasks.html).

### How do you implement internationalization and right-to-left layouts in React Native?

**Short answer:** Use an i18n library (commonly `i18next` + `react-i18next`) with JSON resources per language, detect the device locale with `expo-localization` or `react-native-localize`, and format numbers, dates and currencies with `Intl`. For RTL languages (Arabic, Hebrew, Persian, Urdu), use `I18nManager` — `allowRTL`/`forceRTL` — and **restart** the app for the direction change to apply; write styles with logical `start`/`end` properties so layouts flip automatically.

```ts title="src/i18n/index.ts"
import i18n from 'i18next';
import { initReactI18next } from 'react-i18next';
import { getLocales } from 'expo-localization';
import en from './locales/en.json';
import ar from './locales/ar.json';

i18n.use(initReactI18next).init({
  resources: { en: { translation: en }, ar: { translation: ar } },
  lng: kv.getString('lang') ?? getLocales()[0]?.languageCode ?? 'en',
  fallbackLng: 'en',
  interpolation: { escapeValue: false }, // React already escapes
});

export default i18n;
```

```ts title="src/i18n/applyLanguage.ts"
import { I18nManager } from 'react-native';
import * as Updates from 'expo-updates';

export async function applyLanguage(lang: string) {
  kv.set('lang', lang);
  await i18n.changeLanguage(lang);
  const shouldBeRTL = i18n.dir(lang) === 'rtl';
  if (I18nManager.isRTL !== shouldBeRTL) {
    I18nManager.allowRTL(shouldBeRTL);
    I18nManager.forceRTL(shouldBeRTL);
    await Updates.reloadAsync(); // direction is applied at startup; bare apps use a restart library
  }
}
```

```tsx
// Pluralization and interpolation live in the resource files:
// "cart_items_one": "{{count}} item", "cart_items_other": "{{count}} items"
const { t } = useTranslation();
<Text>{t('cart_items', { count })}</Text>;
<Text>{new Intl.NumberFormat(i18n.language, { style: 'currency', currency: 'EUR' }).format(total)}</Text>;
```

**RTL checklist**

| Do | Avoid |
|---|---|
| `marginStart`, `paddingEnd`, `start`, `end`, `borderStartWidth` | `marginLeft`, `left`, `paddingRight` (whether they flip depends on `I18nManager.swapLeftAndRightInRTL`) |
| `flexDirection: 'row'` (auto-flips in RTL) | Hard-coded `row-reverse` to "fix" RTL |
| Mirror directional icons (`transform: [{ scaleX: I18nManager.isRTL ? -1 : 1 }]`) | Mirroring logos, media controls or clocks |
| Test with a pseudo-RTL or real RTL language on both platforms | Only testing in English |

Also: Android needs `android:supportsRtl="true"` in `AndroidManifest.xml` (present in RN templates); Expo projects enable RTL support through app config (see the `expo-localization` docs); i18next pluralization relies on `Intl.PluralRules`, so confirm your engine version provides it or add a polyfill; and long German or Finnish strings will break fixed-width buttons — design for about 30% text expansion.

> [!INTERVIEW]
> Follow-ups: "Why does changing to Arabic need a restart?" (layout direction is read when the root view is created), "How do you handle server-provided content?" (API returns localized strings via an `Accept-Language` header; format dates on the client with `Intl`).

### How do you make a React Native app accessible, and how do you test it?

**Short answer:** Give every interactive element a **role**, an **accessible name** (label) and its **state**, group related content so screen readers announce it as one item, hide decorative elements, respect **font scaling** and reduced motion, keep touch targets at least 44×44 pt (iOS) / 48×48 dp (Android), and test with **VoiceOver** and **TalkBack** on real devices — plus automated checks via RNTL role queries and platform scanners.

```tsx title="src/settings/ToggleRow.tsx"
import { Pressable, Switch, Text, View } from 'react-native';

type Props = { label: string; description?: string; value: boolean; disabled?: boolean; onChange: (v: boolean) => void };

export function ToggleRow({ label, description, value, disabled, onChange }: Props) {
  return (
    <Pressable
      accessibilityRole="switch"
      accessibilityLabel={label}
      accessibilityHint={description}
      accessibilityState={{ checked: value, disabled }}
      onPress={() => onChange(!value)}
      disabled={disabled}
      hitSlop={8}
      style={{ minHeight: 48, flexDirection: 'row', alignItems: 'center' }}
    >
      <View style={{ flex: 1 }}>
        <Text maxFontSizeMultiplier={2}>{label}</Text>
        {description ? <Text maxFontSizeMultiplier={2}>{description}</Text> : null}
      </View>
      {/* The row is the accessible element; hide the inner Switch from screen readers */}
      <Switch value={value} onValueChange={onChange} disabled={disabled} accessibilityElementsHidden importantForAccessibility="no-hide-descendants" />
    </Pressable>
  );
}
```

| Concern | API |
|---|---|
| What it is | `accessibilityRole` / `role` (`button`, `link`, `header`, `switch`, `checkbox`, `image`, `adjustable`, ...) |
| What it's called | `accessibilityLabel` / `aria-label`; `accessibilityHint` for the result of the action |
| Current state | `accessibilityState` (`disabled`, `selected`, `checked`, `busy`, `expanded`) or `aria-*` equivalents |
| Values (sliders, progress) | `accessibilityValue={{ min, max, now }}` or `{ text }` |
| Custom actions | `accessibilityActions` + `onAccessibilityAction` (e.g. swipe-to-delete alternatives) |
| Grouping | `accessible` on a parent `View` (Pressables are accessible by default) |
| Hiding decorative content | `accessibilityElementsHidden` (iOS), `importantForAccessibility="no-hide-descendants"` (Android), or `aria-hidden` |
| Dynamic announcements | `AccessibilityInfo.announceForAccessibility`, `accessibilityLiveRegion` (Android) |
| Modals | `accessibilityViewIsModal` (iOS) so focus stays inside |
| Preferences | `AccessibilityInfo.isScreenReaderEnabled()`, `isReduceMotionEnabled()`, Reanimated `useReducedMotion()` |

**Dynamic type / font scaling:** `Text` scales with the OS font size by default (`allowFontScaling` is `true`). Don't disable it globally; cap extreme sizes where layout truly can't cope with `maxFontSizeMultiplier`, read `useWindowDimensions().fontScale` to switch layouts (e.g. stack horizontally arranged items vertically), and avoid fixed heights on text containers.

**Testing:** turn on VoiceOver (iOS) and TalkBack (Android) and complete core flows eyes-free; use Xcode's Accessibility Inspector and Google's Accessibility Scanner; check contrast (WCAG AA 4.5:1 for body text); and in unit tests query with `getByRole('button', { name: 'Save' })` — if the query fails, a screen-reader user can't find it either.

> [!INTERVIEW]
> What a senior answer includes: role + name + state as the core triad, grouping and focus order, font scaling rather than disabling it, reduced motion, platform differences (live regions, modal focus), and a testing routine with real screen readers. Red flag: `allowFontScaling={false}` everywhere "because it breaks the design".
