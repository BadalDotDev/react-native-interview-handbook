#### Integration decisions

| Decision | Recommendation |
|---|---|
| Number of hosts | One per app. Each host is a full JS runtime (memory, startup); surfaces are cheap by comparison |
| When to start the runtime | Pre-warm at app launch or when the user approaches an RN entry point, to hide bundle load and JS init latency; weigh the memory cost |
| Repo layout | Native repo with a `react-native/` package, or a separate JS repo consumed as prebuilt artifacts |
| Native team toolchain | If native developers shouldn't need Node and Metro, ship the RN part as an AAR / XCFramework (community brownfield tooling and Expo's brownfield support target this) |
| Release bundle | Build the JS bundle in CI and embed it; decide early whether OTA updates are allowed for the RN part |

> [!INTERVIEW]
> What a senior answer includes: one host with many surfaces, pre-warming trade-offs, how props flow in, packaging for native teams, and ownership of navigation (next question). Likely follow-ups: "What happens to memory when RN screens are closed?" (the runtime stays alive; only the surface's React tree unmounts).

### How do you handle communication and navigation between native screens and multiple React Native surfaces?

**Short answer:** Pass inputs as initial props, expose a small, typed host TurboModule for JS-to-native calls (navigate, close a flow, fetch the session), and use typed events for native-to-JS notifications. Decide explicitly who owns navigation: either native owns the stack and each RN screen is its own surface, or RN owns an entire flow inside one surface and reports a result back. Keep one source of truth for cross-cutting state such as auth, and remember that all surfaces share one JS runtime and therefore one set of JS singletons.

```ts title="specs/NativeHostBridge.ts"
import type {CodegenTypes, TurboModule} from 'react-native';
import {TurboModuleRegistry} from 'react-native';

export type HostEvent = {type: string; payloadJson: string};

export interface Spec extends TurboModule {
  // Native owns the session; JS reads it from native memory (sync, cheap).
  getAccessToken(): string | null;
  // Ask the native router to open a native screen.
  openNativeRoute(route: string, paramsJson: string): void;
  // Finish an RN-owned flow and hand a result back to the native caller.
  finishFlow(resultJson: string): void;
  readonly onHostEvent: CodegenTypes.EventEmitter<HostEvent>;
}

export default TurboModuleRegistry.getEnforcing<Spec>('NativeHostBridge');
```

#### Navigation ownership models

| Model | How it works | Good for | Watch out for |
|---|---|---|---|
| Native owns the stack | Each RN screen is a separate surface pushed by the native navigator | Incremental adoption, a few RN screens | Each surface is its own React root; shared state must live in stores or native; header and back-gesture consistency |
| RN owns a flow | Native presents one surface containing a React Navigation stack; `finishFlow` returns the result | Self-contained features (checkout, onboarding) | Deep links into the middle of the flow; Android back at the flow root must close the native container |
| Mixed nested stacks | RN stacks inside several surfaces, native stacks around them | Rarely a good idea | Duplicate headers, broken back behaviour, deep-link routing split across two routers |

#### Practical rules

- **One router for deep links.** Let native parse incoming links and either open a native screen or pass the route to the RN surface as a prop or event.
- **One owner for auth.** If both sides refresh tokens independently, you get refresh races and random logouts. Usually native owns tokens and JS asks through the host module.
- **Shared JS state across surfaces** is a feature (a warm query cache) and a trap (a store assumed to be per screen). Key per-surface state by a surface ID passed in initial props.
- **Back handling:** on Android, JS `BackHandler` sees the press first; when it returns `false`, the activity or fragment handles it. Check your RN version's support for Android predictive back before targeting the newest API levels.
- **iOS gestures:** the native swipe-back gesture and RN gesture handlers can conflict; decide which side owns horizontal gestures on each screen.
- **Updating props after mount:** prefer events over re-creating surfaces; re-creating a surface discards its React state.

> [!INTERVIEW]
> Likely follow-ups: "How do you return a result from an RN flow to the native screen that opened it?" (the host module's `finishFlow` resolves a native callback or delegate), "How do you share an API cache between native and RN?" (native-owned storage such as MMKV or SQLite accessed from both sides, or keep network logic on one side only).

## Advanced patterns

### What is Headless JS, and when would you use it?

**Short answer:** Headless JS is an Android-only mechanism to run a JS task without UI: a `HeadlessJsTaskService` starts the React host if needed and invokes a task registered with `AppRegistry.registerHeadlessTask`. It's used for work triggered by native events while the app is backgrounded or killed, for example handling a data-only FCM message or syncing after connectivity changes. Modern Android background limits mean you usually trigger it from contexts that are allowed to start work (a high-priority FCM message, WorkManager, a foreground service); iOS has no equivalent and relies on background modes, silent pushes and `BGTaskScheduler` instead.

```ts title="index.js (excerpt)"
import {AppRegistry} from 'react-native';

AppRegistry.registerHeadlessTask('SyncTask', () => require('./src/background/syncTask').default);
```

```ts title="src/background/syncTask.ts"
type SyncTaskData = {reason?: string};

export default async function syncTask(data: SyncTaskData): Promise<void> {
  // No UI, no navigation, no React tree: plain async JS with a hard timeout.
  await flushPendingUploads({reason: data.reason ?? 'unknown'});
}
```

```kotlin title="android/app/src/main/java/com/acme/app/SyncTaskService.kt"
package com.acme.app

import android.content.Intent
import com.facebook.react.HeadlessJsTaskService
import com.facebook.react.bridge.Arguments
import com.facebook.react.jstasks.HeadlessJsTaskConfig

class SyncTaskService : HeadlessJsTaskService() {
  override fun getTaskConfig(intent: Intent?): HeadlessJsTaskConfig? {
    val extras = intent?.extras ?: return null
    return HeadlessJsTaskConfig(
      "SyncTask",                 // name registered in JS
      Arguments.fromBundle(extras),
      30_000,                     // timeout in ms
      false,                      // don't run while the app is in the foreground
    )
  }
}
```

```xml title="android/app/src/main/AndroidManifest.xml (excerpt)"
<service android:name=".SyncTaskService" android:exported="false" />
```

#### Constraints to state in an interview

- Since Android 8, apps in the background can't freely call `startService`; starting the service from a disallowed state throws. Use a trigger that grants a temporary allowance, a foreground service (with the matching foreground service type on Android 14+), or a library built on WorkManager.
- The task must finish before its timeout and should be idempotent: the OS may kill the process at any time.
- Starting the React host cold in the background costs CPU and memory; keep headless tasks small and avoid importing the whole app graph (inline requires help).
- Libraries such as `@react-native-firebase/messaging` use Headless JS for Android background message handlers, which is why the handler must be registered in `index.js`, outside any component.

See the [Background Tasks guide](../guides/background-tasks.html) for WorkManager, `BGTaskScheduler` and library choices.

> [!INTERVIEW]
> Red flag: proposing Headless JS for iOS, or for long-running work such as continuous location tracking. Good signal: mentioning timeouts, idempotency and Android's background-start restrictions.

### What options do you have for running JavaScript off the main JS thread?

**Short answer:** A JS runtime is single-threaded, so "multi-threading" in RN means extra runtimes or native threads. The options: the Reanimated UI runtime (for animation and gesture logic only), custom background worklet runtimes from `react-native-worklets` for CPU-bound pure JS, VisionCamera frame processors for per-frame camera work, and native threads behind a TurboModule, Nitro or C++ module for heavy or I/O-bound work. Each option copies data between runtimes and has restricted APIs, so choose based on data size and what the code needs access to.

| Option | Runs on | Good for | Limits |
|---|---|---|---|
| Reanimated UI runtime | UI thread | Gestures, animations, scroll-driven UI | Any heavy work drops frames app-wide |
| Custom worklet runtime (`react-native-worklets`) | Its own thread | CPU-bound pure JS (parsing, filtering, crypto in JS) | Only worklets and serializable data; many app modules and globals unavailable; data is copied |
| VisionCamera frame processors | Camera thread | Per-frame ML, barcode, image analysis | Must keep up with the frame rate |
| Native threads (TurboModule, Nitro, C++) | Any native thread or pool | Heavy compute, I/O, large binary data | Native code to write and maintain |
| Hidden WebView "worker" or legacy thread libraries | Separate engine or context | Nothing new | Unmaintained, slow message passing; avoid |

```ts title="src/workers/csvWorker.ts"
import {createWorkletRuntime, scheduleOnRN, scheduleOnRuntime} from 'react-native-worklets';

type Row = {id: string; amount: number};

// Created once. (Reanimated 3 exported createWorkletRuntime from
// 'react-native-reanimated' and took the name as a string.)
const background = createWorkletRuntime({name: 'csv-background'});

function parseCsv(input: string): Row[] {
  'worklet';
  const rows: Row[] = [];
  const lines = input.split('\n');
  for (let i = 1; i < lines.length; i++) {
    const [id, amount] = lines[i].split(',');
    if (id) rows.push({id, amount: Number(amount)});
  }
  return rows;
}

export function parseCsvOffThread(input: string, onDone: (rows: Row[]) => void) {
  scheduleOnRuntime(
    background,
    (csv: string) => {
      'worklet';
      const rows = parseCsv(csv); // runs on the background runtime
      scheduleOnRN(onDone, rows); // copy the result back to the RN runtime
    },
    input,
  );
}
```

**Trade-offs**

- The input string and the resulting rows are copied between runtimes. For multi-megabyte data, native parsing that streams from disk is often faster end to end.
- Worklet runtimes don't have your app's module graph by default (no React, no arbitrary imports), and available globals are limited; the worklets team has been experimenting with modes that make more of the bundle available, so check current docs.
- Don't forget cancellation: long jobs need a way to stop (a shared flag the worklet checks between chunks).

> [!INTERVIEW]
> Likely follow-ups: "Why not just run it on the Reanimated UI runtime?" (it's the UI thread), "How would you share a large buffer without copying?" (native memory exposed through JSI `ArrayBuffer`s, as VisionCamera and Skia do).

### How do you bridge a WebView and React Native securely?

**Short answer:** Web to native goes through `window.ReactNativeWebView.postMessage(string)` and the `onMessage` prop; native to web goes through `injectJavaScript` (or `injectedJavaScript` / `injectedJavaScriptBeforeContentLoaded` at load time). Treat every message as untrusted input: restrict which origins can load (`originWhitelist`, `onShouldStartLoadWithRequest`), check the sender URL, validate message shapes with a schema, expose a minimal allowlisted set of actions, never inject secrets into pages you don't control, and disable file access and multiple windows unless needed.

```tsx title="src/features/checkout/CheckoutWebView.tsx"
import {useCallback, useRef} from 'react';
import {WebView, type WebViewMessageEvent} from 'react-native-webview';
import {z} from 'zod';

const TRUSTED_ORIGIN = 'https://pay.acme.com';
const isTrusted = (url: string) => url === TRUSTED_ORIGIN || url.startsWith(`${TRUSTED_ORIGIN}/`);

const WebMessage = z.discriminatedUnion('type', [
  z.object({type: z.literal('ready')}),
  z.object({type: z.literal('paymentResult'), orderId: z.string(), status: z.enum(['succeeded', 'failed'])}),
  z.object({type: z.literal('resize'), height: z.number().min(0).max(5000)}),
]);
type WebMessage = z.infer<typeof WebMessage>;

// Runs before page scripts: define a tiny, versioned API surface for the page.
const BOOTSTRAP = `
  window.acmeHost = {
    version: 1,
    send: function (msg) { window.ReactNativeWebView.postMessage(JSON.stringify(msg)); }
  };
  true;
`;

type Props = {orderId: string; onResult: (status: 'succeeded' | 'failed') => void};

export function CheckoutWebView({orderId, onResult}: Props) {
  const ref = useRef<WebView>(null);

  const sendToWeb = useCallback((payload: object) => {
    // Double JSON.stringify produces a safely escaped JS string literal.
    const literal = JSON.stringify(JSON.stringify(payload));
    ref.current?.injectJavaScript(
      `window.dispatchEvent(new MessageEvent('message', {data: ${literal}})); true;`,
    );
  }, []);

  const onMessage = useCallback(
    (event: WebViewMessageEvent) => {
      if (!isTrusted(event.nativeEvent.url)) return; // wrong page: ignore
      let raw: unknown;
      try {
        raw = JSON.parse(event.nativeEvent.data);
      } catch {
        return;
      }
      const parsed = WebMessage.safeParse(raw);
      if (!parsed.success) return;
      const msg: WebMessage = parsed.data;

      switch (msg.type) {
        case 'ready':
          sendToWeb({type: 'init', orderId}); // no tokens: the page authenticates itself
          break;
        case 'paymentResult':
          if (msg.orderId === orderId) onResult(msg.status); // then verify server-side
          break;
        case 'resize':
          break;
      }
    },
    [orderId, onResult, sendToWeb],
  );

  return (
    <WebView
      ref={ref}
      source={{uri: `${TRUSTED_ORIGIN}/checkout?order=${encodeURIComponent(orderId)}`}}
      originWhitelist={[TRUSTED_ORIGIN]}
      onShouldStartLoadWithRequest={req => isTrusted(req.url)}
      injectedJavaScriptBeforeContentLoaded={BOOTSTRAP}
      onMessage={onMessage}
      allowFileAccess={false}
      setSupportMultipleWindows={false}
      javaScriptCanOpenWindowsAutomatically={false}
      mixedContentMode="never"
    />
  );
}
```

#### Security checklist

- **Origin checks:** `url.startsWith(origin + '/')`, not `includes(domain)`, which `https://pay.acme.com.evil.io` would pass. RN's built-in `URL` implementation is incomplete; add a URL polyfill if you parse URLs.
- **Navigation control:** `onShouldStartLoadWithRequest` stops redirects to untrusted sites that would inherit your message handler.
- **Iframes:** third-party iframes inside a trusted page may be able to post messages depending on platform and injection settings; don't rely on `postMessage` alone for authorization.
- **No privileged bridge:** never expose "run arbitrary native action" or "read the auth token" to web content. Map each allowed message to one narrow action.
- **Results are hints:** a payment "succeeded" message from a WebView must be confirmed by your backend before fulfilling anything.
- **Keep the library updated:** WebView engines get security fixes; on Android the system WebView updates through Play, but `react-native-webview` itself also ships fixes.

> [!INTERVIEW]
> Red flags: injecting the user's access token into a third-party page, or trusting `onMessage` data without validation. Likely follow-ups: "How would you implement request/response RPC over postMessage?" (message IDs plus a pending-promise map with timeouts on both sides).

### What can an attacker extract from your app's JS bundle, and how do you mitigate it?

**Short answer:** Everything in it. The bundle ships inside the APK/AAB and IPA as a file (`assets/index.android.bundle`, `main.jsbundle`); with Hermes it's bytecode, which open-source tools disassemble and decompile into readable pseudo-JS, and string literals (API hosts, keys, feature flags) are visible immediately. On iOS, App Store encryption covers the executable, not bundle resources. Treat the bundle as public: no secrets in JS, enforce authorization on the server, use short-lived tokens, and add integrity signals (Play Integrity, App Attest) and code signing for OTA updates. Obfuscation only raises the cost.

```bash
# Anyone can do this with a release APK
unzip -o app-release.apk assets/index.android.bundle -d extracted/
strings extracted/assets/index.android.bundle | grep -Ei 'api|key|secret|https://' | head
```

| Threat | Mitigation |
|---|---|
| Hardcoded API keys or secrets | Keep secrets server-side; proxy third-party APIs; restrict public keys by bundle ID / package and SHA-256 where the provider supports it |
| Reading business logic | Accept it; keep sensitive rules (pricing, entitlement checks, fraud logic) on the server |
| Modified or repackaged app calling your API | Play Integrity API and App Attest / DeviceCheck verified server-side; rate limiting and anomaly detection |
| Tampered OTA update | Code signing for updates (EAS Update code signing, signed self-hosted CodePush), HTTPS only |
| Traffic interception | TLS everywhere; certificate pinning for high-risk apps, with a rotation plan |
| Reverse engineering effort | JS obfuscation (Metro transformer or post-processing) and R8 for native code: raises the bar, costs performance and debuggability |

**Pitfalls**

- "It's compiled to Hermes bytecode, so it's safe": false. Bytecode is not obfuscation.
- `react-native-config` / `.env` values are compiled into the app; they are configuration, not secrets.
- Root and jailbreak detection is bypassable; use it as a risk signal, not a gate.

See the [Security guide](../guides/security.html) for storage, pinning and attestation details.

> [!INTERVIEW]
> What a senior answer includes: a demonstration that the bundle is extractable, server-side enforcement as the real control, attestation as a risk signal, and OTA signing. Red flag: "we hid the key in native code" (native binaries are reversible too).

### How do you design error handling and error boundaries for a large React Native app?

**Short answer:** Layer them. A root boundary shows a recovery screen with a restart action; each screen or navigator gets a boundary that resets when the route changes, so one broken screen doesn't kill the app; non-critical widgets (a recommendations carousel, an ad slot) get small boundaries that render nothing or a compact fallback. Boundaries only catch render and lifecycle errors, so add global handlers for fatal JS errors and unhandled promise rejections, and report everything with context (route, release, user segment) to your crash reporter.

```tsx title="src/errors/ScreenBoundary.tsx"
import type {ReactNode} from 'react';
import {Button, Text, View} from 'react-native';
import {ErrorBoundary, type FallbackProps} from 'react-error-boundary';
import {useRoute} from '@react-navigation/native';
import * as Sentry from '@sentry/react-native';

function ScreenFallback({resetErrorBoundary}: FallbackProps) {
  return (
    <View style={{flex: 1, alignItems: 'center', justifyContent: 'center', padding: 24}}>
      <Text accessibilityRole="header">Something went wrong on this screen.</Text>
      <Button title="Try again" onPress={resetErrorBoundary} />
    </View>
  );
}

export function ScreenBoundary({children}: {children: ReactNode}) {
  const route = useRoute();
  return (
    <ErrorBoundary
      FallbackComponent={ScreenFallback}
      resetKeys={[route.key]}
      onError={(error, info) =>
        Sentry.captureException(error, {
          tags: {boundary: 'screen', route: route.name},
          extra: {componentStack: info.componentStack},
        })
      }
    >
      {children}
    </ErrorBoundary>
  );
}
```

```ts title="src/errors/installGlobalHandlers.ts"
export function installGlobalHandlers(report: (e: unknown, ctx: object) => void) {
  const previous = ErrorUtils.getGlobalHandler();
  ErrorUtils.setGlobalHandler((error, isFatal) => {
    report(error, {isFatal, source: 'global'});
    previous(error, isFatal); // keep RN's default behaviour (red box in dev)
  });
}
```

#### Layers and what each one catches

| Layer | Catches | Fallback |
|---|---|---|
| Root boundary | Render errors that escaped everything else | Full-screen recovery with restart (e.g. `Updates.reloadAsync()` in Expo, or a restart library in bare apps) |
| Screen / navigator boundary | Render errors within one screen | Screen-level retry; resets on route change |
| Widget boundary | Errors in optional UI | Hide the widget, log it |
| Data layer (`throwOnError`, `QueryErrorResetBoundary`) | Failed queries surfaced to boundaries deliberately | Retry that query |
| `ErrorUtils` global handler | Uncaught errors in event handlers, timers, callbacks | Report; fatal errors crash in release unless handled |
| Unhandled promise rejections | Rejected promises with no `catch` | Report (crash reporters such as Sentry hook the Hermes rejection tracker) |
| Native crash reporting | Crashes in Kotlin, ObjC, C++ | Symbolicated with dSYMs and R8 mappings |

**Pitfalls**

- Boundaries don't catch errors in event handlers, async code, or themselves; `onPress={async () => ...}` failures need `try/catch` or the global handlers.
- A retry that re-renders with the same bad data just crashes again; reset the cause (refetch, clear the cached item) in `onReset`.
- Too many boundaries hide systemic problems; track "errors caught by boundary" as a metric and alert on spikes after releases.
- Keep fallback UIs dependency-light: a fallback that uses the same broken context or theme provider will fail too.

See the [Monitoring guide](../guides/monitoring.html) for release health, source maps and alerting.

> [!INTERVIEW]
> What a senior answer includes: layered boundaries with reset strategy, the list of things boundaries can't catch, global handlers, reporting with context, and monitoring after rollouts. Likely follow-ups: "How do you recover from a crash loop caused by a bad OTA update?" (update rollback, "last known good" logic, kill switches through remote config).
