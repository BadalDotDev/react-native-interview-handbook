> [!INTERVIEW]
> What a senior answer includes: all options share JSI; the trade-off is dependency, ergonomics and call overhead, not "bridge vs no bridge". Good signal: "for an Expo app I'd write app-local modules with the Expo Modules API; for a hot path called thousands of times per second I'd benchmark Nitro or C++". See the [GitHub repo for Nitro](https://github.com/mrousavy/nitro) and the [Expo Modules docs](https://docs.expo.dev/modules/overview/).

### When should you drop down to native code at all?

**Short answer:** When JS can't reach the capability (a platform API or SDK with no maintained library), when the work is too heavy or too frequent for the JS thread (image processing, crypto, parsing large binaries, per-frame work), when you need to run while JS isn't (background execution, widgets, app extensions), or when a platform UI component has no good JS equivalent. Don't go native to "make it faster" before profiling proves the JS side is the bottleneck.

| Signal | Native is justified | Stay in JS |
|---|---|---|
| Capability | Platform API with no maintained library (e.g. a vendor SDK, new OS feature) | A well-maintained library exists |
| CPU cost | Profiled hot path: large data transforms, image or audio processing, crypto | Occasional small computations |
| Frequency | Per-frame or high-rate streams (sensors, camera frames) | User-driven events |
| Lifecycle | Background tasks, widgets, share extensions, watch apps, notification service extensions | Foreground UI logic |
| UI | Native map, video, AR or a platform picker with platform-specific behaviour | Composable views and animations (Reanimated, Skia) |

#### Costs to price in

- Two implementations (Kotlin and Swift) to write, review, test and maintain, unless you choose C++.
- Native code can't ship over the air: every fix needs a store release, which also affects OTA compatibility (runtime versions must change).
- Upgrades: native code couples you to RN's native APIs, Gradle/AGP and Xcode versions.
- Team skills: someone must own it and be able to debug a native crash.

**Order of preference** before writing your own: a maintained library, then an Expo module or config plugin, then an app-local Expo/Nitro module, then a Codegen TurboModule, then C++ only for shared compute.

> [!INTERVIEW]
> Red flag: jumping to native for a slow `FlatList` (almost always a JS render problem). Good signal: citing a trace that showed the cost, and naming the maintenance and OTA implications.

## Hermes

### Why is Hermes the default engine, and how does bytecode precompilation help?

**Short answer:** Hermes is a JavaScript engine built for React Native's constraints: fast startup, low memory and small size on mid-range phones. Its key idea is ahead-of-time compilation: at build time `hermesc` compiles the bundle to Hermes bytecode (`.hbc`), so the app skips parsing and compiling JS at launch. The bytecode file is memory-mapped and pages are loaded on demand, and there is no JIT, which keeps memory predictable. It has been the default since RN 0.70.

#### What changes at runtime

| Step | JSC-style engine | Hermes (release) |
|---|---|---|
| Build | Minify JS | Minify JS, then compile to bytecode with `hermesc -O` |
| App launch | Read the whole source, parse, compile to bytecode | `mmap` the `.hbc` file, start interpreting |
| Memory | Source text plus compiled code on the heap | Bytecode pages are clean and file-backed, so the OS can drop and reload them |
| Hot code | JIT can optimize long-running code (where allowed) | Interpreter only, tuned for startup and consistent latency |

The trade-off is peak throughput. Tight CPU-bound loops can be faster on a JIT engine, but mobile apps are dominated by startup and short bursts of work, and iOS doesn't allow third-party apps to JIT anyway.

#### Dev vs release

In development, Metro serves plain JS and Hermes compiles it lazily at runtime so Fast Refresh works. That's why dev-mode startup and performance are not representative. Always measure release builds.

```ts title="src/utils/engine.ts"
type HermesGlobal = {
  HermesInternal?: {getRuntimeProperties?: () => Record<string, string>};
};

export function engineInfo() {
  const hermes = (globalThis as HermesGlobal).HermesInternal;
  if (!hermes) return {engine: 'other'};
  const props = hermes.getRuntimeProperties?.() ?? {};
  return {engine: 'hermes', version: props['OSS Release Version']};
}
```

**Gotchas**

- `Function.prototype.toString()` doesn't return source for bytecode-compiled functions. Libraries that relied on it (old serialization tricks) break; Reanimated avoids this by capturing worklet code with a Babel plugin at build time.
- Crash stack traces point at bytecode offsets; you need the composed Metro + Hermes source map to symbolicate (see the Metro questions).

> [!INTERVIEW]
> What a senior answer includes: AOT bytecode, mmap and lazy page loading, no JIT and why that's acceptable on mobile, dev vs release differences. Likely follow-ups: "Why is the dev build so much slower?", "How do you symbolicate a Hermes crash?"

### How does Hermes manage memory, and what is Hades?

**Short answer:** Hermes uses a generational garbage collector. New objects are bump-allocated in a young generation that is collected by a fast, short stop-the-world copying pass. Objects that survive are promoted to the old generation, which **Hades**, Hermes' concurrent collector, marks and sweeps mostly on a background thread while JS keeps running. That brought typical GC pauses down from tens or hundreds of milliseconds (with the previous GenGC on large heaps) to the low single-digit milliseconds, which matters for frame-perfect scrolling and animation.

#### Mechanics in brief

- **Young generation:** small, collected often; pause time proportional to live young objects, not heap size.
- **Old generation (Hades):** concurrent marking with write barriers so the mutator (your JS) and the collector can run at the same time; sweeping also happens concurrently, so only short synchronization points remain on the JS thread. On 32-bit devices Hades runs in an incremental mode on the JS thread instead.
- **Only the JS heap:** Hermes manages JS objects. Bitmaps, native views, native module buffers and `ArrayBuffer`s backed by native memory live outside it and don't appear in heap snapshots the same way.

#### What this means for app code

- Allocation-heavy code (building thousands of short-lived objects per frame, e.g. in a scroll handler) still costs CPU in the young-gen collector, even if pauses are short.
- Large long-lived structures (a 50k-item normalized cache) increase old-gen marking work; paginate or keep bulky data native (SQLite, MMKV) and load slices.
- A "memory leak" in RN is usually a *retention* problem (something still references objects), not a GC bug.

```bash
# Android: see JS vs native vs graphics memory for your app
adb shell dumpsys meminfo com.acme.app
```

> [!INTERVIEW]
> Likely follow-ups: "Why doesn't a heap snapshot explain my 400 MB memory usage?" (images and native memory are outside the JS heap), "What's the cost of allocation in a gesture handler?" (young-gen churn, but with Reanimated the handler runs on the UI runtime, which has its own heap).

### How does Hermes compare with JSC, what about Intl, and what is Hermes V1?

**Short answer:** Hermes wins on startup time and memory thanks to bytecode precompilation and a mobile-tuned GC; JSC (now a community-maintained package for RN) can have better peak throughput where JIT is available and historically had broader built-in `Intl` coverage. Hermes implements the commonly used `Intl` APIs by delegating to platform facilities, but newer or less common parts may be missing or partial, so feature-detect or polyfill. Hermes V1 is the next-generation Hermes VM that came out of the Static Hermes work; it appeared as an experimental opt-in around RN 0.82 with better performance and more complete modern JS support.

| | Hermes | JSC |
|---|---|---|
| Status in RN | Default engine | Moved out of core to a community package |
| Startup | Bytecode precompiled at build time, mmap | Parse and compile at launch |
| Memory | Lower; Hades concurrent GC | Higher baseline |
| Peak CPU throughput | Interpreter (no JIT) | JIT where the platform allows it |
| iOS binary | Adds the Hermes framework | Uses the system JavaScriptCore |
| Debugging | React Native DevTools over CDP | Supported, less of a focus |
| `Intl` | Common APIs via platform backends; check edge APIs | Broad (system engine) |

#### Intl in practice

```ts title="src/i18n/formatters.ts"
export const priceFormatter = new Intl.NumberFormat('en-IN', {
  style: 'currency',
  currency: 'INR',
});

// Feature-detect anything beyond the basics and load a FormatJS polyfill if needed.
export const hasSegmenter = typeof (Intl as {Segmenter?: unknown}).Segmenter === 'function';
```

Polyfills from FormatJS (`@formatjs/intl-*`) can fill gaps, at the cost of bundle size and a little startup time; load only the locales you ship.

#### Hermes V1 and Static Hermes

- **Hermes V1**: a new VM generation with performance improvements and fuller ES support. It started as opt-in and experimental; check your RN version's release notes for its current status and the flags that enable it, and benchmark startup, memory and your hot paths before adopting it.
- **Static Hermes**: the research effort to compile typed JavaScript ahead of time to native code. It is the source of V1's improvements, but "compile my typed JS to native" is not a mainstream production feature for RN apps today.

> [!WARNING]
> Engine changes can surface subtle differences: date parsing of non-ISO strings, regex features, `Intl` output formats and sort stability. Keep a test suite that covers formatting and parsing before switching engines or engine versions.

> [!INTERVIEW]
> Red flag: "Hermes has no Intl" (outdated) or "JSC is faster so use it" without measuring startup. Good signal: knowing JSC is now community-maintained and treating Hermes V1 as something to benchmark, not blindly enable.

### How do you debug and profile JavaScript running on Hermes?

**Short answer:** React Native DevTools (the default debugger since 0.76, opened with `j` in the Metro terminal or from the dev menu) connects to Hermes over the Chrome DevTools Protocol: console, Sources with breakpoints, Memory (heap snapshots), and the React Components and Profiler panels; recent releases add Performance and Network panels. For release-build CPU profiling, capture a Hermes sampling profile (for example with `react-native-release-profiler`) and open it in a trace viewer; for whole-app timing, use Perfetto or Instruments.

#### Toolbox

| Task | Tool |
|---|---|
| Breakpoints, console, stepping | React Native DevTools, Sources panel |
| Why did React re-render? | React DevTools Profiler (enable "record why each component rendered") |
| JS CPU hot spots (debug) | DevTools Performance panel in recent releases; `npx react-native profile-hermes` for a captured Android profile |
| JS CPU hot spots (release) | `react-native-release-profiler`: start and stop from code, download, convert to a Chrome trace |
| JS memory | DevTools Memory panel: heap snapshots, allocation timelines |
| Native and all threads | Perfetto (Android), Xcode Instruments (Time Profiler, Hangs, Allocations, Leaks) |

```ts title="src/debug/profileFeed.ts"
import {startProfiling, stopProfiling} from 'react-native-release-profiler';

// Wrap a suspicious interaction in a release build (behind an internal flag).
export async function profileFeedScroll(run: () => Promise<void>) {
  startProfiling();
  await run();
  const path = await stopProfiling(true); // true: save to Downloads (Android)
  return path;
}
```

**Gotchas**

- Legacy "Debug in Chrome" (remote JS debugging) ran your JS in Chrome's V8 and changed timing and sync-method behaviour; it has been removed. If you read old advice mentioning it, ignore it.
- Flipper was removed from the template in 0.74; don't build a debugging workflow around it.
- Debugger-attached performance is not real performance. Profile with the debugger detached or in release.
- The React Profiler measures render time only. Time spent in effects, event handlers, JSON parsing or sync native calls shows up only in the JS sampling profile.

> [!INTERVIEW]
> Likely follow-ups: "How would you profile a jank that only happens in release on a low-end Android?" (release profiler plus Perfetto, correlate JS samples with the UI thread's frame timeline).

## Performance deep dive

The [Performance guide](../guides/performance.html) covers list tuning, images and a production checklist. These questions focus on measurement and root-cause analysis.

### How do you measure React Native performance properly?

**Short answer:** Measure release builds on a low-end Android device, and separate the two threads: **JS FPS** (can the JS thread process frames?) and **UI FPS** (is the main thread rendering on time?). Use the Perf Monitor for a quick read, React DevTools Profiler for render cost, a JS sampling profile for script cost, Perfetto or Instruments for whole-system traces, and explicit markers for startup and TTI. Then track the same metrics in CI and in production so regressions are caught.

#### Budgets

| Display | Frame budget |
|---|---|
| 60 Hz | 16.7 ms |
| 90 Hz | 11.1 ms |
| 120 Hz (ProMotion, many Android flagships) | 8.3 ms |

#### Reading the two FPS numbers

| Symptom | JS FPS | UI FPS | Likely cause |
|---|---|---|---|
| Taps respond late, JS animations stutter, scroll is smooth | Low | OK | Heavy render or JS work (parsing, sorting, large lists re-rendering) |
| Everything janks including native scroll | OK | Low | Main thread: large mounts, overdraw, image decoding, sync native work |
| Both drop | Low | Low | Often a big mount after heavy JS, or memory pressure and GC |

#### Instrumenting TTI

```ts title="src/perf/tti.ts"
const jsStart = performance.now(); // module evaluation time of this file

let reported = false;

export function markInteractive(screen: string, report: (e: object) => void) {
  if (reported) return;
  reported = true;
  performance.mark(`${screen}_interactive`);
  report({
    name: 'tti',
    screen,
    jsToInteractiveMs: Math.round(performance.now() - jsStart),
  });
}
```

JS timestamps miss native startup. To get process-start-to-interactive, record native timestamps too (Android `Process.getStartUptimeMillis()`, iOS process start time) or use a library such as `react-native-performance` that exposes native launch marks. Cross-check with platform tools: `adb shell am start -W` or Macrobenchmark on Android, the App Launch template in Instruments and the Xcode Organizer launch metrics on iOS.

#### Regression tracking

- **Reassure** (Callstack): component render-time tests in CI.
- **Flashlight**: Android performance score for a scripted scenario, usable in CI.
- **Production telemetry**: Sentry or Firebase Performance traces for startup, screen loads, slow and frozen frames (see the [Monitoring guide](../guides/monitoring.html)).

> [!INTERVIEW]
> What a senior answer includes: release builds on real low-end devices, JS vs UI thread distinction, frame budgets at high refresh rates, TTI defined as "useful content visible and responsive", and a regression process. Red flag: measuring in a debug build or on a simulator.

### How do you optimize app startup time?

**Short answer:** Break startup into phases (native init, runtime and bundle load, JS module execution, first render, data), measure each, then attack the biggest one. The usual wins: keep Hermes bytecode, shrink and defer JS (inline requires, lazy screens, no work at module top level), defer native SDK initialization, render a cached or skeleton UI immediately, and hide the splash screen only when meaningful content is ready.

```mermaid
timeline
    title Cold start of a React Native app
    Native init : Process start : Application.onCreate or didFinishLaunching : Native SDK setup
    Runtime : Create ReactHost : Load Hermes : mmap bytecode bundle
    JS execution : Run module factories : Top-level side effects : AppRegistry runApplication
    First frame : React render : Fabric commit and mount : Splash hidden
    Interactive : Data from cache or network : Content painted and responsive
```
*Figure: App startup timeline and the phases to measure separately.*

#### Wins by phase

| Phase | Optimizations |
|---|---|
| Native init | Initialize analytics, crash reporting and feature-flag SDKs lazily or off the main thread; avoid disk I/O in `Application.onCreate` / `didFinishLaunching`; prefer static linkage on iOS (fewer dynamic frameworks means less dyld work); Baseline Profiles for the Kotlin side on Android |
| Runtime and bundle | Keep Hermes bytecode (default); remove heavy dependencies (full `moment` with locales, whole `lodash`); don't import huge JSON at module scope |
| JS execution | Inline requires; no side effects at import time; lazy-load screens and rarely used features; keep `index.js` tiny |
| First render | Render a shell or skeleton first; hydrate persisted state synchronously only if small (MMKV), otherwise in slices |
| Data | Show cached data instantly (persisted query cache), refresh in the background; start critical requests as early as possible |

#### Inline requires and lazy screens

```js title="metro.config.js"
const {getDefaultConfig, mergeConfig} = require('@react-native/metro-config');

const config = {
  transformer: {
    getTransformOptions: async () => ({
      transform: {
        experimentalImportSupport: false,
        // Rewrites top-level imports into require() calls at first use,
        // so module factories run only when actually needed.
        inlineRequires: true,
      },
    }),
  },
};

module.exports = mergeConfig(getDefaultConfig(__dirname), config);
```

```tsx title="src/navigation/RootStack.tsx"
import {createNativeStackNavigator} from '@react-navigation/native-stack';
import {HomeScreen} from '../screens/HomeScreen';

const Stack = createNativeStackNavigator();

export function RootStack() {
  return (
    <Stack.Navigator>
      <Stack.Screen name="Home" component={HomeScreen} />
      {/* Evaluated only when the user first navigates here */}
      <Stack.Screen name="Settings" getComponent={() => require('../screens/SettingsScreen').SettingsScreen} />
      <Stack.Screen name="Reports" getComponent={() => require('../screens/ReportsScreen').ReportsScreen} />
    </Stack.Navigator>
  );
}
```

Defer non-critical work until after the first frame (`requestIdleCallback`, or a `setTimeout` scheduled from the first screen's effect). `InteractionManager.runAfterInteractions` is the legacy way to do this.

**Pitfalls**

- Inline requires can reorder side effects. Modules that must run first (polyfills, `react-native-gesture-handler` setup, Sentry init) should be imported explicitly at the top of `index.js` or listed in Metro's `nonInlinedRequires`.
- Lazy loading in RN defers *evaluation*, not download: the whole bundle is already on the device. The win is CPU time at startup.
- A splash screen hidden too early just moves the blank screen; one hidden too late hides a slow app. Hide it on the first meaningful layout.

### How do you find and fix memory leaks in a React Native app?

**Short answer:** Leaks in RN are almost always retention: listeners, timers or subscriptions that outlive the component; closures captured by long-lived singletons; unbounded caches; or large native resources like images. Find JS leaks with heap snapshots in React Native DevTools (snapshot, repeat the action several times, snapshot again, compare and follow retainers). Find native leaks with the Xcode Memory Graph and Instruments or Android Studio's Memory Profiler and LeakCanary. Fix them with effect cleanups, abort signals and bounded caches.

#### Typical culprits

| Culprit | Example | Fix |
|---|---|---|
| Listeners | `AppState`, `Keyboard`, `Dimensions`, `Linking`, native module events, navigation listeners | Keep the subscription and call `remove()` in the effect cleanup |
| Timers | `setInterval` polling without `clearInterval` | Clear in cleanup; pause polling when the app backgrounds |
| In-flight requests | `fetch` resolving after unmount and calling `setState` into stale closures | `AbortController` in cleanup |
| Singletons capturing closures | An event bus or analytics queue holding component callbacks | Unsubscribe; store IDs, not closures |
| Unbounded caches | Module-level `Map` of every item ever seen | LRU with a size cap |
| Images | Full-resolution photos decoded for thumbnails | Resize at the source or CDN, use `expo-image` or a caching library with sizing, cap memory cache |
| Navigation | Pushing the same screen repeatedly (`push` instead of `navigate`) keeps every instance mounted | Use `navigate`, `popTo` or reset patterns |
| Native retain cycles | ObjC block capturing `self` strongly in a module | `__weak` / `[weak self]`, remove observers in `invalidate` |

```tsx title="src/hooks/useLivePrice.ts"
import {useEffect, useState} from 'react';
import {AppState} from 'react-native';

export function useLivePrice(symbol: string) {
  const [price, setPrice] = useState<number | null>(null);

  useEffect(() => {
    const controller = new AbortController();
    let timer: ReturnType<typeof setInterval> | undefined;

    const poll = async () => {
      try {
        const res = await fetch(`https://api.example.com/price/${symbol}`, {signal: controller.signal});
        const body: {price: number} = await res.json();
        setPrice(body.price);
      } catch (e) {
        if ((e as Error).name !== 'AbortError') console.warn(e);
      }
    };

    const start = () => {
      poll();
      timer = setInterval(poll, 5000);
    };
    const stop = () => clearInterval(timer);

    start();
    const sub = AppState.addEventListener('change', s => (s === 'active' ? start() : stop()));

    return () => {
      stop();
      sub.remove();
      controller.abort();
    };
  }, [symbol]);

  return price;
}
```

#### Heap snapshot workflow (three-snapshot technique)

1. Open React Native DevTools, Memory panel. Navigate to a neutral screen and take snapshot 1.
2. Perform the suspect action N times (open and close a screen 5 times).
3. Return to the neutral screen, take snapshot 2; repeat the action N more times and take snapshot 3.
4. Use the Comparison view: objects allocated between 1 and 2 that are still alive in 3 and grow with N are leaks. Group by constructor, look for counts that match N (5 `FeedScreen` fibers, 5 closures) and follow the **retainers** path to the root holding them (often a listener array or module-level cache).

For native memory, watch the overall footprint while repeating the action (Xcode memory gauge, `adb shell dumpsys meminfo`): steady growth with a flat JS heap points at images, native views or native module buffers.

> [!INTERVIEW]
> Red flag: using an `isMounted` flag to silence warnings instead of cancelling the work. Good signal: describing the retainer chain of a real leak you fixed and how you confirmed it with a second snapshot.

### How do you analyze re-renders, and what does React Compiler change?

**Short answer:** Record an interaction with the React DevTools Profiler (in React Native DevTools) with "record why each component rendered" enabled, and use "highlight updates" to see what re-renders. Most unnecessary renders come from unstable props (inline objects and functions), broad context values, store selectors that return new objects, and state held too high. React Compiler (stable since v1.0 in October 2025) automatically memoizes components and hooks at build time, which removes most manual `useMemo`, `useCallback` and `memo`, but it doesn't fix architectural issues such as a context that changes on every keystroke.

#### Common causes and fixes

| Cause | Fix |
|---|---|
| Parent re-renders, child props are new objects each time | Stable references (compiler or `useMemo`/`useCallback`), `memo` on expensive children |
| One big context (`{user, theme, cart, setCart}`) | Split contexts by change frequency; pass setters separately; or use a store with selectors |
| Selector returns a new object or array | `useShallow` (Zustand), `shallowEqual` (Redux), or select primitives |
| State too high (form state at screen root) | Move state down; lift content up by passing children as props |
| List items re-render on any list change | Memoized item component, stable `renderItem` and `keyExtractor`, FlashList recycling |
| Derived data recomputed in render | Memoize, or compute in the selector |

```tsx title="src/features/cart/CartBadge.tsx"
import {useShallow} from 'zustand/react/shallow';
import {useCartStore} from './store';

export function CartBadge() {
  // Re-renders only when count or hasPromo change, not on every cart mutation.
  const {count, hasPromo} = useCartStore(
    useShallow(s => ({count: s.items.length, hasPromo: s.promoCode != null})),
  );
  return <Badge value={count} highlighted={hasPromo} />;
}
```

#### Enabling React Compiler

```js title="babel.config.js"
module.exports = {
  presets: ['module:@react-native/babel-preset'],
  // The compiler plugin must run first.
  plugins: ['babel-plugin-react-compiler'],
};
```

In Expo, set `"experiments": { "reactCompiler": true }` in `app.json` (recent templates enable it). React 19 needs no extra runtime package.

**What the compiler needs:** code that follows the Rules of React (pure render, no mutation of props or state, hooks at top level). Components that break the rules are skipped, not miscompiled, so run the React Hooks ESLint plugin's compiler rules to see which ones bail out. Opt a file or function out with the `"use no memo"` directive while debugging.

**Interop gotchas:** libraries that rely on mutation during render or reading mutable values (for example Reanimated shared values via `.value` in render) can confuse the compiler; Reanimated recommends `sv.get()` / `sv.set()` for compiler compatibility.

> [!INTERVIEW]
> What a senior answer includes: profiler-first workflow, the difference between a render and a commit to native (a re-render with no prop changes produces no native mutations but still costs JS time), and a realistic view of the compiler. Red flag: wrapping everything in `useCallback` without measuring.

### What blocks the JS thread, and how do you keep it responsive?

**Short answer:** Anything long and synchronous: parsing or transforming large JSON, sorting or filtering thousands of items, crypto or compression in JS, huge render trees mounting at once, synchronous native calls, and big state updates that re-render large parts of the tree. Keep the thread responsive by doing less (pagination, virtualization, memoization), splitting work into chunks that yield, marking non-urgent React updates as transitions, and moving heavy computation to native code or a separate worklet runtime.

#### Techniques, from cheapest to most involved

1. **Do less:** paginate server responses, virtualize lists, select only needed fields, avoid re-deriving data on every render.
2. **Prioritize with concurrent React:** keep typing and taps urgent, render expensive results at lower priority.
3. **Chunk work:** yield between batches so touches and frames get processed.
4. **Move work off the JS thread:** native or C++ modules, or a background worklet runtime.

```tsx title="src/features/search/SearchScreen.tsx"
import {useDeferredValue, useMemo, useState} from 'react';
import {TextInput} from 'react-native';
import {FlashList} from '@shopify/flash-list';
import {filterProducts, type Product} from './filter';

export function SearchScreen({products}: {products: Product[]}) {
  const [query, setQuery] = useState('');
  // The input updates immediately; the expensive list re-renders at lower
  // priority and can be interrupted by the next keystroke.
  const deferredQuery = useDeferredValue(query);
  const results = useMemo(() => filterProducts(products, deferredQuery), [products, deferredQuery]);

  return (
    <>
      <TextInput value={query} onChangeText={setQuery} placeholder="Search" />
      <FlashList data={results} renderItem={({item}) => <ProductRow product={item} />} />
    </>
  );
}
```

```ts title="src/utils/processInChunks.ts"
// Yields to the event loop between batches so input and frames are processed.
export async function processInChunks<T, R>(
  items: T[],
  fn: (item: T) => R,
  chunkSize = 250,
): Promise<R[]> {
  const out: R[] = [];
  for (let i = 0; i < items.length; i += chunkSize) {
    for (const item of items.slice(i, i + chunkSize)) out.push(fn(item));
    await new Promise<void>(resolve => setTimeout(resolve, 0));
  }
  return out;
}
```

> [!WARNING]
> `useDeferredValue` and transitions make *rendering* interruptible. The `filterProducts` call above still runs synchronously inside one component's render; if it takes 300 ms on its own, it blocks regardless. Measure it, and if it's the bottleneck, precompute an index, chunk it, or move it native.

**Diagnosing:** the JS sampling profile shows long tasks by function; the Perf Monitor shows JS FPS dropping; recent RN versions also support `PerformanceObserver` for long tasks and event timing, which you can sample in production.

> [!INTERVIEW]
> Likely follow-ups: "Why is a controlled `TextInput` laggy when the JS thread is busy?" (each keystroke round-trips through JS state), "When would you use a worklet runtime instead of a native module?"

## Animations and gestures

### How do Reanimated worklets and shared values work under the hood?

**Short answer:** Reanimated runs a second, lightweight JS runtime on the UI thread (the "UI runtime"). Functions marked as worklets, either with a `'worklet'` directive or automatically as callbacks of `useAnimatedStyle`, `useDerivedValue`, gesture handlers and similar hooks, are processed at build time by the worklets Babel plugin so they can be recreated on that runtime together with the values they capture. Shared values are JSI-backed containers readable and writable from both runtimes. When a shared value changes on the UI thread, the mappers that read it (animated styles, derived values) re-run in the same frame and apply props directly to native views, with no React render and no JS-thread round-trip.

```mermaid
sequenceDiagram
    participant JS as JS thread
    participant UIRT as UI runtime (worklets)
    participant GH as Gesture Handler
    participant View as Native view
    JS->>UIRT: mount - register useAnimatedStyle mapper
    loop every frame while a gesture or animation runs
        GH->>UIRT: onUpdate(event) worklet
        UIRT->>UIRT: write shared value or step withSpring
        UIRT->>UIRT: re-run mappers that read it
        UIRT->>View: apply transform and opacity
    end
    UIRT-->>JS: scheduleOnRN(callback) only when needed
```
*Figure: Reanimated UI-thread animation loop: the JS thread is not involved per frame.*

#### Moving parts

- **Babel plugin.** In Reanimated 4 the worklet machinery lives in `react-native-worklets`, and the plugin is `react-native-worklets/plugin` (Reanimated 3 used `react-native-reanimated/plugin`). It must be the last Babel plugin; `babel-preset-expo` adds it automatically.
- **Closure capture.** A worklet's captured variables are copied to the UI runtime when the worklet is created. Capturing a big object copies it; capturing React state gives a snapshot; capturing a normal (non-worklet) function is an error unless you schedule it back to the RN runtime.
- **Animations are objects stepped per frame.** `withTiming`, `withSpring` and `withDecay` return animation descriptors; the UI runtime advances them on each frame callback using the frame timestamp, so they are frame-rate independent.
- **Applying props.** Non-layout props (`transform`, `opacity`, colors) take a fast path directly to the native view. Layout props (`width`, `height`, `top`, margins) must go through the Fabric shadow tree and Yoga, which is much more expensive per frame. Reanimated also has to keep React's view of props consistent so a later React commit doesn't overwrite animated values; on Fabric it hooks into the commit pipeline for this.

```tsx title="src/components/ProgressBar.tsx"
import {useEffect} from 'react';
import {StyleSheet, View} from 'react-native';
import Animated, {
  interpolateColor,
  useAnimatedStyle,
  useDerivedValue,
  useSharedValue,
  withTiming,
} from 'react-native-reanimated';

export function ProgressBar({value}: {value: number}) {
  const progress = useSharedValue(0);
  const clamped = useDerivedValue(() => Math.min(Math.max(progress.value, 0), 1));

  useEffect(() => {
    progress.value = withTiming(value, {duration: 400});
  }, [value, progress]);

  const fillStyle = useAnimatedStyle(() => ({
    transform: [{scaleX: clamped.value}], // transform, not width: no layout pass
    backgroundColor: interpolateColor(clamped.value, [0, 1], ['#d64545', '#2f9e44']),
  }));

  return (
    <View style={styles.track}>
      <Animated.View style={[styles.fill, fillStyle]} />
    </View>
  );
}

const styles = StyleSheet.create({
  track: {height: 8, borderRadius: 4, backgroundColor: '#e9ecef', overflow: 'hidden'},
  fill: {...StyleSheet.absoluteFillObject, transformOrigin: 'left'},
});
```

**Gotchas**

- Reading `sv.value` during React render gives a snapshot and never triggers re-renders; derive UI from shared values inside `useAnimatedStyle`, or mirror discrete changes into React state with `useAnimatedReaction`.
- With React Compiler, prefer `sv.get()` and `sv.set(v)` over `.value` so the compiler doesn't treat it as a plain mutable object.
- Heavy computation in a worklet runs on the UI thread and drops frames for everything, including native scrolling.
- Reanimated 4 requires the New Architecture.

> [!INTERVIEW]
> What a senior answer includes: separate UI runtime, build-time workletization and closure copying, mappers re-running on the UI thread, and the layout vs non-layout prop cost. Likely follow-ups: "Why is animating `width` slower than `scaleX`?", "What happens if a worklet captures a large array?"

### How do you move between threads in Reanimated 4?

**Short answer:** From a worklet on the UI runtime, call back into React Native's JS runtime with `scheduleOnRN(fn, ...args)` from `react-native-worklets` (the Reanimated 4 replacement for `runOnJS(fn)(...args)`). To run a worklet on the UI runtime from JS, use `scheduleOnUI(worklet, ...args)` (replacing `runOnUI`), or simply assign a shared value, which is already scheduled to the UI thread. Every hop is asynchronous and copies its arguments, so cross only on meaningful changes, never every frame.

| Reanimated 3 | Reanimated 4 / react-native-worklets | Direction |
|---|---|---|
| `runOnJS(fn)(a, b)` | `scheduleOnRN(fn, a, b)` | UI runtime to JS thread |
| `runOnUI(worklet)(a)` | `scheduleOnUI(worklet, a)` | JS thread to UI runtime |
| `runOnRuntime(rt, worklet)(a)` | `scheduleOnRuntime(rt, worklet, a)` | Any thread to a custom worklet runtime |
| Plugin `react-native-reanimated/plugin` | Plugin `react-native-worklets/plugin` | Build time |

The old names still exist in Reanimated 4 as deprecated aliases, which helps incremental migration.

```tsx title="src/features/feed/useFabVisibility.ts"
import {useState} from 'react';
import {useAnimatedReaction, useAnimatedScrollHandler, useSharedValue} from 'react-native-reanimated';
import {scheduleOnRN} from 'react-native-worklets';

export function useFabVisibility(threshold = 200) {
  const scrollY = useSharedValue(0);
  const [fabVisible, setFabVisible] = useState(true);

  const onScroll = useAnimatedScrollHandler(e => {
    scrollY.value = e.contentOffset.y; // UI thread, every frame, no JS involved
  });

  useAnimatedReaction(
    () => scrollY.value > threshold,
    (isPast, wasPast) => {
      // Cross to JS only when the boolean flips, not on every scroll frame.
      if (isPast !== wasPast) scheduleOnRN(setFabVisible, !isPast);
    },
    [threshold],
  );

  return {onScroll, fabVisible};
}
```

```ts title="src/features/sheet/snap.ts"
import {withSpring, type SharedValue} from 'react-native-reanimated';
import {scheduleOnUI} from 'react-native-worklets';

export function snapTo(offset: SharedValue<number>, target: number) {
  scheduleOnUI((to: number) => {
    'worklet';
    offset.value = withSpring(to, {damping: 20, stiffness: 180});
  }, target);
}
```

**Rules of thumb**

- Functions passed to `scheduleOnRN` must be defined in normal JS (state setters, navigation, analytics, haptics); they're called asynchronously on the JS thread.
- Arguments must be serializable: primitives, plain objects and arrays, other worklets. Class instances and native handles don't cross.
- If JS needs to react to a continuous value (e.g. show a percentage label), consider animating the label natively (`useAnimatedProps` on an animated `TextInput`) instead of pushing numbers to React state 60 to 120 times a second.

> [!INTERVIEW]
> Red flag: calling `setState` via `scheduleOnRN` on every frame of a scroll. Good signal: `useAnimatedReaction` with a change check, and knowing the renamed APIs.

### How do you build a gesture-driven animation that stays smooth at 60 and 120 Hz?

**Short answer:** Put the entire gesture-to-pixels loop on the UI thread: Gesture Handler 2 callbacks run as worklets and write shared values, `useAnimatedStyle` maps them to `transform` and `opacity`, and release hands the gesture's velocity to a spring or decay animation. Cross to JS only at the end (for example to remove the item). For high refresh rates, enable ProMotion on iOS, keep per-frame work tiny (8.3 ms budget) and use time-based animations.

```tsx title="src/components/SwipeToDismiss.tsx"
import {useMemo, type ReactNode} from 'react';
import {useWindowDimensions} from 'react-native';
import {Gesture, GestureDetector} from 'react-native-gesture-handler';
import Animated, {
  Extrapolation,
  interpolate,
  useAnimatedStyle,
  useSharedValue,
  withSpring,
  withTiming,
} from 'react-native-reanimated';
import {scheduleOnRN} from 'react-native-worklets';

type Props = {onDismiss: () => void; children: ReactNode};

export function SwipeToDismiss({onDismiss, children}: Props) {
  const {width} = useWindowDimensions();
  const x = useSharedValue(0);
  const startX = useSharedValue(0);

  const pan = useMemo(
    () =>
      Gesture.Pan()
        .activeOffsetX([-12, 12]) // horizontal intent only...
        .failOffsetY([-8, 8])     // ...so the parent list can still scroll vertically
        .onBegin(() => {
          startX.value = x.value;
        })
        .onUpdate(e => {
          x.value = startX.value + e.translationX;
        })
        .onEnd(e => {
          const fling = Math.abs(e.velocityX) > 900;
          const far = Math.abs(x.value) > width * 0.35;
          if (fling || far) {
            const dir = Math.sign(e.velocityX || x.value);
            x.value = withTiming(dir * width * 1.2, {duration: 180}, finished => {
              if (finished) scheduleOnRN(onDismiss);
            });
          } else {
            x.value = withSpring(0, {velocity: e.velocityX, damping: 18});
          }
        }),
    [onDismiss, width, x, startX],
  );

  const style = useAnimatedStyle(() => ({
    transform: [
      {translateX: x.value},
      {rotate: `${interpolate(x.value, [-width, 0, width], [-10, 0, 10], Extrapolation.CLAMP)}deg`},
    ],
    opacity: interpolate(Math.abs(x.value), [0, width], [1, 0.4], Extrapolation.CLAMP),
  }));

  return (
    <GestureDetector gesture={pan}>
      <Animated.View style={style}>{children}</Animated.View>
    </GestureDetector>
  );
}
```

#### 120 Hz considerations

- **iOS ProMotion:** third-party apps are capped at 60 Hz for `CADisplayLink`-driven animation unless `Info.plist` opts in:

```xml title="ios/MyApp/Info.plist"
<key>CADisableMinimumFrameDurationOnPhone</key>
<true/>
```

- **Android:** high refresh rate depends on the device and the system's frame-rate heuristics; test on a real 90/120 Hz device.
- **Budget:** 8.3 ms per frame for everything on the UI thread, including your worklets and the mount work of any concurrent React commit.
- **Time-based, not frame-based:** use `withTiming` / `withSpring` (timestamp-driven) or `useFrameCallback` with `timeSincePreviousFrame`; never "add 2 px per frame".
- **Only transforms and opacity per frame:** layout props trigger Yoga and shadow-tree commits on each frame.
- **Gesture conflicts:** use `activeOffsetX` / `failOffsetY`, `simultaneousWithExternalGesture` or `requireExternalGestureToFail` rather than disabling scroll.

> [!INTERVIEW]
> Likely follow-ups: "How do you pass fling velocity into the settle animation?", "Why does the same animation look smoother on iPhone after a plist change?", "How do you coordinate this with a parent FlatList's scroll?"

### How do layout animations and CSS-style transitions work in Reanimated 4?

**Short answer:** Layout animations animate views as they mount (`entering`), unmount (`exiting`) or change position and size because of a re-render (`layout`). Reanimated intercepts those changes in the render pipeline, keeps exiting views alive until their animation finishes, and interpolates from the old frame to the new one on the UI thread. Reanimated 4 also adds CSS-style animations and transitions: declare `transitionProperty` / `transitionDuration` or keyframes via `animationName` in the style, and state changes animate automatically, without shared values.

```tsx title="src/features/todos/TodoList.tsx"
import Animated, {FadeInDown, FadeOut, LinearTransition} from 'react-native-reanimated';

export function TodoList({todos, onToggle}: {todos: Todo[]; onToggle: (id: string) => void}) {
  return (
    <Animated.View>
      {todos.map(todo => (
        <Animated.View
          key={todo.id}
          entering={FadeInDown.duration(220)}
          exiting={FadeOut.duration(150)}
          layout={LinearTransition.springify().damping(18)} // siblings slide into place
        >
          <TodoRow todo={todo} onToggle={onToggle} />
        </Animated.View>
      ))}
    </Animated.View>
  );
}
```

```tsx title="src/components/ExpandablePill.tsx"
import Animated from 'react-native-reanimated';

const pulse = {
  from: {opacity: 1},
  to: {opacity: 0.45},
};

export function ExpandablePill({expanded, live}: {expanded: boolean; live: boolean}) {
  return (
    <Animated.View
      style={{
        width: expanded ? 220 : 96,
        height: 36,
        borderRadius: 18,
        backgroundColor: expanded ? '#1c7ed6' : '#adb5bd',
        // CSS-style transition: animates when these props change between renders
        transitionProperty: ['width', 'backgroundColor'],
        transitionDuration: 250,
        transitionTimingFunction: 'ease-in-out',
        // CSS-style keyframe animation
        animationName: live ? pulse : undefined,
        animationDuration: '800ms',
        animationIterationCount: 'infinite',
        animationDirection: 'alternate',
      }}
    />
  );
}
```

#### Choosing the tool

| Need | Use |
|---|---|
| State-driven "A to B" style change | CSS transition (Reanimated 4) |
| Looping or keyframed decoration | CSS animation |
| Items appearing, disappearing, reordering | `entering` / `exiting` / `layout` |
| Gesture-driven, interruptible, physics | Shared values + `useAnimatedStyle` |
| Tiny one-off layout change, no dependency | Core `LayoutAnimation` (less control) |

**Pitfalls**

- `width` transitions animate a layout prop: fine for a single pill, expensive for 50 list rows. Prefer transforms where the design allows.
- Entering animations fire on first mount too. Wrap a screen in `<LayoutAnimationConfig skipEntering>` to suppress them on initial render.
- Recycling lists (FlashList) reuse views, which can fight `entering` / `layout` animations; check the list library's guidance before combining them.
- Shared element transitions have been experimental and their status changes between releases; verify before building a feature on them.

> [!INTERVIEW]
> Likely follow-ups: "How does an exiting animation run if React has already removed the element?" (Reanimated keeps the native view mounted until the animation completes), "When would you choose CSS transitions over shared values?"

## Metro and bundling

### How does Metro turn your source files into a bundle?

**Short answer:** Metro runs three stages. **Resolution** maps every import to a file using a Node-like algorithm plus React Native rules (platform extensions such as `.ios.tsx`, `.native.ts`, the `react-native` field, package `exports`). **Transformation** runs each file through Babel (`@react-native/babel-preset`) in a pool of worker processes, with results cached by content and config. **Serialization** assigns module IDs and concatenates everything into one bundle: a prelude and polyfills, each module wrapped in a `__d(factory, id, deps)` definition, and a final `__r(entryId)` call, plus a source map.

```mermaid
flowchart TD
    Entry["Entry file index.js"] --> Resolve["Resolution<br/>platform extensions, node_modules, exports"]
    Resolve --> Transform["Transformation<br/>Babel in worker pool, cached"]
    Transform --> DepGraph["Dependency graph<br/>module IDs and dependencies"]
    DepGraph -->|"new imports discovered"| Resolve
    DepGraph --> Serialize["Serialization<br/>prelude, module factories, entry require"]
    Serialize --> Dev["Dev server<br/>HTTP bundle, HMR deltas over WebSocket"]
    Serialize --> Rel["Release<br/>minified bundle and source map"]
    Rel --> Hbc["hermesc<br/>bytecode bundle and composed map"]
```
*Figure: Metro pipeline from entry file to dev server output or release bytecode bundle.*

#### Details interviewers probe

- **File map and watching.** Metro crawls the project (using Watchman when available) into an in-memory file map, so resolution doesn't hit the disk for every import, and file changes invalidate only affected modules.
- **Platform resolution.** For `import './Button'` on iOS, Metro tries `Button.ios.tsx`, `Button.native.tsx`, `Button.tsx` (and the other `sourceExts`) in order.
- **Package `exports`.** Recent Metro versions honour `package.json` `exports` (with `react-native`, `browser` and `default` conditions) by default; this occasionally changes which file a library resolves to after an upgrade.
- **Module IDs.** Numeric by default; `__d` registers factories and `__r` executes them lazily on first `require`, which is what makes inline requires effective.
- **Caching.** Transform results are cached; after changing Babel config or environment-dependent transforms, run `npx react-native start --reset-cache` (or `npx expo start -c`).
- **Fast Refresh.** The dev server pushes delta updates over a WebSocket and re-executes changed modules, preserving state for components when possible.

### How do you configure Metro for a monorepo?

**Short answer:** Tell Metro to watch the workspace root (`watchFolders`), resolve from both the app's and the root's `node_modules` (`resolver.nodeModulesPaths`), and make sure only one copy of `react` and `react-native` is ever bundled. Symlinks are supported by default in modern Metro, so pnpm or Yarn workspaces work, but the native side (autolinking, Gradle and CocoaPods paths) also needs to find `react-native` and every native dependency. Expo's `getDefaultConfig` configures most of this automatically in recent SDKs.

```js title="apps/mobile/metro.config.js"
const path = require('path');
const {getDefaultConfig, mergeConfig} = require('@react-native/metro-config');

const projectRoot = __dirname;
const workspaceRoot = path.resolve(projectRoot, '../..');
const singletons = ['react', 'react-native'];

const config = {
  watchFolders: [workspaceRoot],
  resolver: {
    nodeModulesPaths: [
      path.resolve(projectRoot, 'node_modules'),
      path.resolve(workspaceRoot, 'node_modules'),
    ],
    // Resolve singletons as if they were imported from the app itself, so a
    // package with its own nested copy can't pull in a second React.
    resolveRequest: (context, moduleName, platform) => {
      if (singletons.some(name => moduleName === name || moduleName.startsWith(`${name}/`))) {
        return context.resolveRequest(
          {...context, originModulePath: path.join(projectRoot, 'index.js')},
          moduleName,
          platform,
        );
      }
      return context.resolveRequest(context, moduleName, platform);
    },
  },
};

module.exports = mergeConfig(getDefaultConfig(projectRoot), config);
```

#### Checklist

- **Duplicate React** shows up as "Invalid hook call" or "Cannot read property of null (reading useState)". Shared packages should list `react` and `react-native` as `peerDependencies`, never `dependencies`.
- **Native dependencies must be declared in the app's `package.json`.** Autolinking reads the app's dependencies; a native library pulled in only transitively by a shared package won't be linked.
- **Paths in native builds:** if `react-native` is hoisted to the root, point the Gradle plugin (`react { reactNativeDir = ... ; codegenDir = ... }`) and the Podfile's `require` statements at the right location, or keep it installed in the app (for pnpm, `node-linker=hoisted` or a per-app `public-hoist-pattern` is the pragmatic choice for RN).
- **Babel config** for shared TS packages: make sure they are transpiled by the app's Metro and not published pre-built with incompatible settings.
- **Caching:** changes in watched packages trigger rebuilds; stale caches after moving packages need `--reset-cache`.

> [!INTERVIEW]

### Why is code splitting limited in React Native, and does Metro tree-shake?

**Short answer:** In RN the whole bundle already ships inside the app binary, and Hermes memory-maps bytecode and only touches the pages it executes, so the main web motivation (download less JS) mostly disappears. What matters is execution cost, which inline requires and lazy screens already address. Metro therefore bundles everything into one file by default and `import()` resolves within that bundle. Metro has historically not done ES-module tree shaking; minification removes some dead code, and Expo offers experimental tree shaking for production builds. Tools like Re.Pack (Rspack/webpack-based) provide real code splitting and Module Federation, mainly for super-apps.

| Goal | RN approach |
|---|---|
| Faster startup | Hermes bytecode, inline requires, lazy screens, fewer dependencies |
| Smaller download | Remove heavy dependencies, compress assets, Android App Bundles, iOS app thinning |
| Load features on demand from a server | Re.Pack chunks or Module Federation; OTA updates for whole bundles |
| Independent team deployments (super-app) | Re.Pack Module Federation, or multiple RN surfaces with separate bundles (complex) |

#### What does and doesn't get removed

- `if (__DEV__) { ... }` blocks and constant-folded branches are eliminated in production by the minifier.
- `Platform.OS === 'ios'` branches are inlined and stripped per platform by Metro's transform (`Platform.select` too, in simple forms).
- Unused exports of a library you import are **not** removed by Metro's default pipeline. Import from deep paths (`lodash/debounce`), prefer ESM-friendly small libraries, and audit the bundle.
- Expo exposes experimental tree shaking behind environment flags (for example `EXPO_UNSTABLE_TREE_SHAKING`); treat it as opt-in and test carefully.

```bash
# Inspect what's in the bundle
npx react-native bundle --platform android --dev false --entry-file index.js \
  --bundle-output /tmp/index.android.bundle --sourcemap-output /tmp/index.android.bundle.map
npx source-map-explorer /tmp/index.android.bundle /tmp/index.android.bundle.map

# Expo: interactive bundle analysis
EXPO_ATLAS=1 npx expo export --platform android
npx expo-atlas .expo/atlas.jsonl
```

### How are Hermes bytecode bundles, source maps and assets produced in a release build?

**Short answer:** The release build runs Metro to produce a minified JS bundle plus a "packager" source map and copies assets into platform resource folders. `hermesc` then compiles the bundle to bytecode with its own source map, and React Native's scripts compose the two maps into one that maps bytecode offsets back to your original TypeScript. The Gradle plugin (Android) and the "Bundle React Native code and images" build phase (iOS) do this automatically; you upload the composed map, plus R8 mappings and dSYMs for native code, to your crash reporter.

```bash
# Simplified version of what the build tooling does
npx react-native bundle --platform android --dev false --minify true \
  --entry-file index.js \
  --bundle-output build/index.android.bundle \
  --sourcemap-output build/index.android.bundle.packager.map \
  --assets-dest build/res

# Compile to Hermes bytecode (emits build/index.android.bundle.hbc.map)
hermesc -emit-binary -O \
  -out build/index.android.bundle.hbc \
  -output-source-map build/index.android.bundle

# Compose Metro map + Hermes map into one usable map
node node_modules/react-native/scripts/compose-source-maps.js \
  build/index.android.bundle.packager.map build/index.android.bundle.hbc.map \
  -o build/index.android.bundle.map
```

| Artifact | Android | iOS |
|---|---|---|
| Bytecode bundle | `assets/index.android.bundle` in the APK/AAB | `main.jsbundle` in the app bundle |
| Composed JS source map | `android/app/build/generated/sourcemaps/react/release/index.android.bundle.map` | Set `SOURCEMAP_FILE` in the bundle build phase to emit it |
| Native symbols | R8 `mapping.txt` | dSYMs |
| Assets | Copied to `res/drawable-*` by density | Copied to an `assets/` folder next to `main.jsbundle` |

#### Assets

`require('./img/logo.png')` doesn't embed the image in JS. Metro registers an asset record (name, type, width, height, available scales such as `@2x` / `@3x`, hash) and the bundle build copies files into native resources; at runtime `Image.resolveAssetSource` picks the best scale for the screen density. Fonts are not handled by Metro: link them natively (`expo-font` config plugin or native project setup). Large bundled assets inflate both the binary and every OTA update that includes them.

**Pitfalls**

- Uploading the Metro map without composing it with the Hermes map gives wrong line numbers.
- Every OTA update ships a new bundle and needs its own source maps uploaded with a matching release and dist identifier (see the [OTA Updates guide](../guides/ota-updates.html)).
- Debug-ID based matching (supported by Sentry's tooling) is more robust than relying on release names alone.
- Firebase Crashlytics symbolicates native crashes; JS errors need a JS-aware reporter or a custom pipeline.

> [!INTERVIEW]
> Likely follow-ups: "A production JS crash shows `index.android.bundle:1:48213`. Walk me through symbolication.", "Why can the same OTA update produce different stack traces on iOS and Android?" (separate bundles and maps per platform).

## React 18 and 19 on mobile

### Which React 18 and 19 features matter in React Native, and which depend on the New Architecture?

**Short answer:** The concurrent features from React 18 (automatic batching, transitions, `useDeferredValue`, Suspense that keeps content visible during transitions) are the most impactful on mobile, and they only work on the New Architecture because they need Fabric's concurrent root. From React 19 (in RN since 0.78), the useful parts are `use`, Actions with `useActionState` and `useOptimistic`, `ref` as a regular prop, and ref cleanup functions. DOM-specific React 19 features (form actions, document metadata, stylesheet and preload APIs) don't apply to React Native.

| Feature | Version | Why it matters on mobile | Needs New Arch |
|---|---|---|---|
| Automatic batching | 18 | Updates in promises, timers and native event callbacks are batched into one render | Yes (concurrent root) |
| `useTransition` / `startTransition` | 18 | Keep taps and typing responsive while expensive screens render | Yes |
| `useDeferredValue` | 18 | Lag heavy derived UI (search results) behind fast input | Yes |
| Suspense + transitions | 18 | Show old content with a pending indicator instead of flashing skeletons | Yes, for the transition behaviour |
| `useSyncExternalStore` | 18 | Tear-free reads from external stores (Zustand, Redux, MMKV-backed state) | No |
| `use(promise)` / `use(context)` | 19 | Suspend on data or read context conditionally | Works best with concurrent root |
| Actions, `useActionState`, `useOptimistic` | 19 | Pending and optimistic UI for mutations (likes, cart, toggles) | Works best with concurrent root |
| `ref` as a prop, ref cleanup | 19 | No `forwardRef` boilerplate; cleaner imperative handles | No |
| `<Context value>` as provider | 19 | Less nesting noise | No |
| `<Activity>`, `useEffectEvent` | 19.2 (recent RN releases) | Keep hidden screens' state while pausing their effects; stable event callbacks in effects | Check your RN version |
| Form actions, `useFormStatus`, metadata, preload | 19 | DOM only | Not applicable |

#### Optimistic UI with an Action

```tsx title="src/features/posts/LikeButton.tsx"
import {useOptimistic, useTransition} from 'react';
import {Pressable, Text} from 'react-native';

type Props = {postId: string; liked: boolean; onServerUpdate: (liked: boolean) => void};

export function LikeButton({postId, liked, onServerUpdate}: Props) {
  const [optimisticLiked, setOptimisticLiked] = useOptimistic(liked);
  const [isPending, startTransition] = useTransition();

  const toggle = () =>
    startTransition(async () => {
      const next = !optimisticLiked;
      setOptimisticLiked(next); // shows immediately
      const confirmed = await api.setLiked(postId, next);
      onServerUpdate(confirmed); // real state; optimistic value is dropped after the action
    });

  return (
    <Pressable onPress={toggle} disabled={isPending} accessibilityRole="button">
      <Text>{optimisticLiked ? 'Liked' : 'Like'}</Text>
    </Pressable>
  );
}
```

If the request throws, the transition ends and the optimistic value reverts to `liked` automatically; surface the error with an error boundary or a toast.

#### Migration notes for React 19

- `propTypes` checks and `defaultProps` on function components are gone; old libraries relying on them need updates (use default parameters).
- `react-test-renderer` is deprecated; use React Native Testing Library.
- String refs and legacy context are removed, which occasionally breaks very old third-party components.

### How do Suspense, transitions and the `use` hook work together in a React Native screen?

**Short answer:** A component calls `use(promise)` (or a library hook such as TanStack Query's `useSuspenseQuery`) and suspends until the data resolves; the nearest `<Suspense>` shows its fallback on first load, and the nearest error boundary catches rejections. When a later update is wrapped in a transition, React keeps the already-committed UI on screen and renders the new tree in the background, so switching filters shows the old list plus a pending indicator rather than a skeleton flash. The one hard rule: the promise must be cached outside render, or every render creates a new promise and suspends forever.

```tsx title="src/features/orders/OrdersScreen.tsx"
import {Suspense, use, useState, useTransition} from 'react';
import {ActivityIndicator, StyleSheet, View} from 'react-native';
import {ErrorBoundary} from 'react-error-boundary';
import {FlashList} from '@shopify/flash-list';

type Filter = 'open' | 'shipped' | 'returned';

// Minimal cache for illustration. In production use TanStack Query, Relay
// or another cache with invalidation and eviction of rejected promises.
const ordersCache = new Map<Filter, Promise<Order[]>>();
function fetchOrders(filter: Filter): Promise<Order[]> {
  let promise = ordersCache.get(filter);
  if (!promise) {
    promise = api.getOrders(filter).catch(err => {
      ordersCache.delete(filter); // allow retry after failure
      throw err;
    });
    ordersCache.set(filter, promise);
  }
  return promise;
}

function OrderList({filter}: {filter: Filter}) {
  const orders = use(fetchOrders(filter)); // suspends until resolved
  return <FlashList data={orders} renderItem={({item}) => <OrderRow order={item} />} />;
}

export function OrdersScreen() {
  const [filter, setFilter] = useState<Filter>('open');
  const [isPending, startTransition] = useTransition();

  return (
    <View style={styles.flex}>
      <FilterTabs
        value={filter}
        onChange={next => startTransition(() => setFilter(next))}
      />
      {isPending && <ActivityIndicator style={styles.pending} />}
      <ErrorBoundary FallbackComponent={OrdersError} resetKeys={[filter]}>
        <Suspense fallback={<OrdersSkeleton />}>
          <OrderList filter={filter} />
        </Suspense>
      </ErrorBoundary>
    </View>
  );
}

const styles = StyleSheet.create({
  flex: {flex: 1},
  pending: {position: 'absolute', top: 56, alignSelf: 'center'},
});
```

#### Behaviour to be able to explain

| Situation | What the user sees |
|---|---|
| First render | `OrdersSkeleton` (Suspense fallback) |
| Filter change inside `startTransition` | Old list stays, `isPending` spinner shows, new list swaps in when ready |
| Filter change without a transition | Old list replaced by the skeleton immediately |
| Promise rejects | Nearest error boundary renders `OrdersError`; `resetKeys` resets it when the filter changes |

**Mobile-specific considerations**

- Navigation libraries render screens in native containers. A Suspense boundary above the navigator would blank the whole app; put boundaries inside screens.
- Prefetch on intent (`onPressIn` on a list row, or when a tab becomes focused) so the promise is already in the cache by the time the screen renders.
- Suspense fallbacks inside lists cause layout shifts; reserve space with skeletons of the same size.

> [!INTERVIEW]
> Likely follow-ups: "Why does creating the promise inside the component loop forever?", "How does this interact with pull-to-refresh?" (refresh via the cache library's refetch inside a transition so content stays visible), "What happens on the legacy architecture?" (transitions degrade to synchronous updates, so you get the skeleton flash).

## Build systems and upgrades

### How does autolinking work, and how do you keep native builds fast?

**Short answer:** Autolinking discovers native code in your dependencies by running the CLI's `config` command (or `expo-modules-autolinking` in Expo projects), which reads each package's `package.json`, `react-native.config.js`, podspec and Gradle files. On Android, the React Native Gradle plugin uses that output to include library projects, generate `PackageList` and wire C++ and Codegen artifacts. On iOS, `use_native_modules!` in the Podfile adds each library's podspec. For build speed: use prebuilt React Native binaries where available (Android pulls RN from Maven; iOS has precompiled RN core builds since around 0.81), build a single ABI locally, enable ccache and Gradle caches, and cache Pods and Gradle in CI.

#### Android wiring (recent templates)

```gradle title="android/settings.gradle"
pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'AcmeApp'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
```

```gradle title="android/app/build.gradle (excerpt)"
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}
```

#### iOS wiring

```ruby title="ios/Podfile (excerpt)"
target 'AcmeApp' do
  config = use_native_modules!

  use_react_native!(
    :path => config[:reactNativePath],
    :app_path => "#{Pod::Config.instance.installation_root}/.."
  )

  post_install do |installer|
    react_native_post_install(
      installer,
      config[:reactNativePath],
      :mac_catalyst_enabled => false,
      :ccache_enabled => true
    )
  end
end
```

Excluding a library from a platform (for example, a web-only dependency that ships an Android folder):

```js title="react-native.config.js"
module.exports = {
  dependencies: {
    'some-analytics-sdk': {
      platforms: {android: null}, // don't autolink on Android
    },
  },
};
```

#### Keeping builds fast

| Lever | How |
|---|---|
| Single ABI locally | `reactNativeArchitectures=arm64-v8a` in `android/gradle.properties` (keep all ABIs for release) |
| Gradle caching | Build cache and configuration cache where plugins support them; a warm Gradle daemon in CI |
| Prebuilt RN on iOS | Precompiled RN core (XCFrameworks) introduced as opt-in around RN 0.81 and adopted by Expo SDK 54; follow your version's release notes for the switch |
| ccache | `:ccache_enabled => true` for C++ heavy iOS builds |
| CI caching | Cache `~/.gradle`, `ios/Pods` keyed on `Podfile.lock`, and the npm/yarn/pnpm store; EAS Build has built-in caching |
| Avoid rebuilds | Keep `Podfile.lock` committed and use `pod install`, not `pod update`, in CI |

> [!NOTE]
> CocoaPods has announced that its central Specs repository ("trunk") will become read-only (planned for late 2026). Existing pods keep working, but this is accelerating the React Native ecosystem's move toward prebuilt binaries and Swift Package Manager. Watch the RN and Expo release notes for the migration path.

> [!INTERVIEW]
> Likely follow-ups: "A library isn't being linked. How do you debug it?" (`npx @react-native-community/cli config` to see what autolinking detected), "Why did `pod install` stop working after an RN upgrade?" (Ruby/CocoaPods versions pinned in the `Gemfile`, stale `Podfile.lock`).

### How do you set up build flavors and R8/ProGuard for a React Native Android app?

**Short answer:** Define `productFlavors` (for example `dev`, `staging`, `prod`) with different application ID suffixes, names and config, and tell the React Native Gradle plugin which variants are debuggable so it doesn't bundle JS for them. Enable R8 (`minifyEnabled` plus `shrinkResources`) for release, rely on libraries' consumer ProGuard rules, add keep rules only for reflection-based code, test the minified build before shipping and upload `mapping.txt` for crash deobfuscation.

```gradle title="android/app/build.gradle (excerpt)"
def enableProguardInReleaseBuilds = true

react {
    autolinkLibrariesWithApp()
    // Variants that load JS from Metro instead of an embedded bundle.
    debuggableVariants = ["devDebug", "stagingDebug", "prodDebug"]
}

android {
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Acme Dev"
            buildConfigField "String", "API_URL", "\"https://dev.api.acme.com\""
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "Acme Staging"
            buildConfigField "String", "API_URL", "\"https://staging.api.acme.com\""
        }
        prod {
            dimension "env"
            resValue "string", "app_name", "Acme"
            buildConfigField "String", "API_URL", "\"https://api.acme.com\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
```

```bash
# Run a specific variant (community CLI v13+ uses --mode)
npx react-native run-android --mode=devDebug --appId=com.acme.app.dev
cd android && ./gradlew bundleProdRelease
```

#### R8 rules

```properties title="android/app/proguard-rules.pro"
# React Native and most RN libraries ship consumer rules inside their AARs.
# Add rules only for code accessed by reflection or JNI that R8 can't see.

# Example: models deserialized by Gson reflection
-keep class com.acme.app.models.** { *; }

# Example: a vendor SDK that documents required rules
-keep class com.vendor.sdk.** { *; }
-dontwarn com.vendor.sdk.**
```

**Gotchas**

- Release-only crashes like `ClassNotFoundException` or `NoSuchMethodError` from JNI are the classic R8 symptom; check the library's README for rules and whether it annotates JNI entry points with `@DoNotStrip`.
- Without `debuggableVariants`, flavored debug variants are treated as release-like: the plugin bundles JS and runs `hermesc` on every debug build.
- JS config per flavor: read `BuildConfig` values through a small native module or a library like `react-native-config`; in Expo, use `app.config.ts` with an `APP_VARIANT` environment variable to change bundle IDs, names and icons.
- iOS equivalents are schemes plus build configurations and `.xcconfig` files; keep the naming aligned with Android flavors.
- Upload `mapping.txt` (and the composed JS source map) for every release, or production stack traces are unreadable.

> [!INTERVIEW]
> Likely follow-ups: "How do you make dev and prod installable side by side?" (different application IDs and bundle IDs, plus separate Firebase config files per flavor), "How do you debug an R8-only crash?" (retrace with `mapping.txt`, reproduce with a minified debug-signed build).

### How do you upgrade React Native safely across several versions?

**Short answer:** Treat it as a project: read each version's release notes, audit native dependencies for compatibility first, then upgrade in checkpoints (one minor version or one Expo SDK at a time for big gaps) using the Upgrade Helper diff for native template files, update the toolchain, clean everything, and verify with automated and manual tests on both platforms before a staged rollout. The dependency audit, not the RN diff itself, is usually where the time goes.

#### Process

1. **Inventory:** list every dependency with native code, its current version, the version that supports your target RN, and whether it's still maintained (React Native Directory helps). Flag blockers early; plan replacements or patches.
2. **Read release notes** for every version in the gap: breaking changes, removed APIs, minimum Xcode, Android Gradle Plugin, Kotlin, JDK, Node and OS versions.
3. **Upgrade in checkpoints.** Create an upgrade branch; for each step bump `react-native` and `react`, apply the [Upgrade Helper](https://react-native-community.github.io/upgrade-helper/) diff (Gradle files, `MainApplication`, `AppDelegate`, Podfile, Gradle wrapper), update libraries and make it build. In Expo, `npx expo install expo@^<next> --fix` followed by `npx expo-doctor`.
4. **Clean builds:** remove `node_modules`, `ios/Pods`, `ios/build` and DerivedData, run `./gradlew clean`, reset the Metro cache.
5. **Verify:** typecheck, unit tests, E2E (Detox or Maestro), then manual checks of native-heavy flows: push notifications, deep links, payments, camera, background tasks, keyboard and edge-to-edge layouts.
6. **Compare performance:** startup time, memory and frame metrics against the previous release.
7. **Release carefully:** internal and beta testing, Play staged rollout and App Store phased release, and a new OTA runtime version, since native code changed and old OTA updates must not reach the new binary (see the [Deployment guide](../guides/deployment.html)).

#### Time-sensitive platform requirements to fold in

| Requirement | Impact |
|---|---|
| Play target API level rises every August | Bump `targetSdkVersion`; test behaviour changes such as edge-to-edge enforcement on API 35+ |
| Play 16 KB page size support for apps targeting Android 15+ | Every native `.so` must be 16 KB aligned; old native libraries may need updates |
| Apple minimum Xcode and SDK rises every spring | CI images and local machines must move together |
| RN 0.82+ runs only on the New Architecture | Any library relying on legacy-only APIs is a hard blocker |

**Pitfalls:** mixing a huge RN jump with feature work in the same branch; using `patch-package` without upstream issues (patches rot); forgetting to update CI images; skipping Android low-end device testing after a Hermes or Reanimated major bump.

> [!INTERVIEW]
> What a senior answer includes: dependency audit first, stepwise checkpoints, Upgrade Helper, toolchain alignment, test plan covering native integrations, staged rollout and OTA runtime versioning. Red flag: "I just bump the version and run `pod install`".

## Brownfield integration

### How do you embed React Native in an existing native app?

**Short answer:** Add the React Native project to the native repo (a JS package with `react-native` installed, the Gradle plugin on Android and `use_react_native!` in the Podfile on iOS), create one long-lived React host for the whole app (`ReactHost` on Android, `RCTReactNativeFactory` on iOS in current versions), register each RN entry point with `AppRegistry.registerComponent`, and render them as surfaces inside native screens (`ReactActivity` / `ReactFragment` on Android, a root view from the factory on iOS), passing initial props. The exact boilerplate changes between releases, so copy it from the integration guide for your RN version.

#### JS entry points

```ts title="index.js"
import {AppRegistry} from 'react-native';
import {ProfileScreen} from './src/screens/ProfileScreen';
import {CheckoutFlow} from './src/flows/CheckoutFlow';

// Each registered name can be mounted as a separate surface by native code.
AppRegistry.registerComponent('ProfileScreen', () => ProfileScreen);
AppRegistry.registerComponent('CheckoutFlow', () => CheckoutFlow);
```

#### Android

```kotlin title="android/app/src/main/java/com/acme/app/AcmeApplication.kt"
package com.acme.app

import android.app.Application
import com.facebook.react.PackageList
import com.facebook.react.ReactApplication
import com.facebook.react.ReactHost
import com.facebook.react.ReactNativeApplicationEntryPoint.loadReactNative
import com.facebook.react.defaults.DefaultReactHost.getDefaultReactHost

class AcmeApplication : Application(), ReactApplication {

  // One host = one JS runtime shared by every RN surface in the app.
  override val reactHost: ReactHost by lazy {
    getDefaultReactHost(
      context = applicationContext,
      packageList = PackageList(this).packages,
    )
  }

  override fun onCreate() {
    super.onCreate()
    // Recent templates; older versions call SoLoader.init(...) and
    // DefaultNewArchitectureEntryPoint.load() here instead.
    loadReactNative(this)
  }
}
```

/// One factory (one JS runtime) shared by every React Native screen.
final class ReactNativeRuntime {
  static let shared = ReactNativeRuntime()

  private let delegate = ReactNativeDelegate()
  let factory: RCTReactNativeFactory

  private init() {
    delegate.dependencyProvider = RCTAppDependencyProvider()
    factory = RCTReactNativeFactory(delegate: delegate)
  }

  func makeView(module: String, props: [String: Any]) -> UIView {
    factory.rootViewFactory.view(withModuleName: module, initialProperties: props)
  }
