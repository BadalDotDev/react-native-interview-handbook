# Advanced Q&A

Deep-dive answers on React Native internals: the New Architecture (JSI, TurboModules, Fabric, Codegen, Bridgeless), native modules in Kotlin, Objective-C++, Swift and C++, Hermes, performance forensics, Reanimated, Metro, React 19, build systems and brownfield integration. At this level interviewers push past definitions into threads, memory, lifetimes and failure modes, so every answer here goes one layer deeper than "what it is".

## New Architecture internals

For the long-form walkthrough of the migration story and concepts, read the [New Architecture guide](../guides/new-architecture.html). The questions below focus on the mechanics interviewers probe.

### How did the legacy bridge work, and why was it replaced?

**Short answer:** The legacy bridge connected the JS runtime and the native side through an asynchronous, batched message queue. Every call was serialized to JSON, queued in `MessageQueue.js`, flushed to native in batches, deserialized and dispatched by reflection; results came back as callbacks on a later flush. It was simple and engine-agnostic, but it forced everything to be async, paid serialization costs on every hop, initialized modules eagerly, had no type contract between JS and native, and made synchronous layout and concurrent React impossible.

#### How a call actually flowed

1. JS calls `NativeModules.Storage.get('k')`. The JS proxy calls `MessageQueue.enqueueNativeCall(moduleID, methodID, params, onFail, onSuccess)`. Callbacks are stored in a table keyed by callback ID; only IDs cross the bridge.
2. Calls accumulate in three parallel arrays (module IDs, method IDs, params). They are flushed when native next calls into JS (`callFunctionReturnFlushedQueue` / `invokeCallbackAndReturnFlushedQueue` return the pending queue as their result), or JS forces a flush with `nativeFlushQueueImmediate` if at least ~5 ms have passed since the last one.
3. The C++ bridge parses the batch (into `folly::dynamic`), looks up each module and dispatches the method on that module's queue: a per-module serial queue on iOS, the shared native-modules thread on Android. Methods were found via `RCT_EXPORT_METHOD` selectors or `@ReactMethod` reflection.
4. Results travel back the same way as `invokeCallbackAndReturnFlushedQueue(callbackID, args)`.

UI went through the same pipe. The Paper renderer sent `UIManager.createView / updateView / manageChildren` messages, native built shadow views (`RCTShadowView` / `ReactShadowNode`), ran Yoga on a shadow thread and applied the result on the main thread.

```mermaid
flowchart TD
    subgraph legacy["Legacy bridge"]
        JS1["JS thread<br/>NativeModules.Foo.bar(args, cb)"] --> MQ["MessageQueue.js<br/>batch + JSON serialize"]
        MQ -.->|"async flush, 5 ms batches"| BR["C++ bridge<br/>parse to folly dynamic"]
        BR --> NQ["Native module queue<br/>reflection dispatch"]
        NQ -.->|"callback ID + JSON result"| MQ
    end
    subgraph newarch["JSI - New Architecture"]
        JS2["JS thread<br/>NativeFoo.bar(args)"] -->|"direct C++ call"| HO["jsi HostObject method<br/>generated by Codegen"]
        HO -->|"typed conversion, no JSON"| IMPL["Kotlin / ObjC++ / C++ impl"]
        IMPL -->|"return value or Promise"| JS2
    end
```
*Figure: Legacy bridge (serialized, batched, async) versus JSI (direct, typed, sync or async by choice).*

#### Limitations that motivated the rewrite

| Limitation | Practical consequence |
|---|---|
| Async only | `measure()` returned a frame late, so tooltips and popovers flickered; no synchronous reads of native state. |
| JSON serialization on every hop | Large payloads (base64 images, big arrays) were expensive; no way to share memory or pass native object references. |
| Batching and a single channel | High-frequency traffic (scroll, gestures, sensors) congested the bridge, which is why `useNativeDriver` existed. |
| Eager module initialization | Native modules were registered and often initialized at startup whether used or not, which hurt TTI (worst on Android). |
| No type contract | JS and native signatures drifted silently; errors surfaced at runtime, often only in release builds. |
| Paper renderer design | A single mutable native shadow tree with no multi-tree support meant React's concurrent features couldn't work. |

> [!INTERVIEW]
> What a senior answer includes: batching and the ~5 ms flush heuristic, callback IDs instead of functions, eager module init, and the link between bridge congestion and `useNativeDriver`. Red flags: "the bridge was slow because of JSON" as the whole story (latency and asynchrony mattered more), or "JSI makes every call synchronous". Likely follow-ups: "What does JSI change?", "How did you debug bridge traffic?" (`MessageQueue.spy`).

### What is JSI, and what does a JSI host object look like?

**Short answer:** JSI (JavaScript Interface) is a small, engine-agnostic C++ API (`jsi.h`) that Hermes, JSC and V8 implement. It lets C++ hold real references to JS values (`jsi::Object`, `jsi::Function`) and lets JS hold references to C++ objects (`jsi::HostObject`) and call C++ functions (host functions) directly, with no serialization and no queue. Calls can be synchronous. TurboModules, Fabric, Reanimated, VisionCamera, MMKV and Skia are all built on it.

#### A minimal host object

```cpp title="cpp/KVStoreHostObject.h"
#pragma once
#include <jsi/jsi.h>
#include <string>
#include <unordered_map>

using namespace facebook;

class KVStoreHostObject : public jsi::HostObject {
 public:
  jsi::Value get(jsi::Runtime& rt, const jsi::PropNameID& name) override {
    auto prop = name.utf8(rt);

    if (prop == "get") {
      return jsi::Function::createFromHostFunction(
          rt, name, 1,
          [this](jsi::Runtime& rt, const jsi::Value&, const jsi::Value* args,
                 size_t count) -> jsi::Value {
            if (count < 1 || !args[0].isString()) {
              throw jsi::JSError(rt, "get(key) expects a string");
            }
            auto it = store_.find(args[0].asString(rt).utf8(rt));
            if (it == store_.end()) return jsi::Value::null();
            return jsi::String::createFromUtf8(rt, it->second);
          });
    }

    if (prop == "set") {
      return jsi::Function::createFromHostFunction(
          rt, name, 2,
          [this](jsi::Runtime& rt, const jsi::Value&, const jsi::Value* args,
                 size_t count) -> jsi::Value {
            if (count < 2) throw jsi::JSError(rt, "set(key, value) needs 2 args");
            store_[args[0].asString(rt).utf8(rt)] = args[1].asString(rt).utf8(rt);
            return jsi::Value::undefined();
          });
    }

    return jsi::Value::undefined();
  }

  std::vector<jsi::PropNameID> getPropertyNames(jsi::Runtime& rt) override {
    return jsi::PropNameID::names(rt, "get", "set");
  }

 private:
  std::unordered_map<std::string, std::string> store_;
};

// Called once with the runtime (e.g. from a TurboModule's install method).
inline void installKVStore(jsi::Runtime& rt) {
  auto obj = jsi::Object::createFromHostObject(
      rt, std::make_shared<KVStoreHostObject>());
  rt.global().setProperty(rt, "__kvStore", std::move(obj));
}
```

From JS, `global.__kvStore.get('token')` is now a plain synchronous function call into C++.

#### Rules that bite people

- **The runtime is not thread-safe.** Only touch `jsi::Runtime`, `jsi::Value` or `jsi::Object` on the JS thread. Work done on a background thread must hop back through a `CallInvoker` (`jsInvoker->invokeAsync([](jsi::Runtime& rt) { ... })`) before resolving a promise or calling a JS function.
- **Don't cache `jsi::Value` across calls** without thinking about lifetime. Keep `jsi::Function` or `jsi::Object` in a `shared_ptr` that is only accessed on the JS thread, and release it before the runtime is torn down (reloads).
- **Sync is a choice, not a requirement.** JSI enables synchronous calls; a well-designed API still makes slow work async.
- **Zero-copy binary data** is possible with `jsi::ArrayBuffer` and `jsi::MutableBuffer`, which is how libraries pass pixel buffers or file bytes without base64.
- **Prefer higher-level tools.** Hand-installed globals bypass Codegen and lazy loading. For app code, use a C++ TurboModule, Nitro Modules or Expo Modules, which generate this plumbing for you.

> [!INTERVIEW]
> What a senior answer includes: engine-agnostic C++ layer, host objects vs host functions, synchronous by capability, thread-affinity of the runtime, `CallInvoker` for hopping back to JS. Red flags: calling JS from a background thread, or claiming JSI "removes the JS thread". Likely follow-ups: "How would you return a large binary buffer without copying?", "What happens to a host object when JS garbage-collects it?" (its `shared_ptr` is released and the C++ destructor runs).

### How do TurboModules differ from legacy native modules, and what does a call look like end to end?

**Short answer:** TurboModules are native modules exposed through JSI and generated from a typed spec. They load lazily on first access instead of at startup, calls go through Codegen-generated C++ glue with typed conversions instead of JSON, and methods can be synchronous or asynchronous. Codegen gives compile-time checking that native code matches the TypeScript contract.

| | Legacy native module | TurboModule |
|---|---|---|
| Loading | Registered (often initialized) at startup | Created on first `TurboModuleRegistry.get*` call |
| Transport | Bridge: batched JSON messages | JSI host object: direct C++ call |
| Contract | Reflection over `@ReactMethod` / `RCT_EXPORT_METHOD` | TypeScript spec, Codegen, native compile errors on drift |
| Sync methods | `isBlockingSynchronousMethod` hack | First-class (return a value) |
| Async methods | Callback IDs over the bridge | `Promise` resolved via `CallInvoker` on the JS thread |
| Threading | Module queue | Sync on JS thread; async on the native-modules thread (Android) or the module's method queue (iOS) |

```mermaid
sequenceDiagram
    participant JS as JS code
    participant Reg as TurboModuleRegistry
    participant Mgr as TurboModuleManager (C++)
    participant Spec as Generated SpecJSI glue
    participant Impl as Kotlin or ObjC++ impl
    JS->>Reg: getEnforcing('NativeDeviceStats')
    Reg->>Mgr: first access, look up provider
    Mgr->>Impl: instantiate lazily
    Mgr-->>JS: jsi HostObject (cached)
    JS->>Spec: getTotalMemoryMb()
    Spec->>Impl: JNI or ObjC call with typed args
    Impl-->>Spec: double
    Spec-->>JS: number, synchronously
    JS->>Spec: sha256(input)
    Spec->>Impl: dispatch to module queue
    Spec-->>JS: pending Promise
    Impl-->>JS: resolve via CallInvoker on JS thread
```
*Figure: TurboModule call path, lazy creation, a sync call and an async call.*

```ts title="src/useDeviceStats.ts"
import NativeDeviceStats from '../specs/NativeDeviceStats';

export async function collectDiagnostics() {
  const totalMb = NativeDeviceStats.getTotalMemoryMb(); // sync, returns number
  const fingerprint = await NativeDeviceStats.sha256(String(totalMb)); // async
  return {totalMb, fingerprint};
}
```

**Gotchas**

- On Android, all async methods of all modules share one native-modules thread by default. A slow method (disk, crypto) delays every other module's calls, so heavy modules should use their own executor.
- `TurboModuleRegistry.get` returns `null` when the module isn't linked; `getEnforcing` throws at import time. Use `get` for optional, platform-specific modules.
- Lazy loading means a module's constructor runs on first use, sometimes mid-interaction. Keep constructors cheap; do expensive setup on demand.

> [!INTERVIEW]
> Likely follow-ups: "Which thread runs a Promise-returning method on Android?", "How is laziness achieved?" (the registry is a JSI proxy consulted per module name), "What types can a spec use?" (primitives, arrays, typed objects, callbacks, Promises, limited enums and unions, `UnsafeObject` as an escape hatch).

### What does Codegen do, when does it run, and what does it generate?

**Short answer:** Codegen reads typed JS specs (TypeScript or Flow files named `Native*.ts` for modules and `*NativeComponent.ts` for components), converts them into a schema, and generates the native scaffolding: abstract Java spec classes and JNI glue for Android, Objective-C++ protocols and `SpecJSI` classes for iOS, and shared C++ (C++ module base classes, component props, event emitters, shadow nodes and component descriptors). It runs during the Gradle build on Android and during `pod install` on iOS, so a spec change that native code doesn't implement fails the build instead of crashing at runtime.

```mermaid
flowchart TD
    Spec["Typed specs<br/>NativeDeviceStats.ts, ProgressRingNativeComponent.ts"] --> Parser["Codegen parser"]
    Cfg["codegenConfig in package.json"] --> Parser
    Trigger["Gradle build or pod install"] -->|"invokes"| Parser
    Parser --> Schema["Intermediate schema JSON"]
    Schema --> OutA["Android: Java abstract Spec classes<br/>+ JNI C++ glue"]
    Schema --> OutI["iOS: ObjC++ protocols<br/>+ SpecJSI C++ classes"]
    Schema --> OutC["Shared C++: CxxSpec bases, Props,<br/>EventEmitters, ShadowNodes, Descriptors"]
    OutA --> Impl["Your Kotlin / ObjC++ / C++<br/>implements the generated contract"]
    OutI --> Impl
    OutC --> Impl
    Impl --> Check["Build fails if the implementation<br/>drifts from the spec"]
```
*Figure: Codegen flow from spec to native glue.*

#### Configuration

```json title="package.json"
{
  "codegenConfig": {
    "name": "AppSpecs",
    "type": "all",
    "jsSrcsDir": "specs",
    "android": { "javaPackageName": "com.acme.app.specs" },
    "ios": {
      "modulesProvider": { "NativeDeviceStats": "RCTNativeDeviceStats" },
      "componentProvider": { "ProgressRing": "RCTProgressRing" }
    }
  }
}
```

- `name` becomes the generated library and header name (`#import <AppSpecs/AppSpecs.h>`, `#include <AppSpecsJSI.h>`).
- `type` is `modules`, `components` or `all`.
- In recent versions the iOS `modulesProvider` / `componentProvider` maps tell the app which ObjC class implements which spec, replacing older registration macros for app-level code.

#### Where the output lands

| Platform | Output location (typical) | Trigger |
|---|---|---|
| Android | `android/app/build/generated/source/codegen/` (and the library's own `build/`) | `generateCodegenArtifactsFromSchema` Gradle task |
| iOS | `ios/build/generated/ios/` | `pod install` (script phase in the generated pods) |

Libraries can ship pre-generated code (`"includesGeneratedCode": true`) so consumers don't need to run Codegen for them.

**Pitfalls:** forgetting to re-run `pod install` after editing a spec (iOS keeps stale headers); spec files not matching the naming convention are silently ignored; Codegen supports a subset of TypeScript, so exotic types (mapped types, generics, most unions) fail parsing and must be simplified.

> [!INTERVIEW]
> What a senior answer includes: the naming conventions, that the spec is the single source of truth, when generation runs on each platform, and what "type safety" really covers (JS-to-native boundary shapes, not runtime validation of untyped data you pass in).

### What is Bridgeless mode, and what actually changed when the bridge was removed?

**Short answer:** Bridgeless mode removes the legacy bridge objects (`RCTBridge` on iOS, `CatalystInstance` on Android) entirely. The runtime is owned by a new host/instance pair (`RCTHost`/`RCTInstance` on iOS, `ReactHost`/`ReactInstance` on Android), and everything the bridge used to provide (JS module calls, timers, error handling, event emission, module lookup) is reimplemented on JSI. It became the default with the New Architecture in RN 0.74, and since RN 0.82 there is no way back to the legacy architecture.

#### What moved where

| Bridge-era responsibility | Bridgeless replacement |
|---|---|
| `RCTBridge` / `CatalystInstance` lifecycle | `RCTHost` / `ReactHost` (creates the runtime, loads the bundle, owns surfaces) |
| `callFunctionOnModule` over the bridge | Direct JSI calls into the runtime |
| Timers via a bridge module | Native timer manager driven from C++ |
| Module lookup via `bridge.moduleForClass` | TurboModule manager; legacy modules through the interop layer |
| `RCTRootView` with a bridge | Surfaces created by the host (`RCTReactNativeFactory` / `ReactSurface`) |

#### What breaks in libraries

- iOS code that reaches for `self.bridge` or `[RCTBridge currentBridge]` gets nil or a compatibility proxy. Use the injected `moduleRegistry`, `viewRegistry_DEPRECATED` or `callableJSModules` instead.
- Android code that calls `reactContext.getCatalystInstance()` or `hasActiveCatalystInstance()` must switch to `hasActiveReactInstance()` and the context's JS module accessors.
- Anything that assumed module init order or "the bridge exists before any JS runs".

JS can detect the mode with `global.RN$Bridgeless === true`, which is occasionally useful in libraries that support older versions.

> [!NOTE]
> "New Architecture" and "Bridgeless" are separate flags historically: you could run Fabric and TurboModules with a bridge still present (RN 0.68-0.73). Since 0.74 the default New Architecture setup is bridgeless.

> [!INTERVIEW]
> Red flag: "Bridgeless just means TurboModules". A strong answer mentions the host/instance objects, that legacy modules still work through interop, and the specific APIs libraries had to stop using.

### How do the interop layers work, and how would you migrate a library to the New Architecture?

**Short answer:** Interop layers let old-style code run on the New Architecture without rewrites: legacy native modules (`RCT_EXPORT_METHOD`, `@ReactMethod`) are wrapped and exposed through the TurboModule system, and legacy view managers are rendered inside Fabric through a generic interop component (automatic since 0.74). They are a bridge for the ecosystem, not a destination: they rely on reflection, don't support custom shadow nodes, and lose the performance and type-safety benefits. Migrating means writing Codegen specs, implementing the generated interfaces natively and removing bridge-only APIs.

#### What the interop layer does not cover well

- Custom shadow nodes (`RCTShadowView` / `ReactShadowNode` subclasses that measure content, e.g. custom text layout): not supported. These need a real Fabric component with a C++ shadow node.
- Native code that grabs views through `UIManager` directly (`addUIBlock`, `viewForReactTag`, `resolveView`): partially supported, fragile.
- Synchronous access patterns and `setNativeProps` from native.
- Performance: every legacy call pays reflection and conversion costs.

#### Migration steps for a library

1. **Scaffold or compare** with `npx create-react-native-library@latest` (Turbo module / Fabric view templates) to see the current expected layout.
2. **Write the specs:** `src/NativeMyLib.ts` (module) and/or `src/MyViewNativeComponent.ts` (component).
3. **Add `codegenConfig`** to the library's `package.json` (`name`, `type`, `jsSrcsDir`, `android.javaPackageName`).
4. **Android:** make the module extend the generated `NativeMyLibSpec`, use `BaseReactPackage` (formerly `TurboReactPackage`) with `isTurboModule = true` in `ReactModuleInfo`, and make view managers implement the generated `MyViewManagerInterface` and return the generated delegate from `getDelegate()`.
5. **iOS:** rename to `.mm`, conform to the generated protocol, implement `getTurboModule:` returning the `SpecJSI`, and write components as `RCTViewComponentView` subclasses. In the podspec call `install_modules_dependencies(s)`.
6. **Remove bridge-only APIs** (see Bridgeless above) and replace `NativeEventEmitter` plumbing with typed Codegen events if your minimum RN version allows.
7. **Decide on backward compatibility.** Supporting apps still on the legacy architecture (pre-0.82) means dual code paths: Android source sets such as `src/newarch` and `src/oldarch` selected by the `newArchEnabled` Gradle property, and `#ifdef RCT_NEW_ARCH_ENABLED` on iOS. If you target 0.82+ only, delete the old paths.
8. **Verify** in the example app on both platforms, run the New Architecture checks in React Native Directory, and add CI jobs for the RN versions you support.

```ruby title="react-native-my-lib.podspec"
Pod::Spec.new do |s|
  s.name         = "react-native-my-lib"
  s.version      = "2.0.0"
  s.source_files = "ios/**/*.{h,m,mm,swift,cpp}"
  s.platforms    = { :ios => "15.1" }
  # Adds React-Core, Codegen and the other New Architecture dependencies.
  install_modules_dependencies(s)
end
```

> [!INTERVIEW]
> What a senior answer includes: which things interop cannot do (custom shadow nodes), the dual-path cost for supporting old RN versions, and a plan to audit dependencies before an app upgrade. Likely follow-ups: "How did you handle a dependency that wasn't migrated?" (patch-package, fork, replace, or keep it behind interop temporarily while tracking the upstream issue).

## Fabric and the threading model

### What happens between setState and pixels on screen in Fabric?

**Short answer:** Fabric processes every update in three phases. **Render** (JS thread): React reconciles and, through JSI calls into Fabric's C++ UIManager, builds a new immutable shadow tree, cloning only the changed path and sharing the rest. **Commit**: Yoga computes layout on that tree and it is atomically promoted to "next tree to mount". **Mount** (UI thread): Fabric diffs the previously mounted tree against the new one, produces a list of mutations (create, delete, insert, remove, update) and applies them to real `UIView` / `android.view.View` instances; the next vsync draws them.

```mermaid
sequenceDiagram
    participant JS as JS thread (React)
    participant Core as Fabric C++ core
    participant UI as UI main thread
    JS->>JS: Render - run components, reconcile
    JS->>Core: createNode and cloneNode via JSI
    JS->>Core: completeRoot(new children)
    Note over Core: New immutable shadow tree
    Core->>Core: Commit - Yoga layout, commit hooks, promote tree
    Core->>UI: schedule mount
    UI->>Core: pull transaction from MountingCoordinator
    Core-->>UI: diff to mutations - create, insert, update, remove
    UI->>UI: Mount - apply to host views
    Note over UI: Next vsync draws the pixels
```
*Figure: Fabric render, commit and mount across threads for a normal-priority update.*

#### Details worth knowing

- **Immutability and structural sharing.** A shadow node is never mutated after it is sealed. Updating a leaf clones the leaf and each ancestor up to the root; untouched subtrees are shared by pointer. That is what allows React to prepare a tree without mounting it, and allows any thread to read a committed tree safely.
- **Commit is atomic and serialized per surface.** Each root view is a "surface" with its own `ShadowTree`. Commits are serialized, and *commit hooks* let native code (for example Reanimated) merge its own changes into the tree before promotion.
- **Layout lives in C++.** Yoga runs on the shadow tree during commit, so layout results are available synchronously to C++ and JS, not only after a round-trip to native.
- **Mounting is pulled, not pushed.** The UI thread asks the `MountingCoordinator` for the latest transaction. If several commits happened in between, it receives one combined diff, so intermediate states are skipped.
- **View flattening happens during diffing**: layout-only nodes never become host views (see the next questions).

**Not every update comes from React.** Native components can hold *C++ state* (e.g. scroll offset, measured text) that the UI thread updates directly, which triggers a commit without a React render. High-priority events can also render, commit and mount synchronously on the UI thread.

> [!INTERVIEW]
> What a senior answer includes: the three phases and their threads, why immutability matters (thread safety and concurrent rendering), where Yoga runs, and that mounting applies a diff. Likely follow-ups: "Why can Fabric skip intermediate states?", "What is a commit hook used for?", "What happens to a tree React rendered but then abandoned?" (it is simply never committed and gets freed).

### How does the threading model work under the New Architecture?

**Short answer:** There are three kinds of threads to reason about. The **UI (main) thread** owns native views, receives touches and runs native and Reanimated animations. The **JS thread** runs the Hermes runtime: React rendering, effects, timers and your business logic. **Background and native threads** handle async native-module work, networking, image decoding and garbage collection. Fabric's C++ core is thread-agnostic: shadow trees are immutable, so commit and layout run on whichever thread triggered the commit (usually the JS thread right after render), while mounting always happens on the UI thread.

```mermaid
flowchart TD
    subgraph uiT["UI main thread"]
        Touch["Touches, gestures, native scroll"]
        Mount["Mount: mutate UIView / android.view.View"]
        UIRT["Reanimated UI runtime - worklets"]
    end
    subgraph jsT["JS thread"]
        React["React render and effects"]
        Biz["App JS: state, timers, fetch callbacks"]
    end
    Core["Fabric C++ core<br/>immutable shadow trees, Yoga<br/>commit on the calling thread"]
    subgraph bgT["Background and native threads"]
        Mods["Async TurboModule methods"]
        IO["Networking, image decode, Hermes GC"]
    end
    Touch -->|"events with priority"| React
    React -->|"render output"| Core
    Core -->|"mount transaction"| Mount
    Biz -->|"async native calls"| Mods
    Mods -.->|"CallInvoker - results back"| Biz
    Touch -->|"gesture callbacks"| UIRT
    UIRT -->|"direct prop updates"| Mount
```
*Figure: Threading model: UI thread, JS thread, thread-agnostic Fabric core and background threads.*

#### What blocks what

| Busy thread | Still smooth | Janks |
|---|---|---|
| JS thread (long loop, heavy render) | Native scroll, native-driver and Reanimated animations, native navigation transitions | `onPress` handlers, JS-driven animations, state updates, text input echo in controlled inputs |
| UI thread (huge mount, image decode on main, sync native work) | Nothing visible | Everything: scroll, animations, touches |
| Android native-modules thread | JS and UI | Other modules' async calls queue up behind the slow one |

#### Practical rules

- Never do blocking I/O in a synchronous native method: it runs on the JS thread.
- Never do heavy work in a worklet: it runs on the UI thread and drops frames for the whole app.
- iOS modules that touch UIKit must use the main queue (`methodQueue` returning `dispatch_get_main_queue()`), but keep that work tiny.
- In traces, the JS thread appears as `mqt_js` (or `mqt_v_js` in bridgeless builds) on Android and as a named thread such as `com.facebook.react.JavaScript` on iOS.

> [!NOTE]
> The official architecture docs describe layout as happening on a "background thread". In practice the key property is that any thread may commit; for ordinary React updates the commit, including Yoga layout, typically runs on the JS thread immediately after render.

> [!INTERVIEW]
> Red flags: "React Native is multi-threaded so JS can't block the UI" (a sync native call or a heavy worklet can), or not knowing where animations run. Likely follow-ups: "Why does a ScrollView still scroll when JS is frozen?", "Where do Gesture Handler callbacks run?"

### What is view flattening, and when do you need `collapsable={false}`?

**Short answer:** View flattening is a Fabric optimization that removes "layout-only" views, meaning `View`s that only affect layout and have no visual or interactive role, from the host view hierarchy. Their children are attached to the nearest surviving ancestor with adjusted offsets. It reduces view count, memory and mount time. You opt a view out with `collapsable={false}` when native code must find that exact view: snapshotting, native measuring by reference, some third-party native components that expect a real child view.

A view is flattened only if it is layout-only. Anything that needs a real native view prevents flattening, for example:

- backgrounds, borders, shadows, `opacity` other than 1, `transform`, `overflow: 'hidden'` clipping
- accessibility props (`accessible`, labels, roles) and `nativeID`
- event or responder props that need native hit testing
- `collapsable={false}`

```tsx title="src/components/Card.tsx"
import {View, Text, StyleSheet} from 'react-native';

export function Card({title, body}: {title: string; body: string}) {
  return (
    <View style={styles.card}>
      {/* Layout-only wrapper: flattened, no UIView / ViewGroup created */}
      <View style={styles.row}>
        <Text style={styles.title}>{title}</Text>
      </View>
      {/* Must stay a real view: a native snapshot library captures it by ref */}
      <View collapsable={false} style={styles.body}>
        <Text>{body}</Text>
      </View>
    </View>
  );
}

const styles = StyleSheet.create({
  card: {backgroundColor: '#fff', borderRadius: 12, padding: 16},
  row: {flexDirection: 'row', alignItems: 'center'},
  title: {fontSize: 17, fontWeight: '600'},
  body: {marginTop: 8},
});
```

#### Things to know

- The legacy architecture only did this on Android ("layout-only nodes"); Fabric does it in shared C++ for both platforms, so iOS view hierarchies got noticeably flatter after migration.
- Flattening is dynamic. If a prop change turns a layout-only view into a visual one (say, a background appears on press), the differ "unflattens" it by creating the host view and reparenting children. This is correct but costs extra mutations, so views that toggle visual props frequently are cheaper to keep unflattened.
- UI tests that locate views by native hierarchy position can break; locate by `testID` / accessibility identifiers instead.

> [!INTERVIEW]
> Likely follow-ups: "Why did a native library stop finding its child view after the migration?" (flattening), "How do you inspect the real host hierarchy?" (Xcode View Debugger, Android Studio Layout Inspector).

### How does Fabric make synchronous layout and concurrent React possible?

**Short answer:** Because layout is computed in C++ during commit and host instances can read it through JSI, measuring a view is a synchronous call, and a state update made in `useLayoutEffect` is committed before the first mount, so there is no flicker. Concurrent React needs to prepare trees it may later discard, interrupt rendering, and commit atomically; Fabric's immutable shadow trees and atomic commits provide exactly that, which is why transitions, `useDeferredValue`, Suspense-with-transitions and automatic batching only fully work on the New Architecture.

#### Synchronous layout: the tooltip case

With the legacy bridge, `measure` answered asynchronously, so a tooltip rendered at a default position for one frame, then jumped. With Fabric:

```tsx title="src/components/Tooltip.tsx"
import {useLayoutEffect, useState, type RefObject} from 'react';
import {StyleSheet, Text, View} from 'react-native';

type Props = {anchorRef: RefObject<View | null>; text: string};

export function Tooltip({anchorRef, text}: Props) {
  const [pos, setPos] = useState<{top: number; left: number} | null>(null);

  useLayoutEffect(() => {
    // On Fabric the callback runs synchronously, and this state update is
    // committed before the tree is mounted: the tooltip never flashes.
    anchorRef.current?.measureInWindow((x, y, width, height) => {
      setPos({top: y + height + 8, left: x + width / 2 - 80});
    });
  }, [anchorRef]);

  if (!pos) return null;
  return (
    <View style={[styles.tip, {top: pos.top, left: pos.left}]}>
      <Text style={styles.text}>{text}</Text>
    </View>
  );
}

const styles = StyleSheet.create({
  tip: {position: 'absolute', width: 160, padding: 8, borderRadius: 8, backgroundColor: '#222'},
  text: {color: '#fff'},
});
```

Recent RN versions also expose a subset of DOM-like APIs on host refs (for example `getBoundingClientRect()`), which read the same synchronously available layout.

#### Concurrent React

| Feature | Why it needs Fabric |
|---|---|
| `startTransition` / `useTransition` | React renders a low-priority tree that may be interrupted or thrown away. Immutable trees make "render without commit" safe. |
| `useDeferredValue` | Same mechanism: a background render at lower priority. |
| Suspense with transitions | Keeps the committed UI on screen while a new tree suspends. |
| Automatic batching | Requires the concurrent root, which the legacy renderer never used. |
| Event priorities | Native events carry a priority (discrete for taps, continuous for scroll) mapped to React lanes. |

On the legacy architecture React 18 APIs existed but ran in legacy (synchronous) mode, so transitions silently degraded to normal updates.

> [!WARNING]
> Concurrent rendering yields between components, not inside them. A single component that does 200 ms of synchronous work, or a long loop in an event handler, still blocks the JS thread. Transitions are about scheduling React work, not a substitute for moving heavy computation elsewhere.

> [!INTERVIEW]
> What a senior answer includes: layout in C++, synchronous measurement in `useLayoutEffect`, why immutability enables interruptible rendering, and the limits of concurrency. Likely follow-ups: "Why did transitions do nothing in your old-arch app?", "When would you still see a layout flash on Fabric?" (async data arriving after mount, or measuring in `useEffect`).

## Native modules and components

### How do you write a Turbo Native Module end to end?

**Short answer:** Write a typed spec in TypeScript, register it in `codegenConfig`, let Codegen generate the native interfaces, implement them in Kotlin (extending the generated abstract class) and Objective-C++ (conforming to the generated protocol and returning the generated `SpecJSI`), register the module on each platform, then import the spec's default export from JS. The spec is the single source of truth; native code that doesn't match it fails to compile.

#### Step 1 — The spec

```ts title="specs/NativeDeviceStats.ts"
import type {TurboModule} from 'react-native';
import {TurboModuleRegistry} from 'react-native';

export interface Spec extends TurboModule {
  // Sync: cheap, in-memory; runs on the JS thread.
  getTotalMemoryMb(): number;
  // Async: may take time; runs off the JS thread and returns a Promise.
  sha256(input: string): Promise<string>;
}

export default TurboModuleRegistry.getEnforcing<Spec>('NativeDeviceStats');
```

The file name must start with `Native`, the interface must be called `Spec` and extend `TurboModule`, and the string passed to `getEnforcing` is the module name native code registers.

#### Step 2 — Codegen config

Use the `codegenConfig` block shown in the Codegen question (`name: "AppSpecs"`, `jsSrcsDir: "specs"`, `android.javaPackageName: "com.acme.app.specs"`, and the iOS `modulesProvider` mapping `NativeDeviceStats` to `RCTNativeDeviceStats`). Then run a build (Android) and `cd ios && bundle exec pod install` (iOS) to generate code.

#### Step 3 — Android (Kotlin)

```kotlin title="android/app/src/main/java/com/acme/app/devicestats/NativeDeviceStatsModule.kt"
package com.acme.app.devicestats

import android.app.ActivityManager
import android.content.Context
import com.acme.app.specs.NativeDeviceStatsSpec
import com.facebook.react.bridge.Promise
import com.facebook.react.bridge.ReactApplicationContext
import java.security.MessageDigest
import java.util.concurrent.ExecutorService
import java.util.concurrent.Executors

class NativeDeviceStatsModule(reactContext: ReactApplicationContext) :
  NativeDeviceStatsSpec(reactContext) {

  // Own executor so hashing never blocks the shared native-modules thread.
  private val worker: ExecutorService = Executors.newSingleThreadExecutor()

  override fun getName() = NAME

  override fun getTotalMemoryMb(): Double {
    val am = reactApplicationContext.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
    val info = ActivityManager.MemoryInfo().also(am::getMemoryInfo)
    return info.totalMem / (1024.0 * 1024.0)
  }

  override fun sha256(input: String, promise: Promise) {
    worker.execute {
      try {
        val bytes = MessageDigest.getInstance("SHA-256").digest(input.toByteArray(Charsets.UTF_8))
        promise.resolve(bytes.joinToString("") { "%02x".format(it) })
      } catch (e: Exception) {
        promise.reject("E_HASH", e.message, e)
      }
    }
  }

  override fun invalidate() {
    worker.shutdownNow()
    super.invalidate()
  }

  companion object {
    const val NAME = "NativeDeviceStats"
  }
}
```

```kotlin title="android/app/src/main/java/com/acme/app/devicestats/DeviceStatsPackage.kt"

#import <CommonCrypto/CommonDigest.h>

@implementation RCTNativeDeviceStats

+ (NSString *)moduleName
{

}

- (std::shared_ptr<facebook::react::TurboModule>)getTurboModule:

- (void)sha256:(NSString *)input
       resolve:(RCTPromiseResolveBlock)resolve
        reject:(RCTPromiseRejectBlock)reject
{
  // Async methods already run on this module's method queue, not the JS thread.
  NSData *data = [input dataUsingEncoding:NSUTF8StringEncoding];
  unsigned char digest[CC_SHA256_DIGEST_LENGTH];
  CC_SHA256(data.bytes, (CC_LONG)data.length, digest);
  NSMutableString *hex = [NSMutableString stringWithCapacity:CC_SHA256_DIGEST_LENGTH * 2];

  }
  resolve(hex);
}

### How do you implement a TurboModule in Swift?

**Short answer:** Codegen produces Objective-C++ protocols and C++ glue, which Swift cannot conform to directly because Swift can't see C++ `std::shared_ptr` signatures through the ObjC bridge. The standard pattern is a thin Objective-C++ class that conforms to the generated protocol and forwards every call to a Swift class exposed with `@objc`. Alternatively, use the Expo Modules API or Nitro Modules, which let you write the module in Swift without a manual wrapper.

```swift title="ios/DeviceStatsImpl.swift"
import CryptoKit
import Foundation

@objc(DeviceStatsImpl)
public final class DeviceStatsImpl: NSObject {
  @objc public func totalMemoryMb() -> Double {
    Double(ProcessInfo.processInfo.physicalMemory) / 1_048_576
  }

  @objc public func sha256(_ input: String) -> String {
    SHA256.hash(data: Data(input.utf8))
      .map { String(format: "%02x", $0) }
      .joined()
  }
}
```

```objectivec title="ios/RCTNativeDeviceStats.mm"

// Xcode-generated header exposing @objc Swift types. For an app target it is
// "<ProductModuleName>-Swift.h"; inside a pod use <PodName/PodName-Swift.h>.
#import "MyApp-Swift.h"

@implementation RCTNativeDeviceStats {
  DeviceStatsImpl *_impl;
}

+ (NSString *)moduleName { return @"NativeDeviceStats"; }

- (instancetype)init
{
  if (self = [super init]) {
    _impl = [DeviceStatsImpl new];
  }
  return self;
}

- (std::shared_ptr<facebook::react::TurboModule>)getTurboModule:
    (const facebook::react::ObjCTurboModule::InitParams &)params
{
  return std::make_shared<facebook::react::NativeDeviceStatsSpecJSI>(params);
}

- (NSNumber *)getTotalMemoryMb
{
  return @([_impl totalMemoryMb]);
}

- (void)sha256:(NSString *)input
       resolve:(RCTPromiseResolveBlock)resolve
        reject:(RCTPromiseRejectBlock)reject
{
  resolve([_impl sha256:input]);
}

@end
```

**Gotchas**

- The Swift class must be `@objc` and, inside a framework or pod, `public`. Only ObjC-representable types cross (`String`, `Double`, `NSDictionary`, blocks); Swift structs and enums with associated values do not.
- The `-Swift.h` header name depends on the product module name; a wrong name is the most common build error. In pods, `DEFINES_MODULE` must be enabled.
- Keep the wrapper dumb: argument conversion and forwarding only. Business logic in Swift stays unit-testable without React Native.
- Promise blocks can be passed into Swift (`@escaping RCTPromiseResolveBlock`) if Swift imports React headers, but resolving in the ObjC++ layer keeps the Swift side framework-free.

> [!INTERVIEW]
> Likely follow-ups: "Why can't Swift implement the spec directly?", "What does Nitro do differently?" (it generates Swift protocols and uses Swift's C++ interop, so no ObjC layer is needed).

### How do you emit events from native code to JS?

**Short answer:** On the New Architecture, declare a typed event emitter in the TurboModule spec (`readonly onX: CodegenTypes.EventEmitter<Payload>`). Codegen generates an `emitOnX` method on the native base class; JS subscribes by calling `NativeModule.onX(handler)` and gets back a subscription with `remove()`. The older pattern, `RCTEventEmitter` / `DeviceEventManagerModule` plus `NativeEventEmitter` in JS, still works through interop but is untyped and uses global string channels.

#### Spec

```ts title="specs/NativeDeviceStats.ts"
import type {CodegenTypes, TurboModule} from 'react-native';
import {TurboModuleRegistry} from 'react-native';

export type ThermalEvent = {
  state: string; // 'nominal' | 'fair' | 'serious' | 'critical'
  timestamp: number;
};

export interface Spec extends TurboModule {
  getTotalMemoryMb(): number;
  sha256(input: string): Promise<string>;
  startThermalUpdates(): void;
  stopThermalUpdates(): void;
  readonly onThermalChange: CodegenTypes.EventEmitter<ThermalEvent>;
}

export default TurboModuleRegistry.getEnforcing<Spec>('NativeDeviceStats');
```

(Older RN versions import `EventEmitter` from `react-native/Libraries/Types/CodegenTypes` instead of the `CodegenTypes` namespace.)

#### Android

```kotlin title="NativeDeviceStatsModule.kt (additions)"
import android.os.Build
import android.os.PowerManager
import com.facebook.react.bridge.Arguments

private var thermalListener: PowerManager.OnThermalStatusChangedListener? = null

override fun startThermalUpdates() {
  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q || thermalListener != null) return
  val pm = reactApplicationContext.getSystemService(Context.POWER_SERVICE) as PowerManager
  val listener = PowerManager.OnThermalStatusChangedListener { status ->
    emitOnThermalChange(Arguments.createMap().apply {
      putString("state", status.toThermalName())
      putDouble("timestamp", System.currentTimeMillis().toDouble())
    })
  }
  pm.addThermalStatusListener(listener)
  thermalListener = listener
}

override fun stopThermalUpdates() {
  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return
  val pm = reactApplicationContext.getSystemService(Context.POWER_SERVICE) as PowerManager
  thermalListener?.let(pm::removeThermalStatusListener)
  thermalListener = null
}

private fun Int.toThermalName() = when (this) {
  PowerManager.THERMAL_STATUS_NONE -> "nominal"
  PowerManager.THERMAL_STATUS_LIGHT, PowerManager.THERMAL_STATUS_MODERATE -> "fair"
  PowerManager.THERMAL_STATUS_SEVERE -> "serious"
  else -> "critical"
}
```

#### iOS

The class must now inherit from the generated base class so it gets the `emitOn...` methods: `@interface RCTNativeDeviceStats : NativeDeviceStatsSpecBase <NativeDeviceStatsSpec>`.

```objectivec title="RCTNativeDeviceStats.mm (additions)"

{
  [[NSNotificationCenter defaultCenter] addObserver:self
                                           selector:@selector(thermalStateDidChange)
                                               name:NSProcessInfoThermalStateDidChangeNotification
                                             object:nil];
}

- (void)stopThermalUpdates
{
  [[NSNotificationCenter defaultCenter] removeObserver:self
                                                  name:NSProcessInfoThermalStateDidChangeNotification
                                                object:nil];
}

- (void)thermalStateDidChange
{
  NSString *state;
  switch ([NSProcessInfo processInfo].thermalState) {
    case NSProcessInfoThermalStateNominal: state = @"nominal"; break;
    case NSProcessInfoThermalStateFair: state = @"fair"; break;
    case NSProcessInfoThermalStateSerious: state = @"serious"; break;
    default: state = @"critical"; break;
  }
  [self emitOnThermalChange:@{
    @"state": state,
    @"timestamp": @([[NSDate date] timeIntervalSince1970] * 1000)
  }];
}
```

#### JS

```tsx title="src/hooks/useThermalState.ts"
import {useEffect, useState} from 'react';
import NativeDeviceStats from '../../specs/NativeDeviceStats';

export function useThermalState() {
  const [state, setState] = useState<string>('nominal');
  useEffect(() => {
    const sub = NativeDeviceStats.onThermalChange(e => setState(e.state));
    NativeDeviceStats.startThermalUpdates();
    return () => {
      sub.remove();
      NativeDeviceStats.stopThermalUpdates();
    };
  }, []);
  return state;
}
```

**Pitfalls**

- **Events emitted before anyone subscribes are lost.** Expose a sync or async getter for the current state and read it on subscribe.
- **High-frequency streams** (sensors at 100 Hz, audio levels) should be throttled natively or exposed differently (shared buffers, a worklet runtime) instead of flooding the JS thread.
- **Reference counting:** if several components subscribe, count subscribers before stopping the native source, or stop only when the last one unsubscribes.
- **Cleanup on reload:** remove observers in `invalidate` so a JS reload doesn't leave native listeners firing into a dead runtime.

> [!INTERVIEW]
> Likely follow-ups: "How did this work before typed emitters?" (subclass `RCTEventEmitter`, implement `supportedEvents`, call `sendEventWithName:body:`; on Android emit through `RCTDeviceEventEmitter`; in JS wrap with `new NativeEventEmitter(module)`, which also required stub `addListener` / `removeListeners` methods).

### When is a synchronous native method acceptable?

**Short answer:** Only when it is fast (well under a millisecond), reads in-memory or cached state, performs no I/O, and never waits on another thread, especially the main thread. A sync method blocks the JS thread for its entire duration, and waiting on the main thread from it can deadlock. Good candidates: reading a cached value (MMKV-style storage), device constants, cheap pure computation. Bad candidates: disk or network access, keychain reads, anything that touches UIKit or shows a dialog.

#### Why the rules exist

- A sync TurboModule method executes on the JS thread. 5 ms of work is a third of a 60 Hz frame budget for every call, and it is invisible in React profiling because it isn't render time.
- **Deadlock:** if the method does `DispatchQueue.main.sync` (or `runOnUiThread` plus waiting on a latch) while the UI thread is itself waiting on the JS thread, for example during a synchronous Fabric render triggered from the UI thread, both threads wait forever.
- Keychain / Keystore reads can be slow on first access or block until the device is unlocked.

#### A good sync pattern: native cache plus `useSyncExternalStore`

```ts title="src/hooks/useNativeSetting.ts"
import {useSyncExternalStore} from 'react';
import NativeSettings from '../../specs/NativeSettings';

// NativeSettings.getString is sync but reads an in-memory map that the native
// side keeps in sync with disk on a background thread.
export function useNativeSetting(key: string): string | null {
  return useSyncExternalStore(
    onStoreChange => {
      const sub = NativeSettings.onSettingChanged(e => {
        if (e.key === key) onStoreChange();
      });
      return () => sub.remove();
    },
    () => NativeSettings.getString(key),
  );
}
```

This gives tear-free, synchronous reads during render (no loading state, no flash) while writes and persistence stay off the JS thread.

| Method shape | Runs on | Use for |
|---|---|---|
| Returns a value (sync) | JS thread | Cached reads, constants, tiny pure functions |
| Returns `void` | Module queue / native-modules thread | Fire-and-forget commands |
| Returns `Promise` | Module queue / native-modules thread (resolve from any thread) | I/O, crypto, anything that may take time |

> [!WARNING]
> Legacy-era advice said to avoid sync methods because they broke remote Chrome debugging. That debugger is gone; the modern reason to be careful is purely thread blocking and deadlocks.

> [!INTERVIEW]
> What a senior answer includes: the JS thread cost, the deadlock scenario, a concrete example of an acceptable sync API, and the `useSyncExternalStore` pattern. Red flag: "sync is always faster, so make everything sync".

### How do you build a Fabric Native Component?

**Short answer:** Define the component's props and events in a `*NativeComponent.ts` spec with `codegenNativeComponent`, let Codegen generate the C++ props, event emitter, shadow node and component descriptor plus platform interfaces, then implement a view manager on Android (implementing the generated `...ManagerInterface` and returning the generated delegate) and an `RCTViewComponentView` subclass on iOS that applies props in `updateProps:oldProps:` and emits events through the typed C++ event emitter.

#### Spec

```ts title="specs/ProgressRingNativeComponent.ts"
import {codegenNativeComponent} from 'react-native';
import type {CodegenTypes, ColorValue, HostComponent, ViewProps} from 'react-native';

type CompleteEvent = Readonly<{value: CodegenTypes.Double}>;

export interface NativeProps extends ViewProps {
  progress: CodegenTypes.Float; // 0..1
  strokeWidth?: CodegenTypes.WithDefault<CodegenTypes.Float, 4>;
  color?: ColorValue;
  onComplete?: CodegenTypes.DirectEventHandler<CompleteEvent>;
}

export default codegenNativeComponent<NativeProps>('ProgressRing') as HostComponent<NativeProps>;
```

(Older versions import `codegenNativeComponent` and the codegen types from deep `react-native/Libraries/...` paths.)

#### Android

The view dispatches the event through the Fabric event dispatcher when progress crosses 1:

```kotlin title="ProgressRingView.kt (event part)"
private fun emitComplete() {
  val reactContext = context as ReactContext
  val surfaceId = UIManagerHelper.getSurfaceId(reactContext)
  UIManagerHelper.getEventDispatcherForReactTag(reactContext, id)
    ?.dispatchEvent(CompleteEvent(surfaceId, id, 1.0))
}

class CompleteEvent(surfaceId: Int, viewId: Int, private val value: Double) :
  Event<CompleteEvent>(surfaceId, viewId) {
  override fun getEventName() = "topComplete"
  override fun getEventData(): WritableMap =
    Arguments.createMap().apply { putDouble("value", value) }
}
```

{
  if (self = [super initWithFrame:frame]) {
    static const auto defaultProps = std::make_shared<const ProgressRingProps>();
    _props = defaultProps;
    _ring = [CAShapeLayer layer];
    _ring.fillColor = UIColor.clearColor.CGColor;
    _ring.strokeEnd = 0;
    [self.layer addSublayer:_ring];
  }
  return self;
}

- (void)updateProps:(Props::Shared const &)props oldProps:(Props::Shared const &)oldProps
{
  const auto &oldRing = *std::static_pointer_cast<const ProgressRingProps>(_props);
  const auto &newRing = *std::static_pointer_cast<const ProgressRingProps>(props);

  _ring.strokeEnd = newRing.progress;
  _ring.lineWidth = newRing.strokeWidth;
  _ring.strokeColor = RCTUIColorFromSharedColor(newRing.color).CGColor;

  if (oldRing.progress < 1.0 && newRing.progress >= 1.0 && _eventEmitter) {
    std::static_pointer_cast<const ProgressRingEventEmitter>(_eventEmitter)
        ->onComplete(ProgressRingEventEmitter::OnComplete{.value = newRing.progress});
  }

  [super updateProps:props oldProps:oldProps];
}

- (void)layoutSubviews
{
  [super layoutSubviews];
  CGFloat inset = _ring.lineWidth / 2;
  _ring.frame = self.bounds;
  _ring.path = [UIBezierPath bezierPathWithOvalInRect:CGRectInset(self.bounds, inset, inset)].CGPath;
}

@end
```

Register the class through `componentProvider` in `codegenConfig` (recent versions) or, in libraries, a `ProgressRingCls()` function that the generated third-party components provider calls.

**Gotchas**

- Component views are **recycled** on iOS. Reset transient state in `prepareForRecycle`, or a recycled ring shows the previous instance's progress for a frame.
- Compare old and new props before doing expensive work or emitting events; `updateProps` runs on every prop change.
- For imperative calls (`ref.current.reset()`), declare commands with `codegenNativeCommands` instead of routing them through a module.
- Custom layout (the native view decides its own size, like text) needs a custom C++ shadow node with a measure function: the one thing the interop layer never supported.

> [!INTERVIEW]
> Likely follow-ups: "What does the component descriptor do?" (creates and clones shadow nodes for that component type in C++), "What's the difference between direct and bubbling events?", "How do you pass an imperative command?"

### How do you write a C++ TurboModule shared across iOS and Android?

**Short answer:** Write the spec as usual, implement a C++ class that extends the Codegen-generated `NativeXCxxSpec<T>` template, compile the same `.cpp` into both apps, and register a provider on each platform: Android's `cxxModuleProvider` in a custom `OnLoad.cpp` (built with CMake), and on iOS a module provider class mapped in `codegenConfig` (or the app delegate's C++ module hook in older setups). There's no Kotlin or Objective-C layer at all, so calls go straight from JSI into your C++.

```ts title="specs/NativeTextTools.ts"
import type {TurboModule} from 'react-native';
import {TurboModuleRegistry} from 'react-native';

export interface Spec extends TurboModule {
  wordCount(text: string): number;
  slugify(text: string): string;
}

export default TurboModuleRegistry.getEnforcing<Spec>('NativeTextTools');
```

```cpp title="shared/NativeTextTools.h"
#pragma once

#include <AppSpecsJSI.h>
#include <memory>
#include <string>

namespace facebook::react {

class NativeTextTools : public NativeTextToolsCxxSpec<NativeTextTools> {
 public:
  explicit NativeTextTools(std::shared_ptr<CallInvoker> jsInvoker);

  double wordCount(jsi::Runtime& rt, std::string text);
  std::string slugify(jsi::Runtime& rt, std::string text);
};

}  // namespace facebook::react
```

```cpp title="shared/NativeTextTools.cpp"
#include "NativeTextTools.h"
#include <cctype>

namespace facebook::react {

NativeTextTools::NativeTextTools(std::shared_ptr<CallInvoker> jsInvoker)
    : NativeTextToolsCxxSpec(std::move(jsInvoker)) {}

double NativeTextTools::wordCount(jsi::Runtime&, std::string text) {
  double count = 0;
  bool inWord = false;
  for (unsigned char c : text) {
    if (std::isspace(c)) {
      inWord = false;
    } else if (!inWord) {
      inWord = true;
      ++count;
    }
  }
  return count;
}

std::string NativeTextTools::slugify(jsi::Runtime&, std::string text) {
  std::string out;
  out.reserve(text.size());
  bool lastWasDash = false;
  for (unsigned char c : text) {
    if (std::isalnum(c)) {
      out.push_back(static_cast<char>(std::tolower(c)));
      lastWasDash = false;
    } else if (!lastWasDash && !out.empty()) {
      out.push_back('-');
      lastWasDash = true;
    }
  }
  if (!out.empty() && out.back() == '-') out.pop_back();
  return out;
}

}  // namespace facebook::react
```

#### Registration

**Android:** copy React Native's default `OnLoad.cpp` into `android/app/src/main/jni/`, add a `CMakeLists.txt` that includes RN's application CMake utilities and your `shared/` sources, point `android.externalNativeBuild.cmake.path` in `android/app/build.gradle` at it, and change the provider:

```cpp title="android/app/src/main/jni/OnLoad.cpp (excerpt)"
std::shared_ptr<TurboModule> cxxModuleProvider(
    const std::string& name,
    const std::shared_ptr<CallInvoker>& jsInvoker) {
  if (name == NativeTextTools::kModuleName) {
    return std::make_shared<NativeTextTools>(jsInvoker);
  }
  return autolinking_cxxModuleProvider(name, jsInvoker);
}
```

**iOS:** add the `shared/` files to the Xcode target (or a local pod) and expose a provider:

```objectivec title="ios/NativeTextToolsProvider.mm"
#import <Foundation/Foundation.h>
#import <ReactCommon/RCTTurboModule.h>
#import "NativeTextTools.h"

@interface NativeTextToolsProvider : NSObject <RCTModuleProvider>
@end

@implementation NativeTextToolsProvider
- (std::shared_ptr<facebook::react::TurboModule>)getTurboModule:
    (const facebook::react::ObjCTurboModule::InitParams &)params
{
  return std::make_shared<facebook::react::NativeTextTools>(params.jsInvoker);
}
@end
```

and map it with `"modulesProvider": { "NativeTextTools": "NativeTextToolsProvider" }`. The exact wiring has changed across releases, so follow the C++ modules page of the docs for your RN version.

**When it's worth it:** parsers, diffing, crypto, geometry, image math, business rules that must behave identically on both platforms, or wrapping an existing C/C++ library. **When it's not:** anything that needs platform APIs (camera, keychain, notifications); those need Kotlin/Swift anyway.

**Pitfalls:** long-running work in a sync method still blocks JS, so spawn a thread and resolve a promise through the `CallInvoker`; C++ exceptions thrown out of a method should be `jsi::JSError` so JS gets a catchable error rather than a native crash; test the C++ with a normal unit-test framework outside RN.

> [!INTERVIEW]
> Likely follow-ups: "How do you return a Promise from C++?" (return `AsyncPromise<T>` / create a `jsi` Promise and resolve it on the JS thread via `jsInvoker`), "How do you share structs with JS?" (typed object literals in the spec become generated C++ structs with bridging helpers).

### Raw TurboModules, Expo Modules API or Nitro Modules: how do you choose?

**Short answer:** All three sit on JSI. Raw Codegen TurboModules are the official zero-dependency path and the default for libraries that must work everywhere. The Expo Modules API gives the best developer experience (Swift and Kotlin DSL, views, lifecycle hooks, config plugins) and works in bare apps once the `expo` package is installed. Nitro Modules (Margelo) generate strongly typed Swift/Kotlin/C++ bindings for "hybrid objects" and are the fastest option for high-frequency or object-oriented native APIs. C++ TurboModules win for pure cross-platform computation.

| | Codegen TurboModule | Expo Modules API | Nitro Modules | C++ TurboModule |
|---|---|---|---|---|
| Native languages | Kotlin/Java + ObjC++ (Swift via wrapper) | Swift + Kotlin | Swift + Kotlin, or C++ | C++ only |
| API definition | TS spec + Codegen | Native DSL; TS types written by hand | TS spec + `nitrogen` generator | TS spec + Codegen |
| Boilerplate | High | Low | Low to medium | Medium (build wiring) |
| Native views | Fabric components | `View(...)` in the DSL | Supported in recent versions | Fabric components |
| Extra dependency | None | `expo` / `expo-modules-core` | `react-native-nitro-modules` | None |
| Sweet spot | Libraries with no deps, official docs | Expo apps, app-local modules, fast iteration | Perf-critical, many calls, native objects passed around | Shared compute, existing C++ libs |

#### Expo Modules API

```swift title="modules/device-stats/ios/DeviceStatsModule.swift"
import CryptoKit
import ExpoModulesCore

public class DeviceStatsModule: Module {
  public func definition() -> ModuleDefinition {
    Name("DeviceStats")

    Function("getTotalMemoryMb") {
      Double(ProcessInfo.processInfo.physicalMemory) / 1_048_576
    }

    AsyncFunction("sha256") { (input: String) -> String in
      SHA256.hash(data: Data(input.utf8)).map { String(format: "%02x", $0) }.joined()
    }

    Events("onThermalChange")
  }
}
```

```kotlin title="modules/device-stats/android/src/main/java/expo/modules/devicestats/DeviceStatsModule.kt"
package expo.modules.devicestats

import android.app.ActivityManager
import android.content.Context
import expo.modules.kotlin.modules.Module
import expo.modules.kotlin.modules.ModuleDefinition
import java.security.MessageDigest

class DeviceStatsModule : Module() {
  override fun definition() = ModuleDefinition {
    Name("DeviceStats")

    Function("getTotalMemoryMb") {
      val context = requireNotNull(appContext.reactContext)
      val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
      ActivityManager.MemoryInfo().also(am::getMemoryInfo).totalMem / 1_048_576.0
    }

    AsyncFunction("sha256") { input: String ->
      MessageDigest.getInstance("SHA-256")
        .digest(input.toByteArray())
        .joinToString("") { "%02x".format(it) }
    }

    Events("onThermalChange")
  }
}
```

```ts title="modules/device-stats/index.ts"
import {requireNativeModule} from 'expo';

type DeviceStatsModule = {
  getTotalMemoryMb(): number;
  sha256(input: string): Promise<string>;
};

export default requireNativeModule<DeviceStatsModule>('DeviceStats');
```

Events are sent with `sendEvent("onThermalChange", ...)` and `OnStartObserving` / `OnStopObserving` hooks start and stop the native source when JS listeners appear or disappear.
