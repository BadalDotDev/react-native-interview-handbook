# Live Coding Challenges

These are the hands-on exercises senior React Native candidates get in live rounds: custom hooks, UI components, data and state logic, "find the bug" reviews and JavaScript output puzzles. Each card gives the task, what the interviewer is actually scoring, a complete TypeScript solution, a walkthrough of the design decisions and the follow-ups to expect. Say your trade-offs out loud as you code, because that reasoning is much of what gets scored.

## Custom hooks

### Build `useDebounce` for values and `useDebouncedCallback` for functions

**Task:** Implement two hooks. `useDebounce(value, delay)` returns `value` only after it has stopped changing for `delay` ms. `useDebouncedCallback(fn, delay)` returns a **stable** function that postpones calling `fn` until `delay` ms have passed since the last call. It must always call the *latest* `fn` (no stale props), expose `cancel()` and `flush()`, and never fire after the component unmounts unless the caller explicitly asks for a flush on unmount.

#### What the interviewer evaluates

- Effect cleanup: does each value change clear the previous timer?
- Stale closures: does the debounced function see current props and state *without* being re-created on every render? Re-creating it would reset the timer on every keystroke.
- Referential stability of the returned function, so it is safe to pass to memoized children or effect deps.
- Unmount safety and Strict Mode behaviour (in development, effects run mount, unmount, mount).
- Knowing when to debounce a *value* (a derived query that drives fetching) and when to debounce a *callback* (autosave, analytics, validation).

#### Solution

```ts title="src/hooks/useDebounce.ts"
import { useEffect, useLayoutEffect, useMemo, useRef, useState } from 'react';

export function useDebounce<T>(value: T, delay = 300): T {
  const [debounced, setDebounced] = useState(value);

  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);
  }, [value, delay]);

  return debounced;
}

export interface DebouncedFunction<A extends unknown[]> {
  (...args: A): void;
  cancel: () => void;
  flush: () => void;
  isPending: () => boolean;
}

export function useDebouncedCallback<A extends unknown[]>(
  callback: (...args: A) => void,
  delay = 300,
  { flushOnUnmount = false }: { flushOnUnmount?: boolean } = {},
): DebouncedFunction<A> {
  const callbackRef = useRef(callback);
  const flushOnUnmountRef = useRef(flushOnUnmount);
  const timerRef = useRef<ReturnType<typeof setTimeout> | null>(null);
  const argsRef = useRef<A | null>(null);

  // Track the latest callback/options after every commit without
  // changing the identity of the debounced function.
  useLayoutEffect(() => {
    callbackRef.current = callback;
    flushOnUnmountRef.current = flushOnUnmount;
  });

  const debounced = useMemo(() => {
    const invoke = () => {
      const args = argsRef.current;
      timerRef.current = null;
      argsRef.current = null;
      if (args) callbackRef.current(...args);
    };

    const fn = ((...args: A) => {
      argsRef.current = args;
      if (timerRef.current != null) clearTimeout(timerRef.current);
      timerRef.current = setTimeout(invoke, delay);
    }) as DebouncedFunction<A>;

    fn.cancel = () => {
      if (timerRef.current != null) clearTimeout(timerRef.current);
      timerRef.current = null;
      argsRef.current = null;
    };
    fn.flush = () => {
      if (timerRef.current == null) return;
      clearTimeout(timerRef.current);
      invoke();
    };
    fn.isPending = () => timerRef.current != null;
    return fn;
  }, [delay]);

  // On unmount (or when delay changes): drop or flush the pending call.
  useEffect(
    () => () => {
      if (flushOnUnmountRef.current) debounced.flush();
      else debounced.cancel();
    },
    [debounced],
  );

  return debounced;
}
```

Usage: an autosaving editor that must not lose the last edit when the user navigates away.

```tsx title="src/screens/NoteEditor.tsx"
import React, { useState } from 'react';
import { TextInput } from 'react-native';
import { useDebouncedCallback } from '../hooks/useDebounce';
import { saveNote } from '../api/notes';

export function NoteEditor({ noteId, initialBody }: { noteId: string; initialBody: string }) {
  const [body, setBody] = useState(initialBody);
  const save = useDebouncedCallback((text: string) => saveNote(noteId, text), 800, {
    flushOnUnmount: true,
  });

  return (
    <TextInput
      multiline
      value={body}
      onChangeText={(text) => {
        setBody(text); // the input stays controlled and instant
        save(text); // only the network call is debounced
      }}
    />
  );
}
```

#### Walkthrough

- **`useDebounce`**: every value change schedules a timer, and the effect cleanup clears the previous one, so only the last value that "survives" `delay` ms is committed. The first render returns the initial value immediately. Changing `delay` restarts the wait.
- **Why the callback lives in a ref**: if `callback` were a `useMemo` dependency, an inline arrow function would produce a new debounced function on every render, and the cleanup effect would cancel the pending timer each time. The call would either never fire or fire once per keystroke. The ref separates *what to call* (always the latest) from *the timer* (stable).
- **Why `useLayoutEffect` and not assignment during render**: writing `ref.current` during render is unsafe under concurrent rendering, because a render can be thrown away, and the React Compiler lint flags it. A layout effect runs synchronously after commit, before any user event can call the function.
- **Unmount ordering gotcha**: effect cleanups run in declaration order. If the hook always cancelled on unmount and the component tried to `flush()` in its own cleanup, the hook's cancel would run first and the flush would find nothing to send. That is why flush-on-unmount is an option *inside* the hook.
- **Cost**: O(1) per call and one timer at a time. On iOS the JS thread is suspended shortly after the app is backgrounded, so a pending debounce fires on resume. For autosave, also flush on the `AppState` `background` transition.

#### Follow-ups

- **"Add `leading` and `maxWait`."** Leading: invoke immediately if no timer is pending, then suppress until quiet. `maxWait`: record the time of the first call in a burst and force an invoke once it is exceeded. This guarantees progress during continuous typing (lodash semantics).
- **"Why not `useMemo(() => lodash.debounce(fn, 300), [])`?"** It works only if `fn` never changes. Otherwise it captures stale props. You still need the latest-callback ref and a `cancel()` on unmount.
- **"Can `useEffectEvent` replace the ref?"** `useEffectEvent` is stable since React 19.2, but Effect Events may only be called from inside effects. They must not be passed to `onChangeText` or other components, so the ref pattern is still correct for event-handler debouncing.
- **"How do you test it?"** Use `renderHook` from React Native Testing Library with `jest.useFakeTimers()`. Call the function several times, run `act(() => jest.advanceTimersByTime(300))`, then assert a single call with the last arguments. Also unmount and assert no call.

### Build `useThrottle` for a fast-changing value

**Task:** Implement `useThrottle(value, interval)`. The first change must go through immediately (leading edge), then at most one update per `interval` ms, and the final value must always be delivered (trailing edge) so the UI never ends on a stale intermediate value. Typical use is a slider or scroll-derived value that drives an expensive render or a network call. Then give a callback version for event handlers.

#### What the interviewer evaluates

- Can you explain debounce versus throttle, and leading versus trailing edges?
- Correct remaining-time math, rather than a fixed timer that ignores when the last emission happened.
- Cleanup, and never dropping the final value.
- Knowing that animation-grade work (60–120 fps) should not be throttled through React state at all. It belongs on the UI thread with Reanimated shared values.

#### Solution

```ts title="src/hooks/useThrottle.ts"
import { useEffect, useLayoutEffect, useMemo, useRef, useState } from 'react';
import { throttle } from '../lib/timing'; // implemented in the "from scratch" challenge below

export function useThrottle<T>(value: T, interval = 200): T {
  const [throttled, setThrottled] = useState(value);
  const lastEmit = useRef(0);

  useEffect(() => {
    const elapsed = Date.now() - lastEmit.current;

    if (elapsed >= interval) {
      // Leading edge: the window is open, emit now.
      lastEmit.current = Date.now();
      setThrottled(value);
      return;
    }

    // Trailing edge: emit the latest value when the current window closes.
    const id = setTimeout(() => {
      lastEmit.current = Date.now();
      setThrottled(value);
    }, interval - elapsed);

    return () => clearTimeout(id);
  }, [value, interval]);

  return throttled;
}

export function useThrottledCallback<A extends unknown[]>(
  callback: (...args: A) => void,
  interval = 200,
) {
  const callbackRef = useRef(callback);
  useLayoutEffect(() => {
    callbackRef.current = callback;
  });

  const throttled = useMemo(
    () => throttle((...args: A) => callbackRef.current(...args), interval),
    [interval],
  );

  useEffect(() => () => throttled.cancel(), [throttled]);
  return throttled;
}
```

Usage: report scroll depth to analytics at most every 500 ms.

```tsx
const reportDepth = useThrottledCallback((y: number) => analytics.track('feed_scroll', { y }), 500);

<FlatList
  onScroll={(e) => reportDepth(e.nativeEvent.contentOffset.y)}
  scrollEventThrottle={16}
  /* ... */
/>;
```

#### Walkthrough

- The effect runs after each committed change of `value`. If a full window has elapsed, it emits immediately. Otherwise it schedules a timer for the **remaining** part of the window. Each newer value cancels that timer (cleanup) and schedules a new one for the same window end. The trailing emission therefore lands exactly when the window closes, carrying the latest value.
- On mount, `lastEmit` is `0`, so the effect "emits" the initial value. React bails out because the value is identical, and the window starts.
- **Where throttling actually helps**: `useThrottle` protects *consumers* of the throttled value (an expensive child tree, a request). The component that owns the raw value still re-renders on every change. If the source is `onScroll` firing at 60 fps, throttle the **handler** with `useThrottledCallback` instead of storing every offset in state.
- For visual scroll-linked effects (headers, parallax), use Reanimated's `useAnimatedScrollHandler` so nothing goes through the JS thread. See the [Performance guide](../guides/performance.html).

#### Follow-ups

- **"Throttle or debounce for search-as-you-type?"** Debounce, because you want the pause. Throttle suits continuous feedback: live location uploads, progress persistence, scroll analytics.
- **"Throttle to animation frames?"** Coalesce updates with `requestAnimationFrame`, keeping only the latest value per frame. It is still JS-thread work, so it is fine for layout-affecting state and wrong for animations.
- **"`Date.now()` or `performance.now()`?"** `performance.now()` is monotonic and immune to clock changes, which is preferable for short intervals. Either is acceptable in a throttle, but a clock change could stall a `Date.now()`-based window.

### Implement `useInterval` whose delay can change at runtime

**Task:** Write `useInterval(callback, delay)` where `delay` can change while running (a speed control) and `null` pauses it. The callback must always see fresh state and props, and the interval must **not** reset on every render. This is the Dan Abramov "declarative setInterval" pattern.

#### What the interviewer evaluates

- Can you explain why the naive `setInterval` in `useEffect` is broken (a stale closure, or a reset on every render)?
- Refs used as mutable instance variables.
- Separating *what to run* (the latest callback) from *when to run* (the delay).
- Pausing via `null`, cleanup, and knowing that intervals are not clocks.

#### Solution

```ts title="src/hooks/useInterval.ts"
import { useEffect, useLayoutEffect, useRef } from 'react';

export function useInterval(callback: () => void, delay: number | null): void {
  const savedCallback = useRef(callback);

  // Remember the latest callback after every commit.
  useLayoutEffect(() => {
    savedCallback.current = callback;
  }, [callback]);

  // (Re)start the interval only when the delay changes; null pauses.
  useEffect(() => {
    if (delay === null) return;
    const id = setInterval(() => savedCallback.current(), delay);
    return () => clearInterval(id);
  }, [delay]);
}
```

```tsx title="src/components/AutoCounter.tsx"
import React, { useState } from 'react';
import { Button, Text, View } from 'react-native';
import { useInterval } from '../hooks/useInterval';

export function AutoCounter() {
  const [count, setCount] = useState(0);
  const [delay, setDelay] = useState(1000);
  const [running, setRunning] = useState(true);

  // Reading `count` directly is fine: the hook always calls the latest closure.
  useInterval(() => setCount(count + 1), running ? delay : null);

  return (
    <View>
      <Text accessibilityRole="text">{count}</Text>
      <Button title="Faster" onPress={() => setDelay((d) => Math.max(100, d / 2))} />
      <Button title="Slower" onPress={() => setDelay((d) => d * 2)} />
      <Button title={running ? 'Pause' : 'Resume'} onPress={() => setRunning((r) => !r)} />
    </View>
  );
}
```

#### Walkthrough

- **Naive version A**: `useEffect(() => { const id = setInterval(() => setCount(count + 1), 1000); return () => clearInterval(id); }, [])`. The callback captured `count = 0` forever, so the counter sticks at 1.
- **Naive version B**: adding `[count]` to the deps tears down and recreates the interval on every tick. That "works", but any unrelated re-render also resets the timer. With frequent re-renders (typing, animations) the interval may never fire, and the period drifts.
- **The ref pattern**: the interval subscribes once per `delay`. Each tick calls `savedCallback.current`, which is always the closure from the latest render, so it sees fresh state without resubscribing.
- Changing the delay restarts the period from zero, so the elapsed partial period is lost. That is usually acceptable, and it is worth mentioning.
- `setInterval` is a *request*, not a clock. Ticks are delayed by a busy JS thread and paused while the app is suspended in the background. Anything that must show real elapsed time should be computed from timestamps (see `useCountdown` below).

#### Follow-ups

- **"Fire immediately when started?"** Add an `immediate` flag and call `savedCallback.current()` before `setInterval` inside the effect.
- **"Poll an API every 10 s without overlapping requests?"** Use a recursive `setTimeout` that schedules the next run only after the awaited request settles. Guard it with an `active` flag and an `AbortController` in cleanup. `setInterval` can stack requests when the server is slow.
- **"`useTimeout`?"** Use the same ref pattern with `setTimeout`, plus `reset()` and `clear()` functions returned from the hook.

### Implement `usePrevious`, and explain its two possible meanings

**Task:** Implement `usePrevious(value)` that returns the value from the previous render. Then explain the difference between "value at the previous render" and "previous *distinct* value", and implement the latter in a way that is safe under concurrent rendering.

#### What the interviewer evaluates

- Render versus commit, and when effects run relative to the returned value.
- That refs don't trigger renders, and that reading refs during render is discouraged.
- The React-docs pattern for "storing information from previous renders" (a guarded `setState` during render).
- Choosing the right semantics for the use case (animations, transition detection).

#### Solution

```ts title="src/hooks/usePrevious.ts"
import { useEffect, useRef, useState } from 'react';

/** Value from the previous committed render (undefined on the first render). */
export function usePrevious<T>(value: T): T | undefined {
  const ref = useRef<T | undefined>(undefined);
  useEffect(() => {
    ref.current = value; // runs after commit, so this render still returned the old value
  });
  return ref.current;
}

/** Previous *distinct* value. Survives unrelated re-renders, concurrent-safe. */
export function usePreviousDistinct<T>(value: T): T | undefined {
  const [current, setCurrent] = useState<T>(value);
  const [previous, setPrevious] = useState<T | undefined>(undefined);

  if (!Object.is(current, value)) {
    // A guarded state update during render is allowed: React discards this
    // render's output and immediately re-renders with the new state
    // (no extra commit, no effect, no flicker).
    setPrevious(current);
    setCurrent(value);
  }

  return previous;
}
```

Usage: announce a status transition exactly once.

```tsx title="src/components/OrderStatus.tsx"
import React, { useEffect } from 'react';
import { AccessibilityInfo, Text } from 'react-native';
import { usePreviousDistinct } from '../hooks/usePrevious';

type OrderStatus = 'placed' | 'preparing' | 'ready' | 'collected';

export function OrderStatusLabel({ status }: { status: OrderStatus }) {
  const previous = usePreviousDistinct(status);

  useEffect(() => {
    if (previous === 'preparing' && status === 'ready') {
      AccessibilityInfo.announceForAccessibility('Your order is ready for pickup');
    }
  }, [previous, status]);

  return <Text>{status}</Text>;
}
```

#### Walkthrough

| Render | `value` | `usePrevious` | `usePreviousDistinct` |
|---|---|---|---|
| 1 | A | `undefined` | `undefined` |
| 2 (value changed) | B | A | A |
| 3 (unrelated re-render) | B | **B** | A |
| 4 (value changed) | C | B | B |

- The classic ref version returns the value from the *previous render*. After any unrelated re-render it equals the current value, which surprises people who wanted "what was it before it changed".
- It also reads `ref.current` during render. React's docs discourage that, and the React Compiler lint rules flag it, because the component can render more than once before committing. It is widely used and works in practice, but it is not the idiomatic answer anymore.
- The state version stores the last seen value in state and compares during render. React explicitly supports a `setState` during render when it is guarded by a condition. It is the same technique React's docs show for adjusting state when a prop changes.
- It costs one immediate re-render of this component only, and only when the value changes.

#### Follow-ups

- **"Why not compare in an effect and set state there?"** That causes an extra commit, and one frame renders with inconsistent state. The render-phase update avoids both.
- **"The value is an object recreated every render."** `Object.is` sees a change every time. Compare a stable key (`order.id` + `order.status`) or use a cheap custom equality check.
- **"Log which props changed (why-did-you-render)?"** In development, keep the previous props object in a ref updated in an effect and diff the keys. Better still, use the React DevTools profiler's "why did this render" option.

### Write `useFetch` with AbortController and race-condition safety

**Task:** Write `useFetch<T>(url)` returning `{ status, data, error, refetch }`. Requirements:

- A typed discriminated-union state.
- Abort the in-flight request when `url` changes or the component unmounts.
- Never let a stale response overwrite a newer one.
- Treat non-2xx responses as errors.
- Keep previous data while refetching.
- `refetch()` re-runs the request.
- `url = null` means "don't fetch yet".

#### What the interviewer evaluates

- Race-condition awareness. This is the core of the question.
- `AbortController` plus effect cleanup, and knowing that `fetch` does **not** reject on 404 or 500.
- Discriminated unions that make impossible states unrepresentable.
- No `isMounted` hacks, no async function passed directly to `useEffect`.
- The judgement to say "in production I'd use TanStack Query, and here's what it adds".

#### Solution

```ts title="src/hooks/useFetch.ts"
import { useCallback, useEffect, useLayoutEffect, useRef, useState } from 'react';

export class HttpError extends Error {
  constructor(
    public readonly status: number,
    message: string,
  ) {
    super(message);
    this.name = 'HttpError';
  }
}

// Optional `data?/error?: undefined` members let `state.data` type-check on every variant.
export type FetchState<T> =
  | { status: 'idle'; data?: undefined; error?: undefined }
  | { status: 'loading'; data?: T; error?: undefined }
  | { status: 'success'; data: T; error?: undefined }
  | { status: 'error'; data?: T; error: Error };

const toError = (e: unknown): Error => (e instanceof Error ? e : new Error(String(e)));

export function useFetch<T>(url: string | null, init?: Omit<RequestInit, 'signal'>) {
  const [state, setState] = useState<FetchState<T>>(() =>
    url ? { status: 'loading' } : { status: 'idle' },
  );
  const [reloadToken, setReloadToken] = useState(0);

  // Callers usually pass an inline `init` object; don't refetch because of its identity.
  const initRef = useRef(init);
  useLayoutEffect(() => {
    initRef.current = init;
  });

  useEffect(() => {
    if (!url) {
      setState({ status: 'idle' });
      return;
    }

    const controller = new AbortController();
    let active = true;

    setState((prev) => ({ status: 'loading', data: prev.data }));

    (async () => {
      try {
        const res = await fetch(url, { ...initRef.current, signal: controller.signal });
        if (!res.ok) throw new HttpError(res.status, `Request failed with status ${res.status}`);
        const data = (await res.json()) as T;
        if (active) setState({ status: 'success', data });
      } catch (e) {
        if (!active || controller.signal.aborted) return; // superseded or unmounted
        setState((prev) => ({ status: 'error', data: prev.data, error: toError(e) }));
      }
    })();

    return () => {
      active = false;
      controller.abort();
    };
  }, [url, reloadToken]);

  const refetch = useCallback(() => setReloadToken((n) => n + 1), []);

  return { ...state, refetch };
}
```

```tsx title="src/components/UserCard.tsx"
import React from 'react';
import { ActivityIndicator, Button, Text, View } from 'react-native';
import { useFetch } from '../hooks/useFetch';

interface User {
  id: string;
  name: string;
}

export function UserCard({ userId }: { userId: string }) {
  const result = useFetch<User>(`https://api.example.com/users/${encodeURIComponent(userId)}`);

  if (result.status === 'error' && !result.data) {
    return (
      <View>
        <Text>{result.error.message}</Text>
        <Button title="Retry" onPress={result.refetch} />
      </View>
    );
  }
  if (!result.data) return <ActivityIndicator />;

  return (
    <View>
      <Text>{result.data.name}</Text>
      {result.status === 'loading' ? <ActivityIndicator size="small" /> : null}
    </View>
  );
}
```

#### Walkthrough

```mermaid
sequenceDiagram
    participant U as User
    participant H as useFetch effect
    participant API as Server
    U->>H: userId = 1 (url A)
    H->>API: GET A with controller A
    U->>H: userId = 2 (url B)
    H->>H: cleanup aborts controller A, active = false
    H->>API: GET B with controller B
    API-->>H: response B
    H->>U: render user 2
    API--xH: late response A is aborted or ignored
```
*Figure: Without the cleanup, the slower response A would arrive last and overwrite user 2 with user 1.*

- **Two layers of protection.** `controller.abort()` cancels the request at the network level, saves bandwidth and makes `fetch` reject with an `AbortError`. The `active` flag is the logic-level guard. It also covers work that abort cannot cancel: in React Native's XHR-based `fetch`, the body may already be buffered, so `res.json()` can still resolve after an abort.
- **HTTP errors.** `fetch` only rejects on network failure. A 404 or 500 resolves normally, so `res.ok` must be checked. JSON parse errors land in the same `catch`.
- **Stale-while-revalidate.** The loading and error states carry `prev.data`, so a refetch or a URL change doesn't blank the screen.
- **Strict Mode.** In development the effect runs twice on mount, so you will see one cancelled request in the network inspector. That is expected and proves the cleanup works.
- **No `isMounted` ref.** React 18 removed the "state update on an unmounted component" warning. The real bug was always the race, not the warning.

> [!INTERVIEW]
> What a senior answer includes: naming the race before writing code, both abort and ignore guards, `res.ok`, a discriminated union, and a clear "I'd use TanStack Query in production because it adds caching, request dedupe, retries, refetch on focus and reconnect, and garbage collection". Red flag: `useEffect(async () => ...)`, which returns a Promise instead of a cleanup function.

#### Follow-ups

- **"Add a timeout."** Start `setTimeout(() => controller.abort(), 10_000)` next to the request and clear it in `finally`. Set a `timedOut` flag so you can show "took too long" instead of treating it as a cancellation. Don't assume `AbortSignal.timeout()` or `AbortSignal.any()` exist in every RN runtime; check your version.
- **"Two components request the same URL. Dedupe it."** Keep a module-level `Map<url, Promise>` of in-flight requests, plus a TTL cache. At that point you are rebuilding TanStack Query: `useQuery({ queryKey: ['user', id], queryFn: ({ signal }) => getUser(id, signal) })`. It passes an `AbortSignal` to `queryFn` for you.
- **"Suspense version?"** React 19's `use(promise)` suspends on a promise. That promise must come from a cache created outside render, or every render creates a new promise and suspends forever.

### Implement `useAppState` and `useOnlineStatus`

**Task:** Implement `useAppState(onChange?)` that returns the current `AppState` (`active`, `background`, `inactive`) and calls `onChange(next, prev)` on transitions, plus a `useOnForeground(callback)` helper. Then implement `useOnlineStatus()` on top of `@react-native-community/netinfo`, and show how to wire both into TanStack Query so queries refetch on foreground and on reconnect.

#### What the interviewer evaluates

- Subscription cleanup with `subscription.remove()`. The old `AppState.removeEventListener` API is gone.
- Platform nuance: iOS reports `inactive` for the app switcher, Control Center, notification banners, incoming calls and Face ID prompts. Android goes straight from `active` to `background`.
- Latest-callback refs, so inline callbacks don't resubscribe.
- NetInfo semantics: `isConnected` (there is a network) versus `isInternetReachable` (it actually reaches the internet, `null` while unknown).
- Knowing that offline detection is a hint. Requests can still fail and must be handled.

#### Solution

```ts title="src/hooks/useAppState.ts"
import { useEffect, useLayoutEffect, useRef, useState } from 'react';
import { AppState, type AppStateStatus } from 'react-native';

export function useAppState(onChange?: (next: AppStateStatus, prev: AppStateStatus) => void) {
  const [appState, setAppState] = useState<AppStateStatus>(AppState.currentState);
  const prevRef = useRef<AppStateStatus>(AppState.currentState);
  const onChangeRef = useRef(onChange);

  useLayoutEffect(() => {
    onChangeRef.current = onChange;
  });

  useEffect(() => {
    const subscription = AppState.addEventListener('change', (next) => {
      const prev = prevRef.current;
      if (next === prev) return;
      prevRef.current = next;
      setAppState(next);
      onChangeRef.current?.(next, prev);
    });
    return () => subscription.remove();
  }, []);

  return appState;
}

/** Fires when the app returns from the background (not for iOS inactive blips). */
export function useOnForeground(callback: () => void) {
  useAppState((next, prev) => {
    if (next === 'active' && prev === 'background') callback();
  });
}
```

```ts title="src/hooks/useOnlineStatus.ts"
import { useEffect, useState } from 'react';
import NetInfo, { type NetInfoStateType } from '@react-native-community/netinfo';

export interface OnlineStatus {
  /** null until NetInfo has reported at least once */
  isOnline: boolean | null;
  type: NetInfoStateType | null;
}

export function useOnlineStatus(): OnlineStatus {
  const [status, setStatus] = useState<OnlineStatus>({ isOnline: null, type: null });

  useEffect(() => {
    // The listener is called with the current state shortly after subscribing.
    const unsubscribe = NetInfo.addEventListener((state) => {
      setStatus({
        // Treat "reachability unknown" (null) as online; only a definite false is offline.
        isOnline: state.isConnected === true && state.isInternetReachable !== false,
        type: state.type,
      });
    });
    return unsubscribe;
  }, []);

  return status;
}
```

```ts title="src/lib/queryLifecycle.ts"
import NetInfo from '@react-native-community/netinfo';
import { focusManager, onlineManager } from '@tanstack/react-query';
import { AppState, Platform, type AppStateStatus } from 'react-native';

// Pause/resume queries and mutations with connectivity.
onlineManager.setEventListener((setOnline) =>
  NetInfo.addEventListener((state) => {
    setOnline(!!state.isConnected);
  }),
);

// "Window focus" on mobile = app foreground.
function onAppStateChange(status: AppStateStatus) {
  if (Platform.OS !== 'web') focusManager.setFocused(status === 'active');
}

export function subscribeAppFocus(): () => void {
  const subscription = AppState.addEventListener('change', onAppStateChange);
  return () => subscription.remove();
}
```

#### Walkthrough

- `prevRef` deduplicates identical consecutive events and gives the callback the previous state without waiting for a re-render.
- `useOnForeground` deliberately ignores `inactive → active`. Otherwise pulling down Control Center on iOS would trigger a refetch, or a security re-lock, every time. Security-sensitive screens *should* react to `inactive`, for example by covering content before iOS takes the app-switcher snapshot.
- Android also emits `focus` and `blur` AppState events (for example when the notification shade is pulled down). They are useful for pausing video.
- NetInfo's `isInternetReachable` is determined by pinging a reachability URL. Configure it with `NetInfo.configure({ reachabilityUrl })` to hit your own health endpoint, which also catches captive portals. NetInfo also ships a ready-made `useNetInfo()` hook; building your own shows you understand subscriptions.
- `useAppState` re-renders its host on every transition. If you only need the side effect (`useOnForeground`), that re-render is wasted. A variant that only keeps the ref and never sets state avoids it.

#### Follow-ups

- **"Show an offline banner without flicker."** Networks flap during handovers such as Wi-Fi to cellular. Debounce the offline state by 1–2 s (`useDebounce(isOnline, 1500)`) before showing the banner, and hide it immediately on reconnect.
- **"Auto-lock after 5 minutes in the background."** Store `Date.now()` on the `background` transition and compare on `active`. Don't use a timer, because it won't run while the app is suspended.
- **"Can this use `useSyncExternalStore`?"** Yes, if you keep a module-level cache of the last NetInfo state (a sync `getSnapshot`) and subscribe once. Every component then reads the same value without each creating its own subscription.

### Build `useCountdown` that stays correct when the app is backgrounded

**Task:** Build `useCountdown(endsAt)` for an OTP resend timer, flash sale or auction. It returns the seconds left, an `mm:ss` label and `isDone`, and calls `onFinish` exactly once. It must be correct after the app spends a minute in the background, and when the JS thread is busy.

#### What the interviewer evaluates

- Knowing that JS timers pause while the app is suspended and drift under load, so decrementing a counter every second is wrong.
- Deriving remaining time from an **absolute deadline** on every tick, and resyncing immediately on foreground.
- `onFinish` fired once, via a latest-callback ref.
- Avoiding pointless re-renders (the state changes once per second, not per tick).
- Awareness of device versus server clock skew.

#### Solution

```ts title="src/hooks/useCountdown.ts"
import { useEffect, useLayoutEffect, useRef, useState } from 'react';
import { AppState } from 'react-native';

const secondsUntil = (endsAt: number | null) =>
  endsAt == null ? 0 : Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));

export function formatMmSs(totalSeconds: number): string {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

export function useCountdown(
  endsAt: number | null,
  { tickMs = 250, onFinish }: { tickMs?: number; onFinish?: () => void } = {},
) {
  const [secondsLeft, setSecondsLeft] = useState(() => secondsUntil(endsAt));
  const onFinishRef = useRef(onFinish);

  useLayoutEffect(() => {
    onFinishRef.current = onFinish;
  });

  useEffect(() => {
    if (endsAt == null) {
      setSecondsLeft(0);
      return;
    }

    let finished = false;
    let intervalId: ReturnType<typeof setInterval> | undefined;

    const sync = () => {
      const left = secondsUntil(endsAt);
      setSecondsLeft(left); // same value => React bails out, so ~1 render per second
      if (left === 0 && !finished) {
        finished = true;
        if (intervalId !== undefined) clearInterval(intervalId);
        onFinishRef.current?.();
      }
    };

    sync(); // correct immediately (also handles "already expired" on mount)
    if (!finished) intervalId = setInterval(sync, tickMs);

    // Timers don't run while suspended: resync the moment we're back.
    const subscription = AppState.addEventListener('change', (s) => {
      if (s === 'active') sync();
    });

    return () => {
      if (intervalId !== undefined) clearInterval(intervalId);
      subscription.remove();
    };
  }, [endsAt, tickMs]);

  return { secondsLeft, label: formatMmSs(secondsLeft), isDone: secondsLeft === 0 };
}
```

```tsx title="src/components/ResendCode.tsx"
import React, { useState } from 'react';
import { Button, Text } from 'react-native';
import { useCountdown } from '../hooks/useCountdown';

const COOLDOWN_MS = 30_000;

export function ResendCode({ onResend }: { onResend: () => Promise<void> }) {
  const [endsAt, setEndsAt] = useState(() => Date.now() + COOLDOWN_MS);
  const { isDone, label } = useCountdown(endsAt);

  if (!isDone) return <Text>Resend code in {label}</Text>;

  return (
    <Button
      title="Resend code"
      onPress={async () => {
        await onResend();
        setEndsAt(Date.now() + COOLDOWN_MS);
      }}
    />
  );
}
```

#### Walkthrough

- **Why tick counting fails**: `setSeconds((s) => s - 1)` assumes every tick arrives on time. iOS suspends the JS thread soon after backgrounding and Android throttles it. After 60 s away the counter resumes where it stopped and still shows 25 s. Heavy JS work (a big list render, JSON parsing) also delays ticks, and the error accumulates.
- **Deadline-based**: each tick recomputes `endsAt - Date.now()`, so the value corrects itself however late the tick is. The `AppState` listener gives the correct value the instant the app returns, instead of up to `tickMs` later.
- **Tick at 250 ms, render once per second**: a fast tick keeps the display within a quarter-second of the true boundary, while storing *whole seconds* in state means React bails out on the three ticks where nothing visible changed.
- **`Math.ceil`**: the display shows "00:01" until the final second has actually elapsed. Floor would show "00:00" with 900 ms left.
- **Accessibility**: don't put `accessibilityLiveRegion` on a ticking label, because TalkBack would announce every second. Announce once when the timer finishes instead.

#### Follow-ups

- **"The auction end time comes from the server."** The device clock can be wrong or deliberately changed. Compute `offset = serverNow - Date.now()` from a response field or header when you fetch, and use `endsAt - (Date.now() + offset)`. `performance.now()` is monotonic, but how it behaves across device sleep varies by platform, so it is a poor fit for long background gaps.
- **"Notify the user when it ends while the app is in the background."** JS won't reliably run then. Schedule a local notification for `endsAt` when you start, and cancel it if the timer finishes in the foreground. See the [Push Notifications guide](../guides/push-notifications.html) and [Background Tasks](../guides/background-tasks.html).
- **"Survive an app kill."** Persist `endsAt` (never "seconds remaining") in MMKV and restore it on launch.
- **"Smooth circular progress."** Drive it with Reanimated, for example `progress.value = withTiming(0, { duration: endsAt - Date.now(), easing: Easing.linear })` on the UI thread, and restart it from the recomputed remaining time on foreground.

### Build a debounced search screen with cancellation and loading, empty and error states

**Task:** Build a product search screen. Requirements:

- Search as the user types, but no request per keystroke.
- Minimum of 2 characters.
- Cancel outdated requests.
- Show distinct **idle / loading / results / empty / error** states, with a retry on error.
- Keep the old results visible while a new query loads.
- Tapping a result must work on the first tap while the keyboard is open.

#### What the interviewer evaluates

- Debouncing the **query value**, not the controlled `TextInput` value.
- Cancellation and race safety, the same as `useFetch`.
- State modelling: a union rather than four booleans that can contradict each other.
- UX details: no flash of empty list, an inline spinner, an error that doesn't wipe the results, `keyboardShouldPersistTaps`.
- Knowing what TanStack Query would give you here: a cache, so backspacing to a previous query is instant.

#### Solution

```tsx title="src/screens/SearchScreen.tsx"
import React, { useEffect, useState } from 'react';
import { ActivityIndicator, FlatList, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';
import { useDebounce } from '../hooks/useDebounce';

interface Product {
  id: string;
  title: string;
  price: number;
}

type SearchState =
  | { status: 'idle' }
  | { status: 'loading'; results: Product[] }
  | { status: 'success'; results: Product[] }
  | { status: 'error'; results: Product[]; message: string };

const MIN_CHARS = 2;

async function searchProducts(query: string, signal: AbortSignal): Promise<Product[]> {
  const res = await fetch(`https://api.example.com/products?q=${encodeURIComponent(query)}`, { signal });
  if (!res.ok) throw new Error(`Search failed (${res.status})`);
  const body = (await res.json()) as { items: Product[] };
  return body.items;
}

const previousResults = (s: SearchState) => (s.status === 'idle' ? [] : s.results);

export function SearchScreen() {
  const [query, setQuery] = useState('');
  const trimmed = query.trim();
  const debouncedQuery = useDebounce(trimmed, 350);
  const [state, setState] = useState<SearchState>({ status: 'idle' });
  const [attempt, setAttempt] = useState(0); // bump to retry the same query

  useEffect(() => {
    if (debouncedQuery.length < MIN_CHARS) {
      setState({ status: 'idle' });
      return;
    }

    const controller = new AbortController();
    let active = true;

    // Keep showing the previous results while the new query loads.
    setState((prev) => ({ status: 'loading', results: previousResults(prev) }));

    searchProducts(debouncedQuery, controller.signal)
      .then((results) => {
        if (active) setState({ status: 'success', results });
      })
      .catch((e: unknown) => {
        if (!active || controller.signal.aborted) return;
        const message = e instanceof Error ? e.message : 'Something went wrong';
        setState((prev) => ({ status: 'error', message, results: previousResults(prev) }));
      });

    return () => {
      active = false;
      controller.abort();
    };
  }, [debouncedQuery, attempt]);

  const isTyping = trimmed !== debouncedQuery;
  const showSpinner = trimmed.length >= MIN_CHARS && (isTyping || state.status === 'loading');

  return (
    <View style={styles.container}>
      <View style={styles.searchRow}>
        <TextInput
          value={query}
          onChangeText={setQuery}
          placeholder="Search products"
          autoCorrect={false}
          autoCapitalize="none"
          returnKeyType="search"
          clearButtonMode="while-editing"
          accessibilityLabel="Search products"
          style={styles.input}
        />
        {showSpinner ? <ActivityIndicator style={styles.spinner} /> : null}
      </View>

      {state.status === 'error' ? (
        <View style={styles.banner} accessibilityRole="alert">
          <Text style={styles.bannerText}>{state.message}</Text>
          <Pressable onPress={() => setAttempt((n) => n + 1)} accessibilityRole="button" hitSlop={8}>
            <Text style={styles.retry}>Retry</Text>
          </Pressable>
        </View>
      ) : null}

      <FlatList
        data={previousResults(state)}
        keyExtractor={(item) => item.id}
        keyboardShouldPersistTaps="handled"
        keyboardDismissMode="on-drag"
        renderItem={({ item }) => (
          <View style={styles.row}>
            <Text style={styles.title}>{item.title}</Text>
            <Text>{item.price.toFixed(2)}</Text>
          </View>
        )}
        ListEmptyComponent={<EmptyState state={state} query={debouncedQuery} busy={showSpinner} />}
      />
    </View>
  );
}

function EmptyState({ state, query, busy }: { state: SearchState; query: string; busy: boolean }) {
  if (busy || state.status === 'error') return null; // spinner / banner already visible
  if (state.status === 'idle') {
    return <Text style={styles.hint}>{`Type at least ${MIN_CHARS} characters to search.`}</Text>;
  }
  return <Text style={styles.hint}>{`No results for "${query}".`}</Text>;
}

const styles = StyleSheet.create({
  container: { flex: 1 },
  searchRow: { flexDirection: 'row', alignItems: 'center', padding: 12 },
  input: { flex: 1, height: 44, borderWidth: StyleSheet.hairlineWidth, borderRadius: 8, paddingHorizontal: 12 },
  spinner: { marginLeft: 8 },
  banner: { flexDirection: 'row', justifyContent: 'space-between', padding: 12, backgroundColor: '#fdecea' },
  bannerText: { flex: 1, color: '#8a1c1c' },
  retry: { fontWeight: '600' },
  row: { flexDirection: 'row', justifyContent: 'space-between', padding: 16 },
  title: { flex: 1, marginRight: 12 },
  hint: { textAlign: 'center', marginTop: 32, opacity: 0.6 },
});
```

#### Walkthrough

- **Debounce the derived query, not the input.** The `TextInput` stays controlled by `query` and updates on every keystroke. Debouncing a controlled input's `value` causes lost characters and cursor jumps.
- **Cancellation**: the effect keyed on `debouncedQuery` aborts the previous request in cleanup, and the `active` flag protects against late resolutions. A retry bumps `attempt`, which re-runs the same effect for the same query.
- **State union**: `results` only exists where it makes sense, and "loading with previous results" is an explicit, intentional state. That gives stale-while-revalidate without a flash of empty list.
- **Keyboard**: `keyboardShouldPersistTaps="handled"` makes the first tap on a result register. With the default, the first tap only dismisses the keyboard. `keyboardDismissMode="on-drag"` hides it when the user scrolls the results.
- **`isTyping` feedback**: the spinner appears as soon as the user types, not 350 ms later, so the app feels responsive during the debounce window.
- **Performance**: for large result sets, memoize the row component and use FlashList. `encodeURIComponent` prevents broken URLs for queries like `a&b`.

#### Follow-ups

- **"Rewrite it with TanStack Query."**

  ```ts
  import { keepPreviousData, useQuery } from '@tanstack/react-query';

  const search = useQuery({
    queryKey: ['products', 'search', debouncedQuery],
    queryFn: ({ signal }) => searchProducts(debouncedQuery, signal),
    enabled: debouncedQuery.length >= MIN_CHARS,
    placeholderData: keepPreviousData,
    staleTime: 60_000,
  });
  ```

  You get a per-query cache (backspacing is instant), deduplication and retries. The `signal` it passes is aborted when a query becomes unused mid-flight.
- **"Recent searches."** Persist the last N successful queries in MMKV and show them in the idle state.
- **"Announce results for screen readers."** When results arrive, call `` AccessibilityInfo.announceForAccessibility(`${results.length} results`) ``.
- **"Offline."** Show cached results with a banner, and disable the request while NetInfo reports offline.

### Build an infinite-scroll list with pull-to-refresh, retry and deduplicated page loads

**Task:** Build a feed that loads 20 posts per page with cursor pagination. Requirements:

- Load the next page as the user nears the end.
- Pull-to-refresh.
- Full-screen error with retry when the first page fails, and a footer retry when a later page fails.
- Never fire duplicate concurrent page requests.
- Deduplicate items that appear on two pages.
- Keep existing items if a refresh fails.

#### What the interviewer evaluates

- Knowing that `onEndReached` fires **multiple times**, and guarding with a synchronous ref rather than state.
- A clear state machine: initial, more, refresh, error, exhausted.
- Refresh superseding an in-flight page load (abort), with no stale request clearing the new one's flag.
- Stopping auto-pagination after a page error (otherwise you get a request loop on a bad network).
- FlatList performance basics: stable `renderItem`, memoized rows, `keyExtractor`.

#### Solution

```ts title="src/hooks/usePaginatedList.ts"
import { useCallback, useEffect, useLayoutEffect, useRef, useState } from 'react';

export interface Page<T> {
  items: T[];
  nextCursor: string | null;
}

export type FetchPage<T> = (cursor: string | null, signal: AbortSignal) => Promise<Page<T>>;
type LoadMode = 'initial' | 'more' | 'refresh';

interface ListState<T> {
  items: T[];
  hasMore: boolean;
  loading: LoadMode | null;
  error: { mode: LoadMode; message: string } | null;
}

function mergeUnique<T extends { id: string }>(existing: T[], incoming: T[]): T[] {
  const seen = new Set(existing.map((item) => item.id));
  const merged = existing.slice();
  for (const item of incoming) {
    if (!seen.has(item.id)) {
      seen.add(item.id);
      merged.push(item);
    }
  }
  return merged;
}

export function usePaginatedList<T extends { id: string }>(fetchPage: FetchPage<T>) {
  const [state, setState] = useState<ListState<T>>({
    items: [],
    hasMore: true,
    loading: 'initial',
    error: null,
  });

  // Refs are read synchronously, unlike state, which is what makes the dedupe reliable.
  const fetchRef = useRef(fetchPage);
  const inFlight = useRef<AbortController | null>(null);
  const cursorRef = useRef<string | null>(null);
  const hasMoreRef = useRef(true);
  const pageErrorRef = useRef(false);

  useLayoutEffect(() => {
    fetchRef.current = fetchPage;
  });

  const load = useCallback(async (mode: LoadMode) => {
    if (mode === 'more') {
      // onEndReached fires repeatedly: ignore while busy, when exhausted,
      // or after a page error (wait for an explicit retry).
      if (inFlight.current || !hasMoreRef.current || pageErrorRef.current) return;
    } else {
      inFlight.current?.abort(); // initial/refresh supersede an in-flight page load
    }

    const controller = new AbortController();
    inFlight.current = controller;
    pageErrorRef.current = false;
    setState((s) => ({ ...s, loading: mode, error: null }));

    try {
      const cursor = mode === 'more' ? cursorRef.current : null;
      const page = await fetchRef.current(cursor, controller.signal);
      if (controller.signal.aborted) return;

      cursorRef.current = page.nextCursor;
      hasMoreRef.current = page.nextCursor !== null;
      setState((s) => ({
        items: mode === 'more' ? mergeUnique(s.items, page.items) : mergeUnique([], page.items),
        hasMore: hasMoreRef.current,
        loading: null,
        error: null,
      }));
    } catch (e) {
      if (controller.signal.aborted) return;
      if (mode === 'more') pageErrorRef.current = true;
      const message = e instanceof Error ? e.message : 'Something went wrong';
      // Existing items are kept, which matters for a failed refresh.
      setState((s) => ({ ...s, loading: null, error: { mode, message } }));
    } finally {
      // Only clear the flag if a newer request hasn't replaced us.
      if (inFlight.current === controller) inFlight.current = null;
    }
  }, []);

  useEffect(() => {
    void load('initial');
    return () => inFlight.current?.abort();
  }, [load]);

  const loadMore = useCallback(() => void load('more'), [load]);
  const refresh = useCallback(() => void load('refresh'), [load]);
  const failedMode = state.error?.mode ?? null;
  const retry = useCallback(() => {
    pageErrorRef.current = false;
    void load(failedMode ?? 'initial');
  }, [load, failedMode]);

  return { ...state, loadMore, refresh, retry };
}
```

```tsx title="src/screens/FeedScreen.tsx"
import React, { memo, useCallback } from 'react';
import { ActivityIndicator, FlatList, Pressable, StyleSheet, Text, View } from 'react-native';
import { usePaginatedList, type Page } from '../hooks/usePaginatedList';

interface Post {
  id: string;
  title: string;
}

async function fetchPosts(cursor: string | null, signal: AbortSignal): Promise<Page<Post>> {
  const params = new URLSearchParams({ limit: '20' });
  if (cursor) params.set('cursor', cursor);
  const res = await fetch(`https://api.example.com/posts?${params.toString()}`, { signal });
  if (!res.ok) throw new Error(`Couldn't load posts (${res.status})`);
  return (await res.json()) as Page<Post>;
}

const PostRow = memo(function PostRow({ post }: { post: Post }) {
  return (
    <View style={styles.row}>
      <Text>{post.title}</Text>
    </View>
  );
});

export function FeedScreen() {
  const { items, hasMore, loading, error, loadMore, refresh, retry } = usePaginatedList(fetchPosts);
  const renderItem = useCallback(({ item }: { item: Post }) => <PostRow post={item} />, []);

  if (items.length === 0 && loading === 'initial') {
    return <ActivityIndicator size="large" style={styles.center} />;
  }

  if (items.length === 0 && error?.mode === 'initial') {
    return (
      <View style={styles.center}>
        <Text>{error.message}</Text>
        <Pressable onPress={retry} accessibilityRole="button" style={styles.button}>
          <Text>Try again</Text>
        </Pressable>
      </View>
    );
  }

  return (
    <FlatList
      data={items}
      keyExtractor={(post) => post.id}
      renderItem={renderItem}
      onEndReached={loadMore}
      onEndReachedThreshold={0.5}
      refreshing={loading === 'refresh'}
      onRefresh={refresh}
      ListHeaderComponent={
        error?.mode === 'refresh' ? <Text style={styles.banner}>{`Couldn't refresh: ${error.message}`}</Text> : null
      }
      ListEmptyComponent={loading === null ? <Text style={styles.empty}>No posts yet.</Text> : null}
      ListFooterComponent={
        loading === 'more' ? (
          <ActivityIndicator style={styles.footer} />
        ) : error?.mode === 'more' ? (
          <Pressable onPress={retry} accessibilityRole="button" style={styles.footer}>
            <Text>{`${error.message}. Tap to retry.`}</Text>
          </Pressable>
        ) : !hasMore && items.length > 0 ? (
          <Text style={styles.footer}>You're all caught up</Text>
        ) : null
      }
    />
  );
}

const styles = StyleSheet.create({
  center: { flex: 1, alignItems: 'center', justifyContent: 'center' },
  button: { marginTop: 12, padding: 12 },
  row: { padding: 16, borderBottomWidth: StyleSheet.hairlineWidth },
  banner: { padding: 12, textAlign: 'center' },
  empty: { textAlign: 'center', marginTop: 48 },
  footer: { padding: 24, alignItems: 'center', textAlign: 'center' },
});
