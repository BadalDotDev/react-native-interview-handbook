  const d = debounce(fn, 100);
  d('a');
  d('b');
  d('c');
  jest.advanceTimersByTime(99);
  expect(fn).not.toHaveBeenCalled();
  jest.advanceTimersByTime(1);
  expect(fn).toHaveBeenCalledTimes(1);
  expect(fn).toHaveBeenCalledWith('c');
});

test('debounce leading fires immediately and skips trailing for a single call', () => {
  const fn = jest.fn();
  const d = debounce(fn, 100, { leading: true });
  d(1);
  expect(fn).toHaveBeenCalledWith(1);
  jest.advanceTimersByTime(100);
  expect(fn).toHaveBeenCalledTimes(1);
});

test('throttle fires on the leading and trailing edges', () => {
  const fn = jest.fn();
  const t = throttle(fn, 100);
  t(1);
  t(2);
  t(3);
  expect(fn).toHaveBeenNthCalledWith(1, 1);
  jest.advanceTimersByTime(100);
  expect(fn).toHaveBeenNthCalledWith(2, 3);
  expect(fn).toHaveBeenCalledTimes(2);
});

test('debounce preserves this', () => {
  const calls: string[] = [];
  const obj = {
    name: 'form',
    save: debounce(function (this: { name: string }) {
      calls.push(this.name);
    }, 50),
  };
  obj.save();
  jest.runAllTimers();
  expect(calls).toEqual(['form']);
});
```

#### Walkthrough

- **Debounce**: every call resets the timer. With `leading: true`, the first call of a burst runs immediately (`isIdle`) and clears `lastArgs`, so a single call doesn't also fire a trailing call. That matches lodash: with both edges enabled, the trailing call happens only if the function was called again during the wait.
- **Throttle**: it is timestamp-based, not "one timer per call". Calls outside the window run immediately. Calls inside store the latest arguments, and a single timer fires at the window's end with them. The `remaining > wait` guard handles the device clock being moved backwards, which would otherwise freeze the throttle.
- **`this` forwarding**: declaring `this: unknown` as a fake first parameter types the context, and `fn.apply(ctx, args)` forwards it. Arrow functions would lose the caller's `this`.
- **Typing**: TypeScript supports expando properties on function declarations, so `debounced.cancel = ...` produces a callable type with `cancel` and `flush` without casts.
- **Fake timers**: Jest's modern fake timers also mock `Date`, so throttle's `Date.now()` math advances together with `advanceTimersByTime`.
- **Complexity**: O(1) per call, with one timer alive at most.

#### Follow-ups

- **"Implement `maxWait`."** Track the time of the first call in the burst. On each call, if `now - burstStart >= maxWait`, invoke immediately. Lodash implements `throttle` as `debounce` with `maxWait = wait` and both edges enabled.
- **"Return the function's result."** Lodash returns the result of the *last* invocation, which is often confusing. A cleaner design for async work is a debounced function that returns a Promise resolved with the eventual result for every caller in the burst.
- **"Why not `setInterval` for throttle?"** It fires even when there are no calls (wasted work) and doesn't align the window with the first call.

### Find the bugs: a stopwatch that sticks at 1 and won't stop

**Task:** A teammate's stopwatch shows "1s" forever after Start, Stop doesn't stop it, pressing Start again makes it misbehave, and it shows the wrong time after returning from the background. Find every bug and fix it.

```tsx title="src/components/Stopwatch.tsx (buggy)"
import React, { useEffect, useState } from 'react';
import { Button, Text, View } from 'react-native';

export function Stopwatch() {
  const [seconds, setSeconds] = useState(0);
  const [running, setRunning] = useState(false);

  useEffect(() => {
    if (running) {
      setInterval(() => {
        setSeconds(seconds + 1);
      }, 1000);
    }
  }, [running]);

  return (
    <View>
      <Text>{seconds}s</Text>
      <Button title={running ? 'Stop' : 'Start'} onPress={() => setRunning(!running)} />
      <Button title="Reset" onPress={() => setSeconds(0)} />
    </View>
  );
}
```

#### What the interviewer evaluates

- Spotting the **stale closure**: the interval callback captured `seconds` from the render in which the effect ran.
- Spotting the **missing cleanup**: the interval is never cleared.
- Knowing that `exhaustive-deps` would have flagged `seconds`, and that adding it is *not* the right fix.
- Going beyond the minimal fix to a timestamp-based design that survives backgrounding.

#### Solution

**Bugs:**

1. **Stale closure**: `setSeconds(seconds + 1)` always computes `0 + 1`, so the display sticks at 1s.
2. **No cleanup**: the effect doesn't return `clearInterval`. Stop only changes `running`, and the old interval keeps ticking. Every Start adds another interval, and they all keep running after unmount (a leak).
3. **Reset appears broken**: the stale interval immediately writes `seconds + 1` again, using the captured value.
4. **Tick counting**: intervals pause while the app is suspended and drift under load, so the elapsed time is wrong after backgrounding.

Minimal fix (functional update plus cleanup):

```tsx
useEffect(() => {
  if (!running) return;
  const id = setInterval(() => setSeconds((s) => s + 1), 1000);
  return () => clearInterval(id);
}, [running]);
```

Production fix (derive elapsed time from timestamps):

```tsx title="src/components/Stopwatch.tsx (fixed)"
import React, { useEffect, useState } from 'react';
import { Button, Text, View } from 'react-native';

export function Stopwatch() {
  const [accumulatedMs, setAccumulatedMs] = useState(0); // from previous runs
  const [startedAt, setStartedAt] = useState<number | null>(null); // null = stopped
  const [now, setNow] = useState(() => Date.now());
  const running = startedAt !== null;

  useEffect(() => {
    if (startedAt === null) return;
    const id = setInterval(() => setNow(Date.now()), 250); // only triggers re-renders
    return () => clearInterval(id);
  }, [startedAt]);

  const elapsedMs = accumulatedMs + (startedAt !== null ? now - startedAt : 0);

  const start = () => {
    const t = Date.now();
    setStartedAt(t);
    setNow(t);
  };
  const stop = () => {
    if (startedAt === null) return;
    setAccumulatedMs((a) => a + (Date.now() - startedAt));
    setStartedAt(null);
  };
  const reset = () => {
    const t = Date.now();
    setAccumulatedMs(0);
    setStartedAt(running ? t : null);
    setNow(t);
  };

  return (
    <View>
      <Text>{Math.floor(elapsedMs / 1000)}s</Text>
      <Button title={running ? 'Stop' : 'Start'} onPress={running ? stop : start} />
      <Button title="Reset" onPress={reset} />
    </View>
  );
}
```

#### Walkthrough

- Adding `seconds` to the deps would "fix" the counter by tearing down and recreating the interval every second. That is wasteful, and the timer resets on any re-render. The functional updater `setSeconds((s) => s + 1)` doesn't need the closure value at all.
- The cleanup ties the interval's lifetime to `running`: stopping, restarting and unmounting all clear the previous interval.
- In the production version, the interval only *schedules re-renders*. The displayed value is always `now - startedAt`, so a late tick, a busy JS thread or 5 minutes in the background can't make it wrong. The first tick after resume corrects it within 250 ms.

#### Follow-ups

- **"How would the linter have helped?"** `react-hooks/exhaustive-deps` warns that `seconds` is missing. The right response is a functional update, not adding the dependency.
- **"Persist a running stopwatch across app restarts."** Store `startedAt` and `accumulatedMs` in MMKV. Both are absolute values, so a restore is exact.
- **"Lap times?"** Record `elapsedMs` snapshots in an array. They are derived values, so they are consistent with the display.

### Find the bugs: a chat screen that leaks subscriptions

**Task:** After visiting a few chat rooms, users see duplicated messages, messages from the previous room, and battery drain. The keyboard handling gets slower over time. Find and fix the bugs.

```tsx title="src/screens/ChatScreen.tsx (buggy)"
import React, { useEffect, useState } from 'react';
import { Keyboard } from 'react-native';
import { fetchHistory, type Message } from '../api/chat';
import { MessageList } from '../components/MessageList';

export function ChatScreen({ roomId }: { roomId: string }) {
  const [messages, setMessages] = useState<Message[]>([]);
  const [keyboardHeight, setKeyboardHeight] = useState(0);

  useEffect(() => {
    fetchHistory(roomId).then((history) => setMessages(history));
  }, [roomId]);

  useEffect(() => {
    const socket = new WebSocket(`wss://chat.example.com/rooms/${roomId}`);
    socket.onmessage = (e) => {
      setMessages((prev) => [...prev, JSON.parse(e.data)]);
    };
  }, []);

  useEffect(() => {
    Keyboard.addListener('keyboardDidShow', (e) => setKeyboardHeight(e.endCoordinates.height));
    Keyboard.addListener('keyboardDidHide', () => setKeyboardHeight(0));
  });

  return <MessageList messages={messages} bottomInset={keyboardHeight} />;
}
```

#### What the interviewer evaluates

- Every subscription needs a matching cleanup: sockets, listeners, timers, requests.
- Dependency arrays that match what the effect uses (`roomId`).
- Async races when a prop changes (room A's slow history arriving in room B).
- Merging two data sources (history plus live) without losing or duplicating messages.
- RN navigation context: stack screens stay mounted when you navigate forward.

#### Solution

**Bugs:**

1. **Socket never closed**: leaving the screen leaves the connection open (battery, data, server load). Remounting opens another one, so every message is delivered twice.
2. **Missing `roomId` dependency on the socket effect**: switching rooms keeps the *first* room's socket, so messages from the wrong room appear. `exhaustive-deps` flags this.
3. **Keyboard listeners with no deps array and no cleanup**: two new listeners on *every render*, none removed. After 100 renders, each keyboard event runs 100 `setState` calls. That is the "gets slower" symptom.
4. **History race**: room A's slow history can resolve after the switch to room B and overwrite B's messages.
5. **History overwrites live messages**: messages that arrived over the socket before history resolved are thrown away by `setMessages(history)`.

```tsx title="src/screens/ChatScreen.tsx (fixed)"
import React, { useEffect, useState } from 'react';
import { Keyboard } from 'react-native';
import { fetchHistory, type Message } from '../api/chat';
import { MessageList } from '../components/MessageList';

function mergeById(a: Message[], b: Message[]): Message[] {
  const byId = new Map<string, Message>();
  for (const m of [...a, ...b]) byId.set(m.id, m);
  return [...byId.values()].sort((x, y) => x.createdAt - y.createdAt);
}

export function ChatScreen({ roomId }: { roomId: string }) {
  const [messages, setMessages] = useState<Message[]>([]);
  const [keyboardHeight, setKeyboardHeight] = useState(0);

  // History: race-safe, merged with anything that already arrived live.
  useEffect(() => {
    const controller = new AbortController();
    let active = true;
    setMessages([]);
    fetchHistory(roomId, controller.signal)
      .then((history) => {
        if (active) setMessages((live) => mergeById(history, live));
      })
      .catch((e: unknown) => {
        if (active && !controller.signal.aborted) console.warn('History failed', e);
      });
    return () => {
      active = false;
      controller.abort();
    };
  }, [roomId]);

  // Live messages: one socket per room, closed on room change and unmount.
  useEffect(() => {
    const socket = new WebSocket(`wss://chat.example.com/rooms/${encodeURIComponent(roomId)}`);
    socket.onmessage = (e) => {
      const message = JSON.parse(e.data) as Message;
      setMessages((prev) => mergeById(prev, [message]));
    };
    return () => {
      socket.onmessage = null;
      socket.close();
    };
  }, [roomId]);

  // Keyboard: subscribe once, remove on unmount.
  useEffect(() => {
    const show = Keyboard.addListener('keyboardDidShow', (e) => setKeyboardHeight(e.endCoordinates.height));
    const hide = Keyboard.addListener('keyboardDidHide', () => setKeyboardHeight(0));
    return () => {
      show.remove();
      hide.remove();
    };
  }, []);

  return <MessageList messages={messages} bottomInset={keyboardHeight} />;
}
```

#### Walkthrough

- **The cleanup rule**: whatever an effect opens, its cleanup closes. React runs the cleanup before re-running the effect (on dependency change) and on unmount, so "one socket per room" follows from the deps array.
- **Strict Mode helps here**: in development, React mounts, unmounts and remounts every component. With the buggy code you'd immediately see two sockets and doubled messages. That is exactly the bug Strict Mode is designed to surface.
- **Merge by id**: history and live streams overlap. A `Map` keyed by id deduplicates, and sorting by `createdAt` restores order. For very long chats, append-only merging with a `Set` of seen ids avoids the O(n log n) sort per message.
- **Keyboard**: manual heights are fragile. Prefer `KeyboardAvoidingView`, or `react-native-keyboard-controller` for frame-accurate, interactive keyboard handling.

#### Follow-ups

- **"The chat should disconnect when the user navigates to another screen in the stack."** Stack screens stay mounted underneath the pushed screen, so the effect doesn't clean up. Use React Navigation's `useFocusEffect` (with a `useCallback`) to scope the socket to focus, or close it when the app backgrounds.
- **"Reconnect after network loss."** Listen to `onclose`, reconnect with backoff and jitter, fetch missed messages since the last seen id, and stop reconnecting after cleanup has run.
- **"How would you catch these in CI?"** Enforce the `react-hooks/exhaustive-deps` lint rule as an error, and add a test that unmounts the screen and asserts `socket.close` was called (mock `WebSocket`).

### Find the bugs: a todo list that shows the wrong text after inserting and sorting

**Task:** In this todo list, after tapping "Add", the first row shows the *old* first item's title. Sorting sometimes does nothing, edits disappear, and occasionally a warning about duplicate keys appears. Find the bugs.

```tsx title="src/screens/TodoList.tsx (buggy)"
import React, { useState } from 'react';
import { Button, FlatList, Switch, Text, TextInput, View } from 'react-native';

interface Todo {
  id: string;
  title: string;
  done: boolean;
}

function TodoRow({ todo, onToggle }: { todo: Todo; onToggle: (id: string) => void }) {
  const [draft, setDraft] = useState(todo.title);
  const [editing, setEditing] = useState(false);

  return (
    <View style={{ flexDirection: 'row', alignItems: 'center', padding: 12 }}>
      <Switch value={todo.done} onValueChange={() => onToggle(todo.id)} />
      {editing ? (
        <TextInput value={draft} onChangeText={setDraft} onBlur={() => setEditing(false)} autoFocus />
      ) : (
        <Text onPress={() => setEditing(true)}>{draft}</Text>
      )}
    </View>
  );
}

export function TodoList({ initialTodos }: { initialTodos: Todo[] }) {
  const [todos, setTodos] = useState<Todo[]>(initialTodos);

  const addTodo = (title: string) =>
    setTodos((prev) => [{ id: String(Date.now()), title, done: false }, ...prev]);
  const toggle = (id: string) =>
    setTodos((prev) => prev.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
  const sortByDone = () => setTodos((prev) => prev.sort((a, b) => Number(a.done) - Number(b.done)));

  return (
    <View style={{ flex: 1 }}>
      <Button title="Add" onPress={() => addTodo('New todo')} />
      <Button title="Sort" onPress={sortByDone} />
      <FlatList
        data={todos}
        keyExtractor={(_, index) => String(index)}
        renderItem={({ item }) => <TodoRow todo={item} onToggle={toggle} />}
      />
    </View>
  );
}
```

#### What the interviewer evaluates

- Understanding reconciliation: keys decide which component instance (and its state) belongs to which item.
- The "state initialized from props" anti-pattern (copying props into state).
- Immutable updates: `Array.prototype.sort` mutates and returns the same reference.
- Stable, unique ids, and knowing when index keys are acceptable.

#### Solution

**Bugs:**

1. **Index keys plus local state**: inserting at the top shifts every item's index. React keeps the component instance for key `"0"` and gives it the new todo, but that instance's `draft` state still holds the *old* first title, and `editing` sticks to the position too. The same happens after sorting.
2. **Props copied into state**: `useState(todo.title)` only uses its argument on the first render. Even with correct keys, if the title changes (server sync, rename elsewhere), the row keeps showing the stale `draft`.
3. **Edits are never saved**: `onBlur` just leaves edit mode, and nothing propagates the new title to `todos`.
4. **`prev.sort()` mutates state**: it sorts in place and returns the *same array*. `Object.is(prev, next)` is true, so React bails out and the UI may not update. You've also mutated state that other code may hold.
5. **`Date.now()` ids collide** when two todos are created in the same millisecond, which produces duplicate keys.

```tsx title="src/screens/TodoList.tsx (fixed)"
import 'react-native-get-random-values';
import { v4 as uuidv4 } from 'uuid';
import React, { memo, useCallback, useState } from 'react';
import { Button, FlatList, Switch, Text, TextInput, View } from 'react-native';

interface Todo {
  id: string;
  title: string;
  done: boolean;
}

interface RowProps {
  todo: Todo;
  onToggle: (id: string) => void;
  onRename: (id: string, title: string) => void;
}

const TodoRow = memo(function TodoRow({ todo, onToggle, onRename }: RowProps) {
  // null = not editing. The draft only exists while editing and starts from the current title.
  const [draft, setDraft] = useState<string | null>(null);

  const commit = () => {
    const title = draft?.trim();
    if (title && title !== todo.title) onRename(todo.id, title);
    setDraft(null);
  };

  return (
    <View style={{ flexDirection: 'row', alignItems: 'center', padding: 12 }}>
      <Switch value={todo.done} onValueChange={() => onToggle(todo.id)} />
      {draft !== null ? (
        <TextInput value={draft} onChangeText={setDraft} onBlur={commit} onSubmitEditing={commit} autoFocus />
      ) : (
        <Text onPress={() => setDraft(todo.title)}>{todo.title}</Text>
      )}
    </View>
  );
});

export function TodoList({ initialTodos }: { initialTodos: Todo[] }) {
  const [todos, setTodos] = useState<Todo[]>(initialTodos);

  const addTodo = useCallback(
    (title: string) => setTodos((prev) => [{ id: uuidv4(), title, done: false }, ...prev]),
    [],
  );
  const toggle = useCallback(
    (id: string) => setTodos((prev) => prev.map((t) => (t.id === id ? { ...t, done: !t.done } : t))),
    [],
  );
  const rename = useCallback(
    (id: string, title: string) => setTodos((prev) => prev.map((t) => (t.id === id ? { ...t, title } : t))),
    [],
  );
  const sortByDone = () => setTodos((prev) => [...prev].sort((a, b) => Number(a.done) - Number(b.done)));

  return (
    <View style={{ flex: 1 }}>
      <Button title="Add" onPress={() => addTodo('New todo')} />
      <Button title="Sort" onPress={sortByDone} />
      <FlatList
        data={todos}
        keyExtractor={(item) => item.id}
        renderItem={({ item }) => <TodoRow todo={item} onToggle={toggle} onRename={rename} />}
      />
    </View>
  );
}
```

#### Walkthrough

- **Keys are identity**: with `item.id` keys, React moves each row's component instance (and its state) along with its item. With index keys, identity follows the *position*, so any insert, delete or reorder mismatches state and data.
- **When index keys are fine**: static lists that never reorder, insert or delete (like the OTP boxes), or items with no state or uncontrolled inputs.
- **Don't mirror props in state**: render `todo.title` directly, and create the draft only while editing. If a component must reset its state when an entity changes, `key={entity.id}` is the idiomatic reset.
- **Immutable sort**: `[...prev].sort(...)` returns a new reference. On runtimes that support ES2023, `prev.toSorted(...)` does the same; check your engine version before relying on it.
- **`memo` plus stable callbacks** (`useCallback` with functional updates) keep unrelated rows from re-rendering on each toggle. The React Compiler can do this memoization automatically.

#### Follow-ups

- **"Same component in FlashList."** FlashList **recycles** component instances across items while scrolling, so local state leaks between items even with correct keys. Avoid item-local state, lift it into a map keyed by id, or use FlashList's `useRecyclingState`, which resets when its dependencies change.
- **"Stable ids for server data without ids?"** Ask the backend for them. Never use `Math.random()` in `keyExtractor`, because it remounts every row on every render.
- **"How would a test catch bug 1?"** Render the list, type into row 0's editor, add a todo, then assert that the first row shows "New todo".

### Find the bugs: a context that re-renders the whole app on scroll

**Task:** The app drops frames when scrolling the feed, and the React DevTools profiler shows about 200 components re-rendering per scroll event. Find the problems in this provider and propose a fixed architecture.

```tsx title="src/app/AppProvider.tsx (buggy)"
import React, { createContext, useState } from 'react';
import { api, type User } from '../api';

export const AppContext = createContext<any>(null);

export function AppProvider({ children }: { children: React.ReactNode }) {
  const [user, setUser] = useState<User | null>(null);
  const [theme, setTheme] = useState<'light' | 'dark'>('light');
  const [cartCount, setCartCount] = useState(0);
  const [scrollY, setScrollY] = useState(0);

  const login = async (email: string, password: string) => {
    setUser(await api.login(email, password));
  };

  return (
    <AppContext.Provider value={{ user, theme, cartCount, scrollY, setTheme, setCartCount, setScrollY, login }}>
      {children}
    </AppContext.Provider>
  );
}

// FeedScreen:      <FlatList onScroll={(e) => setScrollY(e.nativeEvent.contentOffset.y)} ... />
// ~200 components: const { theme } = useContext(AppContext);
```

#### What the interviewer evaluates

- Knowing that **every consumer** re-renders when the context value changes identity, and that there are no selectors.
- Separating state by update frequency and by concern.
- Keeping animation and scroll-driven values out of React state.
- Knowing what the React Compiler fixes (memoization) and what it doesn't (fan-out).
- Typing contexts properly.

#### Solution

**Bugs:**

1. **New `value` object on every provider render**: every consumer re-renders whenever the provider renders, even if the fields it reads didn't change.
2. **Hot state in global context**: `scrollY` updates up to 60 times a second, and each update re-renders all ~200 consumers. The JS thread saturates and frames drop.
3. **Kitchen-sink context**: unrelated concerns with very different update rates share one context. A theme-only consumer re-renders for cart and scroll changes, because context has no way to subscribe to a slice.
4. **`login` has a new identity every render**: it breaks `memo` and effect deps downstream.
5. **`createContext<any>(null)`**: no type safety, and a missing provider fails silently at runtime.

Note that `children` is passed in, so a provider re-render does not by itself re-render the tree below. The damage comes from the *consumers*.

```tsx title="src/app/providers.tsx (fixed)"
import React, { createContext, useContext, useMemo, useState } from 'react';
import { api, type User } from '../api';

// 1. Theme: rarely changes -> own context, memoized value.
type Theme = 'light' | 'dark';
const ThemeContext = createContext<{ theme: Theme; setTheme: (t: Theme) => void } | null>(null);

export function ThemeProvider({ children }: { children: React.ReactNode }) {
  const [theme, setTheme] = useState<Theme>('light');
  const value = useMemo(() => ({ theme, setTheme }), [theme]);
  return <ThemeContext value={value}>{children}</ThemeContext>; // React 19: context as provider
}

export function useTheme() {
  const ctx = useContext(ThemeContext);
  if (!ctx) throw new Error('useTheme must be used within ThemeProvider');
  return ctx;
}

// 2. Auth: split state from actions so action-only consumers never re-render.
interface AuthActions {
  login: (email: string, password: string) => Promise<void>;
  logout: () => void;
}
const AuthStateContext = createContext<User | null>(null);
const AuthActionsContext = createContext<AuthActions | null>(null);

export function AuthProvider({ children }: { children: React.ReactNode }) {
  const [user, setUser] = useState<User | null>(null);
  const actions = useMemo<AuthActions>(
    () => ({
      login: async (email, password) => setUser(await api.login(email, password)),
      logout: () => setUser(null),
    }),
    [],
  );
  return (
    <AuthActionsContext value={actions}>
      <AuthStateContext value={user}>{children}</AuthStateContext>
    </AuthActionsContext>
  );
}

export const useUser = () => useContext(AuthStateContext);
export function useAuthActions() {
  const ctx = useContext(AuthActionsContext);
  if (!ctx) throw new Error('useAuthActions must be used within AuthProvider');
  return ctx;
}
```

        keyExtractor={(p) => p.id}
        renderItem={({ item }) => <PostRow post={item} />}
        onScroll={onScroll}
        scrollEventThrottle={16}
      />
    </>
  );
}
```

#### Walkthrough

- **Rule of thumb**: context is a dependency-injection mechanism, not a state manager. It is great for values that change rarely (theme, locale, auth user, service instances). For frequently changing or large shared state, use a store with selectors (Zustand, Redux, a custom `useSyncExternalStore` store, Jotai atoms).
- **Split state from actions**: components that only call `login` subscribe to a context whose value never changes.
- **The React Compiler** would memoize the value object, which fixes bug 1 on renders where nothing changed. But whenever *any* field changes, every consumer still re-renders, so bugs 2 and 3 remain. Architecture beats memoization.
- **Scroll-linked UI** (collapsing headers, parallax) belongs on the UI thread with Reanimated shared values: zero React renders per frame.

#### Follow-ups

- **"How do you prove the fix?"** Use the React DevTools Profiler: record a scroll, compare commit counts and "why did this render", and enable "highlight updates when components render". Check the JS FPS in the performance monitor.
- **"Can't I select from context?"** Not natively. `use-context-selector` emulates it, but a store is the cleaner solution.
- **"Does React 19's `use(Context)` change anything?"** It can be called conditionally, but its re-render semantics are identical to `useContext`.

### Find the bugs: a product screen stuck in an infinite render loop

**Task:** This screen crashes with "Too many re-renders" and, before that fix, it was hammering the product API continuously. Find every cause and fix them.

```tsx title="src/screens/ProductScreen.tsx (buggy)"
import React, { useEffect, useState } from 'react';
import { Button, Text, View } from 'react-native';
import { fetchProduct, type Product } from '../api/products';

export function ProductScreen({ productId }: { productId: string }) {
  const [product, setProduct] = useState<Product | null>(null);
  const [quantity, setQuantity] = useState(1);
  const [total, setTotal] = useState(0);

  useEffect(() => {
    fetchProduct(productId).then(setProduct);
  });

  if (product) {
    setTotal(product.price * quantity);
  }

  return (
    <View>
      <Text>{product?.name}</Text>
      <Button title="-" onPress={setQuantity(quantity - 1)} />
      <Text>{quantity}</Text>
      <Button title="+" onPress={() => setQuantity(quantity + 1)} />
      <Text>Total: {total}</Text>
    </View>
  );
}
```

#### What the interviewer evaluates

- Distinguishing *calling* a function from *passing* it (`onPress={fn()}` versus `onPress={fn}`).
- Render-phase `setState` rules, and derived state versus stored state.
- Effects without a dependency array.
- Money handling and input bounds, the senior-level details.

#### Solution

**Bugs:**

1. **`onPress={setQuantity(quantity - 1)}` calls `setState` during render**. Each render schedules another render, and React throws "Too many re-renders". TypeScript also rejects it (`void` is not a press handler), which is one more reason to keep `strict` on; in plain JS it slips through.
2. **Unconditional `setTotal(...)` during render**: once `product` exists, every render sets state, which triggers a render, and so on. It is the same error. `total` is **derived data** and shouldn't be state at all.
3. **`useEffect` with no deps array** runs after *every* render: fetch, `setProduct(newObject)`, render, fetch again. It is an infinite network loop that throws **no error**, which makes it the most dangerous of the three. It also has no race protection when `productId` changes.
4. **Quantity can go to 0 or negative**, and there is no loading or error state.
5. **Floating-point money**: `19.99 * 3` gives `59.97000000000001`. Use integer minor units and `Intl.NumberFormat`.

```tsx title="src/screens/ProductScreen.tsx (fixed)"
import React, { useEffect, useState } from 'react';
import { ActivityIndicator, Button, Text, View } from 'react-native';
import { fetchProduct, type Product } from '../api/products'; // Product: { id, name, priceCents, currency }

const formatMoney = (minorUnits: number, currency: string) =>
  // Assumes a 2-decimal currency; use the currency's minor-unit exponent in real code.
  new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(minorUnits / 100);

export function ProductScreen({ productId }: { productId: string }) {
  const [product, setProduct] = useState<Product | null>(null);
  const [error, setError] = useState<string | null>(null);
  const [quantity, setQuantity] = useState(1);

  useEffect(() => {
    let active = true;
    setProduct(null);
    setError(null);
    fetchProduct(productId)
      .then((p) => {
        if (active) setProduct(p);
      })
      .catch((e: unknown) => {
        if (active) setError(e instanceof Error ? e.message : 'Failed to load product');
      });
    return () => {
      active = false;
    };
  }, [productId]);

  if (error) return <Text>{error}</Text>;
  if (!product) return <ActivityIndicator />;

  const totalMinor = product.priceCents * quantity; // derived during render, never stored

  return (
    <View>
      <Text>{product.name}</Text>
      <Button title="-" onPress={() => setQuantity((q) => Math.max(1, q - 1))} disabled={quantity <= 1} />
      <Text>{quantity}</Text>
      <Button title="+" onPress={() => setQuantity((q) => q + 1)} />
      <Text>{`Total: ${formatMoney(totalMinor, product.currency)}`}</Text>
    </View>
  );
}
```

#### Walkthrough

- **The render-phase rule**: React allows `setState` during render only when it is guarded by a condition that becomes false after the update (the `usePreviousDistinct` pattern earlier). An unconditional render-phase update always loops, even when the value is identical, because React re-runs the component for render-phase updates until none are scheduled.
- **"You might not need an effect or state"**: anything computable from props and state (`total`) is computed during render. Storing it creates sync bugs and extra renders.
- **Silent loops are worse**: the missing deps array produces no crash, just continuous requests, battery drain and a surprise server bill. Network logging in development (React Native DevTools network panel) catches it quickly.
- **Hooks before early returns**: all hooks run unconditionally before `if (error) return ...`, which keeps hook order stable.

#### Follow-ups

- **"Reset quantity when navigating to another product."** Render the screen with `key={productId}`, which remounts it and resets all local state in one move.
- **"Replace the effect with TanStack Query."** `useQuery({ queryKey: ['product', productId], queryFn: ({ signal }) => fetchProduct(productId, signal) })` gives caching, dedupe and race safety for free.
- **"Why did React not catch bug 3?"** Effects are allowed to set state, and looping through async work is not detectable. Only the render-phase loops hit React's re-render limit.

## JavaScript fundamentals

### Predict the output: microtasks, macrotasks and `queueMicrotask`

**Task:** What does this print, and why? Explain the queues involved.

```js
console.log('1');

setTimeout(() => console.log('2'), 0);

Promise.resolve().then(() => console.log('3'));

queueMicrotask(() => console.log('4'));

(async () => {
  console.log('5');
  await null;
  console.log('6');
})();

Promise.resolve().then(() => {
  console.log('7');
  setTimeout(() => console.log('8'), 0);
  Promise.resolve().then(() => console.log('9'));
});

console.log('10');
```

#### What the interviewer evaluates

- The call stack, the microtask queue and the macrotask (task) queue, and the rule that **all microtasks drain before the next macrotask**.
- That an async function runs synchronously until its first `await`.
- That microtasks queued *by* microtasks still run before any timer.
- Relevance to RN: long promise chains or microtask loops can starve rendering and input just like synchronous work.

#### Solution

```plaintext
1
5
10
3
4
6
7
9
2
8
```

```mermaid
flowchart TD
    Task["Take the next macrotask<br/>(script, timer, native event)"] --> Run["Run it on the call stack to completion"]
    Run --> Check{"Microtask queue empty?"}
    Check -->|"no"| Micro["Run the oldest microtask<br/>(then/catch, await continuation, queueMicrotask)"]
    Micro -->|"may enqueue more microtasks"| Check
    Check -->|"yes"| Host["Host work: rendering, UI updates"]
    Host --> Task
```
*Figure: The event loop. Microtasks always drain completely between macrotasks.*

#### Walkthrough

1. **Synchronous pass (the script is the first macrotask)**: prints `1`. The timer callback `2` goes to the macrotask queue. The microtask queue gets `3`, then `4`. The async IIFE runs synchronously and prints `5`, then `await null` queues its continuation (`6`) as a microtask. `7` is queued. The script prints `10`.
2. **Drain microtasks in FIFO order**: `3`, `4`, `6`, `7`. While running, `7` queues timer `8` (a macrotask) and microtask `9`. The drain continues until the queue is empty, so `9` runs next.
3. **Next macrotasks**: `2`, then `8`, in the order the timers were queued (both have 0 ms delay).

React Native note: in current React Native (Hermes plus the New Architecture) the event loop follows the web model: microtasks drain after each task. This snippet therefore prints the same as in a browser or Node. Older RN versions implemented Promises with a polyfill scheduled through `setImmediate`, which could interleave differently with timers. Code that depends on sub-tick ordering is fragile everywhere.

#### Follow-ups

- **"Can microtasks freeze the app?"** Yes. A microtask that keeps queueing microtasks never lets the loop reach the next task, so timers, native events and render updates never run. It behaves like an infinite synchronous loop.
- **"Where do `setImmediate` and `requestAnimationFrame` fit?"** Both are host-scheduled callbacks, not microtasks. `requestAnimationFrame` runs before the next frame, and `setImmediate` is an RN/Node-specific "soon" callback. Neither preempts pending microtasks.
- **"Why does this matter in React?"** State updates are batched, and effects are flushed at scheduled points. Code like `await something; setState(...)` runs in a microtask continuation, after the render that triggered it has committed. That is why stale closures and "state not updated yet" questions come up.

### Predict the output: closures in loops with `var` vs `let`

**Task:** What does each loop print? Then predict the bonus.

```js
for (var i = 0; i < 3; i++) {
  setTimeout(() => console.log('var', i), 0);
}

for (let j = 0; j < 3; j++) {
  setTimeout(() => console.log('let', j), 0);
}

// Bonus
const fns = [];
for (let k = 0; k < 4; k++) {
  fns.push(() => k);
  k++;
}
console.log(fns.map((f) => f()));
```

#### What the interviewer evaluates

- Function scope versus block scope, and what a closure actually captures (a **binding**, not a value).
- Per-iteration bindings for `let` in `for` loops.
- Pre-`let` fixes (IIFE, `bind`, the timer's extra-arguments parameter).
- Connecting it to stale closures in React hooks.

#### Solution

```plaintext
[1, 3]
var 3
var 3
var 3
let 0
let 1
let 2
```

The bonus `console.log` is synchronous, so it prints **first**. All timers run afterwards, in the order they were queued.

#### Walkthrough

- **`var`**: there is one `i` binding for the whole function. The three callbacks close over the same variable, and by the time they run, the loop has finished and `i === 3`.
- **`let`**: the spec creates a **fresh binding per iteration** and copies the value into it before the increment step. Each callback closes over its own `j` (0, 1, 2).
- **Bonus**: iteration 1 gets a binding with `k = 0`. It pushes a closure over that binding, then `k++` mutates *that same binding* to 1. The loop copies 1 into a new binding for iteration 2 and increments it to 2. Iteration 2 pushes a closure over that binding, then `k++` makes it 3. The next copy is incremented to 4 and the loop exits. The closures see their bindings' final values: `[1, 3]`.
- **Pre-ES2015 fixes for `var`**: `setTimeout((n) => console.log(n), 0, i)` (extra arguments are passed to the callback), an IIFE `((n) => setTimeout(() => console.log(n)))(i)`, or `forEach`, whose callback gets a new parameter binding per element.

#### Follow-ups

- **"How is this related to React hooks?"** Each render is like a loop iteration with its own `const count` binding. A `setInterval` created in the first render's effect closes over the first render's `count` forever. That is the stale-closure bug from the stopwatch exercise, and the cure is the same idea: read the latest value through a ref or a functional update.
- **"Does `const` in `for...of` work?"** Yes: `for (const x of arr)` creates a new binding per iteration. `for (const i = 0; i < 3; i++)` throws, because the increment assigns to a constant.
- **"Memory implications?"** Closures keep their captured bindings (and whatever they reference) alive. Long-lived listeners that capture large objects are a common source of leaks in RN apps.

### Predict the output: `this` binding in classes, arrow fields and `bind`

**Task:** What does this print? Assume it runs as module code (strict mode), as all RN code does.

```js
class Timer {
  seconds = 0;
  tickMethod() {
    this.seconds++;
  }
  tickArrow = () => {
    this.seconds++;
  };
}

const t = new Timer();
const method = t.tickMethod;
const arrow = t.tickArrow;

arrow();
console.log(t.seconds);

try {
  method();
} catch (e) {
  console.log(e instanceof TypeError);
}

const bound = t.tickMethod.bind(t);
bound();
console.log(t.seconds);

const other = { seconds: 100, a: t.tickArrow, m: t.tickMethod };
other.a();
other.m();
console.log(t.seconds, other.seconds);

bound.call(other);
console.log(t.seconds, other.seconds);
```

#### What the interviewer evaluates

- The four `this` rules: `new`, explicit (`call`/`apply`/`bind`), implicit (`obj.method()`), and default (`undefined` in strict mode).
- Arrow functions capturing lexical `this`, and why arrow class fields are per-instance.
- That `bind` is permanent: a bound function ignores later `call`/`apply`/implicit receivers.
- RN relevance: passing `this.handlePress` to `onPress` in class components.

#### Solution

```plaintext
1
true
2
3 101
4 101
```

#### Walkthrough

1. `arrow()`: `tickArrow` is a class field initialized in the constructor, so the arrow captured `this = t` permanently. `t.seconds` becomes 1.
2. `method()`: a detached method called with no receiver. Class bodies are always strict, so `this` is `undefined`, and `this.seconds++` throws a `TypeError`.
3. `bound()`: `bind(t)` fixes `this`, so `t.seconds` becomes 2.
4. `other.a()`: the arrow ignores the receiver and increments `t`, making it 3. `other.m()`: an unbound method takes its receiver from the call site, so `other.seconds` becomes 101.
5. `bound.call(other)`: `call` cannot override a bound `this`, so `t.seconds` becomes 4 and `other` stays at 101.

#### Follow-ups

- **"Arrow class fields versus prototype methods: trade-offs?"** Arrow fields create one function per instance (more memory, not on the prototype, so they can't be overridden via `super` or mocked on the prototype in tests), but they're safe to pass as callbacks. Prototype methods are shared and need `bind` when detached.
- **"Why doesn't this matter in function components?"** There is no `this`: handlers close over props and state directly. The equivalent pitfall is stale closures.
- **"What's `this` at the top level of an ES module?"** `undefined`, and an arrow function defined there inherits that. Don't write code that relies on a global `this`; use `globalThis` explicitly.

### Predict the output: async/await ordering

**Task:** What does this print?

```js
async function first() {
  console.log('first start');
  await second();
  console.log('first end');
}

async function second() {
  console.log('second');
}

console.log('script start');
setTimeout(() => console.log('timeout'), 0);
first();
new Promise((resolve) => {
  console.log('executor');
  resolve();
})
  .then(() => console.log('then 1'))
  .then(() => console.log('then 2'));
console.log('script end');
```

#### What the interviewer evaluates

- That an async function body runs synchronously until its first `await`, and that a called async function's body (`second`) also runs synchronously.
- That the `Promise` executor runs synchronously.
- That each `.then` in a chain runs in a separate microtask, and that `await` continuations interleave with `.then` callbacks.
- That timers come after all microtasks.

#### Solution

```plaintext
script start
first start
second
executor
script end
first end
then 1
then 2
timeout
```

#### Walkthrough

1. **Synchronous**: `script start`. The timer is queued. `first()` prints `first start`, then calls `second()`, which prints `second` and returns an already-resolved promise. `await` suspends `first` and queues its continuation (microtask A). The executor prints `executor` and resolves, so `then 1` is queued (microtask B). `script end`.
2. **Microtasks**: A prints `first end`. B prints `then 1`, which resolves the promise returned by the first `.then`, queueing `then 2`, which prints next.
3. **Macrotask**: `timeout`.
- Awaiting a native, already-resolved promise takes a single microtask tick in modern engines (an ES2019 spec optimization). That is why `first end` comes before `then 1`.

#### Follow-ups

- **"Sequential or parallel?"** `for (const id of ids) await load(id)` is sequential (total time is the sum). `await Promise.all(ids.map(load))` is parallel (time of the slowest) and fails fast on the first rejection. `Promise.allSettled` collects every outcome. `ids.forEach(async (id) => await load(id))` waits for nothing, and its errors become unhandled rejections.
- **"Returning a promise from an async function costs extra ticks."** Consider this:

  ```js
  async function f1() { return 1; }
  async function f2() { return Promise.resolve(2); }
  f2().then(console.log);
  f1().then(console.log);
  Promise.resolve().then(() => console.log('A')).then(() => console.log('B')).then(() => console.log('C'));
  ```

  Per the spec this prints `1, A, B, 2, C`. Resolving an async function's promise with another promise adds two extra microtask hops. In React Native, Babel may transpile async functions (Hermes has historically lacked native async/await support), so tick-exact ordering can differ from V8. Treat this as a spec curiosity and never rely on it.
- **"How are unhandled rejections surfaced in RN?"** In development they show as LogBox warnings. In production they are easy to lose, so attach global handlers and use Sentry, which instruments rejection tracking. Always `await` or `.catch` your promises, and lint with `@typescript-eslint/no-floating-promises`.
