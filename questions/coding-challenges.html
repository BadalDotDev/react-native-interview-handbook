#### Walkthrough

```mermaid
stateDiagram-v2
    state "Loading first page" as LoadingInitial
    state "Idle, more pages" as Idle
    state "Loading next page" as LoadingMore
    state "Refreshing" as Refreshing
    state "First page failed" as ErrorInitial
    state "Page failed, footer retry" as ErrorMore
    state "End of list" as Exhausted
    [*] --> LoadingInitial
    LoadingInitial --> Idle : page ok with cursor
    LoadingInitial --> Exhausted : page ok, no cursor
    LoadingInitial --> ErrorInitial : request failed
    ErrorInitial --> LoadingInitial : retry
    Idle --> LoadingMore : onEndReached
    LoadingMore --> LoadingMore : onEndReached ignored
    LoadingMore --> Idle : page ok with cursor
    LoadingMore --> Exhausted : no cursor
    LoadingMore --> ErrorMore : request failed
    ErrorMore --> LoadingMore : tap retry
    Idle --> Refreshing : pull to refresh
    LoadingMore --> Refreshing : pull aborts page load
    Exhausted --> Refreshing : pull to refresh
    Refreshing --> Idle : ok, or failed and items kept
```
*Figure: Infinite-scroll state machine. Each transition maps to a branch in `load()`.*

- **Deduplicating concurrent loads**: `onEndReached` fires on mount when content is shorter than the screen, again during momentum, and again when `data` changes. Two calls can land before React re-renders, so a state-based `isLoading` check is not enough. The `inFlight` ref is read synchronously.
- **Refresh wins**: a pull-to-refresh aborts an in-flight page load. The `inFlight.current === controller` check in `finally` stops the aborted request from clearing the *new* request's flag. The same check makes Strict Mode's double mount safe.
- **Page errors stop auto-loading**: without `pageErrorRef`, a failing page combined with `onEndReached` firing produces a tight request loop on a bad network. The user retries explicitly from the footer.
- **Cursor plus dedupe by id**: offset pagination (`?page=3`) shifts when new posts are inserted at the top, which duplicates or skips items. Cursors fix skipping, and `mergeUnique` handles the occasional overlap. For very long lists, keep the `Set` of ids in a ref instead of rebuilding it per page (currently O(n) per page).
- **Performance**: a memoized row, stable `renderItem` and `keyExtractor`. Consider FlashList v2 for heavy rows, and tune `windowSize` and `maxToRenderPerBatch` on FlatList. See the [Performance guide](../guides/performance.html).

> [!INTERVIEW]
> Likely follow-up: "Why a ref and not `if (loading) return`?" A good answer is that state updates are asynchronous and batched, so two `onEndReached` calls in the same frame both see `loading === null`. A ref is read synchronously, so it closes that window.

#### Follow-ups

- **"Use TanStack Query."**

  ```ts
  const feed = useInfiniteQuery({
    queryKey: ['feed'],
    queryFn: ({ pageParam, signal }) => fetchPosts(pageParam, signal),
    initialPageParam: null as string | null,
    getNextPageParam: (lastPage) => lastPage.nextCursor,
    maxPages: 10, // cap memory for very long sessions
  });
  const items = feed.data?.pages.flatMap((p) => p.items) ?? [];
  const onEndReached = () => {
    if (feed.hasNextPage && !feed.isFetchingNextPage && !feed.isFetchNextPageError) void feed.fetchNextPage();
  };
  ```

  The cache also preserves the list when navigating back, so there is no reload and scroll position survives.
- **"Chat-style list that loads older messages at the top."** Use an `inverted` list, or `maintainVisibleContentPosition`, with `getPreviousPageParam`.
- **"New posts arrive via websocket."** Don't prepend them under the user's thumb. Buffer them and show a "5 new posts" pill that scrolls to the top and merges.
- **"Optimistic delete in a paginated cache."** Map over `pages` and filter out the item. Then deal with page sizes becoming uneven, which cursors tolerate and offsets don't.

### Build a 6-digit OTP input with auto-advance, backspace, paste and SMS autofill

**Task:** Build an OTP input with 6 separate boxes. Requirements:

- Digits only.
- Typing advances to the next box.
- Backspace on an empty box moves back and clears the previous box.
- Pasting a full code, or accepting the OS autofill suggestion, fills every box regardless of which box has focus.
- `onComplete(code)` fires when all 6 are filled.
- Support iOS `textContentType="oneTimeCode"` and Android `autoComplete="sms-otp"`.

#### What the interviewer evaluates

- Knowing that `maxLength={1}` breaks paste and autofill, because the full code gets truncated to one character.
- Knowing that RN's `TextInput` has no `onPaste`, so a paste arrives as a multi-character `onChangeText`.
- Focus management with an array of refs, and backspace via `onKeyPress`.
- Platform autofill props and what they actually do.
- Accessibility, plus the trade-off against the single-hidden-input design.

#### Solution

```tsx title="src/components/OtpInput.tsx"
import React, { useRef, useState } from 'react';
import {
  Platform,
  StyleSheet,
  TextInput,
  View,
  type NativeSyntheticEvent,
  type TextInputKeyPressEventData,
} from 'react-native';

interface OtpInputProps {
  length?: number;
  onComplete: (code: string) => void;
  autoFocus?: boolean;
  disabled?: boolean;
}

export function OtpInput({ length = 6, onComplete, autoFocus = true, disabled = false }: OtpInputProps) {
  const [digits, setDigits] = useState<string[]>(() => Array.from({ length }, () => ''));
  const inputs = useRef<Array<TextInput | null>>([]);

  const focusBox = (index: number) => {
    inputs.current[Math.min(Math.max(index, 0), length - 1)]?.focus();
  };

  const commit = (next: string[], focusIndex: number | null) => {
    setDigits(next);
    if (focusIndex !== null) focusBox(focusIndex);
    if (next.every((d) => d !== '')) {
      inputs.current.forEach((el) => el?.blur());
      onComplete(next.join(''));
    }
  };

  const handleChangeText = (index: number, raw: string) => {
    const chars = raw.replace(/\D/g, '');

    if (chars.length === 0) {
      // Backspace on a filled box (or cut): clear it, keep focus here.
      const next = digits.slice();
      next[index] = '';
      setDigits(next);
      return;
    }

    // 1 char = typing. Several = paste, autofill, or typing into a filled box.
    // A full-length code always fills from the first box, wherever focus is.
    const start = chars.length >= length ? 0 : index;
    const accepted = chars.slice(0, length - start).split('');
    const next = digits.slice();
    accepted.forEach((c, k) => {
      next[start + k] = c;
    });
    const lastFilled = start + accepted.length - 1;
    commit(next, lastFilled < length - 1 ? lastFilled + 1 : null);
  };

  const handleKeyPress = (index: number, e: NativeSyntheticEvent<TextInputKeyPressEventData>) => {
    // Backspace on an EMPTY box produces no onChangeText, so handle it here.
    if (e.nativeEvent.key === 'Backspace' && digits[index] === '' && index > 0) {
      const next = digits.slice();
      next[index - 1] = '';
      setDigits(next);
      focusBox(index - 1);
    }
  };

  return (
    <View style={styles.row} accessibilityLabel={`${length}-digit verification code`}>
      {digits.map((digit, i) => (
        <TextInput
          // Index keys are correct here: a fixed set of boxes that never reorders.
          key={i}
          ref={(el) => {
            inputs.current[i] = el;
          }}
          value={digit}
          onChangeText={(text) => handleChangeText(i, text)}
          onKeyPress={(e) => handleKeyPress(i, e)}
          editable={!disabled}
          autoFocus={autoFocus && i === 0}
          keyboardType="number-pad"
          textContentType="oneTimeCode" // iOS: offer the code from Messages/Mail above the keyboard
          autoComplete={Platform.OS === 'android' ? 'sms-otp' : undefined} // Android autofill hint
          selectTextOnFocus // typing into a filled box replaces its digit
          caretHidden
          accessibilityLabel={`Digit ${i + 1} of ${length}`}
          style={[styles.box, digit !== '' && styles.boxFilled]}
        />
      ))}
    </View>
  );
}

const styles = StyleSheet.create({
  row: { flexDirection: 'row', justifyContent: 'space-between', gap: 8 },
  box: {
    flex: 1,
    aspectRatio: 0.85,
    borderWidth: 1,
    borderRadius: 8,
    borderColor: '#9aa0a6',
    textAlign: 'center',
    fontSize: 22,
  },
  boxFilled: { borderColor: '#1a73e8' },
});
```

#### Walkthrough

- **No `maxLength={1}`**: this is the classic bug. When iOS autofills "482913" into the focused box, or the user pastes, a 1-character limit truncates it and the code never arrives. Accepting any length and distributing the digits handles typing, paste and autofill in one code path.
- **Full code, any box**: if the user taps into box 4 and accepts the suggestion, `start` resets to 0 because a full-length code clearly means the whole OTP.
- **Backspace has two cases**. On a filled box, the OS deletes the character and `onChangeText('')` clears it. On an empty box nothing changes, so no `onChangeText` fires, and `onKeyPress` detects `Backspace` and moves back. `onKeyPress` behaviour varies across some Android soft keyboards; that is the main argument for the single-input design below.
- **Autofill**: iOS `textContentType="oneTimeCode"` surfaces codes it detects in Messages or Mail in the QuickType bar. Android `autoComplete="sms-otp"` hints the autofill service to offer the SMS code. Neither reads SMS automatically. For zero-tap on Android you need the SMS Retriever API through a native module (the SMS must contain your app's hash). iOS also recognises domain-bound codes, where the last line of the SMS is `@example.com #482913`.
- **`selectTextOnFocus`** makes re-typing a box replace its digit instead of producing two characters.
- **`onComplete` fires in the event handler**, not in an effect watching `digits`, so it runs exactly once per completion with no extra render.
- **Security**: never log the code, and rely on server-side expiry and rate limiting. The client only collects the input.

#### Follow-ups

- **"Implement it with a single hidden input instead."** This is often the more robust choice. One real `TextInput` owns the value, with native paste, autofill and backspace. The boxes are just a rendering of `code`:

  ```tsx
  const [code, setCode] = useState('');
  const inputRef = useRef<TextInput>(null);

  <Pressable onPress={() => inputRef.current?.focus()} style={styles.row} accessible={false}>
    {Array.from({ length }, (_, i) => (
      <View key={i} style={[styles.box, i === code.length && styles.boxFilled]}>
        <Text style={styles.digit}>{code[i] ?? ''}</Text>
      </View>
    ))}
    <TextInput
      ref={inputRef}
      value={code}
      onChangeText={(t) => {
        const next = t.replace(/\D/g, '').slice(0, length);
        setCode(next);
        if (next.length === length) onComplete(next);
      }}
      maxLength={length}
      keyboardType="number-pad"
      textContentType="oneTimeCode"
      autoComplete={Platform.OS === 'android' ? 'sms-otp' : undefined}
      style={[StyleSheet.absoluteFill, { color: 'transparent' }]} // laid out, but invisible
      caretHidden
    />
  </Pressable>;
  ```

  Keep the input laid out (absolute, transparent text) rather than `display: 'none'`. The OS won't offer autofill to an input it considers hidden.
- **"Clear and shake on a wrong code."** Expose `clear()` via a ref (in React 19 `ref` is a regular prop for function components; `useImperativeHandle` still defines the handle). Shake with a Reanimated `withSequence` of `withTiming` translations, and announce the error for screen readers.
- **"Resend with cooldown."** Combine it with `useCountdown`.

### Build an image carousel with paging dots

**Task:** Build a horizontally paged image carousel. Requirements:

- One image per page with snap paging.
- Dots that show the active page and scroll to a page when tapped.
- Correct behaviour when the carousel is not full screen width.
- Reasonable memory use with 20+ images.
- Use `FlatList` with `pagingEnabled` and `onViewableItemsChanged`.

#### What the interviewer evaluates

- Knowing that `pagingEnabled` pages by the **scroll view's width**, so items must match the measured container width.
- The `onViewableItemsChanged` gotcha: it must be stable, because FlatList throws if it changes identity after mount.
- `getItemLayout` for reliable `scrollToIndex`.
- Virtualization settings for image-heavy content.
- Accessibility of the dots (buttons with a selected state).

#### Solution

```tsx title="src/components/ImageCarousel.tsx"
import React, { useCallback, useRef, useState } from 'react';
import {
  FlatList,
  Image,
  Pressable,
  StyleSheet,
  View,
  type LayoutChangeEvent,
  type ViewToken,
} from 'react-native';

export interface Slide {
  id: string;
  uri: string;
  alt: string;
}

// Module-level constant: viewabilityConfig must not change between renders either.
const VIEWABILITY_CONFIG = { itemVisiblePercentThreshold: 60 };

export function ImageCarousel({ slides, height = 240 }: { slides: Slide[]; height?: number }) {
  const [width, setWidth] = useState(0);
  const [activeIndex, setActiveIndex] = useState(0);
  const listRef = useRef<FlatList<Slide>>(null);

  const onLayout = (e: LayoutChangeEvent) => setWidth(Math.round(e.nativeEvent.layout.width));

  // Stable for the component's lifetime (setActiveIndex is stable).
  const onViewableItemsChanged = useCallback(
    ({ viewableItems }: { viewableItems: ViewToken<Slide>[] }) => {
      const first = viewableItems.find((v) => v.isViewable);
      if (first?.index != null) setActiveIndex(first.index);
    },
    [],
  );

  const getItemLayout = useCallback(
    (_data: unknown, index: number) => ({ length: width, offset: width * index, index }),
    [width],
  );

  const goTo = (index: number) => listRef.current?.scrollToIndex({ index, animated: true });

  return (
    <View style={{ height }} onLayout={onLayout}>
      {width > 0 ? (
        <FlatList
          ref={listRef}
          data={slides}
          keyExtractor={(s) => s.id}
          horizontal
          pagingEnabled
          showsHorizontalScrollIndicator={false}
          decelerationRate="fast"
          getItemLayout={getItemLayout}
          onViewableItemsChanged={onViewableItemsChanged}
          viewabilityConfig={VIEWABILITY_CONFIG}
          initialNumToRender={1}
          maxToRenderPerBatch={2}
          windowSize={3} // current page plus one screen either side
          renderItem={({ item }) => (
            <Image
              source={{ uri: item.uri }}
              style={{ width, height }}
              resizeMode="cover"
              accessibilityLabel={item.alt}
            />
          )}
        />
      ) : null}

      <View style={styles.dots}>
        {slides.map((s, i) => (
          <Pressable
            key={s.id}
            onPress={() => goTo(i)}
            hitSlop={8}
            accessibilityRole="button"
            accessibilityLabel={`Show image ${i + 1} of ${slides.length}`}
            accessibilityState={{ selected: i === activeIndex }}
          >
            <View style={[styles.dot, i === activeIndex && styles.dotActive]} />
          </Pressable>
        ))}
      </View>
    </View>
  );
}

const styles = StyleSheet.create({
  dots: { position: 'absolute', bottom: 12, alignSelf: 'center', flexDirection: 'row', gap: 8 },
  dot: { width: 8, height: 8, borderRadius: 4, backgroundColor: 'rgba(255,255,255,0.5)' },
  dotActive: { width: 20, backgroundColor: '#ffffff' },
});
```

#### Walkthrough

- **Measure, don't assume**: `pagingEnabled` snaps to multiples of the scroll view's own width. Using `Dimensions` width inside a padded card makes each page drift by the padding. `onLayout` measures the real container, and the list only renders once it has a width.
- **Viewability**: `onViewableItemsChanged` updates the dot as soon as 60% of the next page is visible, during the drag. The alternative, `onMomentumScrollEnd` with `Math.round(x / width)`, is simpler but only updates after the scroll settles. Both the callback and `viewabilityConfig` must be stable, because FlatList raises an invariant error if `onViewableItemsChanged` changes after mount. Hence `useCallback([])` and a module-level config.
- **`getItemLayout`**: FlatList can compute offsets without measuring, so `scrollToIndex` works for far-away pages without triggering `onScrollToIndexFailed`.
- **Memory**: `windowSize={3}` keeps roughly three pages mounted. For many large images, use a caching image component such as `expo-image`, request CDN-resized images at the displayed size and pixel ratio, and prefetch only the next image.
- **Dots as buttons**: each has a label and `selected` state. An alternative pattern is making the whole carousel `accessibilityRole="adjustable"` with increment and decrement actions, so VoiceOver users can swipe up and down to change pages.

#### Follow-ups

- **"Autoplay."** Use `useInterval(() => goTo((activeIndex + 1) % slides.length), paused ? null : 4000)`. Pause on `onScrollBeginDrag`, resume on `onMomentumScrollEnd`, and pause when the screen loses focus (`useIsFocused`) or the app is backgrounded. Respect `AccessibilityInfo.isReduceMotionEnabled()`.
- **"Dots that stretch smoothly with the swipe."** Track the scroll offset in a Reanimated shared value via `useAnimatedScrollHandler` (with `Animated.FlatList`). Each dot `interpolate`s its width and opacity from `offset / width` on the UI thread, with no React re-renders.
- **"Rotation or split-screen resizes."** `onLayout` fires with the new width, but the scroll offset is still `oldWidth * index`. In an effect keyed on `width`, call `scrollToOffset({ offset: width * activeIndex, animated: false })`, reading `activeIndex` from a ref.
- **"Infinite loop."** Render `[last, ...slides, first]` and jump without animation when landing on a clone, or use a maintained library such as react-native-reanimated-carousel.

### Build an accordion with LayoutAnimation or Reanimated

**Task:** Build an FAQ accordion. Tapping a header expands or collapses its body with an animation. It supports "only one open at a time" (default) or "many open", and it is accessible (the expanded state is announced, and collapsed content is hidden from screen readers). Show a zero-dependency version and a Reanimated version, and explain when you'd pick each.

#### What the interviewer evaluates

- Knowing that animating `height` is not supported by the native driver of the core `Animated` API, which only supports transform and opacity.
- LayoutAnimation semantics: configure *before* the state change, and it applies to the entire next layout pass.
- Reanimated measurement: animating to an unknown content height.
- `accessibilityState={{ expanded }}` and hiding collapsed content.
- Immutable `Set` state updates.

#### Solution

Version A, LayoutAnimation (content is unmounted when collapsed):

```tsx title="src/components/Accordion.tsx"
import React, { useState } from 'react';
import { LayoutAnimation, Pressable, StyleSheet, Text, View } from 'react-native';

export interface AccordionSection {
  id: string;
  title: string;
  content: React.ReactNode;
}

export function Accordion({
  sections,
  allowMultiple = false,
}: {
  sections: AccordionSection[];
  allowMultiple?: boolean;
}) {
  const [openIds, setOpenIds] = useState<ReadonlySet<string>>(() => new Set());

  const toggle = (id: string) => {
    // Must be configured BEFORE the state update that changes layout.
    LayoutAnimation.configureNext(LayoutAnimation.Presets.easeInEaseOut);
    setOpenIds((prev) => {
      const next = new Set<string>(allowMultiple ? prev : undefined);
      if (prev.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  return (
    <View>
      {sections.map((section) => {
        const open = openIds.has(section.id);
        return (
          <View key={section.id} style={styles.item}>
            <Pressable
              onPress={() => toggle(section.id)}
              accessibilityRole="button"
              accessibilityState={{ expanded: open }}
              style={styles.header}
            >
              <Text style={styles.title}>{section.title}</Text>
              <Text style={[styles.chevron, open && styles.chevronOpen]}>›</Text>
            </Pressable>
            {open ? <View style={styles.body}>{section.content}</View> : null}
          </View>
        );
      })}
    </View>
  );
}

const styles = StyleSheet.create({
  item: { borderBottomWidth: StyleSheet.hairlineWidth, overflow: 'hidden' },
  header: { flexDirection: 'row', alignItems: 'center', padding: 16 },
  title: { flex: 1, fontSize: 16, fontWeight: '600' },
  chevron: { fontSize: 22 },
  chevronOpen: { transform: [{ rotate: '90deg' }] },
  body: { paddingHorizontal: 16, paddingBottom: 16 },
});
```

Version B, Reanimated (content stays mounted, animation runs on the UI thread and is interruptible):

```tsx title="src/components/AnimatedAccordionItem.tsx"
import React, { useState } from 'react';
import { Pressable, StyleSheet, Text, View } from 'react-native';
import Animated, { useAnimatedStyle, useDerivedValue, useSharedValue, withTiming } from 'react-native-reanimated';

export function AnimatedAccordionItem({ title, children }: { title: string; children: React.ReactNode }) {
  const [open, setOpen] = useState(false); // drives accessibility props
  const expanded = useSharedValue(0); // 0 = collapsed, 1 = expanded
  const contentHeight = useSharedValue(0);

  const progress = useDerivedValue(() => withTiming(expanded.value, { duration: 250 }));

  const bodyStyle = useAnimatedStyle(() => ({
    height: contentHeight.value * progress.value,
    opacity: progress.value,
  }));
  const chevronStyle = useAnimatedStyle(() => ({
    transform: [{ rotate: `${progress.value * 90}deg` }],
  }));

  const toggle = () => {
    const next = !open;
    setOpen(next);
    expanded.value = next ? 1 : 0; // a tap mid-animation reverses smoothly from the current value
  };

  return (
    <View style={styles.item}>
      <Pressable
        onPress={toggle}
        accessibilityRole="button"
        accessibilityState={{ expanded: open }}
        style={styles.header}
      >
        <Text style={styles.title}>{title}</Text>
        <Animated.Text style={[styles.chevron, chevronStyle]}>›</Animated.Text>
      </Pressable>

      <Animated.View style={[styles.clip, bodyStyle]}>
        <View
          // Absolutely positioned so it reports its natural height even while the parent is 0 tall.
          style={styles.measure}
          onLayout={(e) => {
            contentHeight.value = e.nativeEvent.layout.height;
          }}
          accessibilityElementsHidden={!open} // iOS
          importantForAccessibility={open ? 'auto' : 'no-hide-descendants'} // Android
        >
          {children}
        </View>
      </Animated.View>
    </View>
  );
}

const styles = StyleSheet.create({
  item: { borderBottomWidth: StyleSheet.hairlineWidth },
  header: { flexDirection: 'row', alignItems: 'center', padding: 16 },
  title: { flex: 1, fontSize: 16, fontWeight: '600' },
  chevron: { fontSize: 22 },
  clip: { overflow: 'hidden' },
  measure: { position: 'absolute', top: 0, left: 0, right: 0, paddingHorizontal: 16, paddingBottom: 16 },
});
```

#### Walkthrough

| | LayoutAnimation | Reanimated (measured height) |
|---|---|---|
| Dependencies | None (core) | `react-native-reanimated` |
| Runs on | Native layout pass | UI thread (worklets) |
| Scope | Every layout change in the next commit, so unrelated views animate too | Only the views you animate |
| Interruptible | Not really; a new tap starts a new transition | Yes, it reverses from the current value |
| Collapsed content | Unmounted (state lost, cheap) | Mounted (keeps state, costs memory) |
| Best for | Simple static lists, prototypes | Polished UI, many items, gestures |

- **LayoutAnimation**: `configureNext` tells the native side to animate whatever layout changes the *next* commit produces. That is also its weakness: if a toast appears in the same commit, it animates too, and it can glitch inside virtualized lists. On the legacy architecture Android needed `UIManager.setLayoutAnimationEnabledExperimental(true)`. On the New Architecture that call is a no-op, so omit it in new code.
- **Reanimated measurement trick**: you can't animate to `height: 'auto'` directly. The inner view is absolutely positioned, so its `onLayout` reports its natural height even while the outer clip view is 0 tall. The outer view animates `height` between 0 and that measured value. When the content changes, `onLayout` fires again and the target updates.
- **Accessibility**: `accessibilityState.expanded` makes VoiceOver say "collapsed/expanded". In version B, collapsed content is still mounted, so it must be hidden explicitly or screen readers will focus invisible text.
- **Reanimated 4 note**: `.value` still works. `.get()` and `.set()` are the recommended accessors when using the React Compiler.

#### Follow-ups

- **"Use Reanimated layout animations instead of measuring."** Conditionally render the body with `entering={FadeIn}` and `exiting={FadeOut}`, and give the siblings `layout={LinearTransition}` so they slide. That is less code, but content unmounts as in version A.
- **"Scroll the opened section into view."** Record each item's `y` via `onLayout`, then call `scrollViewRef.current?.scrollTo({ y, animated: true })` after expanding.
- **"Controlled accordion."** Accept `expandedIds` and `onChange` props and fall back to internal state when they're undefined, the same pattern as controlled and uncontrolled inputs.
- **"100 sections."** Use a `FlatList` with a memoized item component, and avoid LayoutAnimation in virtualized lists.

### Build a toast/snackbar queue with context and an imperative API

**Task:** Build a toast system. Requirements:

- `useToast().show({ message, type, action })` from components.
- `toast.show(...)` from **outside React** (API interceptors, services).
- One toast visible at a time, queued, auto-dismissed after a duration.
- Duplicate toasts are dropped and the queue is capped.
- Optional action button ("Undo").
- Animated enter and exit, positioned above the safe area.
- Accessible (announced by screen readers).

#### What the interviewer evaluates

- The queue data structure and the timer lifecycle (effects keyed by toast id, cleanup).
- A stable context value, so consumers don't re-render when the queue changes.
- An imperative bridge that works outside the tree, with safe behaviour before the provider mounts.
- Handling toast storms (dedupe, cap).
- Platform gotchas: the native `Modal` window layering, safe areas, and screen reader announcements.

#### Solution

```tsx title="src/toast/ToastProvider.tsx"
import React, { createContext, useCallback, useContext, useEffect, useMemo, useRef, useState } from 'react';
import { AccessibilityInfo, Platform, Pressable, StyleSheet, Text } from 'react-native';
import Animated, { FadeInDown, FadeOutDown } from 'react-native-reanimated';
import { useSafeAreaInsets } from 'react-native-safe-area-context';

export type ToastType = 'info' | 'success' | 'error';

export interface ToastOptions {
  message: string;
  type?: ToastType;
  durationMs?: number;
  action?: { label: string; onPress: () => void };
}

interface Toast {
  id: number;
  message: string;
  type: ToastType;
  durationMs: number;
  action?: ToastOptions['action'];
}

export interface ToastApi {
  show: (options: ToastOptions | string) => number;
  hide: (id?: number) => void;
}

const MAX_QUEUE = 5;
const ToastContext = createContext<ToastApi | null>(null);

// Imperative bridge for non-React code. No-op (returns -1) until the provider mounts.
const apiRef: { current: ToastApi | null } = { current: null };
export const toast: ToastApi = {
  show: (options) => apiRef.current?.show(options) ?? -1,
  hide: (id) => apiRef.current?.hide(id),
};

export function useToast(): ToastApi {
  const ctx = useContext(ToastContext);
  if (!ctx) throw new Error('useToast must be used inside ToastProvider');
  return ctx;
}

export function ToastProvider({ children }: { children: React.ReactNode }) {
  const [queue, setQueue] = useState<Toast[]>([]);
  const nextId = useRef(1);

  const show = useCallback((input: ToastOptions | string) => {
    const o = typeof input === 'string' ? { message: input } : input;
    const item: Toast = {
      id: nextId.current++,
      message: o.message,
      type: o.type ?? 'info',
      durationMs: o.durationMs ?? (o.action ? 5000 : 3000), // action toasts need longer
      action: o.action,
    };
    setQueue((q) => {
      if (q.some((t) => t.message === item.message && t.type === item.type)) return q; // dedupe
      const next = [...q, item];
      // Cap: keep the visible toast plus the newest waiting ones.
      return next.length > MAX_QUEUE ? [next[0], ...next.slice(next.length - (MAX_QUEUE - 1))] : next;
    });
    return item.id;
  }, []);

  const hide = useCallback((id?: number) => {
    setQueue((q) => (id === undefined ? q.slice(1) : q.filter((t) => t.id !== id)));
  }, []);

  // Stable value: components calling useToast() never re-render because of the queue.
  const api = useMemo<ToastApi>(() => ({ show, hide }), [show, hide]);

  useEffect(() => {
    apiRef.current = api;
    return () => {
      if (apiRef.current === api) apiRef.current = null;
    };
  }, [api]);

  const current = queue[0];
  const currentId = current?.id;
  const currentDuration = current?.durationMs;

  // Auto-dismiss the visible toast; the next one mounts when it leaves.
  useEffect(() => {
    if (currentId === undefined || currentDuration === undefined) return;
    const timer = setTimeout(() => hide(currentId), currentDuration);
    return () => clearTimeout(timer);
  }, [currentId, currentDuration, hide]);

  return (
    <ToastContext.Provider value={api}>
      {children}
      {current ? <ToastView key={current.id} toast={current} onDismiss={() => hide(current.id)} /> : null}
    </ToastContext.Provider>
  );
}

function ToastView({ toast: t, onDismiss }: { toast: Toast; onDismiss: () => void }) {
  const insets = useSafeAreaInsets();

  useEffect(() => {
    // Android announces via accessibilityLiveRegion; iOS needs an explicit announcement.
    if (Platform.OS === 'ios') AccessibilityInfo.announceForAccessibility(t.message);
  }, [t.message]);

  return (
    <Animated.View
      entering={FadeInDown}
      exiting={FadeOutDown}
      accessibilityLiveRegion="polite"
      style={[styles.toast, styles[t.type], { bottom: insets.bottom + 16 }]}
    >
      <Text style={styles.message} onPress={onDismiss}>
        {t.message}
      </Text>
      {t.action ? (
        <Pressable
          onPress={() => {
            t.action?.onPress();
            onDismiss();
          }}
          accessibilityRole="button"
          hitSlop={8}
        >
          <Text style={styles.action}>{t.action.label}</Text>
        </Pressable>
      ) : null}
    </Animated.View>
  );
}

const styles = StyleSheet.create({
  toast: {
    position: 'absolute',
    left: 16,
    right: 16,
    flexDirection: 'row',
    alignItems: 'center',
    borderRadius: 10,
    paddingVertical: 12,
    paddingHorizontal: 16,
    elevation: 4,
  },
  info: { backgroundColor: '#323232' },
  success: { backgroundColor: '#1e7d32' },
  error: { backgroundColor: '#b3261e' },
  message: { flex: 1, color: '#ffffff' },
  action: { color: '#ffffff', fontWeight: '700', marginLeft: 16 },
});

#### Walkthrough

- **Queue model**: the head of the array is the visible toast. The auto-dismiss effect depends on the head's **id**, not the object, so it restarts exactly when a new toast becomes visible. Its cleanup clears the timer if the toast is dismissed manually.
- **`key={current.id}`** gives each toast a fresh mount, so Reanimated's `entering` and `exiting` animations run for every toast change.
- **Re-render isolation**: the context value is a memoized `{ show, hide }` that never changes. When `queue` changes, the provider re-renders, but `children` is the same element reference from the parent, so the app below doesn't re-render. Only the toast view does.
- **Imperative bridge**: a module-level ref is registered in an effect and unregistered only if it still points at this provider. That makes it safe under Strict Mode and multiple mounts. Calls before mount are dropped here; buffer them if that matters (for example, errors during startup).
- **Toast storms**: ten failed requests shouldn't produce ten identical toasts. Dedupe by message and type, and cap the queue.
- **Modal gotcha**: RN's `Modal` presents a separate native window, so a toast rendered at the app root appears *behind* an open modal. Options are rendering a toast host inside modal screens, or a full-window overlay (react-native-screens offers `FullWindowOverlay` on iOS).

#### Follow-ups

- **"Swipe to dismiss."** Wrap it in a Gesture Handler `Gesture.Pan()` that updates a `translateX` shared value. Past a threshold, animate it out and call `onDismiss` via `scheduleOnRN` (Reanimated 4 / worklets) or `runOnJS` (older Reanimated).
- **"Pause the timer while the user is touching it."** Store `remaining = durationMs - (Date.now() - shownAt)` on press-in and restart with `remaining` on press-out.
- **"Show up to three stacked."** Render `queue.slice(0, 3)` with `layout={LinearTransition}` and a timer per visible toast, keyed by id.
- **"Test it."** Use RNTL with fake timers: call `show`, assert the text, then `act(() => jest.advanceTimersByTime(3000))` and assert it's gone. Use Reanimated's Jest setup so layout animations resolve synchronously.

### Implement an optimistic like button with rollback using TanStack Query

**Task:** A post appears on its detail screen (`['post', id]`) and in an infinite feed (`['feed']`). Tapping "Like" must update the count instantly in **both** places, send the request, roll back and show a toast on failure, and resync with the server afterwards. Rapid taps (like, unlike, like) must not leave the UI in a wrong state.

#### What the interviewer evaluates

- The `onMutate`, `onError`, `onSettled` lifecycle and *why* each step exists (cancel, snapshot, set, return context).
- Updating every cache that renders the entity, including `InfiniteData` pages.
- Concurrency: overlapping mutations and refetches clobbering optimistic state.
- API design: an idempotent "set liked = true/false" endpoint rather than a toggle.
- Accessible button semantics.

#### Solution

```ts title="src/features/likes/useToggleLike.ts"
import { useMutation, useQueryClient, type InfiniteData } from '@tanstack/react-query';
import { toast } from '../../toast/ToastProvider';

export interface Post {
  id: string;
  title: string;
  liked: boolean;
  likeCount: number;
}
interface FeedPage {
  items: Post[];
  nextCursor: string | null;
}

async function setLike(postId: string, liked: boolean): Promise<Post> {
  // Idempotent: PUT = liked, DELETE = not liked. Retries and replays converge.
  const res = await fetch(`https://api.example.com/posts/${postId}/like`, {
    method: liked ? 'PUT' : 'DELETE',
  });
  if (!res.ok) throw new Error(`Like failed (${res.status})`);
  return (await res.json()) as Post;
}

const applyLike = (post: Post, liked: boolean): Post =>
  post.liked === liked ? post : { ...post, liked, likeCount: post.likeCount + (liked ? 1 : -1) };

export function useToggleLike(postId: string) {
  const qc = useQueryClient();
  const detailKey = ['post', postId] as const;
  const feedKey = ['feed'] as const;

  return useMutation({
    mutationKey: ['like', postId],
    mutationFn: (liked: boolean) => setLike(postId, liked),

    onMutate: async (liked) => {
      // 1. Stop in-flight refetches from overwriting our optimistic write.
      await Promise.all([qc.cancelQueries({ queryKey: detailKey }), qc.cancelQueries({ queryKey: feedKey })]);

      // 2. Snapshot for rollback.
      const previousDetail = qc.getQueryData<Post>(detailKey);
      const previousFeed = qc.getQueryData<InfiniteData<FeedPage>>(feedKey);

      // 3. Optimistically update every cache that shows this post.
      qc.setQueryData<Post>(detailKey, (old) => (old ? applyLike(old, liked) : old));
      qc.setQueryData<InfiniteData<FeedPage>>(feedKey, (old) =>
        old
          ? {
              ...old,
              pages: old.pages.map((page) => ({
                ...page,
                items: page.items.map((p) => (p.id === postId ? applyLike(p, liked) : p)),
              })),
            }
          : old,
      );

      // 4. Returned value is passed to onError/onSettled.
      return { previousDetail, previousFeed };
    },

    onError: (_error, _liked, context) => {
      if (context?.previousDetail) qc.setQueryData(detailKey, context.previousDetail);
      if (context?.previousFeed) qc.setQueryData(feedKey, context.previousFeed);
      toast.show({ message: "Couldn't update like. Please try again.", type: 'error' });
    },

    onSettled: () => {
      // Resync only when this is the last pending like for the post, so an
      // older response can't overwrite a newer optimistic state.
      if (qc.isMutating({ mutationKey: ['like', postId] }) === 1) {
        void qc.invalidateQueries({ queryKey: detailKey });
      }
    },
  });
}
```

export function LikeButton({ post }: { post: Post }) {

  return (
    <Pressable
      onPress={() => mutate(!post.liked)}
      hitSlop={8}
      accessibilityRole="button"
      accessibilityState={{ selected: post.liked }}
      accessibilityLabel={post.liked ? 'Unlike post' : 'Like post'}
    >

    </Pressable>

#### Walkthrough

- **Why cancel first**: if a refetch of `['post', id]` is in flight, its (pre-like) response would land after the optimistic write and flip the heart back. `cancelQueries` prevents that.
- **Snapshot and rollback**: the context returned from `onMutate` is the only reliable way to know what to restore in `onError`.
- **The post comes from the cache**: `LikeButton` renders `post` from `useQuery` or `useInfiniteQuery`. The optimistic `setQueryData` re-renders it immediately, with no local `useState` copy to keep in sync.
- **Don't invalidate the whole feed on every like**: that refetches every loaded page. Patch the feed optimistically and invalidate only the cheap detail query, or rely on the server response.
- **Idempotent endpoint**: with `PUT`/`DELETE` semantics, rapid taps send "true, false, true", and the final server state equals the last intent even if requests are retried. A `POST /toggle` endpoint turns retries into bugs.
- **Concurrency**: the `isMutating(...) === 1` check skips resync while newer like mutations are pending. An alternative is `` scope: { id: `like-${postId}` } `` on the mutation, which makes TanStack Query v5 run mutations with the same scope **serially**.

> [!INTERVIEW]
> What a senior answer includes: cancel, snapshot, optimistic write, rollback, then invalidate; every cache that renders the entity; and a concrete strategy for rapid taps (idempotent API plus serialization or last-mutation resync). Red flag: keeping a local `liked` state that drifts from the cache.

#### Follow-ups

- **"Without TanStack Query?"** React 19's `useOptimistic` shows an optimistic value while an async transition is pending and automatically reverts to the real state when it ends:

  ```tsx
  const [optimisticPost, addOptimistic] = useOptimistic(post, (p: Post, liked: boolean) => applyLike(p, liked));
  const onPress = () =>
    startTransition(async () => {
      const liked = !optimisticPost.liked;
      addOptimistic(liked);
      const saved = await setLike(post.id, liked);
      setPost(saved); // update real state; on error, the optimistic value simply disappears
    });
  ```

- **"Likes while offline."** Either persist paused mutations (TanStack `persistQueryClient`, `setMutationDefaults` so mutation functions can be restored, then `resumePausedMutations()`), or push the intent into your own offline queue (next challenge).
- **"Debounce the network, not the UI."** Update the cache on every tap, but send only the final state after 500 ms of quiet, and skip the request if it equals the server state.
- **"The post is shown in 5 different lists."** Use `qc.setQueriesData({ queryKey: ['feed'] }, updater)` to patch all matching lists. Better still, normalize: one entity cache (RTK Query entity adapter, Apollo or Relay) that all lists reference.

### Build an offline mutation queue persisted to storage with retries

**Task:** Users must be able to post comments and likes while offline. Build a queue that:

- Persists mutations **before** attempting the network, so they survive an app kill.
- Replays them in order when connectivity returns, on app start and on foreground.
- Retries transient failures with exponential backoff and jitter.
- Drops permanently failing items to a dead-letter callback so the UI can roll back.
- Never processes two items concurrently.
- Lets the UI show "pending" badges.

#### What the interviewer evaluates

- Durability ordering (persist first) and idempotency, because a request can succeed while its response is lost.
- Single-flight processing, FIFO ordering, and the head-of-line blocking trade-off.
- Error classification: network or 5xx/429 retry; other 4xx is permanent; 401 means refresh auth, not dead-letter.
- Serialization: handlers are looked up by `type` because functions can't be persisted.
- Integration with NetInfo and AppState, and a `useSyncExternalStore`-friendly API.

#### Solution

```mermaid
flowchart TD
    Act["User action e.g. send comment"] --> Opt["Optimistic UI update"]
    Opt --> Enq["enqueue: id, type, payload, attempts = 0"]
    Enq --> Persist[("Persist queue to storage")]
    Persist --> Proc{"Processor already running?"}
    Trig["Triggers: app start, reconnect, foreground, timer"] --> Proc
    Proc -->|"yes"| Skip(["Return, single flight"])
    Proc -->|"no"| Empty{"Queue empty?"}
    Empty -->|"yes"| Idle(["Idle"])
    Empty -->|"no"| Due{"Head item due now?"}
    Due -->|"no"| Sched["Schedule timer for nextAttemptAt"]
    Due -->|"yes"| Send["Run handler with Idempotency-Key"]
    Send -->|"2xx"| Remove["Remove item and persist"]
    Send -->|"network, 5xx, 429"| Backoff["attempts + 1, set nextAttemptAt with jittered backoff"]
    Send -->|"4xx or max attempts"| Dead["Dead letter: remove, roll back UI, notify"]
    Remove --> Empty
    Backoff --> Due
    Dead --> Empty
```
*Figure: Offline mutation queue. Persist first, process one item at a time, classify every failure.*

```ts title="src/offline/OfflineQueue.ts"
import 'react-native-get-random-values'; // crypto.getRandomValues polyfill required by uuid
import { v4 as uuidv4 } from 'uuid';

export interface AsyncKeyValueStore {
  getItem(key: string): Promise<string | null>;
  setItem(key: string, value: string): Promise<void>;
}

export interface QueuedMutation<P = unknown> {
  id: string; // doubles as the Idempotency-Key
  type: string; // selects the handler, e.g. 'comment.create'
  payload: P;
  createdAt: number;
  attempts: number;
  nextAttemptAt: number;
  lastError?: string;
}

export type MutationHandler = (m: QueuedMutation) => Promise<void>;

/** Throw from a handler when retrying can never succeed (400, 403, 404, 422...). */
export class PermanentError extends Error {
  name = 'PermanentError';
}

interface QueueOptions {
  storageKey?: string;
  maxAttempts?: number;
  onDeadLetter?: (m: QueuedMutation, error: unknown) => void;
}

const backoffMs = (attempt: number) => Math.round(Math.random() * Math.min(60_000, 1_000 * 2 ** attempt));

export class OfflineQueue {
  private items: readonly QueuedMutation[] = [];
  private processing = false;
  private timer: ReturnType<typeof setTimeout> | null = null;
  private listeners = new Set<() => void>();
  private readonly ready: Promise<void>;

  constructor(
    private readonly storage: AsyncKeyValueStore,
    private readonly handlers: Record<string, MutationHandler>,
    private readonly options: QueueOptions = {},
  ) {
    this.ready = this.restore();
  }

  private get key() {
    return this.options.storageKey ?? 'offline-queue/v1';
  }

  private get maxAttempts() {
    return this.options.maxAttempts ?? 8;
  }

  // ---- public API -------------------------------------------------------

  async enqueue<P>(type: string, payload: P): Promise<string> {
    await this.ready;
    const m: QueuedMutation<P> = {
      id: uuidv4(),
      type,
      payload,
      createdAt: Date.now(),
      attempts: 0,
      nextAttemptAt: 0,
    };
    await this.commit([...this.items, m]); // durable BEFORE touching the network
    void this.process();
    return m.id;
  }

  /** Call on reconnect / foreground: skip any remaining backoff and try now. */
  async retryNow(): Promise<void> {
    await this.ready; // never overwrite storage before the saved queue is restored
    if (this.items.some((m) => m.nextAttemptAt > 0)) {
      await this.commit(this.items.map((m) => ({ ...m, nextAttemptAt: 0 })));
    }
    await this.process();
  }

  subscribe = (listener: () => void): (() => void) => {
    this.listeners.add(listener);
    return () => {
      this.listeners.delete(listener);
    };
  };

  getSnapshot = (): readonly QueuedMutation[] => this.items;

  // ---- processing -------------------------------------------------------

  async process(): Promise<void> {
    await this.ready;
    if (this.processing) return; // single flight
    this.processing = true;
    try {
      while (this.items.length > 0) {
        const head = this.items[0];
        const wait = head.nextAttemptAt - Date.now();
        if (wait > 0) {
          this.schedule(wait);
          return;
        }

        try {
          const handler = this.handlers[head.type];
          if (!handler) throw new PermanentError(`No handler registered for '${head.type}'`);
          await handler(head);
          await this.commit(this.items.filter((m) => m.id !== head.id));
        } catch (error) {
          const attempts = head.attempts + 1;
          if (error instanceof PermanentError || attempts >= this.maxAttempts) {
            await this.commit(this.items.filter((m) => m.id !== head.id));
            this.options.onDeadLetter?.(head, error);
          } else {
            const updated: QueuedMutation = {
              ...head,
              attempts,
              nextAttemptAt: Date.now() + backoffMs(attempts),
              lastError: String(error),
            };
            await this.commit(this.items.map((m) => (m.id === head.id ? updated : m)));
          }
        }
      }
    } finally {
      this.processing = false;
    }
  }

  // ---- internals ----------------------------------------------------------

  private async commit(next: readonly QueuedMutation[]): Promise<void> {
    this.items = next; // in-memory state updates synchronously (new array = new snapshot)
    this.listeners.forEach((l) => l());
    await this.storage.setItem(this.key, JSON.stringify(next));
  }

  private schedule(ms: number) {
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      this.timer = null;
      void this.process();
    }, ms);
  }

  private async restore(): Promise<void> {
    try {
      const raw = await this.storage.getItem(this.key);
      const parsed: unknown = raw ? JSON.parse(raw) : [];
      this.items = Array.isArray(parsed) ? (parsed as QueuedMutation[]) : [];
    } catch {
      this.items = []; // corrupted payload: start clean (and report it in real code)
    }
    this.listeners.forEach((l) => l());
  }
}
```

```ts title="src/offline/queue.ts"
import AsyncStorage from '@react-native-async-storage/async-storage';
import NetInfo from '@react-native-community/netinfo';
import { AppState } from 'react-native';
import { OfflineQueue, PermanentError, type QueuedMutation } from './OfflineQueue';
import { toast } from '../toast/ToastProvider';

async function postJson(url: string, m: QueuedMutation): Promise<void> {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Idempotency-Key': m.id },
    body: JSON.stringify(m.payload),
  });
  if (res.ok) return;
  const retryable = res.status === 401 || res.status === 408 || res.status === 429 || res.status >= 500;
  if (!retryable) throw new PermanentError(`HTTP ${res.status}`);
  throw new Error(`HTTP ${res.status}`); // 401: the auth layer refreshes the token; retry later
}

export const offlineQueue = new OfflineQueue(
  AsyncStorage,
  {
    'comment.create': (m) => postJson('https://api.example.com/comments', m),
    'post.like': (m) => postJson('https://api.example.com/likes', m),
  },
  {
    onDeadLetter: (m) => {
      toast.show({ message: "Some offline changes couldn't be saved.", type: 'error' });
      // Also: roll back the optimistic UI for m.id, report to monitoring.
    },
  },
);

// Wire once at app start (module scope), not inside a component.
NetInfo.addEventListener((state) => {
  if (state.isConnected && state.isInternetReachable !== false) void offlineQueue.retryNow();
});
AppState.addEventListener('change', (status) => {
  if (status === 'active') void offlineQueue.retryNow();
});
void offlineQueue.process(); // drain what's left from the previous session
```

import { useSyncExternalStore } from 'react';
import { offlineQueue } from './queue';

export function usePendingMutations(type?: string) {
  const items = useSyncExternalStore(offlineQueue.subscribe, offlineQueue.getSnapshot);
  return type ? items.filter((m) => m.type === type) : items;
}

#### Walkthrough

- **Persist first**: if the app is killed between the tap and the request, the mutation is still on disk. The reverse order loses data.
- **Idempotency key**: the request might succeed on the server while the response is lost (for example, a tunnel). The retry carries the same `Idempotency-Key`, so the server returns the original result instead of creating a duplicate comment. Without server support for idempotency, an offline queue is unsafe for non-idempotent operations.
- **Single flight and FIFO**: the `processing` flag prevents two loops racing when reconnect and foreground events arrive together. Strict FIFO preserves causality: "create comment" must land before "edit comment". The cost is **head-of-line blocking**, where one stuck item delays everything behind it.
- **Classification**: 4xx (except 401, 408 and 429) is permanent. Retrying a 422 forever wastes battery and hides the bug. 401 is treated as transient so the auth layer can refresh the token.
- **Immutable snapshots**: every change assigns a new array, so `getSnapshot` works with `useSyncExternalStore`. Mutating in place would mean React never sees a change.
- **Guarding restore**: every public method awaits `ready`. Otherwise an early `retryNow()` could write `[]` to storage before the saved queue was read, and a crash at that moment would lose it.
- **Storage choice**: AsyncStorage is unencrypted. Don't queue tokens or sensitive payloads there; use encrypted MMKV or keep secrets out of payloads. MMKV's synchronous API also removes the interleaved-write question entirely. See [Offline Storage & Sync](../guides/offline-storage.html).

#### Follow-ups

- **"Conflicts: the comment was edited on another device."** Send a version or ETag (`If-Match`). On 409, dead-letter the item, refetch, and let the user resolve it. Last-write-wins is a product decision, not a default.
- **"Avoid head-of-line blocking."** Partition queues by entity (`postId`) and process partitions in parallel with a concurrency limit. That keeps order within an entity and parallelism across entities.
- **"Create offline, then edit the same comment before sync."** Assign a client-generated id (UUID) that the server accepts as the primary key, so there are no temporary ids to remap. Otherwise, keep a temp-to-server id map and rewrite queued payloads when the create resolves.
- **"Sync in the background."** OS-scheduled background tasks (expo-background-task, BackgroundFetch/WorkManager) are opportunistic, not guaranteed. The queue must work correctly without them. See [Background Tasks](../guides/background-tasks.html).

### Build a minimal global store on `useSyncExternalStore` with selectors

**Task:** Without Redux or Zustand, build `createStore(initializer)` returning `{ getState, setState, subscribe, useStore }`. Components subscribe with a **selector** and re-render only when the selected slice changes (with optional custom equality). Actions live in the store. The store is usable outside React.

#### What the interviewer evaluates

- Why `useSyncExternalStore` exists: tearing-free reads under concurrent rendering and correct subscription timing.
- The **getSnapshot caching rule**: it must return the same reference for unchanged state, or React re-renders forever.
- Selector memoization and equality (`Object.is` versus shallow).
- Immutable updates, and skipping notifications for no-op writes.
- Comparison with Context: fan-out re-renders and no selectors.

#### Solution

```ts title="src/store/createStore.ts"
import { useMemo, useSyncExternalStore } from 'react';

type Listener = () => void;
export type SetState<T> = (partial: Partial<T> | ((state: T) => Partial<T>)) => void;
export type GetState<T> = () => T;

export function createStore<T extends object>(init: (set: SetState<T>, get: GetState<T>) => T) {
  let state: T;
  const listeners = new Set<Listener>();

  const getState: GetState<T> = () => state;

  const setState: SetState<T> = (partial) => {
    const patch = typeof partial === 'function' ? (partial as (s: T) => Partial<T>)(state) : partial;
    const changed = (Object.keys(patch) as Array<keyof T>).some((k) => !Object.is(patch[k], state[k]));
    if (!changed) return; // no-op writes don't notify anyone
    state = { ...state, ...patch }; // new reference = new snapshot
    listeners.forEach((listener) => listener());
  };

  const subscribe = (listener: Listener) => {
    listeners.add(listener);
    return () => {
      listeners.delete(listener);
    };
  };

  state = init(setState, getState);

  function useStore(): T;
  function useStore<S>(selector: (state: T) => S, isEqual?: (a: S, b: S) => boolean): S;
  function useStore<S>(selector?: (state: T) => S, isEqual: (a: S, b: S) => boolean = Object.is) {
    const select = selector ?? ((s: T) => s as unknown as S);

    // getSnapshot must return a cached value for the same store state,
    // otherwise useSyncExternalStore loops. Memoize per selector/equality.
    const getSelection = useMemo(() => {
      let memo: { state: T; selected: S } | null = null;
      return () => {
        const current = state;
        if (memo && Object.is(memo.state, current)) return memo.selected;
        const selected = select(current);
        if (memo && isEqual(memo.selected, selected)) {
          memo = { state: current, selected: memo.selected }; // keep the old reference
          return memo.selected;
        }
        memo = { state: current, selected };
        return selected;
      };
    }, [select, isEqual]);

    return useSyncExternalStore(subscribe, getSelection, getSelection);
  }

  return { getState, setState, subscribe, useStore };
}

export function shallow<A>(a: A, b: A): boolean {
  if (Object.is(a, b)) return true;
  if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
  const keysA = Object.keys(a) as Array<keyof A>;
  if (keysA.length !== Object.keys(b).length) return false;
  return keysA.every((k) => Object.prototype.hasOwnProperty.call(b, k) && Object.is(a[k], b[k]));
}

  clear: () => void;

export const cartStore = createStore<CartState>((set) => ({

  add: (id) => set((s) => ({ items: { ...s.items, [id]: (s.items[id] ?? 0) + 1 } })),
  remove: (id) =>

      const { [id]: _removed, ...rest } = s.items;
      return { items: rest };
    }),
  clear: () => set({ items: {} }),

export function CartBadge() {

  return <Text>{count}</Text>;
}

  return <Button title="Add to cart" onPress={() => add(productId)} />;
}

export function CartActions() {
  // Object selector: pass shallow, or every store change would produce a "new" object.
  const { items, clear } = useCart((s) => ({ items: s.items, clear: s.clear }), shallow);

#### Walkthrough

- **Why `useSyncExternalStore`**: a hand-rolled `useState` + `useEffect(subscribe)` misses updates that happen between render and subscribe. Under concurrent rendering, it can also *tear*, where two components read different versions of the store in the same render. `useSyncExternalStore` solves both. It is what Redux, Zustand and friends use under the hood.
- **Snapshot caching**: React calls `getSnapshot` during render and again to check for changes. If it returns a fresh object each time, React assumes the store changed and re-renders forever (in development it warns that the result of getSnapshot should be cached). The memo returns the previous selection for unchanged state, and keeps the previous reference when `isEqual` says the new selection is equivalent.
- **Equality**: `Object.is` is right for primitives and stable references (`s.add`, `s.items`). Selectors that build objects need `shallow`.
- **Immutable writes**: `set` creates a new state object. Mutating `state.items[id]++` would keep the same references, so no one would be notified.
- **Inline selectors**: a new selector function each render recreates the memo. That is fine for correctness (it recomputes once per render), and hoisting selectors (`selectCount`) avoids the work.
- **Honest limitation**: the official `useSyncExternalStoreWithSelector` (in the `use-sync-external-store` package) also carries the last selection *across* selector identity changes. Libraries use it, or equivalent logic, for that reason.

#### Follow-ups

- **"Persist it."** `subscribe` to the store and write the relevant slice to MMKV, debounced. Hydrate synchronously from MMKV at creation time, so there is no flash of empty cart.
- **"Middleware (logging, devtools, immer)."** Wrap `setState`: `const set = (p) => { const prev = state; rawSet(p); log(prev, state); }`. With immer, `set((s) => produce(s, draft => ...))`.
- **"Global singletons break tests and multi-instance screens."** Create the store per provider (`const [store] = useState(() => createStore(init))`) and pass it via context. The context value never changes, and the store handles the updates.
- **"Why not just Context?"** Every consumer re-renders when the context value changes, and there is no selector API. Context is ideal for rarely changing values (theme, auth, DI) and poor for hot state.

### Write a retry utility with exponential backoff and jitter

**Task:** Implement `retry(fn, options)`. It retries a failing async operation with exponential backoff, a maximum delay, **jitter**, a configurable `shouldRetry` predicate, a `Retry-After` header override, an `onRetry` hook and cancellation via `AbortSignal`. Only transient errors are retried.

#### What the interviewer evaluates

- The backoff formula and why **jitter** matters (the thundering herd after an outage).
- Error classification: network, 408, 429 and 5xx are retryable; 4xx and aborts are not.
- Honouring `Retry-After`.
- An abortable sleep, and not retrying non-idempotent requests blindly.
- Clean, generic TypeScript.

#### Solution

```ts title="src/lib/retry.ts"
export class HttpError extends Error {
  constructor(
    public readonly status: number,
    message: string,
    public readonly retryAfterMs?: number,
  ) {
    super(message);
    this.name = 'HttpError';
  }
}

export interface RetryOptions {
  retries?: number; // retries AFTER the first attempt
  baseMs?: number;
  maxMs?: number;
  factor?: number;
  jitter?: 'full' | 'equal' | 'none';
  shouldRetry?: (error: unknown, attempt: number) => boolean;
  onRetry?: (error: unknown, attempt: number, delayMs: number) => void;
  signal?: AbortSignal;
}

export function computeDelay(
  attempt: number,
  { baseMs = 300, maxMs = 30_000, factor = 2, jitter = 'full' }: RetryOptions = {},
): number {
  const exp = Math.min(maxMs, baseMs * factor ** attempt);
  if (jitter === 'none') return exp;
  if (jitter === 'equal') return exp / 2 + Math.random() * (exp / 2);
  return Math.random() * exp; // full jitter: uniform in [0, exp]
}

export function isRetryable(error: unknown): boolean {
  if (error instanceof HttpError) {
    return error.status === 408 || error.status === 429 || error.status >= 500;
  }
  if (error instanceof Error && error.name === 'AbortError') return false;
  // RN's fetch rejects with TypeError('Network request failed') on connectivity errors.
  return error instanceof TypeError;
}

export function parseRetryAfter(value: string | null): number | undefined {
  if (!value) return undefined;
  const seconds = Number(value);
  if (Number.isFinite(seconds)) return Math.max(0, seconds * 1000);
  const date = Date.parse(value); // HTTP-date form
  return Number.isNaN(date) ? undefined : Math.max(0, date - Date.now());
}

function abortError(): Error {
  const e = new Error('Aborted');
  e.name = 'AbortError';
  return e;
}

function sleep(ms: number, signal?: AbortSignal): Promise<void> {
  return new Promise((resolve, reject) => {
    if (signal?.aborted) {
      reject(abortError());
      return;
    }
    const onAbort = () => {
      clearTimeout(timer);
      reject(abortError());
    };
    const timer = setTimeout(() => {
      signal?.removeEventListener('abort', onAbort);
      resolve();
    }, ms);
    signal?.addEventListener('abort', onAbort);
  });
}

export async function retry<T>(fn: () => Promise<T>, options: RetryOptions = {}): Promise<T> {
  const { retries = 3, shouldRetry = isRetryable, onRetry, signal } = options;

  for (let attempt = 0; ; attempt++) {
    try {
      return await fn();
    } catch (error) {
      if (attempt >= retries || signal?.aborted || !shouldRetry(error, attempt)) throw error;
      const serverHint = error instanceof HttpError ? error.retryAfterMs ?? 0 : 0;
      const delay = Math.max(computeDelay(attempt, options), serverHint);
      onRetry?.(error, attempt + 1, delay);
      await sleep(delay, signal);
    }
  }
}
```

#### Walkthrough

| Attempt (0-based) | No jitter (base 300 ms, ×2) | Full jitter range |
|---|---|---|
| 0 | 300 ms | 0–300 ms |
| 1 | 600 ms | 0–600 ms |
| 2 | 1.2 s | 0–1.2 s |
| 3 | 2.4 s | 0–2.4 s |
| 10 | capped at 30 s | 0–30 s |

- **Why jitter**: when a backend recovers from an outage, a million clients using identical backoff schedules retry in synchronized waves and knock it over again. Randomizing spreads the load. "Full jitter" (uniform between 0 and the exponential value) is the variant AWS's architecture blog found to work well. "Equal jitter" keeps a guaranteed minimum wait.
- **Classification first**: retrying a 400 or 403 just delays the inevitable error and multiplies server load. Aborts are user intent, so never retry them.
- **Retry-After**: servers returning 429 or 503 often tell you when to come back. Taking `max(backoff, hint)` respects it.
- **Abortable sleep**: navigating away should stop the whole chain, not just the in-flight request. The listener is removed on normal completion to avoid leaks on long-lived signals.
- **Idempotency**: only retry `POST` with an idempotency key. `GET`, `PUT` and `DELETE` are idempotent by definition.
- The loop has no condition, so TypeScript knows it never falls through, and no unreachable `return` is needed.

#### Follow-ups

- **"Use it with TanStack Query."** It has this built in: `retry: (count, error) => count < 3 && isRetryable(error)` and `retryDelay: (attempt) => computeDelay(attempt)`.
- **"Many concurrent requests get 401. Refresh the token once."** Keep a single in-flight `refreshPromise`. Every 401 awaits it, then replays its request once. On refresh failure, log the user out.
- **"Circuit breaker."** After N consecutive failures, fail fast for a cool-down period, then allow one probe request (half-open). This protects the battery and the backend.
- **"Test it deterministically."** Mock `Math.random` (`jest.spyOn(Math, 'random').mockReturnValue(0.5)`), use fake timers, and advance by the computed delays.

### Implement an LRU cache

**Task:** Implement `LRUCache<K, V>` with a fixed capacity. `get(key)` returns the value and marks it most recently used. `set(key, value)` inserts or updates, evicting the least recently used entry when full. Both must be **O(1)**. Then implement it again without relying on `Map` insertion order (hash map plus doubly linked list), which is the version many interviewers are really asking for.

#### What the interviewer evaluates

- Knowing that JS `Map` preserves insertion order, and using delete-plus-reinsert to refresh recency.
- The classic hash map plus doubly linked list design, with pointer manipulation that has no edge-case bugs (single node, head, tail).
- API semantics: does `has()` count as a use? Does updating an existing key refresh it?
- Input validation and TypeScript generics.
- Real uses in apps: response caches, image metadata, memoized computations.

#### Solution

```ts title="src/lib/LRUCache.ts"
/** O(1) LRU using Map's insertion order: first key = least recently used. */
export class LRUCache<K, V> {
  private readonly map = new Map<K, V>();

  constructor(private readonly capacity: number) {
    if (!Number.isInteger(capacity) || capacity <= 0) {
      throw new RangeError('capacity must be a positive integer');
    }
  }

  get size(): number {
    return this.map.size;
  }

  get(key: K): V | undefined {
    if (!this.map.has(key)) return undefined;
    const value = this.map.get(key) as V;
    this.map.delete(key); // move to the "most recent" end
    this.map.set(key, value);
    return value;
  }

  /** Read without affecting recency. */
  peek(key: K): V | undefined {
    return this.map.get(key);
  }

  has(key: K): boolean {
    return this.map.has(key);
  }

  set(key: K, value: V): this {
    if (this.map.has(key)) {
      this.map.delete(key);
    } else if (this.map.size >= this.capacity) {
      const oldest = this.map.keys().next().value as K;
      this.map.delete(oldest);
    }
    this.map.set(key, value);
    return this;
  }

  delete(key: K): boolean {
    return this.map.delete(key);
  }

  clear(): void {
    this.map.clear();
  }
}
```

```ts title="src/lib/LinkedLRUCache.ts"
interface Node<K, V> {
  key: K;
  value: V;
  prev: Node<K, V> | null;
  next: Node<K, V> | null;
}

/** Hash map for O(1) lookup + doubly linked list for O(1) recency updates. */
export class LinkedLRUCache<K, V> {
  private readonly nodes = new Map<K, Node<K, V>>();
  private head: Node<K, V> | null = null; // most recently used
  private tail: Node<K, V> | null = null; // least recently used

  constructor(
    private readonly capacity: number,
    private readonly onEvict?: (key: K, value: V) => void,
  ) {
    if (!Number.isInteger(capacity) || capacity <= 0) {
      throw new RangeError('capacity must be a positive integer');
    }
  }

  get(key: K): V | undefined {
    const node = this.nodes.get(key);
    if (!node) return undefined;
    this.moveToFront(node);
    return node.value;
  }

  set(key: K, value: V): void {
    const existing = this.nodes.get(key);
    if (existing) {
      existing.value = value;
      this.moveToFront(existing);
      return;
    }
    const node: Node<K, V> = { key, value, prev: null, next: null };
    this.nodes.set(key, node);
    this.addToFront(node);
    if (this.nodes.size > this.capacity) this.evictTail();
  }

  private addToFront(node: Node<K, V>): void {
    node.prev = null;
    node.next = this.head;
    if (this.head) this.head.prev = node;
    this.head = node;
    if (!this.tail) this.tail = node;
  }

  private unlink(node: Node<K, V>): void {
    if (node.prev) node.prev.next = node.next;
    else this.head = node.next;
    if (node.next) node.next.prev = node.prev;
    else this.tail = node.prev;
    node.prev = null;
    node.next = null;
  }

  private moveToFront(node: Node<K, V>): void {
    if (this.head === node) return;
    this.unlink(node);
    this.addToFront(node);
  }

  private evictTail(): void {
    const lru = this.tail;
    if (!lru) return;
    this.unlink(lru);
    this.nodes.delete(lru.key);
    this.onEvict?.(lru.key, lru.value);
  }
}
```

cache.set('a', 1).set('b', 2);
cache.get('a'); // 1: 'a' is now most recent
cache.set('c', 3); // evicts 'b' (least recently used)
cache.has('b'); // false

#### Walkthrough

- **Map version**: `Map` iterates keys in insertion order. Deleting and re-inserting a key moves it to the end, so the first key is always the least recently used. Every operation is O(1) amortized. `has()` and `peek()` deliberately don't refresh recency, because "checking" is not "using". Say that decision out loud.
- **Linked version**: the map gives O(1) lookup of the *node*, and the list gives O(1) move-to-front and evict-tail because each node knows its neighbours. `unlink` handles all four cases (middle, head, tail, only node) through the `else` branches that update `head` and `tail`.
- **`onEvict`** lets callers release resources: revoke object URLs, delete temp files, cancel prefetches.
- **Memory**: an LRU bounds entry *count*, not bytes. For images or blobs, bound by size (next follow-up) or cache references (URIs), not decoded bitmaps. Native image libraries already maintain their own memory and disk caches.

#### Follow-ups

- **"Add TTL."** Store `{ value, expiresAt }`. `get` checks expiry lazily and deletes stale entries, and an optional sweep runs on `AppState` `active`.
- **"Bound by bytes."** Take a `sizeOf(value)` function, track `totalSize`, and evict from the tail while `totalSize > maxBytes`.
- **"Cache async results without duplicate fetches."** Store the **Promise** as the value, so concurrent callers share it. Delete the entry if the promise rejects, so errors aren't cached.
- **"Production?"** The `lru-cache` package (TTL, size limits, fetch method) or TanStack Query's cache (`gcTime`) for server state.

### Implement a type-safe event emitter

**Task:** Implement `TypedEmitter<Events>` where `Events` maps event names to payload types. `on`, `once` and `off` are type-checked, `emit('x', payload)` requires the correct payload, and events with a `void` payload take **no** argument. `on` returns an unsubscribe function. A throwing listener must not stop the other listeners.

#### What the interviewer evaluates

- Generic constraints, `keyof`, indexed access types, and conditional rest parameters.
- Safe iteration while listeners unsubscribe during emit (`once`).
- Error isolation between listeners.
- An API that fits React: an unsubscribe function returned directly from `useEffect`.
- Knowing when an emitter is appropriate (cross-cutting signals) and when it isn't (state belongs in a store).

#### Solution

```ts title="src/lib/TypedEmitter.ts"
type Handler<P> = (payload: P) => void;
type EmitArgs<P> = [P] extends [void] ? [] : [payload: P];

export class TypedEmitter<Events extends Record<string, unknown>> {
  private readonly handlers = new Map<keyof Events, Set<Handler<unknown>>>();

  constructor(
    private readonly onError: (error: unknown, event: keyof Events) => void = (error) => console.error(error),
  ) {}

  on<K extends keyof Events>(event: K, handler: Handler<Events[K]>): () => void {
    let set = this.handlers.get(event);
    if (!set) {
      set = new Set();
      this.handlers.set(event, set);
    }
    set.add(handler as Handler<unknown>);
    return () => this.off(event, handler);
  }

  once<K extends keyof Events>(event: K, handler: Handler<Events[K]>): () => void {
    const off = this.on(event, (payload) => {
      off();
      handler(payload);
    });
    return off;
  }

  off<K extends keyof Events>(event: K, handler: Handler<Events[K]>): void {
    const set = this.handlers.get(event);
    if (!set) return;
    set.delete(handler as Handler<unknown>);
    if (set.size === 0) this.handlers.delete(event);
  }

  emit<K extends keyof Events>(event: K, ...args: EmitArgs<Events[K]>): void {
    const set = this.handlers.get(event);
    if (!set) return;
    const payload = (args as unknown[])[0];
    // Snapshot: listeners added/removed during this emit don't affect this round.
    for (const handler of [...set]) {
      try {
        handler(payload);
      } catch (error) {
        this.onError(error, event);
      }
    }
  }

  waitFor<K extends keyof Events>(event: K): Promise<Events[K]> {
    return new Promise((resolve) => {
      this.once(event, resolve);
    });
  }

  listenerCount(event: keyof Events): number {
    return this.handlers.get(event)?.size ?? 0;
  }
}
```

import { useEffect, useLayoutEffect, useRef } from 'react';
import { TypedEmitter } from './TypedEmitter';

// A `type` alias, not an `interface`: only type aliases get the implicit index
// signature needed to satisfy `Record<string, unknown>`.
type AppEvents = {
  'auth:expired': void;
  'cart:updated': { count: number };
  'deeplink:received': { url: string };
};

export const appEvents = new TypedEmitter<AppEvents>();

appEvents.emit('auth:expired'); // OK, no payload
appEvents.emit('cart:updated', { count: 3 }); // OK
// appEvents.emit('cart:updated');             // error: payload required
// appEvents.emit('cart:updatd', { count: 3 }); // error: unknown event name

export function useAppEvent<K extends keyof AppEvents>(event: K, handler: (payload: AppEvents[K]) => void) {
  const handlerRef = useRef(handler);
  useLayoutEffect(() => {
    handlerRef.current = handler;
  });
  // `on` returns the unsubscribe function, which is exactly what an effect cleanup wants.
  useEffect(() => appEvents.on(event, (payload) => handlerRef.current(payload)), [event]);
}
```

#### Walkthrough

- **Typing**: `K extends keyof Events` ties the event name to its payload through `Events[K]`. `EmitArgs` wraps both sides in tuples (`[P] extends [void]`) so the conditional doesn't distribute over unions and `void` events take zero arguments.
- **Internals are loosely typed on purpose**: storing `Set<Handler<unknown>>` behind a strictly typed public API avoids fighting TypeScript over generic mapped-type writes. Soundness is guaranteed at the boundary (`on`/`emit`).
- **Snapshot iteration**: `once` removes itself during emit. Iterating a copy (`[...set]`) also prevents a listener added during emit from firing in the same round.
- **Error isolation**: one faulty analytics listener must not stop the logout listener. The error is reported through `onError` (wire it to Sentry) instead of being swallowed.
- **The `interface` gotcha**: `interface AppEvents { ... }` fails the `Record<string, unknown>` constraint because interfaces are open to declaration merging and get no implicit index signature. A `type` alias works. It is a good detail to volunteer.

#### Follow-ups

- **"Where would you use this in an RN app?"** For cross-cutting fire-and-forget signals: an HTTP interceptor emits `auth:expired` and the navigation layer shows login; a deep link arrives before the navigator is ready. Don't use it for state other screens need to *read*; that belongs in a store.
- **"Detect leaks."** Warn in development when `listenerCount(event)` exceeds a threshold, like Node's `MaxListenersExceededWarning`. The usual cause is a missing effect cleanup.
- **"Wildcard listener."** Keep a separate `Set<(event, payload) => void>` notified on every emit. It is useful for logging and devtools.
- **"`waitFor` with timeout."** Race the `once` promise against a timer, and unsubscribe in both paths so neither leaks.

### Implement `debounce` and `throttle` from scratch

**Task:** Without lodash, implement `debounce(fn, wait, { leading, trailing })` with `cancel()` and `flush()`, and `throttle(fn, wait)` with leading and trailing invocation plus `cancel()`. Both must forward `this` and arguments, and throttle must use the latest arguments for the trailing call. Write tests with fake timers.

#### What the interviewer evaluates

- Closures as private state, and timer management.
- Precise leading and trailing semantics (lodash-compatible behaviour is a plus).
- `this` and argument forwarding (`fn.apply`), and TypeScript typing of the returned function with attached methods.
- Timestamp-based remaining-time math for throttle, including clock-skew safety.
- Testing with Jest fake timers.

#### Solution

```ts title="src/lib/timing.ts"
type Timer = ReturnType<typeof setTimeout>;

export function debounce<A extends unknown[]>(
  fn: (...args: A) => void,
  wait: number,
  { leading = false, trailing = true }: { leading?: boolean; trailing?: boolean } = {},
) {
  let timer: Timer | undefined;
  let lastArgs: A | undefined;
  let lastThis: unknown;

  function invoke() {
    const args = lastArgs as A;
    const ctx = lastThis;
    lastArgs = undefined;
    lastThis = undefined;
    fn.apply(ctx, args);
  }

  function debounced(this: unknown, ...args: A): void {
    lastArgs = args;
    lastThis = this;
    const isIdle = timer === undefined;
    if (timer !== undefined) clearTimeout(timer);

    timer = setTimeout(() => {
      timer = undefined;
      // Trailing call only if there were calls since the leading invoke.
      if (trailing && lastArgs) invoke();
      lastArgs = undefined;
      lastThis = undefined;
    }, wait);

    if (leading && isIdle) invoke();
  }

  debounced.cancel = (): void => {
    if (timer !== undefined) clearTimeout(timer);
    timer = undefined;
    lastArgs = undefined;
    lastThis = undefined;
  };

  debounced.flush = (): void => {
    if (timer === undefined) return;
    clearTimeout(timer);
    timer = undefined;
    if (lastArgs) invoke();
  };

  return debounced;
}

export function throttle<A extends unknown[]>(fn: (...args: A) => void, wait: number) {
  let lastCall = 0;
  let timer: Timer | undefined;
  let pendingArgs: A | undefined;
  let pendingThis: unknown;

  function throttled(this: unknown, ...args: A): void {
    const now = Date.now();
    const remaining = wait - (now - lastCall);

    // `remaining > wait` means the system clock went backwards: treat it as expired.
    if (remaining <= 0 || remaining > wait) {
      if (timer !== undefined) {
        clearTimeout(timer);
        timer = undefined;
      }
      lastCall = now;
      pendingArgs = undefined;
      fn.apply(this, args); // leading edge
      return;
    }

    // Inside the window: remember the latest call for the trailing edge.
    pendingArgs = args;
    pendingThis = this;
    if (timer === undefined) {
      timer = setTimeout(() => {
        timer = undefined;
        lastCall = Date.now();
        const a = pendingArgs;
        const ctx = pendingThis;
        pendingArgs = undefined;
        pendingThis = undefined;
        if (a) fn.apply(ctx, a); // trailing edge with the latest args
      }, remaining);
    }
  }

  throttled.cancel = (): void => {
    if (timer !== undefined) clearTimeout(timer);
    timer = undefined;
    lastCall = 0;
    pendingArgs = undefined;
    pendingThis = undefined;
  };

  return throttled;
}
