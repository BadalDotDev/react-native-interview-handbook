- **Why serializable params:** navigation state can be persisted and restored, and deep links produce params from URL strings. Objects go stale (the product changes on another screen) and functions trigger a "non-serializable values" warning. Pass IDs and read fresh data from your cache (TanStack Query, store).
- **Returning data to a previous screen:** use `popTo('Previous', { selected })` or navigate with params back to it, or better, write the result to shared state.
- For navigation outside components (e.g. from a push notification handler), use a navigation ref (`createNavigationContainerRef`) and wait until the container is ready.

### What is Expo Router, and how does it compare to React Navigation?

**Short answer:** Expo Router is a **file-based router** built on React Navigation. Files in the `app/` directory become routes, `_layout.tsx` files define which navigator (Stack, Tabs, Drawer) wraps a folder, and every screen automatically gets a **URL**, so deep links, universal links and web work without manual linking config. You get React Navigation's native navigators with less wiring and typed routes.

```plaintext
app/
  _layout.tsx            root Stack (providers go here)
  (tabs)/                route group: doesn't appear in the URL
    _layout.tsx          Tabs navigator
    index.tsx            "/"          Home tab
    cart.tsx             "/cart"
  product/[id].tsx       "/product/42"   dynamic segment
  settings/index.tsx     "/settings"
  +not-found.tsx         unmatched routes
```

```tsx title="app/product/[id].tsx"
import { Stack, useLocalSearchParams, router } from 'expo-router';
import { Text, Pressable } from 'react-native';

export default function ProductScreen() {
  const { id } = useLocalSearchParams<{ id: string }>();
  return (
    <>
      <Stack.Screen options={{ title: `Product ${id}` }} />
      <Text>Product {id}</Text>
      <Pressable onPress={() => router.push('/cart')}><Text>Go to cart</Text></Pressable>
    </>
  );
}
```

| | React Navigation | Expo Router |
|---|---|---|
| Route definition | Components/config in code | Files and folders in `app/` |
| Deep links | Manual `linking` config (automatic with the static API) | Automatic: every screen has a URL |
| Navigation calls | `navigation.navigate('Product', { id })` | `router.push('/product/42')` or `<Link href="/product/42">` |
| Web | Possible | First-class (including static rendering and API routes) |
| Flexibility | Maximum | Conventions; drop down to React Navigation APIs when needed |
| Requires Expo | No | Uses Expo tooling (works in any Expo/CNG project) |

**Senior points:** protected routes (redirect-based auth guards, or `Stack.Protected` in recent versions), typed routes generated from the file tree, and the fact that URL-first thinking forces you to keep params serializable, which is good practice anyway. See the [Deep Linking & Universal Links guide](../guides/deep-linking.html) for the native side.

## Networking and Data Basics

### `fetch` or axios? How do you structure a request with loading and error states?

**Short answer:** `fetch` is built in (RN implements it on top of the native networking stacks, `NSURLSession` and OkHttp), so it's a fine default. Axios adds conveniences: interceptors (auth headers, token refresh), automatic JSON, timeouts, and **rejecting on non-2xx responses**. Either way, wrap it in a small typed API client, always handle loading, error and empty states, check `response.ok` with `fetch`, and cancel requests that are no longer needed. For server state in screens, use **TanStack Query** (or RTK Query) rather than hand-rolled `useEffect` fetching.

```ts title="src/api/client.ts"
export class ApiError extends Error {
  constructor(public status: number, message: string, public body?: unknown) {
    super(message);
  }
}

const BASE_URL = process.env.EXPO_PUBLIC_API_URL ?? 'https://api.example.com';

export async function apiGet<T>(path: string, opts: { token?: string; signal?: AbortSignal; timeoutMs?: number } = {}): Promise<T> {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), opts.timeoutMs ?? 15_000);
  opts.signal?.addEventListener('abort', () => controller.abort());

  try {
    const res = await fetch(`${BASE_URL}${path}`, {
      headers: { Accept: 'application/json', ...(opts.token ? { Authorization: `Bearer ${opts.token}` } : {}) },
      signal: controller.signal,
    });
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new ApiError(res.status, `Request failed: ${res.status}`, body); // fetch does NOT throw on 4xx/5xx
    return body as T;
  } finally {
    clearTimeout(timeout);
  }
}
```

```tsx
import { useQuery } from '@tanstack/react-query';

function ProfileScreen() {
  const { data, isLoading, error, refetch } = useQuery({
    queryKey: ['me'],
    queryFn: ({ signal }) => apiGet<{ name: string }>('/me', { signal }),
  });
  if (isLoading) return <ActivityIndicator />;
  if (error) return <ErrorState message="Couldn't load your profile" onRetry={refetch} />;
  return <Text>{data?.name}</Text>;
}
```

| | `fetch` | axios |
|---|---|---|
| Dependency | None | Extra package (uses XMLHttpRequest in RN) |
| HTTP errors | Resolves; check `res.ok` | Rejects on non-2xx by default |
| JSON | `await res.json()` | Automatic |
| Timeouts | Via `AbortController` | `timeout` option |
| Interceptors | Write a wrapper | Built in (handy for token refresh) |
| Upload progress | Not supported | `onUploadProgress` (XHR-based) |

**Mobile-specific gotchas:**
- **Plain HTTP is blocked** by default: iOS App Transport Security and Android's cleartext policy (API 28+). The debug config allows local Metro traffic, which is why "works in debug, fails in release" with `http://` URLs happens.
- **Android emulator** reaches your machine's localhost at `10.0.2.2`; physical devices need your LAN IP or `adb reverse tcp:3000 tcp:3000`.
- Networks are flaky: add timeouts, retries with backoff for idempotent requests, and offline handling (`@react-native-community/netinfo`, TanStack Query's `onlineManager`).
- Token refresh must be **single-flight**: when several requests get a 401 at once, refresh once and replay them. See the [Authentication & Sessions guide](../guides/authentication.html).

### What is AsyncStorage, and what should you never store in it?

**Short answer:** `@react-native-async-storage/async-storage` is a simple, **asynchronous, unencrypted, string-only key-value store**. It's fine for small non-sensitive data such as preferences, onboarding flags or a cached filter. **Never store secrets** in it (auth tokens, refresh tokens, passwords, PII, API keys): it's plain data on disk, readable on rooted or jailbroken devices and potentially included in backups. Use the Keychain/Keystore via `react-native-keychain` or `expo-secure-store` for secrets.

```ts title="src/storage/preferences.ts"
import AsyncStorage from '@react-native-async-storage/async-storage';

type Preferences = { theme: 'system' | 'light' | 'dark'; hasSeenOnboarding: boolean };
const KEY = 'prefs:v1'; // version keys so you can migrate the shape later
const DEFAULTS: Preferences = { theme: 'system', hasSeenOnboarding: false };

export async function loadPreferences(): Promise<Preferences> {
  try {
    const raw = await AsyncStorage.getItem(KEY);
    return raw ? { ...DEFAULTS, ...(JSON.parse(raw) as Partial<Preferences>) } : DEFAULTS;
  } catch {
    return DEFAULTS; // corrupted JSON or storage error: fail safe
  }
}

export async function savePreferences(prefs: Preferences): Promise<void> {
  await AsyncStorage.setItem(KEY, JSON.stringify(prefs));
}
```

| Store | Sync? | Encrypted? | Good for |
|---|---|---|---|
| AsyncStorage | Async | No | Small preferences and flags |
| react-native-mmkv | **Sync** (JSI), very fast | Optional (you manage the key) | Preferences, persisted state, caches, anything read at startup |
| `expo-secure-store` / `react-native-keychain` | Async | Yes (Keychain / Android Keystore) | Tokens, credentials, small secrets |
| SQLite (`expo-sqlite`, `op-sqlite`), WatermelonDB | Varies | Optional (SQLCipher variants) | Structured, queryable, large or offline data |

**Senior details:**
- Being async means you can't read it synchronously during the first render. Apps that persist theme or auth in AsyncStorage must gate rendering (splash screen) until it's loaded, or they flash the wrong state. MMKV's synchronous reads avoid this.
- It stores strings only, so JSON-serialize, and treat parsing failures as expected.
- Android has a total size cap by default (historically 6 MB, configurable). It isn't designed for large datasets or frequent big writes.
- Keychain items on iOS **survive app uninstall** unless you clear them on first launch. That's a known source of "logged in after reinstall" bugs.
- Also worth mentioning: nothing shipped in the JS bundle is secret, even with Hermes bytecode. See the [Security guide](../guides/security.html) and the [Offline Storage & Sync guide](../guides/offline-storage.html).

### How do you manage environment configuration (dev, staging, production)?

**Short answer:** Keep per-environment values (API URLs, feature flags, public keys) outside the code and inject them **at build time**. In Expo, use `EXPO_PUBLIC_*` environment variables (inlined into the bundle) and a dynamic `app.config.ts` for native values such as bundle ID and app name per variant, with EAS build profiles and environment variables. In bare apps, use `react-native-config` (values available to both JS and native), backed by Android product flavors and iOS schemes/configurations. And remember: **everything in the JS bundle is public**.

```ts title="app.config.ts"
import type { ExpoConfig } from 'expo/config';

const variant = process.env.APP_VARIANT ?? 'development'; // set per EAS build profile
const suffix = variant === 'production' ? '' : `.${variant}`;

const config: ExpoConfig = {
  name: variant === 'production' ? 'Acme' : `Acme (${variant})`,
  slug: 'acme',
  ios: { bundleIdentifier: `com.acme.app${suffix}` },
  android: { package: `com.acme.app${suffix}` },
  extra: { variant },
};

export default config;
```

```properties title=".env.staging"
EXPO_PUBLIC_API_URL=https://staging-api.acme.com
EXPO_PUBLIC_SENTRY_DSN=https://public@sentry.example.com/1
```

**Practices a senior should mention:**
- **Different bundle IDs / application IDs per environment** so dev, staging and prod install side by side, each with its own push credentials, deep-link domains and analytics project.
- **No secrets in the app**: API secrets, database credentials and signing keys stay on the server or in CI secrets. Public identifiers (Sentry DSN, Stripe publishable key) are fine.
- `EXPO_PUBLIC_*` values are inlined at **bundle time**, so changing them requires a new build or OTA update. Access them as `process.env.EXPO_PUBLIC_API_URL` literally (no destructuring or dynamic keys), or they won't be inlined.
- Validate config at startup (e.g. with zod) and fail loudly in non-production builds when a value is missing.
- Runtime-changeable behavior (kill switches, rollouts) belongs in **remote config / feature flags**, not in build-time env vars.
- Details on build variants, signing and CI live in the [Deployment, Signing & CI/CD guide](../guides/deployment.html).

## Debugging and Tooling

### How do you debug a React Native app today?

**Short answer:** **React Native DevTools** is the default debugger (since RN 0.76). It's a Chrome DevTools-based frontend that connects directly to Hermes, with Console, Sources (breakpoints, stepping), Memory and the React Components/Profiler tabs built in. You open it from the **Dev Menu** or by pressing `j` in the Metro terminal. **LogBox** shows warnings and errors in-app. For native crashes and logs, use Xcode's console and Android Studio's Logcat (`adb logcat`).

| Tool | What it's for | How to open |
|---|---|---|
| React Native DevTools | Breakpoints, console, React component tree, profiling, heap snapshots | Dev Menu, then "Open DevTools", or `j` in Metro |
| Dev Menu | Reload, open DevTools, toggle Perf Monitor, element inspector | iOS Simulator: Cmd+D. Android emulator: Cmd+M / Ctrl+M. Device: shake, or `adb shell input keyevent 82` |
| LogBox | In-app warnings (yellow) and errors/redboxes with symbolicated stacks | Automatic in debug |
| Perf Monitor | JS and UI frame rates, RAM | Dev Menu |
| Element Inspector | Tap a view to see its styles and component hierarchy | Dev Menu |
| Xcode / Logcat | Native logs, native crashes, memory tools (Instruments, Android Profiler) | Run from Xcode / Android Studio |

```tsx
import { LogBox } from 'react-native';

// Silence a known, tracked third-party warning (never blanket-ignore everything)
LogBox.ignoreLogs(['Some library: deprecated prop']);
```

**Senior details:**
- **Remote "Debug JS in Chrome" is gone.** It ran JS in the browser's engine rather than on the device, which caused engine-specific bugs and broke synchronous native calls. **Flipper** was removed from the template in 0.74. Answers built around either sound dated.
- In recent versions (0.77+), `console.log` output doesn't stream to the Metro terminal in the default community CLI setup; read logs in DevTools. Recent DevTools releases also add network and performance inspection.
- For network debugging, use DevTools where available, a proxy (Charles, Proxyman), or Reactotron. For release-build crashes, use **Sentry/Crashlytics with uploaded source maps and dSYMs** (see the [Monitoring guide](../guides/monitoring.html)).
- **Debug in debug, measure in release.** Performance profiling of JS should use a release-like build (the React profiler works in profiling builds); dev mode is many times slower.
- A good debugging approach: reproduce reliably, isolate JS vs native (does it crash with a redbox or a native crash log?), check recent dependency changes, then bisect.

### What are the go-to fixes when the app won't build or run?

**Short answer:** Most "it worked yesterday" failures are stale caches or out-of-sync native dependencies. Reset Metro's cache, reinstall `node_modules`, re-run `pod install` for iOS, clean Gradle for Android, and rebuild the native app (not just reload JS) after adding any library with native code. In Expo CNG projects, `npx expo prebuild --clean` regenerates the native folders.

```bash
# Metro cache (stale transforms, "change not showing", weird resolution errors)
npx react-native start --reset-cache
npx expo start -c                      # Expo equivalent

# JS dependencies
rm -rf node_modules && npm install     # or yarn / pnpm / bun

# iOS native dependencies
cd ios && bundle exec pod install && cd ..      # after adding/updating native libraries
cd ios && pod install --repo-update && cd ..    # when a pod version can't be found
rm -rf ~/Library/Developer/Xcode/DerivedData    # nuclear option for Xcode build weirdness

# Android
cd android && ./gradlew clean && cd ..
adb reverse tcp:8081 tcp:8081          # physical device can't reach Metro over USB

# Health checks
npx react-native doctor
npx expo-doctor                        # Expo: checks dependency versions and config
npx expo install --check               # align library versions with the SDK
```

| Symptom | Likely cause | Fix |
|---|---|---|
| "Unable to resolve module" after installing a package | Metro cache or a missing install | Reset cache; confirm the package is in `package.json` |
| Native module is null / "TurboModule not found" | Library added but app not rebuilt | Rebuild the native app (`run-ios` / `run-android` / EAS dev build) |
| iOS build: "No such module" / pod errors | Pods out of date, or opened `.xcodeproj` | `pod install`; open the `.xcworkspace` |
| Android build: duplicate classes, Gradle cache errors | Stale build outputs or version conflicts | `./gradlew clean`; check library versions |
| "Application has not been registered" | Registered name mismatch, or JS crashed before registering | Check `app.json` name vs native; look for earlier errors |
| App shows old code | Wrong Metro instance, or a release build embedding an old bundle | Kill other Metro processes; rebuild |

> [!TIP]
> After upgrading React Native, use the official Upgrade Helper diff (bare) or `npx expo install expo@latest` followed by `npx expo install --fix` (Expo) instead of piecemeal fixes. Half-applied upgrades cause most of the hard build errors.

### What are the differences between debug and release builds?

**Short answer:** Debug builds load JS from Metro, run in development mode (`__DEV__` is `true`) with extra checks, warnings, LogBox and Fast Refresh, and are unoptimized. Release builds embed a minified bundle precompiled to Hermes bytecode, set `__DEV__` to `false`, strip dev tooling, enable native optimizations (and R8 on Android if configured), and are signed with release credentials. That's why **performance must be measured in release**, and why some bugs appear only in release.

| Aspect | Debug | Release |
|---|---|---|
| JS source | Served by Metro over the network | Embedded in the binary as Hermes bytecode |
| `__DEV__` | `true` | `false` |
| Dev tooling | Dev Menu, Fast Refresh, LogBox, DevTools | None |
| Performance | Slow: dev-mode React checks, no bytecode precompile | Representative of production |
| Native compilation | Debuggable, unoptimized | Optimized; Android code shrinking with R8 (if enabled) |
| Signing | Debug keystore / development certificate | Upload keystore / distribution certificate |
| Cleartext HTTP (Android) | Allowed by the debug manifest (for Metro) | Blocked unless explicitly configured |

```bash
npx react-native run-android --mode release
npx react-native run-ios --mode Release
npx expo run:android --variant release
npx expo run:ios --configuration Release
```

**Release-only bugs to anticipate:**
- **R8/ProGuard** strips or renames classes used via reflection by a native library. Fix with keep rules from the library's docs.
- **HTTP URLs** fail because cleartext was only allowed in debug.
- **Code that depends on `__DEV__`** or dev-only polyfills behaves differently.
- **Timing differences:** release is faster, exposing race conditions hidden by slow debug builds.
- **Missing env config** or a wrong API URL for the release variant.
- **Large `console.log` calls** still execute in release and cost performance. Strip them with a Babel plugin (`transform-remove-console`) or a logger that's silenced in production.

Always smoke-test a release build (on a real, ideally low-end, Android device) before shipping. See the [Deployment, Signing & CI/CD guide](../guides/deployment.html).

## Platform Basics

### How do you track whether the app is in the foreground or background?

**Short answer:** Use **`AppState`**. `AppState.currentState` gives the current state, and `AppState.addEventListener('change', ...)` notifies you of transitions between `active`, `background` and, on iOS only, `inactive`. Typical uses: refetch data or re-check permissions when the app returns to the foreground, pause media and timers when it leaves, and hide sensitive content before the iOS app switcher snapshot.

```mermaid
stateDiagram-v2
    [*] --> active : app launched
    active --> inactive : iOS only - app switcher or incoming call
    inactive --> active : user returns
    inactive --> background : app hidden
    active --> background : home button or switching apps
    background --> active : user reopens the app
    background --> [*] : OS terminates the process
```
*Figure: AppState transitions. `inactive` is an iOS-only transitional state.*

```tsx title="src/hooks/useAppForeground.ts"
import { useEffect, useRef } from 'react';
import { AppState, type AppStateStatus } from 'react-native';

export function useOnForeground(callback: () => void) {
  const appState = useRef<AppStateStatus>(AppState.currentState);
  const cb = useRef(callback);
  cb.current = callback;

  useEffect(() => {
    const sub = AppState.addEventListener('change', (next) => {
      if (appState.current.match(/inactive|background/) && next === 'active') cb.current();
      appState.current = next;
    });
    return () => sub.remove();
  }, []);
}

// Usage: re-check notification permission after the user returns from Settings
useOnForeground(() => { void refreshPermissionStatus(); });
```

**Senior details:**
- **Background doesn't mean running.** iOS suspends your process shortly after it's backgrounded, and Android may freeze or kill it. JS timers stop. Real background work needs OS-sanctioned mechanisms (background fetch, WorkManager, background location, push). See the [Background Tasks guide](../guides/background-tasks.html).
- **Privacy screen:** iOS takes the app switcher snapshot around the `inactive` transition. Banking apps render a blur overlay on `inactive` and remove it on `active`. On Android, `FLAG_SECURE` (native) is the equivalent and also blocks screenshots.
- Android also emits `focus`/`blur` events (e.g. when the notification shade is pulled down) without changing `AppState`.
- TanStack Query can refetch on foreground by wiring `focusManager` to `AppState`.
- There's a `memoryWarning` event. Use it to clear caches (images, in-memory data).

### How do you handle the Android back button?

**Short answer:** React Navigation already handles the hardware back button and back gesture (it pops the stack, or exits at the root). For custom behavior, register a `BackHandler` `hardwareBackPress` listener that returns `true` to consume the event or `false` to let the default happen, and register it only while the screen is **focused** (`useFocusEffect`). For "unsaved changes" prompts, prefer React Navigation's `usePreventRemove`, which also covers the iOS swipe gesture and header back button.

```tsx
import { useCallback } from 'react';
import { Alert, BackHandler } from 'react-native';
import { useFocusEffect, useNavigation, usePreventRemove } from '@react-navigation/native';

// Custom handling on one screen, e.g. close an in-screen panel first
export function useCloseOnBack(isPanelOpen: boolean, closePanel: () => void) {
  useFocusEffect(
    useCallback(() => {
      const sub = BackHandler.addEventListener('hardwareBackPress', () => {
        if (!isPanelOpen) return false; // not handled: let navigation pop the screen
        closePanel();
        return true;                    // handled: stop propagation
      });
      return () => sub.remove();
    }, [isPanelOpen, closePanel]),
  );
}

// Unsaved changes: covers hardware back, gestures and the header back button
export function useConfirmDiscard(hasUnsavedChanges: boolean) {
  const navigation = useNavigation();
  usePreventRemove(hasUnsavedChanges, ({ data }) => {
    Alert.alert('Discard changes?', 'You have unsaved changes.', [
      { text: 'Keep editing', style: 'cancel' },
      { text: 'Discard', style: 'destructive', onPress: () => navigation.dispatch(data.action) },
    ]);
  });
}
```

**Details:**
- Listeners run in **reverse registration order** (last registered first); the first one returning `true` stops the chain.
- `BackHandler.exitApp()` exists, but exiting on back from the root is already the default. Don't override root behavior without a UX reason ("press back again to exit" is a common but debatable pattern).
- Use `sub.remove()`; the old `BackHandler.removeEventListener` API was removed.
- `Modal` has its own `onRequestClose` for the back button.
- **Predictive back** (the system back animation, default for apps targeting recent Android SDKs) changes how back events are dispatched. Verify that your RN and navigation versions support it, and test the back gesture on current Android versions.

### How do you open external URLs, the dialer, email, or the app's settings?

**Short answer:** Use the **`Linking`** API. `Linking.openURL()` hands a URL to the OS (`https:`, `tel:`, `mailto:`, `sms:`, `geo:`, other apps' schemes), and `Linking.openSettings()` opens your app's settings page (essential after a permission is permanently denied). For checking whether a URL can be handled, both platforms require you to **declare the schemes/intents you query**. For web content that should stay in-app (terms pages, OAuth), use an in-app browser (`expo-web-browser`), which uses `SFSafariViewController` / Chrome Custom Tabs.

```ts title="src/utils/links.ts"
import { Alert, Linking } from 'react-native';

export async function openExternal(url: string) {
  try {
    await Linking.openURL(url); // rejects if no app can handle it
  } catch {
    Alert.alert('Cannot open link', url);
  }
}

export const callSupport = () => openExternal('tel:+18005551234');
export const emailSupport = () => openExternal('mailto:support@example.com?subject=Help');
export const openAppSettings = () => Linking.openSettings();
```

| Concern | iOS | Android |
|---|---|---|
| `canOpenURL` for custom schemes | Declare schemes in `LSApplicationQueriesSchemes` (`Info.plist`), otherwise it returns `false` | Android 11+ package visibility: declare `<queries>` intents in `AndroidManifest.xml` |
| `tel:` on simulators/emulators | Not supported on the iOS Simulator | Opens the dialer on emulators with a phone app |
| Settings | `openSettings()` opens your app's page in Settings | Opens your app's details screen; `Linking.sendIntent` for specific screens |

**Related (incoming links):** `Linking.getInitialURL()` returns the URL that cold-started the app, and `Linking.addEventListener('url', ...)` handles links while it's running. Navigation libraries wrap both. The full setup (custom schemes, Universal Links, App Links, deferred deep links) is in the [Deep Linking & Universal Links guide](../guides/deep-linking.html).

> [!TIP]
> Prefer calling `openURL` in a try/catch over checking `canOpenURL` first. It avoids the query-declaration requirements for the common case and handles failure the same way.

### How do runtime permissions work in React Native, at a high level?

**Short answer:** Both platforms require you to **declare** a permission in native config and **request** it at runtime for sensitive capabilities (camera, location, notifications, contacts). On iOS you add a usage description string to `Info.plist` (e.g. `NSCameraUsageDescription`); the system prompt appears **once**, and after a denial the user can only change it in Settings. On Android you declare `<uses-permission>` in the manifest and request "dangerous" permissions at runtime (Android 6+), which can be denied permanently after repeated refusals. Use `react-native-permissions` or the Expo module's permission APIs for one cross-platform flow.

```tsx
import { PermissionsAndroid, Platform } from 'react-native';
import { useCameraPermissions } from 'expo-camera';

// Core API: Android only
async function requestAndroidCamera(): Promise<boolean> {
  if (Platform.OS !== 'android') return true;
  const result = await PermissionsAndroid.request(PermissionsAndroid.PERMISSIONS.CAMERA, {
    title: 'Camera access',
    message: 'We use the camera to scan receipts.',
    buttonPositive: 'Continue',
  });
  return result === PermissionsAndroid.RESULTS.GRANTED; // other values: DENIED, NEVER_ASK_AGAIN
}

// Expo module API: both platforms
function ScanButton() {
  const [permission, requestPermission] = useCameraPermissions();
  // permission?.granted, permission?.canAskAgain -> if false, send the user to Linking.openSettings()
}
```

**Principles a senior states:**
- **Ask in context, not at launch.** Ask when the user taps "Scan receipt", optionally after a short in-app explanation ("priming") that improves acceptance and protects your one iOS prompt.
- **Handle every state:** undetermined, granted, denied (can ask again), blocked/never-ask-again (send the user to Settings), limited (iOS photo library, Android 14 partial media access), and approximate location.
- **Missing iOS usage strings crash the app** when the API is accessed, and vague strings get rejected in App Store review.
- Permissions change outside your app. Re-check on foreground (`AppState`), don't cache "granted" forever.
- Version-specific rules keep changing (Android 13 notification permission and granular media permissions, Android 14 partial photo access). The details live in the [Permissions guide](../guides/permissions.html).

### What are the accessibility basics every React Native screen should get right?

**Short answer:** Give interactive elements an **`accessibilityRole`** and a meaningful **`accessibilityLabel`** (plus `accessibilityHint` when the result isn't obvious), expose state with **`accessibilityState`** (disabled, selected, checked, expanded), make touch targets at least **44×44 pt (iOS) / 48×48 dp (Android)** using padding or `hitSlop`, respect font scaling, and test with **VoiceOver and TalkBack**. RN maps these props to the native accessibility APIs, so doing them right gives real screen-reader support.

```tsx
import { Pressable, Text, View } from 'react-native';
import { Ionicons } from '@expo/vector-icons';

function IconButton({ onPress, liked }: { onPress: () => void; liked: boolean }) {
  return (
    <Pressable
      onPress={onPress}
      hitSlop={12}                                  // 24pt icon + 12pt on each side = 48pt target
      accessibilityRole="button"
      accessibilityLabel={liked ? 'Unlike post' : 'Like post'}
      accessibilityState={{ selected: liked }}
    >
      <Ionicons name={liked ? 'heart' : 'heart-outline'} size={24} />
    </Pressable>
  );
}

// Group related text into one focusable element: read as "Order 1042, shipped, 3 items"
function OrderSummary() {
  return (
    <View accessible accessibilityLabel="Order 1042, shipped, 3 items">
      <Text>Order #1042</Text>
      <Text>Shipped</Text>
      <Text>3 items</Text>
    </View>
  );
}
```

| Prop / API | Purpose |
|---|---|
| `accessibilityRole` / `role` | What the element is: `button`, `link`, `header`, `image`, `switch`, `tab`, and so on |
| `accessibilityLabel` / `aria-label` | What the screen reader says (required for icon-only buttons) |
| `accessibilityHint` | What happens on activation, when not obvious |
| `accessibilityState` / `aria-*` | `disabled`, `selected`, `checked`, `busy`, `expanded` |
| `accessible` | Groups children into one focusable element |
| `accessibilityElementsHidden` (iOS), `importantForAccessibility` (Android), `aria-hidden` | Hide decorative elements |
| `AccessibilityInfo` | `isScreenReaderEnabled()`, `isReduceMotionEnabled()`, `announceForAccessibility()` |

**Gotchas:**
- On Android, `hitSlop` can't extend a touch area **beyond the parent's bounds**. Use padding for reliable targets in tight layouts.
- Don't disable `allowFontScaling` globally. Use `maxFontSizeMultiplier` for constrained UI and make layouts wrap.
- Mark section titles with `accessibilityRole="header"` so screen-reader users can jump between them.
- Respect **reduce motion** for large animations (Reanimated's `useReducedMotion`).
- ARIA-style props (`role`, `aria-label`, `aria-disabled`, and so on) are supported as aliases in modern RN, which helps code shared with the web.
- Tests using React Native Testing Library's `getByRole`/`getByLabelText` double as accessibility checks (see the [Testing Strategy guide](../guides/testing.html)).

> [!INTERVIEW]
> What a senior answer includes: roles, labels and states, target sizes, font scaling, grouping, reduce motion, and actually testing with VoiceOver/TalkBack. Red flag: treating accessibility as "adding testIDs". `testID` is for automation, not screen readers.
